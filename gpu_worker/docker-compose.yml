services:
  astra-gpu:
    build:
      context: ..
      dockerfile: gpu_worker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ASTRA_GPU_PORT:-8765}:8765"
    environment:
      ASTRA_GPU_BIND: 0.0.0.0
      ASTRA_GPU_PORT: 8765
      ASTRA_GPU_WORKER_TOKEN: ${ASTRA_GPU_WORKER_TOKEN:?required}
      ASTRA_OSS_VIDEO_PROVIDER: ${ASTRA_OSS_VIDEO_PROVIDER:-auto}
      ASTRA_LTX_ROOT: /models/LTX-Video
      ASTRA_LTX_CONFIG: ${ASTRA_LTX_CONFIG:-configs/ltxv-2b-0.9.8-distilled.yaml}
      ASTRA_WAN22_ROOT: /models/Wan2.2
      ASTRA_WAN22_CKPT: /weights/Wan2.2
      ASTRA_ALLOW_PAID_CHARACTER_VIDEO: "0"
    volumes:
      - ${ASTRA_LTX_HOST_ROOT:-./models/LTX-Video}:/models/LTX-Video:ro
      - ${ASTRA_WAN_HOST_ROOT:-./models/Wan2.2}:/models/Wan2.2:ro
      - ${ASTRA_WAN_CKPT_HOST_ROOT:-./weights/Wan2.2}:/weights/Wan2.2:ro
      - astra_gpu_jobs:/tmp/astra_gpu_jobs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  astra_gpu_jobs:
