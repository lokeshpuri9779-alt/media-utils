name: Pillow narrated shadow verification
on:
  workflow_dispatch:
  push:
    branches:
      - integration/pillow-narrated-shadow
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12' 'imageio-ffmpeg>=0.5,<1'
      - run: python -m unittest discover -s tests -p 'test_pillow_shadow_assembly.py' -v
