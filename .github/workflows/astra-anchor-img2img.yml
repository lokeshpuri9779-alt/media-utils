name: ASTRA Anchor Image-to-Image (Isolated)
on:
  push:
    branches:
      - benchmark/lighthouse-anchor-img2img
    paths:
      - .astra/anchor-img2img-trigger.txt
permissions:
  contents: read
  actions: read
jobs:
  anchor-story:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HF_HOME: /tmp/astra-hf
      HF_HUB_DISABLE_TELEMETRY: '1'
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve verified sunset anchor from prior run
        uses: actions/download-artifact@v4
        with:
          name: astra-lighthouse-three-scenes-40371027354
          run-id: 40371027354
          github-token: ${{ github.token }}
          path: artifacts/anchor-input/
      - name: Verify anchor PNG
        run: |
          test -s artifacts/anchor-input/01_sunset.png
          ls -lh artifacts/anchor-input/
          free -h
      - name: Install CPU inference dependencies
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'optimum[openvino]' diffusers 'transformers>=4.46,<5'
      - name: Generate two anchor-conditioned variations
        run: timeout --signal=TERM --kill-after=15s 27m python -u -m tools.experimental_openvino_anchor_story
      - name: Upload images and review-only report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-anchor-img2img-${{ github.run_id }}
          path: artifacts/experimental-openvino/anchor-story/
          if-no-files-found: warn
          retention-days: 7
