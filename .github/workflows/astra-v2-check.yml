name: ASTRA V2 - Rebuild Checks

# Temporary isolated validation of the replacement; no OAuth or publishing.
on:
  push:
    branches:
      - astra-v2-clean-rebuild-20261008
    paths:
      - 'astra_v2/**'
      - 'tests/test_astra_v2.py'
      - '.github/workflows/astra-v2-check.yml'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'httpx==0.28.1'
      - run: python -m compileall -q astra_v2
      - run: python -m unittest discover -s tests -p 'test_astra_v2.py' -v
