name: ASTRA Offline AI One-Shot GGUF CPU (Isolated)
on:
  push:
    branches:
      - experiment/astra-offline-ai-parallel-20261103
    paths:
      - .github/workflows/astra-offline-ai-oneshot.yml
      - tools/astra_offline_cpu_smoke.py
      - tools/grammars/astra_four_beats.gbnf
      - tests/test_astra_offline_cpu_smoke.py
      - docs/astra-offline-ai-real-llm.md
  workflow_dispatch:
    inputs:
      confirm_benchmark:
        description: 'Enter BENCHMARK to authorize a single CPU GGUF inference benchmark'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: astra-one-shot-qwen-cpu
  cancel-in-progress: false
jobs:
  real-llm-cpu:
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message == 'experiment(ASTRA): grammar-guided one-shot CPU validation')
      || (github.event_name == 'workflow_dispatch' && inputs.confirm_benchmark == 'BENCHMARK')
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '2'
      MODEL_FILE: /tmp/astra-offline-model/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify experimental branch and credential isolation
        run: |
          test "${GITHUB_REF#refs/heads/}" = "experiment/astra-offline-ai-parallel-20261103"
          python3 -m tools.experimental_guard
          python3 -m unittest -v tests.test_astra_offline_cpu_smoke tests.test_astra_offline_llm
      - name: Bounded CPU, RAM and storage preflight
        run: |
          test "$(nproc)" -ge 1
          free -h
          df -h .
          python3 - <<'PY'
          import shutil
          assert shutil.disk_usage("/tmp").free >= 2_000_000_000, "Not enough disk for isolated small model benchmark"
          PY
      - name: Compile pinned CPU-only llama.cpp from verified source revision
        run: |
          git clone --quiet --depth 1 --branch b12064 https://github.com/ggml-org/llama.cpp.git /tmp/astra-llama-cpp
          test "$(git -C /tmp/astra-llama-cpp rev-parse HEAD)" = "51fe42c5d14bfb9adf0612ff98a9ab79e0e7275c"
          cmake -S /tmp/astra-llama-cpp -B /tmp/astra-llama-cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DGGML_OPENMP=OFF
          cmake --build /tmp/astra-llama-cpp/build -j 2 --target llama-cli
      - name: Download and SHA256-verify one small Apache-2.0 model
        run: |
          mkdir -p /tmp/astra-offline-model
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 240 \
            --output "$MODEL_FILE" \
            'https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf'
          echo "6eb923e7d26e9cea28811e1a8e852009b21242fb157b26149d3b188f3a8c8653  $MODEL_FILE" | sha256sum -c -
      - name: Run exactly one CPU-only offline story inference
        run: |
          ulimit -v 6291456
          python3 -m tools.astra_offline_cpu_smoke \
            --binary /tmp/astra-llama-cpp/build/bin/llama-cli \
            --model "$MODEL_FILE" \
            --output artifacts/offline-real-llm/ \
            --timeout-seconds 180
      - name: Upload unapproved benchmark evidence even if inference fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-qwen-real-llm-cpu-${{ github.run_id }}
          path: artifacts/offline-real-llm/
          if-no-files-found: warn
          retention-days: 7
