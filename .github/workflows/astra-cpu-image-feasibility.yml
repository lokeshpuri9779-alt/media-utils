name: ASTRA CPU Image Feasibility (Manual)
on:
  workflow_dispatch:
    inputs:
      confirm_cpu_benchmark:
        description: 'BENCHMARK normally. Manual SDXL tokens: BENCHMARK_SLOW_REVIEW, BENCHMARK_DECODE_REVIEW, BENCHMARK_TEXT_REVIEW, BENCHMARK_FIRST_PREDICTION, BENCHMARK_REFERENCE_IMAGE, BENCHMARK_DENOISER_REVIEW.'
        required: true
        type: string
      sdxl_one_image:
        description: 'One 1024x1024 fixed-seed 20-step SDXL INT8 CPU diagnostic; review only, not production quality'
        type: boolean
        default: false
      sdxl_load:
        description: 'Load/compile only; WITH sdxl_one_image enabled, run a three-step timing probe with NO image'
        type: boolean
        default: false
      sdxl_preflight:
        description: 'Metadata-only SDXL RAM/disk gate; no weight download or rendering'
        type: boolean
        default: false
      prompt_diagnostic:
        description: 'One fixed-noise prompt intervention; review only'
        type: boolean
        default: false
      backend_parity:
        description: 'One matched PyTorch/OpenVINO pair; review only'
        type: boolean
        default: false
      object_diagnostic:
        description: 'Two isolated objects: truck and school; review only'
        type: boolean
        default: false
      square_diagnostic:
        description: 'Two 512x512 diagnostic images at 20 steps; not portrait assets'
        type: boolean
        default: false
      comparison:
        description: 'Four review-only images: two seeds at 8 and 20 steps'
        type: boolean
        default: false
      model_profile:
        description: 'Preconverted OpenVINO model recommended; export uses more memory/time'
        type: choice
        required: true
        default: export
        options:
          - preconverted
          - export
permissions:
  contents: read
jobs:
  sdxl-denoiser-review:
    if: inputs.confirm_cpu_benchmark == 'BENCHMARK_DENOISER_REVIEW' && !inputs.sdxl_one_image && !inputs.sdxl_load && !inputs.sdxl_preflight && !inputs.prompt_diagnostic && !inputs.backend_parity && !inputs.object_diagnostic && !inputs.square_diagnostic && !inputs.comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU reference denoiser runtime
        timeout-minutes: 15
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pillow==11.3.0 diffusers==0.39.0 transformers==4.57.6 numpy==2.4.6 huggingface_hub==0.36.2 psutil==7.0.0
      - name: Check CPU review guardrails
        run: python -m unittest discover -s tests -p 'test_experimental_sdxl*.py' -v
      - name: Restore verified run-78 conditioning
        uses: actions/download-artifact@v4
        with:
          name: astra-sdxl-text-review-42192924660
          run-id: 42192924660
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/experimental-openvino/sdxl-text-source/
      - name: Restore verified run-79 prediction
        uses: actions/download-artifact@v4
        with:
          name: astra-sdxl-first-prediction-42232753910
          run-id: 42232753910
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/experimental-openvino/sdxl-prediction-source/
      - name: Compare the reference FP32 first-step denoiser predictions
        run: python -m tools.experimental_sdxl_denoiser_review
      - name: Retain unapproved denoiser comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-sdxl-denoiser-review-${{ github.run_id }}
          path: artifacts/experimental-openvino/sdxl-denoiser-review/
          if-no-files-found: error
          retention-days: 7
  sdxl-reference-image:
    if: inputs.confirm_cpu_benchmark == 'BENCHMARK_REFERENCE_IMAGE' && !inputs.sdxl_one_image && !inputs.sdxl_load && !inputs.sdxl_preflight && !inputs.prompt_diagnostic && !inputs.backend_parity && !inputs.object_diagnostic && !inputs.square_diagnostic && !inputs.comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    env:
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU image runtime
        timeout-minutes: 15
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pillow==11.3.0 optimum==2.3.0 optimum-intel==2.2.0 openvino==2026.4.1 openvino-tokenizers==2026.4.1.0 diffusers==0.39.0 transformers==4.57.6 numpy==2.4.6 huggingface_hub==0.36.2 psutil==7.0.0
      - name: Check CPU review guardrails
        run: python -m unittest discover -s tests -p 'test_experimental_sdxl*.py' -v
      - name: Restore verified run-78 conditioning
        uses: actions/download-artifact@v4
        with:
          name: astra-sdxl-text-review-42192924660
          run-id: 42192924660
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/experimental-openvino/sdxl-text-source/
      - name: Restore verified run-79 prediction
        uses: actions/download-artifact@v4
        with:
          name: astra-sdxl-first-prediction-42232753910
          run-id: 42232753910
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/experimental-openvino/sdxl-prediction-source/
      - name: Finish one fixed-seed reference-text image for manual review
        run: python -m tools.experimental_sdxl_load --one-image --slow-review --reference-image
      - name: Retain unapproved reference-text image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-sdxl-reference-image-${{ github.run_id }}
          path: artifacts/experimental-openvino/sdxl-load/
          if-no-files-found: error
          retention-days: 7
  sdxl-first-prediction:
    if: inputs.confirm_cpu_benchmark == 'BENCHMARK_FIRST_PREDICTION' && !inputs.sdxl_one_image && !inputs.sdxl_load && !inputs.sdxl_preflight && !inputs.prompt_diagnostic && !inputs.backend_parity && !inputs.object_diagnostic && !inputs.square_diagnostic && !inputs.comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU denoiser runtime
        timeout-minutes: 15
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pillow==11.3.0 optimum==2.3.0 optimum-intel==2.2.0 openvino==2026.4.1 openvino-tokenizers==2026.4.1.0 diffusers==0.39.0 transformers==4.57.6 numpy==2.4.6 huggingface_hub==0.36.2 psutil==7.0.0
      - name: Check CPU review guardrails
        run: python -m unittest discover -s tests -p 'test_experimental_sdxl*.py' -v
      - name: Restore verified run-78 conditioning
        uses: actions/download-artifact@v4
        with:
          name: astra-sdxl-text-review-42192924660
          run-id: 42192924660
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/experimental-openvino/sdxl-text-source/
      - name: Measure the two first-timestep predictions
        run: python -m tools.experimental_sdxl_first_prediction
      - name: Retain first-prediction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-sdxl-first-prediction-${{ github.run_id }}
          path: artifacts/experimental-openvino/sdxl-first-prediction/
          if-no-files-found: error
          retention-days: 7
  sdxl-text-review:
    if: inputs.confirm_cpu_benchmark == 'BENCHMARK_TEXT_REVIEW' && !inputs.sdxl_one_image && !inputs.sdxl_load && !inputs.sdxl_preflight && !inputs.prompt_diagnostic && !inputs.backend_parity && !inputs.object_diagnostic && !inputs.square_diagnostic && !inputs.comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU text encoders
        timeout-minutes: 15
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pillow==11.3.0 optimum==2.3.0 optimum-intel==2.2.0 openvino==2026.4.1 openvino-tokenizers==2026.4.1.0 diffusers==0.39.0 transformers==4.57.6 numpy==2.4.6 huggingface_hub==0.36.2 psutil==7.0.0
      - name: Check CPU review guardrails
        run: python -m unittest discover -s tests -p 'test_experimental_sdxl*.py' -v
      - name: Compare text conditioning for the run-76 prompt pair
        run: python -m tools.experimental_sdxl_text_review
      - name: Retain conditioning evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-sdxl-text-review-${{ github.run_id }}
          path: artifacts/experimental-openvino/sdxl-text-review/
          if-no-files-found: error
          retention-days: 7
  sdxl-decode-review:
    if: inputs.confirm_cpu_benchmark == 'BENCHMARK_DECODE_REVIEW' && !inputs.sdxl_one_image && !inputs.sdxl_load && !inputs.sdxl_preflight && !inputs.prompt_diagnostic && !inputs.backend_parity && !inputs.object_diagnostic && !inputs.square_diagnostic && !inputs.comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    env:
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU reference decoder runtime
        timeout-minutes: 15
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pillow==11.3.0 diffusers==0.39.0 transformers==4.57.6 numpy==2.4.6 huggingface_hub==0.36.2 psutil==7.0.0
      - name: Verify SDXL guardrails without loading model weights
        run: python -m unittest discover -s tests -p 'test_experimental_sdxl*.py' -v
      - name: Retrieve the fixed unapproved run-76 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: astra-sdxl-one-image-41988573278
          run-id: 41988573278
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/experimental-openvino/sdxl-source/
      - name: Decode the saved latent with its pinned source VAE on CPU
        run: python -m tools.experimental_sdxl_decode_review
      - name: Retain reference comparison for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-sdxl-decode-review-${{ github.run_id }}
          path: artifacts/experimental-openvino/sdxl-decode-review/
          if-no-files-found: error
          retention-days: 7
  sdxl-load-compile:
    if: inputs.confirm_cpu_benchmark == 'BENCHMARK' && inputs.sdxl_load && !inputs.sdxl_one_image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pillow==11.3.0 optimum==2.3.0 optimum-intel==2.2.0 openvino==2026.4.1 openvino-tokenizers==2026.4.1.0 diffusers==0.39.0 transformers==4.57.6 numpy==2.4.6 huggingface_hub==0.36.2 psutil==7.0.0
      - name: Load and compile pinned INT8 package without inference
        run: python -m tools.experimental_sdxl_load
      - name: Retain load-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-sdxl-load-${{ github.run_id }}
          path: artifacts/experimental-openvino/sdxl-load/
          if-no-files-found: error
          retention-days: 7
  sdxl-one-image:
    if: inputs.sdxl_one_image && (inputs.confirm_cpu_benchmark == 'BENCHMARK' || (inputs.confirm_cpu_benchmark == 'BENCHMARK_SLOW_REVIEW' && !inputs.sdxl_load))
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.confirm_cpu_benchmark == 'BENCHMARK_SLOW_REVIEW' && 65 || 40 }}
    env:
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU runtime
        timeout-minutes: 15
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pillow==11.3.0 optimum==2.3.0 optimum-intel==2.2.0 openvino==2026.4.1 openvino-tokenizers==2026.4.1.0 diffusers==0.39.0 transformers==4.57.6 numpy==2.4.6 huggingface_hub==0.36.2 psutil==7.0.0
      - name: Verify single-image guardrails without loading weights
        run: python -m unittest discover -s tests -p 'test_experimental_sdxl*.py' -v
      - name: Produce one fixed-seed unapproved SDXL diagnostic
        if: ${{ !inputs.sdxl_load && inputs.confirm_cpu_benchmark == 'BENCHMARK' }}
        run: python -m tools.experimental_sdxl_load --one-image
      - name: Produce one fixed-seed unapproved SDXL slow review
        if: ${{ inputs.confirm_cpu_benchmark == 'BENCHMARK_SLOW_REVIEW' }}
        run: python -m tools.experimental_sdxl_load --one-image --slow-review
      - name: Measure three SDXL steps without decoding an image
        if: ${{ inputs.sdxl_load }}
        run: python -m tools.experimental_sdxl_load --performance-probe
      - name: Archive unapproved single-image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-sdxl-one-image-${{ github.run_id }}
          path: artifacts/experimental-openvino/sdxl-load/
          if-no-files-found: error
          retention-days: 7
  sdxl-resource-preflight:
    if: inputs.confirm_cpu_benchmark == 'BENCHMARK' && inputs.sdxl_preflight && !inputs.sdxl_load && !inputs.sdxl_one_image
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Screen pinned SDXL FP32 resources without downloading weights
        run: python3 -m tools.experimental_sdxl_preflight
      - name: Retain review-only resource report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-sdxl-resource-${{ github.run_id }}
          path: artifacts/experimental-openvino/sdxl-preflight.json
          if-no-files-found: error
          retention-days: 7
  benchmark:
    if: inputs.confirm_cpu_benchmark == 'BENCHMARK' && !inputs.sdxl_preflight && !inputs.sdxl_load && !inputs.sdxl_one_image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HOME: /tmp/astra-hf
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'optimum[openvino]' diffusers 'transformers>=4.46,<5'
      - name: Match recorded core versions for resolution diagnostic
        if: ${{ inputs.square_diagnostic || inputs.object_diagnostic || inputs.backend_parity || inputs.prompt_diagnostic }}
        run: python -m pip install pillow==11.3.0 optimum==2.3.0 optimum-intel==2.2.0 openvino==2026.4.1 openvino-tokenizers==2026.4.1.0 diffusers==0.39.0 transformers==4.57.6 numpy==2.4.6 huggingface_hub==0.36.2 torch==2.14.1 torchvision==0.29.1
      - name: Log runner limits
        run: |
          nproc
          free -h
          df -h .
      - name: Produce isolated portrait keyframe
        if: ${{ !inputs.comparison && !inputs.square_diagnostic && !inputs.object_diagnostic && !inputs.backend_parity && !inputs.prompt_diagnostic }}
        run: |
          python -m tools.experimental_openvino_benchmark --profile "${{ inputs.model_profile }}" --steps 8
      - name: Produce controlled four-image comparison
        if: ${{ inputs.comparison && !inputs.square_diagnostic && !inputs.object_diagnostic && !inputs.backend_parity && !inputs.prompt_diagnostic }}
        run: python -m tools.experimental_openvino_comparison
      - name: Produce square resolution diagnostic
        if: ${{ inputs.square_diagnostic && !inputs.object_diagnostic && !inputs.backend_parity && !inputs.prompt_diagnostic }}
        run: python -m tools.experimental_openvino_comparison --square
      - name: Produce two isolated object diagnostics
        if: ${{ inputs.object_diagnostic && !inputs.backend_parity && !inputs.prompt_diagnostic }}
        run: python -m tools.experimental_openvino_comparison --objects
      - name: Produce matched backend parity pair
        if: ${{ inputs.backend_parity && !inputs.prompt_diagnostic }}
        run: python -m tools.experimental_backend_parity
      - name: Produce one prompt intervention
        if: ${{ inputs.prompt_diagnostic }}
        run: timeout 600 python -m tools.experimental_prompt_diagnostic
      - name: Explain benchmark scope
        if: always()
        run: |
          echo 'Pixel-quality pass is NOT semantic fidelity, character continuity, or approval.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Benchmark artifacts require human visual review. Production/publishing remain disabled.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain review-only benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-openvino-cpu-${{ github.run_id }}
          path: artifacts/experimental-openvino/
          if-no-files-found: warn
          retention-days: 7
