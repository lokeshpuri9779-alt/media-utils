name: ASTRA CPU Image Feasibility (Manual)
on:
  workflow_dispatch:
    inputs:
      confirm_cpu_benchmark:
        description: 'Enter BENCHMARK; uses available GitHub Actions minutes, never a paid API'
        required: true
        type: string
      cpu_runtime_probe:
        description: 'Read-only CPU model, affinity, quota and memory report; no model downloads or images'
        type: boolean
        default: false
      sdxl_one_image:
        description: 'One 1024x1024 fixed-seed 20-step SDXL INT8 CPU diagnostic; review only, not production quality'
        type: boolean
        default: false
      sdxl_load:
        description: 'One bounded SDXL INT8 CPU load/compile; no images'
        type: boolean
        default: false
      sdxl_preflight:
        description: 'Metadata-only SDXL RAM/disk gate; no weight download or rendering'
        type: boolean
        default: false
      prompt_diagnostic:
        description: 'One fixed-noise prompt intervention; review only'
        type: boolean
        default: false
      backend_parity:
        description: 'One matched PyTorch/OpenVINO pair; review only'
        type: boolean
        default: false
      object_diagnostic:
        description: 'Two isolated objects: truck and school; review only'
        type: boolean
        default: false
      square_diagnostic:
        description: 'Two 512x512 diagnostic images at 20 steps; not portrait assets'
        type: boolean
        default: false
      comparison:
        description: 'Four review-only images: two seeds at 8 and 20 steps'
        type: boolean
        default: false
      model_profile:
        description: 'Preconverted OpenVINO model recommended; export uses more memory/time'
        type: choice
        required: true
        default: export
        options:
          - preconverted
          - export
permissions:
  contents: read
jobs:
  cpu-runtime-probe:
    if: inputs.confirm_cpu_benchmark == 'BENCHMARK' && inputs.cpu_runtime_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify offline CPU probe guardrails
        run: python3 -m unittest discover -s tests -p 'test_experimental_cpu_runtime_probe.py' -v
      - name: Capture read-only CPU environment
        run: python3 -m tools.experimental_cpu_runtime_probe
      - name: Retain CPU environment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-cpu-runtime-${{ github.run_id }}
          path: artifacts/experimental-openvino/cpu-runtime-probe.json
          if-no-files-found: error
          retention-days: 7
  sdxl-load-compile:
    if: inputs.confirm_cpu_benchmark == 'BENCHMARK' && inputs.sdxl_load && !inputs.sdxl_one_image && !inputs.cpu_runtime_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU runtime
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pillow==11.3.0 optimum==2.3.0 optimum-intel==2.2.0 openvino==2026.4.1 openvino-tokenizers==2026.4.1.0 diffusers==0.39.0 transformers==4.57.6 numpy==2.4.6 huggingface_hub==0.36.2 psutil==7.0.0
      - name: Load and compile pinned INT8 package without inference
        run: python -m tools.experimental_sdxl_load
      - name: Retain load-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-sdxl-load-${{ github.run_id }}
          path: artifacts/experimental-openvino/sdxl-load/
          if-no-files-found: error
          retention-days: 7
  sdxl-one-image:
    if: inputs.confirm_cpu_benchmark == 'BENCHMARK' && inputs.sdxl_one_image && !inputs.cpu_runtime_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU runtime
        timeout-minutes: 15
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pillow==11.3.0 optimum==2.3.0 optimum-intel==2.2.0 openvino==2026.4.1 openvino-tokenizers==2026.4.1.0 diffusers==0.39.0 transformers==4.57.6 numpy==2.4.6 huggingface_hub==0.36.2 psutil==7.0.0
      - name: Verify single-image guardrails without loading weights
        run: python -m unittest discover -s tests -p 'test_experimental_sdxl_guardrails.py' -v
      - name: Produce one fixed-seed unapproved SDXL diagnostic
        run: python -m tools.experimental_sdxl_load --one-image
      - name: Archive unapproved single-image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-sdxl-one-image-${{ github.run_id }}
          path: artifacts/experimental-openvino/sdxl-load/
          if-no-files-found: error
          retention-days: 7
  sdxl-resource-preflight:
    if: inputs.confirm_cpu_benchmark == 'BENCHMARK' && inputs.sdxl_preflight && !inputs.sdxl_load && !inputs.sdxl_one_image && !inputs.cpu_runtime_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Screen pinned SDXL FP32 resources without downloading weights
        run: python3 -m tools.experimental_sdxl_preflight
      - name: Retain review-only resource report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-sdxl-resource-${{ github.run_id }}
          path: artifacts/experimental-openvino/sdxl-preflight.json
          if-no-files-found: error
          retention-days: 7
  benchmark:
    if: inputs.confirm_cpu_benchmark == 'BENCHMARK' && !inputs.sdxl_preflight && !inputs.sdxl_load && !inputs.sdxl_one_image && !inputs.cpu_runtime_probe
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HOME: /tmp/astra-hf
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-only benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'optimum[openvino]' diffusers 'transformers>=4.46,<5'
      - name: Match recorded core versions for resolution diagnostic
        if: ${{ inputs.square_diagnostic || inputs.object_diagnostic || inputs.backend_parity || inputs.prompt_diagnostic }}
        run: python -m pip install pillow==11.3.0 optimum==2.3.0 optimum-intel==2.2.0 openvino==2026.4.1 openvino-tokenizers==2026.4.1.0 diffusers==0.39.0 transformers==4.57.6 numpy==2.4.6 huggingface_hub==0.36.2 torch==2.14.1 torchvision==0.29.1
      - name: Log runner limits
        run: |
          nproc
          free -h
          df -h .
      - name: Produce isolated portrait keyframe
        if: ${{ !inputs.comparison && !inputs.square_diagnostic && !inputs.object_diagnostic && !inputs.backend_parity && !inputs.prompt_diagnostic }}
        run: |
          python -m tools.experimental_openvino_benchmark --profile "${{ inputs.model_profile }}" --steps 8
      - name: Produce controlled four-image comparison
        if: ${{ inputs.comparison && !inputs.square_diagnostic && !inputs.object_diagnostic && !inputs.backend_parity && !inputs.prompt_diagnostic }}
        run: python -m tools.experimental_openvino_comparison
      - name: Produce square resolution diagnostic
        if: ${{ inputs.square_diagnostic && !inputs.object_diagnostic && !inputs.backend_parity && !inputs.prompt_diagnostic }}
        run: python -m tools.experimental_openvino_comparison --square
      - name: Produce two isolated object diagnostics
        if: ${{ inputs.object_diagnostic && !inputs.backend_parity && !inputs.prompt_diagnostic }}
        run: python -m tools.experimental_openvino_comparison --objects
      - name: Produce matched backend parity pair
        if: ${{ inputs.backend_parity && !inputs.prompt_diagnostic }}
        run: python -m tools.experimental_backend_parity
      - name: Produce one prompt intervention
        if: ${{ inputs.prompt_diagnostic }}
        run: timeout 600 python -m tools.experimental_prompt_diagnostic
      - name: Explain benchmark scope
        if: always()
        run: |
          echo 'Pixel-quality pass is NOT semantic fidelity, character continuity, or approval.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Benchmark artifacts require human visual review. Production/publishing remain disabled.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain review-only benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-openvino-cpu-${{ github.run_id }}
          path: artifacts/experimental-openvino/
          if-no-files-found: warn
          retention-days: 7
