name: ASTRA Fiction Episode Full Render Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/astra-fiction-episode-render-audit.yml'
      - 'astra_v2/human_story_performance.py'
      - 'astra_v2/human_story_composition.py'
      - 'tests/test_human_story_composition.py'
      - 'astra_v2/human_performance_cues.py'
      - 'tests/test_human_physical_acting.py'
      - 'astra_v2/human_prop_interaction.py'
      - 'tests/test_human_prop_interaction.py'
      - 'astra_v2/human_skeletal_rig.py'
      - 'tests/test_human_skeletal_rig.py'
      - 'astra_v2/human_illustrated_materials.py'
      - 'tests/test_human_illustrated_materials.py'
      - 'astra_v2/human_stage_depth.py'
      - 'tests/test_human_stage_depth.py'
      - 'astra_v2/human_action_choreography.py'
      - 'tests/test_human_story_choreography.py'
      - 'tests/test_expressive_mara_performance.py'
      - 'astra_v2/human_cinematic_camera.py'
      - 'studio_renderer.py'
      - 'tests/test_human_cinematic_staging.py'
      - 'astra_v2/unified_story_engine.py'
      - 'astra_v2/omniroute_local.py'
      - 'tests/test_pilot_human_performance.py'

permissions:
  contents: read
  actions: read

jobs:
  fiction-episode:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ASTRA_CHANNEL: rayvan
      ASTRA_UNIFIED_STORY_ENGINE: '1'
      ASTRA_FICTION_VISUAL_GUARD: '1'
      ASTRA_HUMAN_CINEMATIC_CAMERA: '1'
      ASTRA_ASSET_PACK_ENABLED: '1'
      ASTRA_ASSET_PACK_AUDIT: '1'
      ASTRA_ASSET_PACK_IMMUTABLE: '1'
      ASTRA_ASSET_PACK_ROOT: runtime-artifacts/verified-pack
      ASTRA_ASSET_AUDIT_DIR: runtime-artifacts/fiction-episode/receipts
      ASTRA_OPENAI_ENABLED: '0'
      ASTRA_OPENAI_ALLOW_PAID_API: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Studio stack and ffprobe
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Check visual direction and per-shot asset-selection regressions
        run: |
          python -m unittest discover -s tests -p 'test_omniroute_local.py' -v
          python -m unittest discover -s tests -p 'test_astra_asset_pack_compositor.py' -v
          python -m unittest discover -s tests -p 'test_pilot_human_performance.py' -v
          python -m unittest discover -s tests -p 'test_expressive_mara_performance.py' -v
          python -m unittest discover -s tests -p 'test_human_story_choreography.py' -v
          python -m unittest discover -s tests -p 'test_human_stage_depth.py' -v
          python -m unittest discover -s tests -p 'test_human_illustrated_materials.py' -v
          python -m unittest discover -s tests -p 'test_human_skeletal_rig.py' -v
          python -m unittest discover -s tests -p 'test_human_prop_interaction.py' -v
          python -m unittest discover -s tests -p 'test_human_physical_acting.py' -v
          python -m unittest discover -s tests -p 'test_human_story_composition.py' -v
          python -m unittest discover -s tests -p 'test_human_cinematic_staging.py' -v
      - name: Restore original verified artwork
        uses: actions/download-artifact@v4
        with:
          name: astra-original-visual-pack
          run-id: 39960540392
          github-token: ${{ github.token }}
          path: runtime-artifacts/download
      - name: Verify source artwork integrity
        run: python -m tools.astra_restore_visual_pack runtime-artifacts/download/astra-visual-pack.zip runtime-artifacts/verified-pack --expected 3200
      - name: Render actual existing Season 1 Episode 1 with Studio
        run: |
          mkdir -p runtime-artifacts/fiction-episode
          python - <<'PY'
          import json
          from pathlib import Path
          from astra_v2.omniroute_local import catalog
          from studio_renderer import render_short
          stories = catalog()
          matches = [s for s in stories if s.get('content_id') == 'rayvan-season-01-episode-01']
          assert len(matches) == 1, 'Expected existing canonical episode 1'
          episode = matches[0]
          assert episode['genre'] == 'fiction' and episode['production_ready']
          assert len(episode['story_beats']) == 4
          root = Path('runtime-artifacts/fiction-episode')
          (root/'story.json').write_text(json.dumps(episode, indent=2, default=str))
          report = render_short(episode, root/'episode-01.mp4', still_dir=root/'scene-stills')
          (root/'studio-report.json').write_text(json.dumps(report, indent=2, default=str))
          PY
      - name: Decode actual MP4 and build storyboard review sheet
        run: |
          ffprobe -v error -show_entries format=duration:stream=codec_type,codec_name,width,height -of json runtime-artifacts/fiction-episode/episode-01.mp4 > runtime-artifacts/fiction-episode/ffprobe.json
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          from PIL import Image, ImageDraw
          root=Path('runtime-artifacts/fiction-episode')
          video=root/'episode-01.mp4'
          report=json.loads((root/'studio-report.json').read_text())
          probe=json.loads((root/'ffprobe.json').read_text())
          assert report['genre']=='fiction' and len(report['scenes'])==4
          assert all(scene.get('story_human_actor')=='mara' for scene in report['scenes']), 'No Mara performance in report'
          assert [scene.get('story_human_action') for scene in report['scenes']] == [
              'discover_radio','trace_cable','hear_warning','flee_door'], 'Human story actions missing'
          v=[s for s in probe['streams'] if s.get('codec_type')=='video']
          a=[s for s in probe['streams'] if s.get('codec_type')=='audio']
          assert len(v)==1 and v[0]['codec_name']=='h264'
          assert (v[0]['width'],v[0]['height'])==(1080,1920)
          assert a and any(s['codec_name']=='aac' for s in a)
          assert float(probe['format']['duration'])>0
          receipts=list((root/'receipts').glob('*.json'))
          assert len(receipts)==1, 'Missing full Studio asset receipt'
          receipt=json.loads(receipts[0].read_text())
          sha=hashlib.sha256(video.read_bytes()).hexdigest()
          assert receipt['video_sha256']==sha
          assert receipt['content_id']=='rayvan-season-01-episode-01'
          assert receipt['shot_count']==len(report['scenes'])==4
          assert receipt['asset_coverage_status']=='full', receipt['statuses']
          assert all(s['status']=='composited' and s['pixel_changed'] and s['asset'] for s in receipt['shots'])
          art_ids=[s['asset']['id'] for s in receipt['shots']]
          assert len(set(art_ids))==len(art_ids), f'Background reused across distinct episode shots: {art_ids}'
          # Verify temporal storytelling survives H264 encoding, not just
          # source-frame unit tests. Sample early/late action inside each beat.
          from PIL import ImageChops
          from astra_v2.human_action_choreography import action_state
          temporal_evidence=[]
          for index,scene in enumerate(scenes if 'scenes' in locals() else report['scenes'],1):
              action=scene['story_human_action']
              assert action, 'Narrative shot lacks action choreography'
              duration=float(scene['duration'])
              samples=[]
              for phase,part in (('early',.10),('late',.86)):
                  at=float(scene['start'])+duration*part
                  dest=root/f'temporal-beat-{index:02d}-{phase}.png'
                  subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y',
                                  '-ss',f'{at:.3f}','-i',str(video),'-frames:v','1',str(dest)],
                                 check=True,timeout=50)
                  with Image.open(dest) as still:
                      samples.append(still.convert('RGB').crop((115,570,1010,1330))
                                     .resize((224,190),Image.Resampling.BILINEAR))
              delta=ImageChops.difference(samples[0],samples[1])
              changed=sum(delta.convert('L').point(
                  lambda v: 1 if v>20 else 0).getdata())
              assert changed>=400, f'Encoded scene {index} frozen: {changed} changed pixels'
              temporal_evidence.append({'scene':index,'action':action,
                  'early_cue':action_state(action,.10*duration,duration).cue,
                  'late_cue':action_state(action,.86*duration,duration).cue,
                  'changed_pixels':changed})
          (root/'temporal-story-evidence.json').write_text(json.dumps(temporal_evidence,indent=2))
          thumbs=[]
          for index,scene in enumerate(report['scenes'],1):
              at=float(scene['start'])+float(scene['duration'])*.5
              output=root/f'decoded-beat-{index:02d}.png'
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y',
                              '-ss',f'{at:.3f}','-i',str(video),'-frames:v','1',str(output)],
                             check=True,timeout=45)
              with Image.open(output) as frame:
                  thumbs.append(frame.convert('RGB').resize((270,480),Image.Resampling.LANCZOS))
          sheet=Image.new('RGB',(540,960),(15,16,22))
          for i,im in enumerate(thumbs):
              sheet.paste(im,((i%2)*270,(i//2)*480))
          sheet.save(root/'decoded-video-contact-sheet.jpg',quality=90)
          (root/'render-verification.json').write_text(json.dumps({
              'content_id':receipt['content_id'],
              'genre':'fiction','verified_shots':receipt['composited_shots'],
              'artifact_scope':'Full encoded episode, not evidence of story-semantic fidelity',
              'video_sha256':sha,'duration':probe['format']['duration'],
              'decoded_preview_frames':len(thumbs),
              'manual_visual_review_required':True,
              'youtube_uploaded':False
          },indent=2))
          print('ASTRA_FICTION_EPISODE_VERIFIED='+str(root/'render-verification.json'))
          PY
      - name: Preserve full fiction episode, samples and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-season-one-episode-one-visual-review
          path: runtime-artifacts/fiction-episode/
          if-no-files-found: warn
          retention-days: 7
