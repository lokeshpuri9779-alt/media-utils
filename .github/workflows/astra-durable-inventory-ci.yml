name: ASTRA durable inventory CI
on:
  pull_request:
    paths:
      - 'astra_v2/durable_inventory.py'
      - 'tests/test_durable_inventory.py'
      - '.github/workflows/astra-durable-inventory-ci.yml'
  push:
    branches: [main]
    paths:
      - 'astra_v2/durable_inventory.py'
      - 'tests/test_durable_inventory.py'
      - '.github/workflows/astra-durable-inventory-ci.yml'
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile inventory and tests
        run: python -m compileall -q astra_v2/durable_inventory.py tests/test_durable_inventory.py
      - name: Run inventory regression tests
        run: python -m unittest discover -s tests -p 'test_durable_inventory.py' -v
