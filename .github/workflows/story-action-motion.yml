name: Story action motion tests
on:
  workflow_dispatch:
  push:
    branches:
      - feature/story-action-motion-v1
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_story_action_motion.py' -v
