name: ASTRA - Autonomous Story Proposal Inventory

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/astra-story-proposals.yml'
      - 'astra_v2/autonomous_story_proposals.py'
      - 'astra_v2/genre_story_supply.py'
      - 'astra_v2/proposal_history.py'
      - 'astra_v2/persisted_plot_proposals.py'
      - 'astra_v2/plot_first_proposals.py'
      - 'astra_v2/plot_first_inventory.py'
      - 'astra_v2/shorts_novelty.py'
      - 'astra_v2/publication_quality.py'
      - 'astra_v2/story_editorial_report.py'
      - 'astra_v2/story_editorial.py'
      - 'tests/test_astra_story_editorial.py'
      - 'astra_v2/story_supply_review.py'
      - 'astra_v2/story_review_shortlist.py'
      - 'astra_v2/editorial_review_packet.py'
      - 'astra_v2/story_cohort_quality.py'
      - 'astra_v2/story_cohort_history.py'
      - 'tests/test_story_cohort_history.py'
      - 'tests/test_story_cohort_quality.py'
      - 'astra_v2/story_mechanism_ledger.py'

permissions:
  contents: write

concurrency:
  group: astra-story-proposals
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-24.04
    # Two complete history audits must finish before the review bundle is exported.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore persistent proposal ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime-health
          git fetch --depth=1 origin astra-state
          if git cat-file -e origin/astra-state:runtime-health/story_proposals.json 2>/dev/null; then
            git show origin/astra-state:runtime-health/story_proposals.json > runtime-health/story_proposals.json
            echo "ASTRA_PROPOSAL_LEDGER_RESTORED=astra-state"
          else
            echo "No durable ledger found; attempting artifact migration."
            gh run list --workflow astra-story-proposals.yml --status success --limit 20 --json databaseId |
              python -c 'import json,sys; print("\n".join(str(x["databaseId"]) for x in json.load(sys.stdin)))' |
              while read -r id; do
                if gh run download "$id" --name astra-unreviewed-story-ledger --dir runtime-health 2>/dev/null; then
                  echo "ASTRA_PROPOSAL_LEDGER_RESTORED_FROM_ARTIFACT=$id"
                  break
                fi
              done
          fi
      - name: Restore bounded cohort history
        run: |
          if git cat-file -e origin/astra-state:runtime-health/story_cohort_history.json 2>/dev/null; then
            git show origin/astra-state:runtime-health/story_cohort_history.json > runtime-health/story_cohort_history.json
          fi
      - name: Restore mechanism review history from state branch
        run: |
          git fetch --depth=1 origin astra-state
          mkdir -p runtime-health
          if git cat-file -e origin/astra-state:runtime-health/story_mechanisms.json 2>/dev/null; then
            git show origin/astra-state:runtime-health/story_mechanisms.json > runtime-health/story_mechanisms.json
          fi
          python -c 'from astra_v2.story_mechanism_ledger import load_mechanisms; print("ASTRA_REVIEWED_MECHANISMS=" + str(len(load_mechanisms("runtime-health/story_mechanisms.json"))))'
      - name: Restore publication novelty history from state branch
        run: |
          git fetch --depth=1 origin astra-state
          git show origin/astra-state:astra_v2_state.json > astra_v2_state.json
          if git cat-file -e origin/astra-state:astra_story_history.json 2>/dev/null; then
            git show origin/astra-state:astra_story_history.json > astra_story_history.json
          fi
      - name: Audit history-aware plot-first supply (diagnostic only)
        run: |
          python - <<'PY'
          import json
          from astra_v2.persisted_plot_proposals import proposals_with_history
          from astra_v2.plot_first_proposals import structural_key
          candidates = proposals_with_history(limit=100)
          assert all(not item["production_ready"] for item in candidates)
          assert len({structural_key(item) for item in candidates}) == len(candidates)
          print("ASTRA_HISTORY_AWARE_PLOT_SUPPLY=" + json.dumps({
              "unreviewed_candidates": len(candidates),
              "approved_for_production": 0,
              "publication_enabled": False
          }, sort_keys=True))
          PY
      - name: Snapshot existing proposal identities for cohort comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ledger_path = Path("runtime-health/story_proposals.json")
          ledger = json.loads(ledger_path.read_text()) if ledger_path.exists() else {"proposals": []}
          Path("/tmp/astra-existing-proposal-ids.json").write_text(
              json.dumps([x["content_id"] for x in ledger["proposals"]]), encoding="utf-8")
          PY
      - name: Generate novel unreviewed proposals
        env:
          ASTRA_PROPOSAL_BATCH: "100"
        run: /usr/bin/time -f "ASTRA_STAGE_GENERATION_SECONDS=%e ASTRA_STAGE_GENERATION_PEAK_KB=%M" python -m astra_v2.autonomous_story_proposals
      - name: Snapshot inventory before plot-first replenishment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ledger = json.loads(Path("runtime-health/story_proposals.json").read_text(encoding="utf-8"))
          Path("/tmp/astra-plot-first-before.json").write_text(json.dumps(
              [x.get("content_id") for x in ledger["proposals"]]), encoding="utf-8")
          PY
      - name: Replenish unreviewed inventory with history-filtered plot-first drafts
        env:
          ASTRA_PLOT_FIRST_BATCH: "10"
        run: python -m astra_v2.plot_first_inventory
      - name: Verify plot-first additions and isolation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from astra_v2.publication_quality import publication_rejection
          previous = set(json.loads(Path("/tmp/astra-plot-first-before.json").read_text(encoding="utf-8")))
          ledger = json.loads(Path("runtime-health/story_proposals.json").read_text(encoding="utf-8"))
          added = [x for x in ledger["proposals"] if x.get("content_id") not in previous]
          if len(added) > 10 or len({x.get("content_id") for x in added}) != len(added):
              raise SystemExit("Invalid plot-first replenishment count or duplicate IDs")
          if any(x.get("production_ready") is not False or
                 publication_rejection(x) != "unreviewed_causal_draft" for x in added):
              raise SystemExit("Plot-first inventory contains an unsafe addition")
          print("ASTRA_PLOT_FIRST_ADDED_VERIFIED=" + str(len(added)))
          Path("/tmp/astra-plot-first-ids.json").write_text(
              json.dumps([x["content_id"] for x in added]), encoding="utf-8")
          PY
      - name: Verify isolation and persistence
        run: |
          python -m unittest discover -s tests -p test_astra_autonomous_story_proposals.py -v
          python -m unittest discover -s tests -p test_astra_proposal_history.py -v
      - name: Triage proposals without granting publication approval
        run: /usr/bin/time -f "ASTRA_STAGE_TRIAGE_SECONDS=%e ASTRA_STAGE_TRIAGE_PEAK_KB=%M" python -m astra_v2.story_editorial_report
      - name: Audit production eligibility without promotion
        run: /usr/bin/time -f "ASTRA_STAGE_AUDIT_SECONDS=%e ASTRA_STAGE_AUDIT_PEAK_KB=%M" python -m astra_v2.story_supply_review
      - name: Compare newly generated proposals with historical inventory
        run: python -m astra_v2.story_cohort_quality
      - name: Update bounded cohort trend without approval
        run: |
          python -m unittest discover -s tests -p test_story_cohort_history.py -v
          python -m astra_v2.story_cohort_history
      - name: Generate read-only editorial shortlist
        run: python -m astra_v2.story_review_shortlist
      - name: Validate editorial shortlist diagnostic schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("runtime-health/story_review_shortlist.json")
          if not p.is_file():
              raise SystemExit("Editorial shortlist missing after generation")
          data = json.loads(p.read_text(encoding="utf-8"))
          required = ("candidates_with_title_story_flags", "candidates_with_causal_continuity_flags", "candidates_with_primary_problem_resolution_flags")
          missing = [key for key in required if key not in data]
          if missing:
              raise SystemExit(f"Editorial shortlist missing diagnostic fields: {missing}")
          candidates = data.get("review_candidates")
          if not isinstance(candidates, list):
              raise SystemExit("Editorial shortlist review_candidates must be a list")
          for key, field in (("candidates_with_title_story_flags", "title_story_flags"),
                             ("candidates_with_causal_continuity_flags", "causal_continuity_flags"), ("candidates_with_primary_problem_resolution_flags", "primary_problem_resolution_flags")):
              if any(not isinstance(item.get(field), list) for item in candidates):
                  raise SystemExit(f"Editorial shortlist candidates missing {field}")
              if data[key] != sum(bool(item[field]) for item in candidates):
                  raise SystemExit(f"Editorial shortlist count mismatch for {key}")
          for item in candidates:
              if not isinstance(item.get("causal_continuity_evidence"), list):
                  raise SystemExit("Missing causal continuity evidence")
              evidence = item.get("primary_problem_resolution_evidence")
              if bool(item["primary_problem_resolution_flags"]) != isinstance(evidence, dict):
                  raise SystemExit("Primary problem evidence mismatch")
          print(f"Validated diagnostic fields for {len(candidates)} editorial candidates")
          PY
      - name: Export full shortlist stories and pending review decisions
        run: |
          python -m astra_v2.editorial_review_packet \
            --stories runtime-health/story_proposals.json \
            --shortlist runtime-health/story_review_shortlist.json \
            --output runtime-health/story_review_packet.json \
            --stories-output runtime-health/story_review_stories.json \
            --reviews-output runtime-health/story_review_decisions.json
      - name: Prepare exported editorial candidates without approval
        run: |
          python -m astra_v2.editorial_batch_preparation \
            --stories runtime-health/story_review_stories.json \
            --output runtime-health/story_review_preparation.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("runtime-health/story_review_preparation.json").read_text())
          stories = json.loads(Path("runtime-health/story_review_stories.json").read_text())["stories"]
          assert result["count"] == len(stories)
          assert result["approved_count"] == 0
          assert result["publication_triggered"] is False
          assert all(not item["story"]["production_ready"] for item in result["stories"])
          print("ASTRA_EDITORIAL_PREPARATION_VERIFIED=" + str(result["count"]))
          PY
      - name: Summarize reviewable story supply without approval
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ledger_path = Path("runtime-health/story_proposals.json")
          review_path = Path("runtime-health/story_supply_review.json")
          ledger = json.loads(ledger_path.read_text()) if ledger_path.exists() else {"proposals": []}
          review = json.loads(review_path.read_text()) if review_path.exists() else {}
          proposals = ledger.get("proposals", [])
          assessments = {x.get("content_id"): x for x in review.get("proposals", [])}
          lines = [
              "## ASTRA story supply review",
              "",
              f"- Unreviewed proposals available: **{len(proposals)}**",
              f"- Editorial issues flagged: **{review.get('editorial_issue_count', 'not assessed')}**",
              f"- Publication quality blocks: **{review.get('publication_blocked_count', 'not assessed')}**",
              "- Automatically approved: **0** (approval remains a separate human decision)",
              "- Review bundle: full stories, content hashes and pending decisions in the story-ledger artifact.",
              "",
              "| Candidate ID | Editorial flags | Publication block |",
              "|---|---|---|",
          ]
          shortlist_path = Path("runtime-health/story_review_shortlist.json")
          shortlist = json.loads(shortlist_path.read_text()) if shortlist_path.exists() else {}
          candidates = shortlist.get("review_candidates", [])
          lines.insert(5, f"- Recent editorial shortlist: **{len(candidates)}** (human review required)")
          for item in candidates:
              cid = item.get("content_id", "missing-id")
              assess = assessments.get(cid, {})
              issues = ", ".join(assess.get("editorial_issues", [])) or "none reported"
              block = assess.get("publication_rejection") or "none reported"
              lines.append(f"| {cid} | {issues} | {block} |")
          if not proposals:
              lines += ["", "No candidate proposals were generated; inspect the proposal-generation step and restored novelty history."]
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          print(f"ASTRA_REVIEWABLE_PROPOSALS={len(proposals)}")
          print(f"ASTRA_APPROVED_FOR_PRODUCTION={review.get('approved_for_production', 0)}")
          PY
      - name: Persist proposal ledger to astra-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/astra-proposal-persist
          cp runtime-health/story_proposals.json /tmp/astra-proposal-persist/story_proposals.json
          if [ -f runtime-health/story_mechanisms.json ]; then cp runtime-health/story_mechanisms.json /tmp/astra-proposal-persist/story_mechanisms.json; fi
          cp runtime-health/story_editorial_report.json /tmp/astra-proposal-persist/story_editorial_report.json
          cp runtime-health/story_supply_review.json /tmp/astra-proposal-persist/story_supply_review.json
          cp runtime-health/story_cohort_quality.json /tmp/astra-proposal-persist/story_cohort_quality.json
          cp runtime-health/story_cohort_history.json /tmp/astra-proposal-persist/story_cohort_history.json
          cp runtime-health/story_review_shortlist.json /tmp/astra-proposal-persist/story_review_shortlist.json
          cp runtime-health/story_review_{packet,stories,decisions}.json /tmp/astra-proposal-persist/
          git fetch --depth=1 origin astra-state
          # The run restored these state files into the main-branch worktree.
          # Move them out before switching to astra-state, which owns their paths.
          cp astra_v2_state.json /tmp/astra-proposal-persist/astra_v2_state.json
          if [ -f astra_story_history.json ]; then cp astra_story_history.json /tmp/astra-proposal-persist/astra_story_history.json; fi
          rm -f astra_v2_state.json astra_story_history.json
          git stash push --include-untracked -m "ASTRA proposal ledger handoff" -- runtime-health
          git checkout -B astra-state origin/astra-state
          mkdir -p runtime-health
          cp /tmp/astra-proposal-persist/*.json runtime-health/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep a small, independently readable status alongside the large ledger.
          python - <<'PY'
          import json
          from pathlib import Path
          ledger = json.loads(Path("runtime-health/story_proposals.json").read_text(encoding="utf-8"))
          review = json.loads(Path("runtime-health/story_supply_review.json").read_text(encoding="utf-8"))
          ids = json.loads(Path("/tmp/astra-plot-first-ids.json").read_text(encoding="utf-8"))
          summary = {
              "schema_version": 1,
              "workflow_run_id": "${{ github.run_id }}",
              "workflow_attempt": "${{ github.run_attempt }}",
              "commit": "${{ github.sha }}",
              "total_unreviewed_inventory": len(ledger["proposals"]),
              "new_plot_first_candidates": len(ids),
              "editorial_issues_flagged": review.get("editorial_issue_count"),
              "publication_quality_blocks": review.get("publication_blocked_count"),
              "approved_for_production": 0,
              "structurally_sound_unreviewed_count": review.get("structurally_sound_unreviewed_count"),
              "editorial_review_queue_count": len(review.get("review_queue", [])),
              "editorial_reason_counts": review.get("editorial_reason_counts", {}),
              "publication_rejection_reason_counts": review.get("publication_rejection_reason_counts", {}),
          }
          Path("runtime-health/story_supply_status.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("ASTRA_SUPPLY_STATUS=" + json.dumps(summary, sort_keys=True))
          PY
          git add runtime-health/story_proposals.json runtime-health/story_editorial_report.json runtime-health/story_supply_review.json runtime-health/story_review_shortlist.json runtime-health/story_cohort_quality.json runtime-health/story_cohort_history.json runtime-health/story_supply_status.json
          git add runtime-health/story_review_packet.json runtime-health/story_review_stories.json runtime-health/story_review_decisions.json
          if [ -f runtime-health/story_mechanisms.json ]; then git add runtime-health/story_mechanisms.json; fi
          if git diff --cached --quiet; then
            echo "ASTRA_DURABLE_LEDGER_CHANGED=false"
          else
            git commit -m "Persist ASTRA story proposal inventory"
            git push origin astra-state
            echo "ASTRA_DURABLE_LEDGER_CHANGED=true"
          fi
      - name: Verify durable ledger write and read-back
        run: |
          git fetch origin astra-state
          git show origin/astra-state:runtime-health/story_proposals.json > /tmp/astra-ledger-readback.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path("/tmp/astra-proposal-persist/story_proposals.json").read_text(encoding="utf-8"))
          actual = json.loads(Path("/tmp/astra-ledger-readback.json").read_text(encoding="utf-8"))
          if expected != actual:
              raise SystemExit("Durable ledger read-back differs from the generated ledger")
          expected_ids = json.loads(Path("/tmp/astra-plot-first-ids.json").read_text(encoding="utf-8"))
          durable_ids = {x.get("content_id") for x in actual.get("proposals", [])}
          if not set(expected_ids).issubset(durable_ids):
              raise SystemExit("Plot-first additions missing from durable state")
          print("ASTRA_DURABLE_PLOT_FIRST_ADDED=" + str(len(expected_ids)))
          status = json.loads(__import__("subprocess").check_output(
              ["git", "show", "origin/astra-state:runtime-health/story_supply_status.json"],
              text=True))
          if status["total_unreviewed_inventory"] != len(actual["proposals"]) or (
                  status["new_plot_first_candidates"] != len(expected_ids)):
              raise SystemExit("Durable supply status does not match persisted ledger")
          cohort_path = Path("runtime-health/story_cohort_quality.json")
          if not cohort_path.exists():
              raise SystemExit("Durable cohort-quality report missing")
          cohort = json.loads(cohort_path.read_text(encoding="utf-8"))
          expected_cohort = json.loads(Path("/tmp/astra-proposal-persist/story_cohort_quality.json").read_text(encoding="utf-8"))
          if cohort != expected_cohort:
              raise SystemExit("Durable cohort-quality report differs from generated report")
          if (cohort.get("approved_for_production") != 0 or
                  cohort.get("publication_enabled") is not False):
              raise SystemExit("Cohort report must not enable publishing")
          if sum(cohort.get(group, {}).get("total", 0) for group in ("new", "historical")) != len(actual["proposals"]):
              raise SystemExit("Cohort totals do not match persisted inventory")
          trend = json.loads(Path("runtime-health/story_cohort_history.json").read_text())
          expected_trend = json.loads(Path("/tmp/astra-proposal-persist/story_cohort_history.json").read_text())
          if trend != expected_trend or not trend.get("runs") or len(trend["runs"]) > 30:
              raise SystemExit("Durable cohort trend missing or inconsistent")
          latest = trend["runs"][-1]
          if (latest["run_id"] != "${{ github.run_id }}" or
                  latest["attempt"] != "${{ github.run_attempt }}" or
                  latest["new_proposals"] != cohort["new"].get("total", 0) or
                  latest["narrative_duplicates"] != cohort["new"].get("issue:narrative_duplicate", 0) or
                  latest["publication_enabled"] is not False):
              raise SystemExit("Durable cohort trend does not match current run")
          for name in ("story_review_packet.json", "story_review_stories.json", "story_review_decisions.json"):
              expected_bundle = json.loads(Path("/tmp/astra-proposal-persist", name).read_text(encoding="utf-8"))
              durable_bundle = json.loads(__import__("subprocess").check_output(
                  ["git", "show", "origin/astra-state:runtime-health/" + name], text=True))
              if durable_bundle != expected_bundle:
                  raise SystemExit("Durable review bundle differs: " + name)
          print("ASTRA_DURABLE_REVIEW_BUNDLE=verified")
          print("ASTRA_DURABLE_COHORT_TREND=verified")
          print("ASTRA_DURABLE_COHORT_QUALITY=verified")
          print("ASTRA_DURABLE_SUPPLY_STATUS=verified")
          print("ASTRA_DURABLE_LEDGER_READBACK=verified")
          print(f"ASTRA_DURABLE_PROPOSAL_COUNT={len(actual.get('proposals', []))}")
          print(f"ASTRA_DURABLE_NEXT_INDEX={actual.get('next_index', 'missing')}")
          PY
      - name: Store unreviewed proposal ledger
        uses: actions/upload-artifact@v4
        with:
          name: astra-unreviewed-story-ledger
          path: |
            runtime-health/story_proposals.json
            runtime-health/story_editorial_report.json
            runtime-health/story_supply_review.json
            runtime-health/story_cohort_quality.json
            runtime-health/story_cohort_history.json
            runtime-health/story_review_shortlist.json
            runtime-health/story_review_packet.json
            runtime-health/story_review_stories.json
            runtime-health/story_review_decisions.json
            runtime-health/story_review_preparation.json
          if-no-files-found: error
          retention-days: 90
