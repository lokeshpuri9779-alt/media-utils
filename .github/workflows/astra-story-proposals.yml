name: ASTRA - Autonomous Story Proposal Inventory

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/astra-story-proposals.yml'
      - 'astra_v2/autonomous_story_proposals.py'
      - 'astra_v2/genre_story_supply.py'
      - 'astra_v2/proposal_history.py'
      - 'astra_v2/persisted_plot_proposals.py'
      - 'astra_v2/plot_first_proposals.py'
      - 'astra_v2/shorts_novelty.py'
      - 'astra_v2/publication_quality.py'
      - 'astra_v2/story_editorial_report.py'
      - 'astra_v2/story_editorial.py'
      - 'tests/test_astra_story_editorial.py'
      - 'astra_v2/story_supply_review.py'
      - 'astra_v2/story_mechanism_ledger.py'

permissions:
  contents: write

concurrency:
  group: astra-story-proposals
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore persistent proposal ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime-health
          git fetch --depth=1 origin astra-state
          if git cat-file -e origin/astra-state:runtime-health/story_proposals.json 2>/dev/null; then
            git show origin/astra-state:runtime-health/story_proposals.json > runtime-health/story_proposals.json
            echo "ASTRA_PROPOSAL_LEDGER_RESTORED=astra-state"
          else
            echo "No durable ledger found; attempting artifact migration."
            gh run list --workflow astra-story-proposals.yml --status success --limit 20 --json databaseId |
              python -c 'import json,sys; print("\n".join(str(x["databaseId"]) for x in json.load(sys.stdin)))' |
              while read -r id; do
                if gh run download "$id" --name astra-unreviewed-story-ledger --dir runtime-health 2>/dev/null; then
                  echo "ASTRA_PROPOSAL_LEDGER_RESTORED_FROM_ARTIFACT=$id"
                  break
                fi
              done
          fi
      - name: Restore mechanism review history from state branch
        run: |
          git fetch --depth=1 origin astra-state
          mkdir -p runtime-health
          if git cat-file -e origin/astra-state:runtime-health/story_mechanisms.json 2>/dev/null; then
            git show origin/astra-state:runtime-health/story_mechanisms.json > runtime-health/story_mechanisms.json
          fi
          python -c 'from astra_v2.story_mechanism_ledger import load_mechanisms; print("ASTRA_REVIEWED_MECHANISMS=" + str(len(load_mechanisms("runtime-health/story_mechanisms.json"))))'
      - name: Restore publication novelty history from state branch
        run: |
          git fetch --depth=1 origin astra-state
          git show origin/astra-state:astra_v2_state.json > astra_v2_state.json
          if git cat-file -e origin/astra-state:astra_story_history.json 2>/dev/null; then
            git show origin/astra-state:astra_story_history.json > astra_story_history.json
          fi
      - name: Audit history-aware plot-first supply (diagnostic only)
        run: |
          python - <<'PY'
          import json
          from astra_v2.persisted_plot_proposals import proposals_with_history
          from astra_v2.plot_first_proposals import structural_key
          candidates = proposals_with_history(limit=100)
          assert all(not item["production_ready"] for item in candidates)
          assert len({structural_key(item) for item in candidates}) == len(candidates)
          print("ASTRA_HISTORY_AWARE_PLOT_SUPPLY=" + json.dumps({
              "unreviewed_candidates": len(candidates),
              "approved_for_production": 0,
              "publication_enabled": False
          }, sort_keys=True))
          PY
      - name: Generate novel unreviewed proposals
        env:
          ASTRA_PROPOSAL_BATCH: "100"
        run: /usr/bin/time -f "ASTRA_STAGE_GENERATION_SECONDS=%e ASTRA_STAGE_GENERATION_PEAK_KB=%M" python -m astra_v2.autonomous_story_proposals
      - name: Verify isolation and persistence
        run: |
          python -m unittest discover -s tests -p test_astra_autonomous_story_proposals.py -v
          python -m unittest discover -s tests -p test_astra_proposal_history.py -v
      - name: Triage proposals without granting publication approval
        run: /usr/bin/time -f "ASTRA_STAGE_TRIAGE_SECONDS=%e ASTRA_STAGE_TRIAGE_PEAK_KB=%M" python -m astra_v2.story_editorial_report
      - name: Audit production eligibility without promotion
        run: /usr/bin/time -f "ASTRA_STAGE_AUDIT_SECONDS=%e ASTRA_STAGE_AUDIT_PEAK_KB=%M" python -m astra_v2.story_supply_review
      - name: Summarize reviewable story supply without approval
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ledger_path = Path("runtime-health/story_proposals.json")
          review_path = Path("runtime-health/story_supply_review.json")
          ledger = json.loads(ledger_path.read_text()) if ledger_path.exists() else {"proposals": []}
          review = json.loads(review_path.read_text()) if review_path.exists() else {}
          proposals = ledger.get("proposals", [])
          assessments = {x.get("content_id"): x for x in review.get("proposals", [])}
          lines = [
              "## ASTRA story supply review",
              "",
              f"- Unreviewed proposals available: **{len(proposals)}**",
              f"- Editorial issues flagged: **{review.get('editorial_issue_count', 'not assessed')}**",
              f"- Publication quality blocks: **{review.get('publication_blocked_count', 'not assessed')}**",
              "- Automatically approved: **0** (approval remains a separate human decision)",
              "",
              "| Candidate ID | Editorial flags | Publication block |",
              "|---|---|---|",
          ]
          for item in proposals[:30]:
              cid = item.get("content_id", "missing-id")
              assess = assessments.get(cid, {})
              issues = ", ".join(assess.get("editorial_issues", [])) or "none reported"
              block = assess.get("publication_rejection") or "none reported"
              lines.append(f"| {cid} | {issues} | {block} |")
          if not proposals:
              lines += ["", "No candidate proposals were generated; inspect the proposal-generation step and restored novelty history."]
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          print(f"ASTRA_REVIEWABLE_PROPOSALS={len(proposals)}")
          print(f"ASTRA_APPROVED_FOR_PRODUCTION={review.get('approved_for_production', 0)}")
          PY
      - name: Persist proposal ledger to astra-state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/astra-proposal-persist
          cp runtime-health/story_proposals.json /tmp/astra-proposal-persist/story_proposals.json
          if [ -f runtime-health/story_mechanisms.json ]; then cp runtime-health/story_mechanisms.json /tmp/astra-proposal-persist/story_mechanisms.json; fi
          cp runtime-health/story_editorial_report.json /tmp/astra-proposal-persist/story_editorial_report.json
          cp runtime-health/story_supply_review.json /tmp/astra-proposal-persist/story_supply_review.json
          git fetch --depth=1 origin astra-state
          # The run restored these state files into the main-branch worktree.
          # Move them out before switching to astra-state, which owns their paths.
          cp astra_v2_state.json /tmp/astra-proposal-persist/astra_v2_state.json
          if [ -f astra_story_history.json ]; then cp astra_story_history.json /tmp/astra-proposal-persist/astra_story_history.json; fi
          rm -f astra_v2_state.json astra_story_history.json
          git stash push --include-untracked -m "ASTRA proposal ledger handoff" -- runtime-health
          git checkout -B astra-state origin/astra-state
          mkdir -p runtime-health
          cp /tmp/astra-proposal-persist/*.json runtime-health/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-health/story_proposals.json runtime-health/story_editorial_report.json runtime-health/story_supply_review.json
          if [ -f runtime-health/story_mechanisms.json ]; then git add runtime-health/story_mechanisms.json; fi
          if git diff --cached --quiet; then
            echo "ASTRA_DURABLE_LEDGER_CHANGED=false"
          else
            git commit -m "Persist ASTRA story proposal inventory"
            git push origin astra-state
            echo "ASTRA_DURABLE_LEDGER_CHANGED=true"
          fi
      - name: Verify durable ledger write and read-back
        run: |
          git fetch origin astra-state
          git show origin/astra-state:runtime-health/story_proposals.json > /tmp/astra-ledger-readback.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path("/tmp/astra-proposal-persist/story_proposals.json").read_text(encoding="utf-8"))
          actual = json.loads(Path("/tmp/astra-ledger-readback.json").read_text(encoding="utf-8"))
          if expected != actual:
              raise SystemExit("Durable ledger read-back differs from the generated ledger")
          print("ASTRA_DURABLE_LEDGER_READBACK=verified")
          print(f"ASTRA_DURABLE_PROPOSAL_COUNT={len(actual.get('proposals', []))}")
          print(f"ASTRA_DURABLE_NEXT_INDEX={actual.get('next_index', 'missing')}")
          PY
      - name: Store unreviewed proposal ledger
        uses: actions/upload-artifact@v4
        with:
          name: astra-unreviewed-story-ledger
          path: |
            runtime-health/story_proposals.json
            runtime-health/story_editorial_report.json
            runtime-health/story_supply_review.json
          if-no-files-found: error
          retention-days: 90
