name: ASTRA Render Lab - Manual CPU Benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory CPU renderer capabilities
        run: python render_lab/capabilities.py
      - name: Run CPU-only baseline
        run: python render_lab/benchmark.py
      - name: Benchmark Blender if available
        run: python render_lab/blender_benchmark.py
      - name: Benchmark Godot if available
        run: python render_lab/godot_benchmark.py
      - name: Check offline OpenVINO and SD 1.5 feasibility
        run: python render_lab/openvino_preflight.py
      - name: Verify rendered MP4 and metadata
        run: python render_lab/verify.py
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-render-lab-baseline
          path: |
            render_lab/output/openvino_preflight.json
            render_lab/output/godot.json
            render_lab/output/godot.mp4
            render_lab/output/blender.json
            render_lab/output/blender.mp4
            render_lab/output/verification.json
            render_lab/output/capabilities.json
            render_lab/output/baseline.json
            render_lab/output/baseline.mp4
          if-no-files-found: warn
