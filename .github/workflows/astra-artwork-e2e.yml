name: ASTRA Artwork End-to-End Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'astra/artwork_e2e_smoke.py'
      - 'tests/test_artwork_e2e_smoke.py'
      - 'astra/artwork_archive.py'
      - 'astra/artwork_restore.py'
      - 'astra_v2/restore_reviewed_artwork.py'
      - 'tests/test_restore_reviewed_artwork.py'
      - 'astra_v2/reviewed_artwork_intake.py'
      - 'tests/test_reviewed_artwork_intake.py'
      - 'astra/asset_library.py'
      - '.github/workflows/astra-artwork-e2e.yml'

permissions:
  contents: read

jobs:
  artwork-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install artwork and Studio planner dependencies
        run: python -m pip install 'Pillow>=10,<12' 'httpx>=0.27,<1'
      - name: Run end-to-end archive restore render tests
        run: python -m unittest discover -s tests -p 'test_artwork_e2e_smoke.py' -v
      - name: Validate independently approved remote artwork restoration
        run: python -m unittest discover -s tests -p 'test_restore_reviewed_artwork.py' -v
      - name: Validate complete reviewed artwork intake
        run: python -m unittest discover -s tests -p 'test_reviewed_artwork_intake.py' -v
      - name: Print end-to-end proof
        run: python -m astra.artwork_e2e_smoke
