name: ASTRA - Reviewed Shorts Inventory

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  pull_request:
    paths:
      - 'astra_v2/story_inventory.py'
      - 'astra_v2/production_story_gate.py'
      - 'tests/test_astra_story_inventory.py'
      - '.github/workflows/astra-reviewed-story-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore publication history
        run: |
          git fetch --depth=1 origin astra-state
          git show origin/astra-state:astra_v2_state.json > astra_v2_state.json
          if git cat-file -e origin/astra-state:astra_story_history.json 2>/dev/null; then
            git show origin/astra-state:astra_story_history.json > astra_story_history.json
          fi
      - name: Run inventory regressions
        run: python -m unittest discover -s tests -p test_astra_story_inventory.py -v
      - name: Measure eligible authored story inventory
        run: python -m astra_v2.story_inventory
      - name: Archive report
        uses: actions/upload-artifact@v4
        with:
          name: astra-reviewed-shorts-inventory
          path: runtime-health/story_inventory.json
          retention-days: 30
