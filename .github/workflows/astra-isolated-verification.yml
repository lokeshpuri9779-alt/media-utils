name: ASTRA Isolated Verification

on:
  workflow_dispatch:
  push:
    branches: [astra-isolated-verification-20261013]
    paths:
      - '.github/workflows/astra-isolated-verification.yml'
      - 'astra_v2/**'
      - 'tests/**'
      - 'studio_renderer.py'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASTRA_OPENAI_ENABLED: '0'
      ASTRA_OPENAI_ALLOW_PAID_API: '0'
      ASTRA_SERIES_PUBLICATION: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test and render dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Run story inventory and publication safeguards
        run: |
          python -m unittest discover -s tests -p 'test_astra_story_inventory.py' -v
          python -m unittest discover -s tests -p 'test_astra_publication_quality.py' -v
      - name: Run video and animation regression tests
        run: |
          python -m unittest discover -s tests -p 'test_astra_motion_gate.py' -v
          python -m unittest discover -s tests -p 'test_astra_animal_scenes.py' -v
          python -m unittest discover -s tests -p 'test_scene_layer_contract.py' -v
          python -m unittest discover -s tests -p 'test_astra_v2.py' -v
      - name: Run queue and authentication regression tests
        run: |
          python -m unittest discover -s tests -p 'test_astra_preload_artifact_pagination.py' -v
          python -m unittest discover -s tests -p 'test_astra_youtube_oauth_errors.py' -v
      - name: Render and inspect offline animation sample
        run: |
          mkdir -p verification-output
          python - <<'PY'
          from PIL import Image
          from astra_v2.story_visuals import draw_subject
          for i in range(24):
              frame=Image.new('RGB',(360,640),(24,34,52))
              assert draw_subject(frame,'robot',i/12,(236,174,112))
              frame.save(f'verification-output/frame-{i:03d}.png')
          PY
          ffmpeg -hide_banner -loglevel error -y -framerate 12 -i verification-output/frame-%03d.png -c:v libx264 -pix_fmt yuv420p verification-output/sample.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,nb_frames -of json verification-output/sample.mp4 > verification-output/probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image,ImageChops
          p=json.loads(Path('verification-output/probe.json').read_text())['streams'][0]
          assert (p['width'],p['height'])==(360,640)
          assert int(p['nb_frames'])==24
          a=Image.open('verification-output/frame-000.png')
          b=Image.open('verification-output/frame-012.png')
          assert ImageChops.difference(a,b).getbbox() is not None
          from astra_v2.story_visuals import draw_subject
          # Newly introduced protagonists must each draw and animate distinctly.
          for subject in ('hedgehog', 'turtle'):
              a=Image.new('RGB',(1080,1920),(24,34,52))
              b=Image.new('RGB',(1080,1920),(24,34,52))
              assert draw_subject(a,subject,0.0,(236,174,112)),subject
              assert draw_subject(b,subject,1.0,(236,174,112)),subject
              assert ImageChops.difference(a,b).getbbox() is not None,subject
          PY
      - name: Upload offline sample and probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-offline-render-check
          path: verification-output/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify publication media gate rejects silent or undersized video
        run: |
          python - <<'PY'
          import subprocess, tempfile
          from pathlib import Path
          from astra_v2.creative import inspect_video, CreativeSkip
          with tempfile.TemporaryDirectory() as d:
              p=Path(d)/'silent.mp4'
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-f','lavfi','-i','testsrc2=size=360x640:rate=12','-t','3','-c:v','libx264','-pix_fmt','yuv420p',str(p)],check=True)
              try:
                  inspect_video(p)
              except CreativeSkip as exc:
                  assert str(exc)=='video_audio_orientation_or_duration_failed', str(exc)
              else:
                  raise AssertionError('Silent video passed publication integrity gate')
          PY
      - name: Verify publication media gate accepts valid audio and portrait
        run: |
          python - <<'PY'
          import subprocess, tempfile
          from pathlib import Path
          from astra_v2.creative import inspect_video
          with tempfile.TemporaryDirectory() as d:
              p=Path(d)/'valid.mp4'
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y',
                  '-f','lavfi','-i','testsrc2=size=360x640:rate=12',
                  '-f','lavfi','-i','sine=frequency=440:sample_rate=24000',
                  '-t','3','-c:v','libx264','-pix_fmt','yuv420p',
                  '-c:a','aac','-shortest',str(p)],check=True)
              result=inspect_video(p)
              assert result['width']==360 and result['height']==640, result
              assert 2.5 < result['seconds'] < 3.5, result
          PY
      - name: Verify production storyboard and timed caption frames offline
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          import studio_renderer as studio
          from astra_v2.story_forge import catalog
          story=catalog()[0]
          plan=studio.make_plan(story)
          assert len(plan)>=3, len(plan)
          assert story.get('production_ready') is True, 'Only approved authored stories may be sampled'
          for i,shot in enumerate(plan):
              assert str(shot.get('speech') or '').strip(), i
              assert str(shot.get('headline') or '').strip(), i
          # Production renderer frame path, with synthetic timing to avoid voice downloads.
          for i,shot in enumerate(plan):
              shot['start']=float(i)*2
              shot['end']=float(i+1)*2
              shot['duration']=2.0
          frames=[]
          for t in (0.3,2.3):
              frame=studio.render_frame(plan,t,story['genre'],len(plan)*2)
              assert isinstance(frame,Image.Image)
              assert frame.size==(studio.W,studio.H)
              frames.append(frame)
          assert ImageChops.difference(frames[0].convert('RGB'),frames[1].convert('RGB')).getbbox() is not None
          PY
      - name: Verify landscape video cannot pass Shorts media gate
        run: |
          python - <<'PY'
          import subprocess, tempfile
          from pathlib import Path
          from astra_v2.creative import inspect_video, CreativeSkip
          with tempfile.TemporaryDirectory() as d:
              p=Path(d)/'landscape.mp4'
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y',
                  '-f','lavfi','-i','testsrc2=size=640x360:rate=12',
                  '-f','lavfi','-i','sine=frequency=440:sample_rate=24000',
                  '-t','3','-c:v','libx264','-pix_fmt','yuv420p',
                  '-c:a','aac','-shortest',str(p)],check=True,timeout=90)
              assert p.stat().st_size>30000
              try:
                  inspect_video(p,fmt='short')
              except CreativeSkip as exc:
                  assert str(exc)=='video_audio_orientation_or_duration_failed',str(exc)
              else:
                  raise AssertionError('Landscape video passed Shorts media gate')
          PY
      - name: Verify 2000 procedural animation variants
        run: |
          python - <<'PY'
          from PIL import Image, ImageChops
          from astra_v2.motion_elements import COUNT, SHAPES, MOTIONS, COLORS, variant, draw
          assert COUNT == 2000
          assert len(SHAPES) == 20 and len(MOTIONS) == 10 and len(COLORS) == 10
          assert len({variant(i) for i in range(COUNT)}) == COUNT
          for index in (0, 199, 888, 1999):
              a=Image.new('RGB',(1080,1920),(20,30,45))
              b=Image.new('RGB',(1080,1920),(20,30,45))
              draw(a,index,0)
              draw(b,index,1.2)
              assert ImageChops.difference(a,b).getbbox() is not None, index
          PY
      - name: Verify character and object catalogs
        run: |
          python - <<'PY'
          from PIL import Image, ImageChops
          from astra_v2.character_object_catalog import (
              CHARACTER_COUNT, OBJECT_COUNT, character, prop,
              draw_character, draw_prop,
          )
          assert CHARACTER_COUNT == 2000 and OBJECT_COUNT == 2000
          assert len({character(i) for i in range(2000)}) == 2000
          assert len({prop(i) for i in range(2000)}) == 2000
          for fn in (draw_character, draw_prop):
              for index in (0, 399, 999, 1999):
                  a=Image.new('RGB',(1080,1920),(20,30,45))
                  b=Image.new('RGB',(1080,1920),(20,30,45))
                  fn(a,index,0.0)
                  fn(b,index,1.0)
                  assert ImageChops.difference(a,b).getbbox() is not None, (fn.__name__,index)
          PY
      - name: Verify opt-in character and prop renderer integration
        run: |
          python - <<'PY'
          from PIL import Image, ImageChops
          import studio_renderer
          from astra_v2.story_forge import catalog
          stories = catalog()
          assert stories, 'No approved authored stories available'
          story = stories[0]
          plan = studio_renderer.make_plan(story)
          assert plan
          for shot in plan:
              shot['start'] = 0.0
              shot['end'] = 2.0
              shot['duration'] = 2.0
              shot['experimental_cast_enabled'] = True
          # Compare enabled against disabled at the same timestamp to prove
          # that the new catalog is actually composited, not just moving text.
          a = studio_renderer.render_frame(plan[:1], 0.3, 'fiction', 2.0)
          plan[0]['experimental_cast_enabled'] = False
          baseline = studio_renderer.render_frame(plan[:1], 0.3, 'fiction', 2.0)
          plan[0]['experimental_cast_enabled'] = True
          b = studio_renderer.render_frame(plan[:1], 1.3, 'fiction', 2.0)
          assert a.size == (1080, 1920)
          assert ImageChops.difference(a.convert('RGB'), baseline.convert('RGB')).getbbox() is not None, 'Cast layer not visible'
          assert ImageChops.difference(a.convert('RGB'), b.convert('RGB')).getbbox() is not None
          # Publish reduced preview frames for visual review, not to YouTube.
          from pathlib import Path
          out=Path('verification-output')
          out.mkdir(exist_ok=True)
          a.resize((270,480)).save(out/'cast-prop-preview-0.png')
          b.resize((270,480)).save(out/'cast-prop-preview-1.png')
          PY
      - name: Upload experimental cast and prop previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-cast-prop-previews
          path: verification-output/cast-prop-preview-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Build visual diversity contact sheets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          from astra_v2.character_object_catalog import SPECIES, OBJECTS, draw_character, draw_prop
          out=Path('verification-output')
          out.mkdir(exist_ok=True)
          def sheet(filename, labels, draw_fn, index_fn, columns=5):
              tile_w,tile_h=220,280
              rows=(len(labels)+columns-1)//columns
              canvas=Image.new('RGB',(columns*tile_w,rows*tile_h),(22,31,46))
              for i,label in enumerate(labels):
                  tile=Image.new('RGB',(1080,1920),(28,40,59))
                  draw_fn(tile,index_fn(i),1.1,540,900)
                  crop=tile.crop((260,570,820,1280)).resize((190,240))
                  x=(i%columns)*tile_w+15
                  y=(i//columns)*tile_h+10
                  canvas.paste(crop,(x,y))
                  ImageDraw.Draw(canvas).text((x,y+245),label,fill=(240,241,244))
              canvas.save(out/filename)
          sheet('character-species-contact-sheet.png',SPECIES,draw_character,lambda i:i*100)
          sheet('object-categories-contact-sheet.png',OBJECTS,draw_prop,lambda i:i*50)
          PY
      - name: Upload visual diversity contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-diversity-contact-sheets
          path: verification-output/*contact-sheet.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Record verification boundary
        run: |
          echo 'Regression checks completed. No YouTube credentials are provided to this workflow.'
          echo 'Offline animation and production frame checks completed; neural narration, full production encoding, caption timing with real audio, creative approval and publication remain unverified.' >> "$GITHUB_STEP_SUMMARY"
