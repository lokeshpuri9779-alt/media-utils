name: Astra one-shot private pilot

on:
  push:
    paths:
      - '.github/workflows/astra-private-pilot.yml'

permissions:
  contents: write

concurrency:
  group: astra-private-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_FULL_REFRESH_TOKEN: ${{ secrets.YOUTUBE_FULL_REFRESH_TOKEN }}
      YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
      YOUTUBE_COMMUNITY_REFRESH_TOKEN: ${{ secrets.YOUTUBE_COMMUNITY_REFRESH_TOKEN }}
      YOUTUBE_COMMUNITY_CLIENT_ID: ${{ secrets.YOUTUBE_COMMUNITY_CLIENT_ID }}
      YOUTUBE_COMMUNITY_CLIENT_SECRET: ${{ secrets.YOUTUBE_COMMUNITY_CLIENT_SECRET }}
      YOUTUBE_PRIVACY: private
      ORT_DISABLE_TELEMETRY: '1'
      ASTRA_LONG_ENABLED: '0'
      ASTRA_CHANNEL: 'rayvan'
      ASTRA_INITIAL_DAILY_TARGET: '1'
      ASTRA_MAX_DAILY_TARGET: '1'
      ASTRA_MIN_UPLOAD_INTERVAL_MINUTES: '1'
      ASTRA_FORCE_RUN: '1'
      ASTRA_PROBE_ID: 'private-pilot-2026-10-07-v1'
    steps:
      - name: Checkout validated production
        uses: actions/checkout@v7
        with:
          ref: astra-production
          fetch-depth: 0
          submodules: recursive
      - name: Restore adaptive runtime state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin astra-state
          for f in performance.json quota_state.json SHORTS.md; do
            git checkout origin/astra-state -- "$f" 2>/dev/null || true
          done
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Cache neural voice
        uses: actions/cache@v4
        with:
          path: ~/.cache/astra-voice
          key: astra-kokoro-v1-beb0d184
      - name: Cache faster-whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: astra-faster-whisper-tiny-en-v1
      - name: Run one private production pilot
        id: controller
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import cloud_once as c
          from premium_stories import catalog
          from distribution import branded_description, optimize_title
          from revenue_geo import geography_state
          from ypp_safety import enforce

          story = next(x for x in catalog() if x.get("content_id") == "iss-sixteen-sunrises-v1")
          if c.content_already_published(story["content_id"]):
              raise RuntimeError("Pilot story is already present in persistent history; refusing duplicate.")

          fields = (
              "genre","content_id","source","trend_matches","selection_reason","stage0_rank",
              "stage0_score","winner_descendant","exploration_rate","hook","question","prompt",
              "answer","script","news_source","news_title","secondary_source",
              "secondary_news_source","source_count","sensitive_topic","trend_region",
              "trend_traffic","realistic_synthetic","altered_real_event",
              "synthetic_real_person","reused_third_party_media","transformative_commentary",
              "copyright_unlicensed","packaging_winner_score","packaging_candidates"
          )
          c.CONTENT_META = {k: story.get(k) for k in fields}
          c.CONTENT_META["selection_reason"] = "controlled-private-premium-pilot"

          work = Path("/tmp/astra-private-pilot")
          work.mkdir(parents=True, exist_ok=True)
          video = work / "clip.mp4"

          # Keep Astra's normal render, Creative Director, measured media QA,
          # retention repair, and rejection behavior; only candidate selection
          # is pinned for this one controlled private pilot.
          original_select = c.select_content
          def pilot_select(excluded_ids=None, excluded_titles=None):
              return dict(story)
          c.select_content = pilot_select
          try:
              title, desc = c.make_short(video)
          finally:
              c.select_content = original_select

          perf = c.load_performance()
          desc, distribution_plan = branded_description(
              desc, perf, genre=str(c.CONTENT_META.get("genre") or "unknown"), fmt="short"
          )
          title = optimize_title(title, distribution_plan, c.CONTENT_META)
          c.CONTENT_META["distribution_plan"] = distribution_plan
          c.CONTENT_META["revenue_geography"] = geography_state(perf)
          ypp = enforce(title, desc, c.CONTENT_META, perf)
          c.CONTENT_META["ypp_safety"] = ypp
          c.CONTENT_META["ai_disclosure_required"] = bool(ypp.get("ai_disclosure_required"))

          token = c.access_token()
          c.verify_channel(token)
          if c.live_channel_duplicate(token, title, story["content_id"]):
              raise RuntimeError("Pilot blocked by live YouTube duplicate guard.")

          desc += "\nASTRA-ID:" + story["content_id"]
          status, url = c.upload(video, title, desc, token=token)
          if status != "success":
              raise RuntimeError("Pilot upload did not succeed: " + status)

          video_id = url.rsplit("=", 1)[-1]
          c.record_video(video_id, title)
          print("PRIVATE_PILOT_SUCCESS", json.dumps({
              "url": url,
              "title": title,
              "content_id": story["content_id"],
              "visibility": c.CONTENT_META.get("visibility"),
              "director": c.CONTENT_META.get("creative_director"),
              "media_qa": c.CONTENT_META.get("media_qa"),
          }, ensure_ascii=False))
          PY
      - name: Save adaptive state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin astra-state
          if git diff --quiet origin/astra-state -- performance.json quota_state.json SHORTS.md; then
            exit 0
          fi
          STATE_DIR="$(mktemp -d)"
          git worktree add --detach "$STATE_DIR" origin/astra-state
          for f in performance.json quota_state.json SHORTS.md; do
            if [ -e "$f" ]; then cp "$f" "$STATE_DIR/$f"; else rm -f "$STATE_DIR/$f"; fi
          done
          cd "$STATE_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- performance.json quota_state.json SHORTS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record one-shot private Astra pilot [skip ci]"
          git push origin "HEAD:refs/heads/astra-state"
