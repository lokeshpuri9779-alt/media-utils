name: ASTRA clean cinematic review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install render dependencies
        run: python -m pip install 'Pillow>=10,<12' 'imageio-ffmpeg>=0.5,<1'
      - name: Run framing tests
        run: python -m unittest discover -s tests -p 'test_clean_cinematic_render.py' -v
      - name: Require six full-scene source images
        run: |
          test -d premium-assets/clean-scenes || { echo "No reviewed full-scene images in premium-assets/clean-scenes"; exit 1; }
          python - <<'PY'
          from pathlib import Path
          p=Path('premium-assets/clean-scenes')
          images=sorted(x for x in p.iterdir() if x.suffix.lower() in ('.png','.jpg','.jpeg','.webp'))
          if len(images)!=6: raise SystemExit(f"Need exactly six approved scene images; found {len(images)}")
          print('Found six scene images')
          PY
      - name: Render clean review video
        run: |
          python - <<'PY'
          from pathlib import Path
          from experimental.clean_cinematic_render import render
          images=sorted(x for x in Path('premium-assets/clean-scenes').iterdir() if x.suffix.lower() in ('.png','.jpg','.jpeg','.webp'))
          print(render(images,'clean-review/ASTRA_clean_24s.mp4'))
          PY
      - name: Verify playable H.264 MP4
        run: |
          python - <<'PY'
          import subprocess
          from imageio_ffmpeg import get_ffmpeg_exe
          p='clean-review/ASTRA_clean_24s.mp4'
          subprocess.run([get_ffmpeg_exe(),'-v','error','-i',p,'-f','null','-'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astra-clean-cinematic-review
          path: clean-review/ASTRA_clean_24s.mp4
          retention-days: 3
