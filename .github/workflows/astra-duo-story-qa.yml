name: ASTRA Studio Duo Story QA
on:
  pull_request:
    branches: [main]
    paths:
      - astra_v2/pillow_duo_stories.py
      - astra_v2/story_forge.py
      - astra_v2/crossgenre_directed_24.py
      - tests/test_crossgenre_directed_24.py
      - astra_v2/editorial_batch_oct2026.py
      - tests/test_editorial_oct2026.py
      - tools/editorial_oct2026_preview.py
      - tests/test_pillow_duo_story_supply.py
      - tests/test_studio721_release.py
      - studio_renderer.py
      - .github/workflows/astra-v2-preload.yml
      - .github/workflows/astra-v2-publish.yml
      - astra_v2/pillow_duo_scene.py
      - astra_v2/pillow_scene_direction.py
      - tests/test_pillow_scene_direction.py
      - tests/test_astra_duo_setting_consistency.py
      - astra_v2/story_action_motion.py
      - tests/test_story_action_motion.py
      - tests/test_astra_story_inventory.py
      - .github/workflows/astra-duo-story-qa.yml
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Validate curated story supply
        run: |
          python -m unittest discover -s tests -p 'test_story_action_motion.py' -v
          python -m unittest discover -s tests -p 'test_astra_story_inventory.py' -v
          python -m unittest discover -s tests -p 'test_crossgenre_directed_24.py' -v
          python -m unittest discover -s tests -p 'test_editorial_oct2026.py' -v
          python -m unittest discover -s tests -p 'test_pillow_duo_story_supply.py' -v
          python -m unittest discover -s tests -p 'test_pillow_scene_direction.py' -v
          python -m unittest discover -s tests -p 'test_astra_duo_setting_consistency.py' -v
      - name: Verify Studio 7.3.0 provenance and live publisher regression tests
        env:
          ASTRA_MIN_STUDIO_VERSION: '7.3.0'
          ASTRA_REQUIRE_STUDIO_PRELOAD: '1'
        run: |
          python -m unittest discover -s tests -p 'test_studio721_release.py' -v
          python -m unittest discover -s tests -p 'test_astra_preload_artifact_pagination.py' -v
      - name: Render one complete voiced two-character Short
        run: |
          mkdir -p duo-preview
          python - <<'PY'
          from astra_v2.story_forge import catalog
          from studio_renderer import render_short
          from quality_lab import evaluate_studio_render
          from pathlib import Path
          s=next(s for s in catalog(limit=256) if s['title']=="The Fox and Rabbit's Last Lantern")
          p=Path('duo-preview/duo-short.mp4')
          report=render_short(s,p)
          verdict=evaluate_studio_render(s,report,video_path=p)
          assert report['renderer']=='studio-7.3.0'
          assert report['visual_edit']['pillow_duo_scenes']==4
          assert verdict['pass'],verdict
          print('ASTRA_DUO_FULL_RENDER_VERIFIED',p.stat().st_size)
          PY
      - name: Verify MP4 codecs, both stream decodes, and duration metadata
        run: |
          set -euo pipefail
          video='duo-preview/duo-short.mp4'
          ffprobe -v error -show_entries stream=index,codec_type,codec_name,duration,width,height -show_entries format=duration,size -of json "$video" > duo-preview/mp4-probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('duo-preview/mp4-probe.json').read_text())
          streams=d.get('streams', [])
          video_streams=[s for s in streams if s.get('codec_type')=='video']
          audio_streams=[s for s in streams if s.get('codec_type')=='audio']
          assert video_streams, 'MP4 is missing a video stream'
          assert audio_streams, 'MP4 is missing narration/audio stream'
          v,a=video_streams[0],audio_streams[0]
          assert v.get('codec_name')=='h264', f"Expected H.264 video, got {v.get('codec_name')}"
          assert a.get('codec_name')=='aac', f"Expected AAC audio, got {a.get('codec_name')}"
          assert (v.get('width'),v.get('height'))==(1080,1920), f"Unexpected frame size: {v.get('width')}x{v.get('height')}"
          assert float(d.get('format',{}).get('duration',0))>0, 'Missing/invalid container duration'
          assert float(a.get('duration',0) or d['format']['duration'])>0, 'Missing/invalid audio duration'
          print('ASTRA_MP4_METADATA_OK', json.dumps({'video_codec':v['codec_name'],'audio_codec':a['codec_name'],'resolution':[v['width'],v['height']],'duration':d['format']['duration']}))
          PY
          ffmpeg -v error -i "$video" -map 0:v:0 -f null -
          ffmpeg -v error -i "$video" -map 0:a:0 -f null -
          ffmpeg -v error -i "$video" -map 0:v:0 -map 0:a:0 -f null -
          echo 'ASTRA_DUO_MP4_BOTH_STREAMS_DECODE_OK'
      - name: Write machine-readable render verification evidence
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('duo-preview/mp4-probe.json')
          report={'workflow':'ASTRA Studio Duo Story QA','mp4_probe_present':p.is_file(),'mp4_probe':json.loads(p.read_text()) if p.is_file() else None}
          Path('duo-preview/verification-evidence.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
      - name: Render all 80 authored story beats as storyboard contact sheet
        run: python -m tools.editorial_oct2026_preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astra-duo-voiced-preview
          path: |
            duo-preview/
            preview/editorial-oct2026-scenes.png
            preview/editorial-oct2026-qa.json
          if-no-files-found: warn
          retention-days: 7
