name: Experimental Godot Motion (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install free Godot 4 and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg unzip xvfb libgl1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2
          curl -fL --retry 3 --connect-timeout 20 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          sudo install -m 755 /tmp/godot-bin/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
      - name: Run headless animation benchmark
        run: python3 tools/experimental_godot_benchmark.py
      - name: Save video and timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-godot-${{ github.run_id }}
          path: artifacts/experimental-godot/
          retention-days: 7
          if-no-files-found: warn
