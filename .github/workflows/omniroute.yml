name: OmniRoute Free Video Pilot

# Automatic CI disabled by user request. Run manually only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-video-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      HOSTNAME: '127.0.0.1'
      OMNIROUTE_SKIP_SYSTEM_TRUST: '1'
      DISABLE_SQLITE_AUTO_BACKUP: 'true'
      REQUIRE_API_KEY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pinned OmniRoute
        run: npm install -g omniroute@3.8.51 --no-audit --no-fund

      - name: Start local gateway
        shell: bash
        run: |
          set -euo pipefail
          export DATA_DIR="$RUNNER_TEMP/astra-omniroute"
          export INITIAL_PASSWORD="$(openssl rand -hex 24)"
          export JWT_SECRET="$(openssl rand -hex 32)"
          export API_KEY_SECRET="$(openssl rand -hex 32)"
          nohup omniroute serve --port 20128 --log --no-open > "$RUNNER_TEMP/omniroute-boot.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/omniroute.pid"
          python - <<'PY'
          import json, time, urllib.request
          base='http://127.0.0.1:20128'
          for _ in range(75):
              try:
                  with urllib.request.urlopen(base + '/api/monitoring/health', timeout=2) as r:
                      if r.status == 200 and isinstance(json.load(r), dict):
                          print('OmniRoute healthy')
                          raise SystemExit(0)
              except Exception:
                  pass
              time.sleep(2)
          raise SystemExit('OmniRoute did not become healthy')
          PY

      - name: Generate one zero-cost watermark-free candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, pathlib, urllib.request, urllib.error

          endpoint='http://127.0.0.1:20128/v1/videos/generations'
          payload={
              'model':'veoaifree-web/seedance',
              'prompt':(
                  'Vertical cinematic short, 9:16. A futuristic glass city at blue hour, '
                  'a single sleek electric hypercar glides through reflective streets, '
                  'subtle rain, volumetric light, physically coherent motion, premium film look, '
                  'no text, no logos, no captions, no watermark.'
              ),
              'aspect_ratio':'9:16'
          }
          req=urllib.request.Request(
              endpoint,
              data=json.dumps(payload).encode(),
              headers={
                  'Content-Type':'application/json',
                  'Authorization':'Bearer sk_omniroute',
                  'X-OmniRoute-No-Cache':'true'
              },
              method='POST'
          )
          try:
              with urllib.request.urlopen(req, timeout=900) as r:
                  body=r.read()
                  headers={k.lower():v for k,v in r.headers.items()}
                  cost=headers.get('x-omniroute-response-cost','')
          except urllib.error.HTTPError as e:
              detail=e.read().decode('utf-8','replace')
              raise SystemExit(f'Pilot generation failed HTTP {e.code}: {detail[:1200]}')

          if cost and cost not in ('0','0.0','0.0000000000'):
              raise SystemExit(f'Paid inference guard tripped: reported cost={cost}')

          data=json.loads(body)
          item=(data.get('data') or [{}])[0]
          b64=item.get('b64_json')
          if not b64 or item.get('format') != 'mp4':
              raise SystemExit('No valid MP4 payload returned by free provider')

          out=pathlib.Path('astra-omniroute-pilot.mp4')
          out.write_bytes(base64.b64decode(b64))
          if out.stat().st_size < 10000:
              raise SystemExit('Returned MP4 is unexpectedly small')

          meta={
              'provider': headers.get('x-omniroute-provider','veoaifree-web'),
              'model': headers.get('x-omniroute-model','veoaifree-web/seedance'),
              'reported_cost_usd': cost or 'unpriced/free route',
              'bytes': out.stat().st_size,
              'watermark_policy': 'provider states generated videos are watermark-free; prompt also forbids text/logos/watermarks',
              'paid_fallback': False
          }
          pathlib.Path('astra-omniroute-pilot.json').write_text(json.dumps(meta,indent=2))
          print(json.dumps(meta,indent=2))
          PY

      - name: Upload pilot result
        uses: actions/upload-artifact@v4
        with:
          name: astra-omniroute-free-pilot
          path: |
            astra-omniroute-pilot.mp4
            astra-omniroute-pilot.json
          if-no-files-found: error
          retention-days: 7

      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Astra OmniRoute free-video pilot"
            echo
            echo "- Route: `veoaifree-web/veo` only"
            echo "- Paid fallback: **disabled**"
            echo "- Requests this run: **1 maximum**"
            echo "- Target: vertical 9:16, no logos/text/watermark"
            echo "- Result artifact: `astra-omniroute-free-pilot` when generation succeeds"
          } >> "$GITHUB_STEP_SUMMARY"
