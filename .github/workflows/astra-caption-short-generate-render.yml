name: ASTRA Caption Short Generate + Review Render

on:
  workflow_dispatch:
    inputs:
      creative_brief:
        description: Optional topic or creative direction (avoid personal or sensitive data)
        required: false
        default: ""
        type: string
      voice:
        description: Kokoro voice
        required: true
        default: af_heart
        type: string
      speed:
        description: Narration speed (0.75–1.25)
        required: true
        default: "1.04"
        type: string

permissions:
  contents: read

concurrency:
  group: astra-caption-short-generate-render
  cancel-in-progress: false

jobs:
  generate-and-render-review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out ASTRA
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-caption-only.txt

      - name: Restore Kokoro voice model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/astra-voice
          key: astra-kokoro-onnx-v1-model-files-v1.1

      - name: Install review-generation and caption-render dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-caption-only.txt

      - name: Restore protected story history for originality context
        run: |
          git fetch --no-tags origin astra-state
          git show origin/astra-state:astra_story_history.json > output-story-history-source.json
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path("output-story-history-source.json").read_text(encoding="utf-8"))
          stories = source.get("stories") if isinstance(source, dict) else source
          if not isinstance(stories, list):
              raise SystemExit("Protected story history has an invalid schema; refusing empty-history generation")
          Path("output").mkdir(exist_ok=True)
          Path("output/story-history.json").write_text(
              json.dumps(stories, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          print(f"Restored {len(stories)} protected story-history entries.")
          PY

      - name: Generate one original review-only candidate
        env:
          ASTRA_GEMINI_ENABLED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ASTRA_GEMINI_MODEL: ${{ vars.ASTRA_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          CREATIVE_BRIEF: ${{ inputs.creative_brief }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY repository secret is not configured."
            exit 1
          fi
          python -m astra_v2.performance_short_generator \
            --history output/story-history.json \
            --output output/candidate.json \
            --packet output/review-packet.json \
            --queue output/review-queue.json \
            --brief "$CREATIVE_BRIEF"

      - name: Enforce review-only candidate contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          candidate = json.loads(Path("output/candidate.json").read_text(encoding="utf-8"))
          packet = json.loads(Path("output/review-packet.json").read_text(encoding="utf-8"))
          queue = json.loads(Path("output/review-queue.json").read_text(encoding="utf-8"))
          for key in ("approved", "production_ready", "eligible_for_automatic_publishing", "published"):
              if candidate.get(key) is not False:
                  raise SystemExit(f"Candidate promotion flag is not false: {key}")
          scenes = candidate.get("performance_scenes")
          roles = ["hook", "stakes", "attempt", "setback", "discovery", "climax", "payoff"]
          if not isinstance(scenes, list) or [scene.get("role") for scene in scenes] != roles:
              raise SystemExit("Candidate must contain the exact seven-scene story sequence")
          if packet.get("approved_count") != 0 or packet.get("rendering_triggered") is not False or packet.get("publication_triggered") is not False:
              raise SystemExit("Review packet is not review-only")
          if queue.get("approved_count") != 0 or queue.get("rendering_triggered") is not False or queue.get("publication_triggered") is not False:
              raise SystemExit("Review queue is not review-only")
          if queue.get("count") != 1 or len(queue.get("candidates", [])) != 1:
              raise SystemExit("Expected exactly one review candidate")
          print("Candidate contract passed; still unapproved and unpublished.")
          PY

      - name: Render narration and timed captions for human review
        env:
          ASTRA_VOICE_CACHE: /home/runner/.cache/astra-voice
          VOICE: ${{ inputs.voice }}
          SPEED: ${{ inputs.speed }}
        run: |
          python -m astra_v2.caption_short_pipeline \
            --candidate output/candidate.json \
            --output output/rayvan-short.mp4 \
            --voice "$VOICE" \
            --speed "$SPEED"

      - name: Verify rendered review report remains unapproved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("output/rayvan-short.review.json").read_text(encoding="utf-8"))
          for key in ("approved", "production_ready", "published"):
              if report.get(key) is not False:
                  raise SystemExit(f"Rendered review report promoted unexpectedly: {key}")
          if report.get("next_action") != "human_review":
              raise SystemExit("Rendered artifact must require human review")
          video = Path("output/rayvan-short.mp4")
          if not video.is_file() or video.stat().st_size < 1024:
              raise SystemExit("Rendered MP4 is missing or invalid")
          print("Review render verified; no approval or publication occurred.")
          PY

      - name: Upload complete review package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rayvan-caption-short-generate-render-review-${{ github.run_id }}
          path: |
            output/candidate.json
            output/review-packet.json
            output/review-queue.json
            output/rayvan-short.mp4
            output/rayvan-short.captions.json
            output/rayvan-short.review.json
          if-no-files-found: ignore
          retention-days: 14
