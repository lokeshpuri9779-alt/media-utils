name: Character action render integration
on:
  workflow_dispatch:
  push:
    branches:
      - feature/story-action-renderer-wiring
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python -m unittest discover -s tests -p 'test_character_action_render.py' -v
      - run: python -m unittest discover -s tests -p 'test_story_action_motion.py' -v
      - run: python -m py_compile studio_renderer.py astra_v2/story_visuals.py
