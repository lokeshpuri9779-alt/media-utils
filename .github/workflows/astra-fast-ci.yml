name: ASTRA Fast CI

on:
  pull_request:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: astra-fast-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stories:
    name: Story and novelty checks
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install story and storage test dependencies
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12' -r integrations/requirements-artifact-storage.txt
      - name: Compile story modules
        run: python -m compileall -q astra_v2
      - name: Run adaptive warehouse contract tests
        run: |
          python -m unittest discover -s tests -p 'test_adaptive_*.py' -v
      - name: Compare story generators (diagnostic only)
        run: |
          python -m unittest discover -s tests -p 'test_astra_generator_comparison.py' -v
          python -m unittest discover -s tests -p 'test_astra_structural_exclusion.py' -v
          python -m unittest discover -s tests -p 'test_astra_persisted_structural_history.py' -v
          python -m unittest discover -s tests -p 'test_astra_plot_first_inventory.py' -v
          python -m astra_v2.generator_comparison
      - name: Run story and novelty safeguards
        run: |
          python -m unittest discover -s tests -p 'test_astra_story_*.py' -v
          python -m unittest discover -s tests -p 'test_astra_durable_story_ledger.py' -v
          python -m unittest discover -s tests -p 'test_astra_shorts_novelty*.py' -v
          python -m unittest discover -s tests -p 'test_astra_autonomous_story_proposals.py' -v
          python -m unittest discover -s tests -p 'test_story_batch_checkpoint.py' -v
          python -m unittest discover -s tests -p 'test_parallel_story_workers.py' -v
          python -m unittest discover -s tests -p 'test_isolated_story_worker.py' -v
          python -m unittest discover -s tests -p 'test_global_story_novelty.py' -v
          python -m unittest discover -s tests -p 'test_single_writer_story_ledger.py' -v
          python -m unittest discover -s tests -p 'test_parallel_story_inventory.py' -v
          python -m unittest discover -s tests -p 'test_astra_proposal_history.py' -v
          python -m unittest discover -s tests -p 'test_astra_story_supply_review.py' -v
          python -m unittest discover -s tests -p 'test_editorial_cache_parity.py' -v
          python -m unittest discover -s tests -p 'test_semantic_candidate_index.py' -v
          python -m unittest discover -s tests -p 'test_indexed_triage_parity.py' -v
          python -m unittest discover -s tests -p 'test_story_supply_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_proposal_visual_variety.py' -v
          python -m unittest discover -s tests -p 'test_mystery_causal_paths.py' -v
          python -m unittest discover -s tests -p 'test_mystery_novelty_benchmark.py' -v
          python -m unittest discover -s tests -p 'test_mystery_generator_comparison.py' -v
          python -m unittest discover -s tests -p 'test_mystery_hard_negative.py' -v
          python -m unittest discover -s tests -p 'test_mystery_plot_engines.py' -v
          python -m unittest discover -s tests -p 'test_mystery_batch_coherence.py' -v
          python -m unittest discover -s tests -p 'test_mystery_rejection_reasons.py' -v
          python -m unittest discover -s tests -p 'test_mystery_narrative_architectures.py' -v
          python -m unittest discover -s tests -p 'test_mystery_novelty_regression.py' -v
          python -m unittest discover -s tests -p 'test_mystery_duplicate_pressure.py' -v
          python -m unittest discover -s tests -p 'test_mystery_premise_expansion.py' -v
          python -m astra_v2.mystery_novelty_benchmark --history-count 200 --sample-start 10000 --sample-count 100
          python -m astra_v2.mystery_novelty_benchmark --history-start 1000 --history-count 400 --sample-start 10000 --sample-count 100
          python -m astra_v2.mystery_novelty_benchmark --history-start 3000 --history-count 400 --sample-start 10000 --sample-count 100
          python -m astra_v2.mystery_novelty_benchmark --history-start 5000 --history-count 200 --sample-start 10000 --sample-count 100
          python -m unittest discover -s tests -p 'test_genre_visual_variety.py' -v
          python -m unittest discover -s tests -p 'test_astra_production_story_gate.py' -v
          python -m unittest discover -s tests -p 'test_editorial_approval_manifest.py' -v
          python -m unittest discover -s tests -p 'test_editorial_review_packet.py' -v
          python -m unittest discover -s tests -p 'test_editorial_approved_intake.py' -v
          python -m unittest discover -s tests -p 'test_editorial_creative_configuration.py' -v
          python -m unittest discover -s tests -p 'test_astra_motion_curves.py' -v
          python -m unittest discover -s tests -p 'test_astra_interaction_props.py' -v
          python -m unittest discover -s tests -p 'test_astra_model_story_novelty.py' -v
          python -m unittest discover -s tests -p 'test_astra_model_runtime_gate.py' -v
  production:
    name: Publisher and package safety
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight API client
        run: python -m pip install --disable-pip-version-check 'httpx==0.28.1'
      - name: Verify publishing and renderer boundaries
        run: |
          python -m unittest discover -s tests -p 'test_astra_renderer_provenance.py' -v
          python -m unittest discover -s tests -p 'test_astra_shorts_fingerprint_lifecycle.py' -v
          python -m unittest discover -s tests -p 'test_astra_preload_novelty.py' -v
          python -m unittest discover -s tests -p 'test_preload_queue.py' -v
          python -m unittest discover -s tests -p 'test_astra_preload_covers.py' -v
          python -m unittest discover -s tests -p 'test_astra_production_readiness.py' -v
  editorial:
    name: Editorial shortlist intake
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install editorial test dependencies
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'PyYAML==6.0.2'
      - name: Test shortlist export and actual workflow configuration
        run: |
          python -m unittest discover -s tests -p 'test_editorial_shortlist_handoff.py' -v
          python -m unittest discover -s tests -p 'test_editorial_workflow_handoff.py' -v
      - name: Audit configured intake with complete current history
        run: |
          set -euo pipefail
          git fetch --depth=1 origin astra-state
          mkdir -p /tmp/astra-editorial-ci
          git show origin/astra-state:astra_v2_state.json > /tmp/astra-editorial-ci/state.json
          git show origin/astra-state:astra_story_history.json > /tmp/astra-editorial-ci/history.json
          git rev-parse origin/astra-state
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          from unittest.mock import patch
          sys.path.insert(0, "tests")
          from test_editorial_workflow_handoff import workflow_environments
          from astra_v2.editorial_approved_intake import intake_files
          from astra_v2.editorial_creative_source import load_editorial_stories
          for index, (workflow, env) in enumerate(workflow_environments()):
              env.update(ASTRA_PUBLISHER_STATE_PATH="/tmp/astra-editorial-ci/state.json",
                         ASTRA_STORY_HISTORY_PATH="/tmp/astra-editorial-ci/history.json")
              result = intake_files(
                  env["ASTRA_EDITORIAL_STORIES_FILE"], env["ASTRA_EDITORIAL_REVIEWS_FILE"],
                  f"/tmp/astra-editorial-ci/approved-{index}.json",
                  env["ASTRA_PUBLISHER_STATE_PATH"], env["ASTRA_STORY_HISTORY_PATH"])
              with patch.dict(os.environ, env):
                  assert load_editorial_stories() == result["stories"], "CLI/creative intake mismatch"
              assert result["publication_triggered"] is False
              summary = {"workflow": workflow, "intake_count": result["intake_count"],
                         "audit": result["audit"], "publication_triggered": False}
              print("ASTRA_CONFIGURED_EDITORIAL_INTAKE=" + json.dumps(summary, sort_keys=True))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
                  out.write(f"- {workflow}: {result['intake_count']} intake candidates; no publication.\n")
          PY
