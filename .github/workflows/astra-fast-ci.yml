name: ASTRA Fast CI

on:
  pull_request:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: astra-fast-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stories:
    name: Story and novelty checks
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install story test image dependency
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Compile story modules
        run: python -m compileall -q astra_v2
      - name: Run story and novelty safeguards
        run: |
          python -m unittest discover -s tests -p 'test_astra_story_*.py' -v
          python -m unittest discover -s tests -p 'test_astra_durable_story_ledger.py' -v
          python -m unittest discover -s tests -p 'test_astra_shorts_novelty*.py' -v
          python -m unittest discover -s tests -p 'test_astra_autonomous_story_proposals.py' -v
          python -m unittest discover -s tests -p 'test_astra_proposal_history.py' -v
          python -m unittest discover -s tests -p 'test_astra_story_supply_review.py' -v
          python -m unittest discover -s tests -p 'test_editorial_cache_parity.py' -v
          python -m unittest discover -s tests -p 'test_semantic_candidate_index.py' -v
          python -m unittest discover -s tests -p 'test_indexed_triage_parity.py' -v
          python -m unittest discover -s tests -p 'test_story_supply_diagnostics.py' -v
          python -m unittest discover -s tests -p 'test_proposal_visual_variety.py' -v
          python -m unittest discover -s tests -p 'test_mystery_causal_paths.py' -v
          python -m unittest discover -s tests -p 'test_mystery_novelty_benchmark.py' -v
          python -m unittest discover -s tests -p 'test_mystery_generator_comparison.py' -v
          python -m unittest discover -s tests -p 'test_mystery_hard_negative.py' -v
          python -m unittest discover -s tests -p 'test_mystery_plot_engines.py' -v
          python -m unittest discover -s tests -p 'test_mystery_batch_coherence.py' -v
          python -m unittest discover -s tests -p 'test_mystery_rejection_reasons.py' -v
          python -m unittest discover -s tests -p 'test_mystery_narrative_architectures.py' -v
          python -m unittest discover -s tests -p 'test_mystery_novelty_regression.py' -v
          python -m unittest discover -s tests -p 'test_mystery_duplicate_pressure.py' -v
          python -m unittest discover -s tests -p 'test_mystery_premise_expansion.py' -v
          python -m astra_v2.mystery_novelty_benchmark --history-count 200 --sample-start 10000 --sample-count 100
          python -m astra_v2.mystery_novelty_benchmark --history-start 1000 --history-count 400 --sample-start 10000 --sample-count 100
          python -m astra_v2.mystery_novelty_benchmark --history-start 3000 --history-count 400 --sample-start 10000 --sample-count 100
          python -m astra_v2.mystery_novelty_benchmark --history-start 5000 --history-count 200 --sample-start 10000 --sample-count 100
          python -m unittest discover -s tests -p 'test_genre_visual_variety.py' -v
          python -m unittest discover -s tests -p 'test_astra_production_story_gate.py' -v
          python -m unittest discover -s tests -p 'test_editorial_approval_manifest.py' -v
          python -m unittest discover -s tests -p 'test_editorial_review_packet.py' -v
          python -m unittest discover -s tests -p 'test_editorial_approved_intake.py' -v
          python -m unittest discover -s tests -p 'test_editorial_creative_configuration.py' -v
          python -m unittest discover -s tests -p 'test_astra_motion_curves.py' -v
          python -m unittest discover -s tests -p 'test_astra_interaction_props.py' -v
          python -m unittest discover -s tests -p 'test_astra_model_story_novelty.py' -v
          python -m unittest discover -s tests -p 'test_astra_model_runtime_gate.py' -v
  production:
    name: Publisher and package safety
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify publisher health journal regression cases
        run: python -m unittest discover -s tests -p 'test_astra_health_journal_validation.py' -v
      - name: Install lightweight API client
        run: python -m pip install --disable-pip-version-check 'httpx==0.28.1'
      - name: Verify publishing and renderer boundaries
        run: |
          python -m unittest discover -s tests -p 'test_astra_renderer_provenance.py' -v
          python -m unittest discover -s tests -p 'test_astra_shorts_fingerprint_lifecycle.py' -v
          python -m unittest discover -s tests -p 'test_astra_preload_novelty.py' -v
          python -m unittest discover -s tests -p 'test_astra_production_readiness.py' -v
