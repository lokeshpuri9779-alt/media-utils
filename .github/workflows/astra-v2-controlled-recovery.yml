name: ASTRA V2 - Controlled Publisher Recovery
on:
  workflow_run:
    workflows: ['ASTRA V2 - Publisher Health Watch']
    types: [completed]
permissions:
  actions: read
  contents: read
concurrency:
  group: astra-v2-controlled-recovery
  cancel-in-progress: false
jobs:
  recover:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check for an already-running automatic preload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          repo = os.environ["REPO"]
          result = subprocess.run(
              ["gh", "api", f"repos/{repo}/actions/workflows/astra-v2-preload.yml/runs?per_page=10"],
              capture_output=True, text=True, check=True, timeout=30)
          runs = json.loads(result.stdout).get("workflow_runs", [])
          active = [r for r in runs if r.get("status") in {"queued", "in_progress"}]
          if active:
              print("ASTRA_RECOVERY=OBSERVE:automatic_preload_already_active")
              for run in active:
                  print(f"ASTRA_PRELOAD_ACTIVE={run.get('html_url')}")
          else:
              print("ASTRA_RECOVERY=NOOP:no_supported_dispatch_trigger")
              print("ASTRA_RECOVERY_POLICY=preload_runs_only_from_configured_push_or_schedule_events")
              print("ASTRA_RECOVERY_ACTION=none; preserving_no_manual_dispatch_policy")
          PY
