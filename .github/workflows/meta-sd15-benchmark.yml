name: SD15 CPU Benchmark (manual only)
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Model profile'
        required: true
        type: choice
        options:
          - quality
          - low_memory
        default: quality
permissions:
  contents: read
concurrency:
  group: rayvan-sd15-benchmark
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'diffusers>=0.30,<0.38' 'transformers>=4.44,<5' 'accelerate>=0.30,<2' 'safetensors>=0.4,<1' 'Pillow>=10,<13'
      - name: Queue safety tests
        run: python -m unittest discover -s tests -p 'test_meta_sd15_queue*.py' -v
      - name: CPU image generation benchmark
        run: |
          mkdir -p artifacts
          python tools/meta_cpu_benchmark.py --profile '${{ inputs.profile }}' --steps 25 --output artifacts/meta_sd15_first.png
      - name: Preserve benchmark output and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sd15-cpu-benchmark-${{ github.run_id }}
          path: |
            artifacts/meta_sd15_first.png
            artifacts/meta_sd15_first.benchmark.json
          if-no-files-found: warn
          retention-days: 7
