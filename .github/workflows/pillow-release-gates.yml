name: Pillow motion release gates
on:
  workflow_dispatch:
  push:
    branches:
      - batch/pillow-release-gates
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_pillow_release_gate.py' -v
      - run: python -m py_compile astra_v2/pillow_release_gate.py
