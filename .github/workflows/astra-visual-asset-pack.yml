name: ASTRA Reusable Visual Asset Pack
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astra-visual-asset-pack.yml'
  workflow_dispatch:
    inputs:
      format:
        description: 'shorts, long, or both'
        type: choice
        options:
          - both
          - shorts
          - long
        default: both
      count:
        description: 'Number of original portrait backgrounds'
        required: false
        default: '1600'
permissions:
  contents: read
concurrency:
  group: astra-reusable-asset-pack
  cancel-in-progress: false
jobs:
  build-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free local image conversion tools
        run: python -m pip install Pillow cairosvg
      - name: Generate, validate and package original assets
        env:
          ASSET_COUNT: ${{ inputs.count || '1600' }}
          ASSET_FORMAT: ${{ inputs.format || 'both' }}
        run: |
          python - <<'PY'
          import io, os, json, hashlib, zipfile
          from pathlib import Path
          import cairosvg
          from PIL import Image
          from astra_v2.visual_artifact_library import artifact
          from astra_v2.illustrated_asset_validation import validate_library
          count=int(os.environ['ASSET_COUNT'])
          if not 1 <= count <= 4000: raise ValueError('count must be 1..4000')
          fmt=os.environ['ASSET_FORMAT']
          if fmt not in ('shorts','long','both'): raise ValueError('invalid format')
          root=Path('runtime-artifacts/astra-pack')
          (root/'art').mkdir(parents=True,exist_ok=True)
          manifest={'assets':[]}
          for format_name in (('shorts','long') if fmt=='both' else (fmt,)):
              width,height=(540,960) if format_name=='shorts' else (1280,720)
              art=root/'art'/format_name/'backgrounds'
              art.mkdir(parents=True,exist_ok=True)
              for i in range(count):
                  scene,svg=artifact(i)
                  raw=cairosvg.svg2png(bytestring=svg.encode(),output_width=540,output_height=720)
                  with Image.open(io.BytesIO(raw)) as source:
                      source=source.convert('RGB')
                      # Fit the entire illustration without cropping or stretching.
                      scale=min(width/source.width,height/source.height)
                      size=(round(source.width*scale),round(source.height*scale))
                      resized=source.resize(size,Image.Resampling.LANCZOS)
                      canvas=Image.new('RGB',(width,height),source.getpixel((0,0)))
                      canvas.paste(resized,((width-size[0])//2,(height-size[1])//2))
                      output=io.BytesIO()
                      canvas.save(output,format='PNG',optimize=True)
                      png=output.getvalue()
                  rel=f'art/{format_name}/backgrounds/{scene}-{i:04d}.png'
                  (root/rel).write_bytes(png)
                  manifest['assets'].append({'id':f'{format_name}-{scene}-{i:04d}',
                      'path':rel,'kind':'background','license':'original',
                      'source':'ASTRA visual_artifact_library procedural generator',
                      'artist':'ASTRA original procedural generator',
                      'style':'stylized-illustration',
                      'tags':[scene,'background',format_name,'environment'],
                      'sha256':hashlib.sha256(png).hexdigest()})
          (root/'art'/'manifest.json').write_text(json.dumps(manifest,indent=2))
          result=validate_library(root)
          assert result['verified_files']==count*(2 if fmt=='both' else 1)
          dest=Path('runtime-artifacts/astra-visual-pack.zip')
          with zipfile.ZipFile(dest,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted((root/'art').rglob('*')):
                  if p.is_file(): z.write(p,p.relative_to(root))
          print('ASTRA_ASSET_PACK='+json.dumps({'verified':result['verified_files'],
              'zip_bytes':dest.stat().st_size,'formats':fmt,'shorts_dimensions':'540x960','long_dimensions':'1280x720','production_approved':False}))
          PY
      - name: Verify compositor tests for Shorts and long videos
        run: |
          python -m unittest discover -s tests -p 'test_astra_asset_video_formats.py' -v
          python -m unittest discover -s tests -p 'test_astra_asset_pack_compositor.py' -v
      - name: Check ZIP archive contents
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          path=Path('runtime-artifacts/astra-visual-pack.zip')
          with zipfile.ZipFile(path) as archive:
              bad=archive.testzip()
              assert bad is None, f'corrupt ZIP member: {bad}'
              files=archive.namelist()
              assert 'art/manifest.json' in files
              print('ASTRA_ASSET_ARCHIVE_VERIFIED='+str(len(files)-1))
          PY
      - name: Upload reusable asset ZIP
        uses: actions/upload-artifact@v4
        with:
          name: astra-original-visual-pack
          path: runtime-artifacts/astra-visual-pack.zip
          retention-days: 30
          if-no-files-found: error
