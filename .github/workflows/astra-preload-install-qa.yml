name: ASTRA Preload Install QA

on:
  pull_request:
    paths:
      - '.github/workflows/astra-v2-preload.yml'
      - '.github/workflows/astra-preload-install-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-preload-install-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        lane: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      ASTRA_PRELOAD_LANE: '${{ matrix.lane }}'
      ASTRA_OPENAI_ENABLED: '0'
      ASTRA_OPENAI_ALLOW_PAID_API: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        continue-on-error: true
        with:
          enable-cache: false
      - name: Read exact production installer
        run: |
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.2' 'Pillow==11.3.0'
          python - <<'PY'
          import os
          from pathlib import Path
          import yaml
          workflow = yaml.safe_load(Path(".github/workflows/astra-v2-preload.yml").read_text())
          steps = workflow["jobs"]["preload"]["steps"]
          matches = [s["run"] for s in steps if s.get("name") == "Install rendering stack"]
          assert len(matches) == 1
          Path(os.environ["RUNNER_TEMP"], "astra-production-install.sh").write_text(matches[0])
          PY
          bash -n "$RUNNER_TEMP/astra-production-install.sh"
      - name: Install rendering stack and probe a real MP4
        timeout-minutes: 18
        run: bash -e -o pipefail "$RUNNER_TEMP/astra-production-install.sh"
      - name: Exercise renderer and preserve rejection gates
        run: |
          python -m unittest discover -s tests -p 'test_astra_motion_gate.py' -v
          python -m unittest discover -s tests -p 'test_astra_animal_scenes.py' -v
          python -m unittest discover -s tests -p 'test_astra_publication_quality.py' -v
          python -m unittest discover -s tests -p 'test_astra_preload_covers.py' -v
          python -c "import astra_v2.preload_worker; print('ASTRA_PRELOAD_RENDER_IMPORT=ready')"
          echo "ASTRA_INSTALL_QA_LANE=$ASTRA_PRELOAD_LANE:passed"
