name: ASTRA Ensemble Story Experiments QA
on:
  pull_request:
    paths:
      - 'astra_v2/ensemble_scene.py'
      - 'astra_v2/fiction_visual_guard.py'
      - 'tests/test_fiction_visual_guard.py'
      - 'astra_v2/ensemble_stage.py'
      - 'astra_v2/ensemble_story_experiments.py'
      - 'studio_renderer.py'
      - 'tests/test_ensemble_experiments.py'
      - 'tests/test_ensemble_direction.py'
      - 'tests/test_ensemble_artifact_activity.py'
      - 'tests/test_ensemble_physical_motion.py'
      - 'tests/test_ensemble_stability_expansion.py'
      - 'tests/test_ensemble_activity_release.py'
      - 'tools/astra_ensemble_preview.py'
      - '.github/workflows/astra-ensemble-experiments-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ensemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      ASTRA_EXPERIMENT_ENSEMBLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'imageio-ffmpeg>=0.5,<1' 'numpy>=1.24' 'httpx>=0.25'
      - name: Full ensemble story QA with strict isolation
        run: |
          python -m unittest discover -s tests -p 'test_ensemble_experiments.py' -v
          python -m unittest discover -s tests -p 'test_ensemble_direction.py' -v
          python -m unittest discover -s tests -p 'test_ensemble_artifact_activity.py' -v
          python -m unittest discover -s tests -p 'test_ensemble_physical_motion.py' -v
          python -m unittest discover -s tests -p 'test_ensemble_stability_expansion.py' -v
          python -m unittest discover -s tests -p 'test_ensemble_activity_release.py' -v
          python -m unittest discover -s tests -p 'test_fiction_visual_guard.py' -v
      - name: Verify stable fiction edges and story-directed set catalog
        run: |
          python - <<'PY'
          from astra_v2.ensemble_stage import ENVIRONMENTS
          from astra_v2.ensemble_story_experiments import catalog
          assert len(ENVIRONMENTS)>=27
          assert len(catalog())==9
          print('ASTRA_ENSEMBLE_SCENE_VARIANTS',len(ENVIRONMENTS))
          PY
      - name: Nine-pilot 3–8 cast Studio storyboard comparison
        run: python -m tools.astra_ensemble_preview
      - uses: actions/upload-artifact@v4
        with:
          name: astra-ensemble-nine-pilots
          path: |
            preview/astra-ensemble-nine-pilots.mp4
            preview/astra-ensemble-nine-pilots.json
          retention-days: 7
          if-no-files-found: error
