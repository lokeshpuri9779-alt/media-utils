name: Astra OmniRoute Adapter Test
on:
  workflow_dispatch:
  push:
    paths:
      - "omniroute_adapter.py"
      - "tests/test_omniroute_adapter.py"
      - ".github/workflows/test-omniroute-adapter.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: PYTHONPATH=. pytest -q tests/test_omniroute_adapter.py
