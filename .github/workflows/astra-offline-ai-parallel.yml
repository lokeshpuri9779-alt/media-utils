name: ASTRA Offline AI Parallel Review (Isolated)

on:
  push:
    branches:
      - experiment/astra-offline-ai-parallel-20261103
    paths:
      - .github/workflows/astra-offline-ai-parallel.yml
      - tools/astra_offline_cpu_smoke.py
      - tools/astra_offline_story_plan.py
      - tools/astra_offline_causal_audit.py
      - tools/astra_offline_reference_benchmark.py
      - tools/grammars/astra_four_beats.gbnf
      - tests/test_astra_offline_cpu_smoke.py
      - tests/test_astra_offline_causal_audit.py
      - tests/test_astra_offline_reference_benchmark.py
      - docs/astra-offline-ai-real-llm.md
  pull_request:
    branches: [main]
    paths:
      - tools/astra_offline_llm.py
      - tools/astra_offline_cpu_smoke.py
      - tools/astra_offline_story_plan.py
      - tools/astra_offline_causal_audit.py
      - tools/astra_offline_reference_benchmark.py
      - tools/grammars/astra_four_beats.gbnf
      - tests/test_astra_offline_llm.py
      - tests/test_astra_offline_cpu_smoke.py
      - tests/test_astra_offline_causal_audit.py
      - tests/test_astra_offline_reference_benchmark.py
      - .github/workflows/astra-offline-ai-parallel.yml
      - docs/astra-offline-ai-parallel.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astra-offline-ai-review-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-lanes:
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'experiment/astra-offline-ai-parallel-20261103')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/experiment/astra-offline-ai-parallel-20261103')
      || (github.event_name == 'push' && github.ref == 'refs/heads/experiment/astra-offline-ai-parallel-20261103'
          && (github.event.head_commit.message == 'experiment(ASTRA): planned GBNF one-shot CPU validation'
              || github.event.head_commit.message == 'experiment(ASTRA): Qwen 1.5B bounded CPU comparison'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        lane: [story, image, motion]
    env:
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ASTRA_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refuse production-like credentials
        run: python3 -m tools.experimental_guard
      - name: Story local-LLM review contract tests (no model inference)
        if: matrix.lane == 'story'
        run: python3 -m unittest -v tests.test_astra_offline_llm tests.test_astra_offline_cpu_smoke tests.test_astra_offline_causal_audit tests.test_astra_offline_reference_benchmark tests.test_astra_model_story_novelty
      - name: Build review-only independent story reference packet
        if: matrix.lane == 'story'
        run: python3 -m tools.astra_offline_reference_benchmark --output artifacts/offline-reference-benchmark/packet.json
      - name: Archive human-review reference packet
        if: matrix.lane == 'story'
        uses: actions/upload-artifact@v4
        with:
          name: astra-offline-story-reference
          path: artifacts/offline-reference-benchmark/packet.json
          if-no-files-found: error
          retention-days: 7
      - name: CPU image preflight and guarded mock tests (no model inference)
        if: matrix.lane == 'image'
        run: |
          python3 -m unittest -v tests.test_experimental_cpu_image_benchmark tests.test_experimental_cpu_runtime_probe tests.test_experimental_openvino_timing
      - name: Install free motion-test dependency (no video model)
        if: matrix.lane == 'motion'
        run: python3 -m pip install --disable-pip-version-check 'Pillow>=10,<12'
      - name: Motion pixel-change tests (no publishing)
        if: matrix.lane == 'motion'
        run: python3 -m unittest -v tests.test_astra_motion_gate
      - name: Write unapproved review evidence for this lane
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          lane = os.environ['ASTRA_LANE']
          assert lane in {'story', 'image', 'motion'}
          report = {
              'lane': lane, 'type': 'contract_and_regression_tests',
              'checks_completed': True, 'real_model_inference_executed': False,
              'semantic_quality': 'not_verified',
              'manual_visual_review_required': True,
              'approved': False, 'production_ready': False, 'published': False,
          }
          root = Path('artifacts/offline-ai-review')
          root.mkdir(parents=True, exist_ok=True)
          (root / (lane + '.json')).write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Archive this lane's evidence
        uses: actions/upload-artifact@v4
        with:
          name: astra-offline-review-${{ matrix.lane }}
          path: artifacts/offline-ai-review/
          if-no-files-found: error
          retention-days: 7

  aggregate-review:
    needs: [review-lanes]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: astra-offline-review-*
          path: artifacts/offline-ai-review
          merge-multiple: true
      - name: Verify all three independent review reports and fail closed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('artifacts/offline-ai-review')
          actual = {p.stem for p in root.glob('*.json')}
          assert actual == {'story', 'image', 'motion'}, actual
          for path in root.glob('*.json'):
              report = json.loads(path.read_text())
              assert report['lane'] == path.stem
              assert report['checks_completed'] is True
              assert report['real_model_inference_executed'] is False
              assert report['semantic_quality'] == 'not_verified'
              assert report['manual_visual_review_required'] is True
              assert all(report[k] is False for k in
                         ('approved', 'production_ready', 'published'))
          print('Three parallel offline-AI review lanes passed; no production approval')
          PY

  real-llm-cpu:
    needs: [aggregate-review]
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/experiment/astra-offline-ai-parallel-20261103'
      && (github.event.head_commit.message == 'experiment(ASTRA): planned GBNF one-shot CPU validation'
              || github.event.head_commit.message == 'experiment(ASTRA): Qwen 1.5B bounded CPU comparison')
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '2'
      MODEL_PROFILE: "${{ github.event.head_commit.message == 'experiment(ASTRA): Qwen 1.5B bounded CPU comparison' && 'qwen15' || 'baseline' }}"
      MODEL_FILE: "${{ github.event.head_commit.message == 'experiment(ASTRA): Qwen 1.5B bounded CPU comparison' && '/tmp/astra-offline-model/qwen2.5-1.5b-instruct-q4_k_m.gguf' || '/tmp/astra-offline-model/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf' }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify experimental branch and credential isolation
        run: |
          test "${GITHUB_REF#refs/heads/}" = "experiment/astra-offline-ai-parallel-20261103"
          python3 -m tools.experimental_guard
          python3 -m unittest -v tests.test_astra_offline_cpu_smoke tests.test_astra_offline_llm
      - name: Bounded CPU, RAM and storage preflight
        run: |
          test "$(nproc)" -ge 1
          free -h
          df -h .
          python3 - <<'PY'
          import shutil
          assert shutil.disk_usage("/tmp").free >= 2_000_000_000, "Not enough disk for isolated small model benchmark"
          PY
      - name: Compile pinned CPU-only llama.cpp from verified source revision
        run: |
          git clone --quiet --depth 1 --branch b12064 https://github.com/ggml-org/llama.cpp.git /tmp/astra-llama-cpp
          test "$(git -C /tmp/astra-llama-cpp rev-parse HEAD)" = "51fe42c5d14bfb9adf0612ff98a9ab79e0e7275c"
          cmake -S /tmp/astra-llama-cpp -B /tmp/astra-llama-cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DGGML_OPENMP=OFF
          cmake --build /tmp/astra-llama-cpp/build -j 2 --target llama-cli
      - name: Download and SHA256-verify one small Apache-2.0 model
        run: |
          mkdir -p /tmp/astra-offline-model
          case "$MODEL_PROFILE" in
            qwen15)
              model_url='https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf'
              model_sha='6a1a2eb6d15622bf3c96857206351ba97e1af16c30d7a74ee38970e434e9407e'
              expected_bytes=1117320736
              ;;
            baseline)
              model_url='https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf'
              model_sha='6eb923e7d26e9cea28811e1a8e852009b21242fb157b26149d3b188f3a8c8653'
              expected_bytes=397808192
              ;;
            *)
              echo "::error::Unknown offline model profile" >&2
              exit 1
              ;;
          esac
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 240 \
            --output "$MODEL_FILE" "$model_url"
          test "$(stat -c%s "$MODEL_FILE")" -eq "$expected_bytes"
          echo "$model_sha  $MODEL_FILE" | sha256sum -c -
      - name: Run exactly one CPU-only offline story inference
        run: |
          ulimit -v 6291456
          python3 -m tools.astra_offline_cpu_smoke \
            --binary /tmp/astra-llama-cpp/build/bin/llama-cli \
            --model "$MODEL_FILE" \
            --output artifacts/offline-real-llm/ \
            --timeout-seconds 180 \
            --model-profile "$MODEL_PROFILE"
      - name: Upload unapproved benchmark evidence even if inference fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-qwen-real-llm-cpu-${{ github.run_id }}
          path: artifacts/offline-real-llm/
          if-no-files-found: warn
          retention-days: 7
