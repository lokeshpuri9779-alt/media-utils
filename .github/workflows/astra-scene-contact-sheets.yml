name: ASTRA Scene Review Sheets
on:
  pull_request:
    paths:
      - 'astra_v2/review_contact_sheets.py'
      - 'tests/test_review_contact_sheets.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: astra-state
          path: state
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12'
      - working-directory: code
        run: python -m unittest discover -s tests -p test_review_contact_sheets.py -v
      - working-directory: code
        run: python -m astra_v2.review_contact_sheets --queue ../state/story_factory_rewrite_queue.json --manifest ../state/story_factory_image_manifest.json --assets ../state/omni_assets --output ../review-output
      - uses: actions/upload-artifact@v4
        with:
          name: astra-scene-review
          path: review-output/
          retention-days: 14
          if-no-files-found: error
