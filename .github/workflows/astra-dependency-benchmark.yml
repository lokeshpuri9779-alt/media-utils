name: ASTRA Dependency Installer Benchmark
on:
  pull_request:
    paths:
      - '.github/workflows/astra-dependency-benchmark.yml'
      - 'requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uv-stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install exact pinned ASTRA stack through uv
        shell: bash
        run: |
          start=$SECONDS
          uv pip install --system -r requirements.txt
          echo "ASTRA_UV_INSTALL_SECONDS=$((SECONDS-start))"
      - name: Import production render dependencies
        run: |
          python - <<'PY'
          import cv2, numpy, PIL, httpx, onnxruntime, imageio_ffmpeg
          import kokoro_onnx
          import faster_whisper
          print('ASTRA_UV_STACK_IMPORTS_OK')
          PY
      - name: Animation smoke after alternate installer
        run: python -m unittest discover -s tests -p 'test_pillow_duo_scene.py' -v
