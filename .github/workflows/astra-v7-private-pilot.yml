name: Astra v7 experimental private pilot

on:
  push:
    paths:
      - '.github/workflows/astra-v7-private-pilot.yml'

permissions:
  contents: write

concurrency:
  group: astra-v7-private-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_FULL_REFRESH_TOKEN: ${{ secrets.YOUTUBE_FULL_REFRESH_TOKEN }}
      YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
      YOUTUBE_COMMUNITY_REFRESH_TOKEN: ${{ secrets.YOUTUBE_COMMUNITY_REFRESH_TOKEN }}
      YOUTUBE_COMMUNITY_CLIENT_ID: ${{ secrets.YOUTUBE_COMMUNITY_CLIENT_ID }}
      YOUTUBE_COMMUNITY_CLIENT_SECRET: ${{ secrets.YOUTUBE_COMMUNITY_CLIENT_SECRET }}
      YOUTUBE_PRIVACY: private
      ORT_DISABLE_TELEMETRY: '1'
      ASTRA_LONG_ENABLED: '0'
      ASTRA_CHANNEL: 'rayvan'
      ASTRA_INITIAL_DAILY_TARGET: '1'
      ASTRA_MAX_DAILY_TARGET: '1'
      ASTRA_MIN_UPLOAD_INTERVAL_MINUTES: '1'
      ASTRA_FORCE_RUN: '1'
      ASTRA_PROBE_ID: 'creative-v7-private-pilot'
    steps:
      - name: Checkout exact v7 candidate
        uses: actions/checkout@v7
        with:
          ref: 7b945808f9b85d1b75a61c2a9be0a1b6b5170d02
          fetch-depth: 0
          submodules: recursive
      - name: Restore adaptive runtime state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin astra-state
          for f in performance.json quota_state.json SHORTS.md; do
            git checkout origin/astra-state -- "$f" 2>/dev/null || true
          done
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Dependencies
        run: pip install -r requirements.txt
      - name: Cache neural voice
        uses: actions/cache@v4
        with:
          path: ~/.cache/astra-voice
          key: astra-kokoro-v1-beb0d184
      - name: Cache faster-whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: astra-faster-whisper-tiny-en-v1
      - name: Run v7 private creative pilot
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import cloud_once as c
          from distribution import branded_description, optimize_title
          from revenue_geo import geography_state
          from ypp_safety import enforce

          # New editorially bounded evergreen story for this private-only pilot.
          story = {
              "genre":"space","kind":"explainer","content_id":"mars-blue-sunset-v7-private",
              "premium_story":True,"production_ready":True,
              "hook":"MARS HAS BLUE SUNSETS",
              "question":"Why can sunset near the Sun look blue on the Red Planet?",
              "answer":"Fine Martian dust keeps blue light concentrated close to the Sun while warmer colors spread more broadly through the sky.",
              "title":"Why Sunsets on Mars Can Look Blue",
              "voice_speed":1.04,
              "source":"https://science.nasa.gov/solar-system/planets/mars/what-does-a-sunrise-sunset-look-like-on-mars/",
              "keywords":["mars","sunset","space"],
              "story_beats":[
                  {"headline":"THE RED PLANET TURNS BLUE","speech":"Near sunset on Mars, the sky around the Sun can glow blue.","visual":"media","story_beat":"reveal","media_query":"Mars sunset","media_file":"File:MarsSunset.jpg","media_fit":"wide","media_motion":"push"},
                  {"headline":"IT'S THE DUST","speech":"Fine dust in the Martian atmosphere scatters light differently from Earth's air.","visual":"planet","story_beat":"mechanism","label":"DUST","sub":"CHANGES THE LIGHT","hot":true},
                  {"headline":"BLUE STAYS NEAR THE SUN","speech":"Blue light stays concentrated closer to the Sun while warmer colors spread farther across the sky.","visual":"media","story_beat":"evidence","media_query":"Mars sunset","media_file":"File:Mars sunset PIA01547.jpg","media_fit":"wide","media_motion":"track"},
                  {"headline":"MARS FLIPS THE SCRIPT","speech":"Red landscape. Blue sunset. The same dusty atmosphere makes both possible.","visual":"media","story_beat":"payoff","media_query":"Mars sunset","media_file":"File:MarsSunsetCut.jpg","media_fit":"wide","media_motion":"push"},
              ],
          }

          perf = c.load_performance()
          recent_entries=sorted((perf.get("videos") or {}).values(),key=lambda x:x.get("published_at",""),reverse=True)
          story["recent_formats"]=[str(x.get("creative_format") or "") for x in recent_entries if x.get("creative_format")][:3]
          story["recent_creative_fingerprints"]=[x.get("creative_fingerprint") for x in recent_entries if isinstance(x.get("creative_fingerprint"),dict)][:5]

          fields=("genre","content_id","source","hook","question","answer","creative_format")
          c.CONTENT_META={k:story.get(k) for k in fields}
          c.CONTENT_META["selection_reason"]="experimental-v7-private-pilot"

          work=Path("/tmp/astra-v7-private")
          work.mkdir(parents=True,exist_ok=True)
          video=work/"clip.mp4"

          original_select=c.select_content
          c.select_content=lambda excluded_ids=None, excluded_titles=None: dict(story)
          try:
              title,desc=c.make_short(video)
          finally:
              c.select_content=original_select

          desc,distribution_plan=branded_description(
              desc,perf,genre=str(c.CONTENT_META.get("genre") or "unknown"),fmt="short"
          )
          title=optimize_title(title,distribution_plan,c.CONTENT_META)
          c.CONTENT_META["distribution_plan"]=distribution_plan
          c.CONTENT_META["revenue_geography"]=geography_state(perf)
          c.CONTENT_META["ypp_safety"]=enforce(title,desc,c.CONTENT_META,perf)

          token=c.access_token()
          c.verify_channel(token)
          if c.live_channel_duplicate(token,title,story["content_id"]):
              raise RuntimeError("Pilot blocked by live duplicate guard.")

          desc += "\nASTRA-ID:" + story["content_id"]
          status,url=c.upload(video,title,desc,token=token)
          if status!="success":
              raise RuntimeError("Pilot upload failed: "+status)

          video_id=url.rsplit("=",1)[-1]
          c.record_video(video_id,title)
          print("V7_PRIVATE_PILOT_SUCCESS",json.dumps({
              "url":url,
              "title":title,
              "visibility":"private",
              "creative_format":c.CONTENT_META.get("creative_format"),
              "creative_identity":c.CONTENT_META.get("creative_identity"),
              "director":c.CONTENT_META.get("creative_director"),
              "media_qa":c.CONTENT_META.get("media_qa"),
          },ensure_ascii=False))
          PY
      - name: Save adaptive state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin astra-state
          if git diff --quiet origin/astra-state -- performance.json quota_state.json SHORTS.md; then exit 0; fi
          STATE_DIR="$(mktemp -d)"
          git worktree add --detach "$STATE_DIR" origin/astra-state
          for f in performance.json quota_state.json SHORTS.md; do
            if [ -e "$f" ]; then cp "$f" "$STATE_DIR/$f"; else rm -f "$STATE_DIR/$f"; fi
          done
          cd "$STATE_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- performance.json quota_state.json SHORTS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record v7 private creative pilot [skip ci]"
          git push origin "HEAD:refs/heads/astra-state"
