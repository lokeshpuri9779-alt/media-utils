name: ASTRA Durable Artwork Archive

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: artwork-archive
    env:
      ASTRA_ARTIFACT_S3_BUCKET: ${{ secrets.ASTRA_ARTIFACT_S3_BUCKET }}
      ASTRA_ARTIFACT_S3_ENDPOINT: ${{ secrets.ASTRA_ARTIFACT_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify archive is explicitly configured
        run: |
          test -n "$ASTRA_ARTIFACT_S3_BUCKET" || { echo "Durable storage not configured"; exit 1; }
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" || { echo "Archive credentials missing"; exit 1; }
      - name: Install isolated artwork dependencies
        run: python -m pip install 'Pillow>=10,<12' 'boto3>=1.34,<2'
      - name: Run archive tests
        run: python -m unittest discover -s tests -p 'test_artwork_archive.py' -v
      - name: Generate and validate artwork
        run: |
          python -m astra.background_factory --output "$RUNNER_TEMP/astra-preview"
          python -m astra.asset_package_qa --manifest "$RUNNER_TEMP/astra-preview/art/manifest.json" --strict
      - name: Archive verified artwork to immutable remote storage
        run: python -m astra.artwork_archive --manifest "$RUNNER_TEMP/astra-preview/art/manifest.json" --receipt "$RUNNER_TEMP/archive-receipt.json"
      - name: Upload archive receipt without credentials
        uses: actions/upload-artifact@v4
        with:
          name: astra-durable-artwork-receipts
          path: ${{ runner.temp }}/archive-receipt.json
          if-no-files-found: error
          retention-days: 14
