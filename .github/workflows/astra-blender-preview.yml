name: ASTRA Blender Preview (Manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check Blender availability
        id: blender
        shell: bash
        run: |
          if command -v blender >/dev/null 2>&1; then
            echo "binary=$(command -v blender)" >> "$GITHUB_OUTPUT"
          else
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y blender
            echo "binary=$(command -v blender)" >> "$GITHUB_OUTPUT"
          fi
      - name: Render original 3D animation
        run: |
          mkdir -p preview
          "${{ steps.blender.outputs.binary }}" -b -t 2 --python astra_v2/blender_scene.py -- preview/astra-blender-preview.mp4
      - name: Verify rendered media
        run: |
          test -s preview/astra-blender-preview.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,nb_frames -of default=noprint_wrappers=1 preview/astra-blender-preview.mp4
      - name: Save animation preview
        uses: actions/upload-artifact@v4
        with:
          name: astra-blender-preview
          path: preview/astra-blender-preview.mp4
          retention-days: 7
