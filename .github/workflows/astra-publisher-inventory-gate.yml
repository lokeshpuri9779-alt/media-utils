name: ASTRA Publisher Inventory Gate
on:
  pull_request:
    paths:
      - 'astra_v2/story_forge.py'
      - 'tests/test_astra_story_inventory.py'
      - '.github/workflows/astra-publisher-inventory-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Renderer preflight imports the Studio render stack. Match the
      # publisher's pinned lightweight dependencies, without paid APIs.
      - run: python -m pip install Pillow==11.3.0 httpx==0.28.1 numpy==2.2.6 imageio-ffmpeg==0.6.0
      - run: python -m unittest discover -s tests -p 'test_astra_story_inventory.py' -v
