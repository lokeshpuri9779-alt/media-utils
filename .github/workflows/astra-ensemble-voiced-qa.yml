name: ASTRA Ensemble Voiced Pilot Experiment
on:
  pull_request:
    paths:
      - 'tools/astra_ensemble_voiced_preview.py'
      - '.github/workflows/astra-ensemble-voiced-qa.yml'
      - 'astra_v2/ensemble_story_experiments.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  narrated-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASTRA_EXPERIMENT_ENSEMBLE: '1'
      ASTRA_OPENAI_ENABLED: '0'
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install exact offline production dependencies
        run: uv pip install --system -r requirements.txt
      - name: Render complete ensemble drama with narrated sound
        run: python -m tools.astra_ensemble_voiced_preview
      - name: Verify real video and audio tracks
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          from imageio_ffmpeg import get_ffmpeg_exe
          path=Path('preview/astra-ensemble-voiced-pilot.mp4')
          p=subprocess.run([get_ffmpeg_exe(),'-v','error','-i',str(path),'-f','null','-'],check=True)
          info=json.loads(Path('preview/astra-ensemble-voiced-pilot.json').read_text())
          assert info['cast_count']==5 and info['published_to_youtube']==False
          print('ASTRA_NARRATED_ENSEMBLE_QA_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astra-ensemble-voiced-five-character
          path: |
            preview/astra-ensemble-voiced-pilot.mp4
            preview/astra-ensemble-voiced-pilot.json
          retention-days: 7
