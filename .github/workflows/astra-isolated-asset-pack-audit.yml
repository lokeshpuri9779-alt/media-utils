name: ASTRA Isolated Asset Pack Render Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astra-isolated-asset-pack-audit.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify-pack-compositor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ASTRA_ASSET_PACK_ENABLED: '1'
      ASTRA_ASSET_PACK_AUDIT: '1'
      ASTRA_ASSET_PACK_IMMUTABLE: '1'
      ASTRA_ASSET_PACK_ROOT: runtime-artifacts/verified-pack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependency
        run: python -m pip install 'Pillow>=10,<12'
      - name: Download existing reviewed background artifact
        uses: actions/download-artifact@v4
        with:
          name: astra-original-visual-pack
          run-id: 39960540392
          github-token: ${{ github.token }}
          path: runtime-artifacts/download
      - name: Restore and verify 3200 backgrounds
        run: python -m tools.astra_restore_visual_pack runtime-artifacts/download/astra-visual-pack.zip runtime-artifacts/verified-pack --expected 3200
      - name: Benchmark verified inventory cache
        run: |
          python - <<'PY'
          import json, time
          from pathlib import Path
          from astra_v2.quality_asset_selector import select_assets, _verified_inventory
          root = Path('runtime-artifacts/verified-pack')
          _verified_inventory.cache_clear()
          start = time.perf_counter()
          first = select_assets(root, kind='background', tags=('railway',), video_format='shorts', limit=50)
          cold_seconds = time.perf_counter() - start
          start = time.perf_counter()
          second = select_assets(root, kind='background', tags=('railway',), video_format='shorts', limit=50)
          warm_seconds = time.perf_counter() - start
          info = _verified_inventory.cache_info()
          assert first and first == second, 'asset selection mismatch'
          assert info.misses == 1 and info.hits >= 1, f'cache not reused: {info}'
          output = Path('runtime-artifacts/audit')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'cache-benchmark.json').write_text(json.dumps({'cold_seconds': round(cold_seconds, 4), 'warm_seconds': round(warm_seconds, 4), 'verified_assets': 3200, 'cache_hits': info.hits, 'cache_misses': info.misses, 'selection_count': len(first)}, indent=2))
          print(f'Cold {cold_seconds:.3f}s; warm {warm_seconds:.3f}s; cache hits {info.hits}')
          PY
      - name: Verify actual compositor changes pixels
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageChops
          from astra_v2.visual_artifact_backdrop import apply_pack_background
          from astra_v2.asset_usage_audit import begin, observing
          root = Path('runtime-artifacts/verified-pack')
          image = Image.new('RGB', (540, 960), (35, 45, 65))
          shot = {'scene_environment': 'railway station', 'visual_intent': 'railway platform'}
          assert begin({'content_id': 'isolated-railway-smoke', 'title': 'Isolated railway compositor audit'}, 1)
          assert observing(1)
          output = apply_pack_background(image, shot, 'astra-asset-smoke-railway', root=root, shot_number=1)
          assert not observing(1), 'compositor did not record per-shot evidence'
          assert ImageChops.difference(image, output).getbbox() is not None, 'background not composited'
          Path('runtime-artifacts/audit').mkdir(parents=True, exist_ok=True)
          output.save('runtime-artifacts/audit/railway-compositor.png')
          Path('runtime-artifacts/audit/result.json').write_text(json.dumps({
              'evidence': 'in-process compositor observation, not MP4 audit receipt',
              'test': 'isolated nonpublishing production compositor',
              'scene': 'railway',
              'pixel_changed': True,
              'asset_pack_enabled': True,
              'youtube_uploaded': False,
              'full_mp4_render': False
          }, indent=2))
          PY
      - name: Encode isolated compositor MP4 and finalize evidence
        run: |
          ffmpeg -hide_banner -loglevel error -y -loop 1 -framerate 24 -i runtime-artifacts/audit/railway-compositor.png -t 1 -c:v libx264 -pix_fmt yuv420p -movflags +faststart runtime-artifacts/audit/railway-compositor-smoke.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of json runtime-artifacts/audit/railway-compositor-smoke.mp4 > runtime-artifacts/audit/video-probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          probe = json.loads(Path('runtime-artifacts/audit/video-probe.json').read_text())
          streams = probe.get('streams', [])
          assert len(streams) == 1 and streams[0]['codec_name'] == 'h264'
          assert (streams[0]['width'], streams[0]['height']) == (540, 960)
          report = json.loads(Path('runtime-artifacts/audit/result.json').read_text())
          report.update({'isolated_encoded_mp4': True, 'full_mp4_render': False,
                         'video_kind': 'one-second compositor-frame smoke, not full Studio output'})
          Path('runtime-artifacts/audit/result.json').write_text(json.dumps(report, indent=2))
          PY
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-isolated-asset-pack-audit
          path: runtime-artifacts/audit/
          if-no-files-found: warn
