name: promote Astra production

# Automatic CI disabled by user request. Run manually only.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    # Promote only successful push-CI from main. Scheduled/manual production runs
    # can never promote themselves.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Promote passing main SHA with fast-forward safety
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git init astra-promote
          cd astra-promote
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch --depth=200 origin main astra-production astra-known-good
          # Only the newest validated main SHA may deploy. Older successful CI
          # runs from the same burst must not create an extra production event.
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "${SHA}" != "${MAIN_SHA}" ]; then
            echo "Stale validated SHA ${SHA}; current main is ${MAIN_SHA}. No promotion dispatched."
            exit 0
          fi
          # Production is code-only. Refuse any unexplained code drift from the
          # last validated source. State lives independently on astra-state.
          DRIFT="$(git diff --name-only origin/astra-known-good..origin/astra-production -- . ':!performance.json' ':!quota_state.json' ':!SHORTS.md')"
          if [ -n "${DRIFT}" ]; then
            echo "Refusing promotion: production code differs from astra-known-good:"
            echo "${DRIFT}"
            exit 1
          fi

          # Rebuild a normal descendant of production from the validated code.
          # Mutable runtime state is restored separately from astra-state.
          git checkout -B promote origin/astra-production
          git read-tree --reset -u "${SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            PROMOTE_SHA="$(git rev-parse HEAD)"
          else
            git commit -m "Promote validated Astra code ${SHA:0:12} [skip ci]"
            PROMOTE_SHA="$(git rev-parse HEAD)"
          fi
          git push origin "HEAD:refs/heads/astra-production"
          # known-good tracks validated source code and never receives runtime state.
          git push origin "${SHA}:refs/heads/astra-known-good"
          echo "Promoted ${SHA} as production commit ${PROMOTE_SHA}; runtime state remains on astra-state."

          # Trigger exactly one production verification run only after a real,
          # latest-head promotion. repository_dispatch is allowed to start a
          # workflow even when sent with GITHUB_TOKEN.
          gh api --method POST "repos/${REPO}/dispatches" \
            -f event_type='astra-production-promoted' \
            -f "client_payload[sha]=${SHA}" \
            -f "client_payload[production_sha]=${PROMOTE_SHA}"
