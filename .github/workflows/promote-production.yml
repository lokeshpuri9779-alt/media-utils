name: promote Astra production

on:
  workflow_run:
    workflows: ["media check"]
    types: [completed]

permissions:
  contents: write

jobs:
  promote:
    # Promote only successful push-CI from main. Scheduled/manual production runs
    # can never promote themselves.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Promote passing main SHA with fast-forward safety
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git init astra-promote
          cd astra-promote
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git fetch --depth=200 origin main astra-production astra-known-good
          # Refuse promotion if the passing SHA is no longer on main.
          git merge-base --is-ancestor "${SHA}" origin/main
          # Production must advance by ancestry only. A divergence requires
          # human inspection rather than a destructive force-reset.
          git merge-base --is-ancestor origin/astra-production "${SHA}"
          git push origin "${SHA}:refs/heads/astra-production"
          git push origin "${SHA}:refs/heads/astra-known-good"
          echo "Promoted ${SHA} to astra-production and astra-known-good."
