name: media check
# CI validation marker: PR runs are non-publishing and cannot persist runtime state.

on:
  push:
    paths:
      - '.github/workflows/media-check.yml'
      - 'cloud_once.py'
      - 'viral_prior.py'
      - 'evolution.py'
      - 'backup_state.py'
      - 'distribution.py'
      - 'ops_guardian.py'
      - 'ypp_safety.py'
      - 'channels.json'
      - 'studio_renderer.py'
      - 'audience_research.py'
      - 'longform.py'
      - 'longform_challenges.py'
      - 'autonomy.py'
      - 'reach_reports.py'
      - 'learning_policy.json'
      - 'youtube_autonomy_setup.py'
      - 'tests/test_growth.py'
      - 'tests/test_viral_prior.py'
      - 'tests/test_evolution.py'
      - 'tests/test_backup.py'
      - 'tests/test_distribution.py'
      - 'tests/test_ops_guardian.py'
      - 'tests/test_ypp_safety.py'
      - 'tests/test_audience.py'
      - 'tests/test_studio.py'
      - 'requirements.txt'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Hourly controller. The Python worker decides whether an upload attempt is due,
    # spreading the adaptive daily target across the India-local day.
    - cron: '20 * * * *'

permissions:
  contents: write

concurrency:
  group: media-check-adaptive
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_FULL_REFRESH_TOKEN: ${{ secrets.YOUTUBE_FULL_REFRESH_TOKEN }}
      YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
      YOUTUBE_COMMUNITY_REFRESH_TOKEN: ${{ secrets.YOUTUBE_COMMUNITY_REFRESH_TOKEN }}
      YOUTUBE_COMMUNITY_CLIENT_ID: ${{ secrets.YOUTUBE_COMMUNITY_CLIENT_ID }}
      YOUTUBE_COMMUNITY_CLIENT_SECRET: ${{ secrets.YOUTUBE_COMMUNITY_CLIENT_SECRET }}
      YOUTUBE_PRIVACY: public
      ORT_DISABLE_TELEMETRY: '1'
      ASTRA_LONG_ENABLED: '1'
      ASTRA_CHANNEL: 'rayvan'
      ASTRA_INITIAL_DAILY_TARGET: '9'
      ASTRA_MAX_DAILY_TARGET: '24'
      ASTRA_FORCE_RUN: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[upload-probe]'))) && '1' || '0' }}
      ASTRA_PROBE_ID: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[upload-probe]') && github.sha || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Development pushes test their own SHA. Scheduled/manual runtime
          # executes only the separately promoted production branch.
          ref: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.sha || 'astra-production' }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: dependencies
        run: pip install -r requirements.txt
      - name: Verify Python modules
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: python -m py_compile cloud_once.py viral_prior.py evolution.py backup_state.py distribution.py ops_guardian.py ypp_safety.py autonomy.py reach_reports.py longform.py longform_challenges.py studio_renderer.py youtube_autonomy_setup.py
      - name: Verify Studio layouts and audio
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Cache neural voice
        uses: actions/cache@v4
        with:
          path: ~/.cache/astra-voice
          key: astra-kokoro-v1-beb0d184
      - name: Render Studio startup preview
        if: github.event_name == 'push' || github.event_name == 'pull_request' && env.ASTRA_FORCE_RUN != '1'
        run: python studio_renderer.py --preview /tmp/astra-studio-preview.mp4
      - name: Refresh daily research on code pushes
        if: github.event_name == 'push' || github.event_name == 'pull_request' && env.ASTRA_FORCE_RUN != '1'
        run: python cloud_once.py --study
      - name: Snapshot adaptive state before controller
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        run: python backup_state.py pre-run
      - name: Upload recovery snapshot
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: astra-state-${{ github.run_id }}
          path: backups/
          retention-days: 30
          if-no-files-found: error
      - name: run
        id: controller
        run: |
          if { [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; } && [ "$ASTRA_FORCE_RUN" != "1" ]; then
            python cloud_once.py --diagnose
          else
            python cloud_once.py
          fi
      - name: Record runtime health
        if: github.event_name != 'push' && github.event_name != 'pull_request' && always()
        shell: bash
        run: |
          mkdir -p runtime-health
          printf '%s
' "run_id=${{ github.run_id }}" > runtime-health/status.txt
          printf '%s
' "production_sha=$(git rev-parse HEAD)" >> runtime-health/status.txt
          printf '%s
' "controller_outcome=${{ steps.controller.outcome || 'unknown' }}" >> runtime-health/status.txt
          if [ "${{ steps.controller.outcome }}" != "success" ]; then
            printf '%s
' "recovery=production_ref_unchanged; use pre-run state snapshot" >> runtime-health/status.txt
          else
            printf '%s
' "recovery=none" >> runtime-health/status.txt
          fi
      - name: Upload runtime health record
        if: github.event_name != 'push' && github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-health-${{ github.run_id }}
          path: runtime-health/
          retention-days: 30
          if-no-files-found: error
      - name: save adaptive state
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- quota_state.json performance.json ops_state.json SHORTS.md)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in quota_state.json performance.json ops_state.json SHORTS.md; do
            if [ -e "$f" ] || git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              git add -A -- "$f"
            fi
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Astra state and performance [skip ci]"
          TARGET_BRANCH="$(git branch --show-current)"
          # Runtime state belongs to the checked-out production branch; push-CI
          # state belongs to its development branch. Never rewrite main here.
          for attempt in 1 2 3; do
            if git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            echo "State push raced with a newer commit; rebasing (attempt $attempt/3)."
            git pull --rebase origin "$TARGET_BRANCH"
          done
          echo "Could not persist Astra state after three attempts."
          exit 1
