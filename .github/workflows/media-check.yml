name: media check

on:
  workflow_dispatch:
  schedule:
    # Hourly controller. The Python worker decides whether an upload attempt is due,
    # spreading the adaptive daily target across the India-local day.
    - cron: '20 * * * *'

permissions:
  contents: write

concurrency:
  group: media-check-adaptive
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: public
      ASTRA_INITIAL_DAILY_TARGET: '9'
      ASTRA_MAX_DAILY_TARGET: '24'
      ASTRA_FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: dependencies
        run: pip install -r requirements.txt
      - name: run
        run: python cloud_once.py
      - name: save adaptive state
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- quota_state.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quota_state.json
          git commit -m "Update adaptive upload state [skip ci]"
          git push
