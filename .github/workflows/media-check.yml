name: media check

on:
  workflow_dispatch:
  schedule:
    # 9 runs/day, roughly every 2h40m. Times below are UTC.
    # Approx IST: 00:20, 03:00, 05:40, 08:20, 11:00, 13:40, 16:20, 19:00, 21:40
    - cron: '50 18 * * *'
    - cron: '30 21 * * *'
    - cron: '10 0 * * *'
    - cron: '50 2 * * *'
    - cron: '30 5 * * *'
    - cron: '10 8 * * *'
    - cron: '50 10 * * *'
    - cron: '30 13 * * *'
    - cron: '10 16 * * *'

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: dependencies
        run: pip install -r requirements.txt
      - name: run
        run: python cloud_once.py
