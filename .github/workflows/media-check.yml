name: media check

on:
  push:
    paths:
      - '.github/workflows/media-check.yml'
      - '.github/workflows/promote-production.yml'
      - 'cloud_once.py'
      - 'creative_engine.py'
      - 'premium_stories.py'
      - 'channel_state.py'
      - 'revenue_geo.py'
      - 'viral_prior.py'
      - 'evolution.py'
      - 'backup_state.py'
      - 'distribution.py'
      - 'ops_guardian.py'
      - 'ypp_safety.py'
      - 'channels.json'
      - 'studio_renderer.py'
      - 'audience_research.py'
      - 'longform.py'
      - 'longform_trends.py'
      - 'longform_challenges.py'
      - 'autonomy.py'
      - 'reach_reports.py'
      - 'learning_policy.json'
      - 'youtube_autonomy_setup.py'
      - 'tests/test_growth.py'
      - 'tests/test_creative_engine.py'
      - 'tests/test_publish_selection.py'
      - 'tests/test_viral_prior.py'
      - 'tests/test_evolution.py'
      - 'tests/test_backup.py'
      - 'tests/test_distribution.py'
      - 'tests/test_ops_guardian.py'
      - 'tests/test_ypp_safety.py'
      - 'tests/test_revenue_geo.py'
      - 'tests/test_audience.py'
      - 'tests/test_studio.py'
      - 'oss_stack.py'
      - 'edit_spec.py'
      - 'quality_lab.py'
      - 'tests/test_channel_memory.py'
      - 'tests/test_caption_audio_qa.py'
      - 'channel_memory.py'
      - 'caption_audio_qa.py'
      - 'tests/test_retention_surgery.py'
      - 'retention_surgery.py'
      - 'tests/test_semantic_broll.py'
      - 'tests/test_creative_director.py'
      - 'semantic_broll.py'
      - 'creative_director.py'
      - 'tests/test_astra_pipeline.py'
      - 'tests/test_creative_identity.py'
      - 'astra_pipeline.py'
      - 'creative_identity.py'
      - 'tests/test_creative_formats.py'
      - 'creative_formats.py'
      - 'premium_batch_review.py'
      - 'tests/test_open_source_stack.py'
      - 'tests/test_edit_spec.py'
      - 'motion_engine/**'
      - 'astra_errors.py'
      - 'hyperframes_adapter.py'
      - 'tests/test_hyperframes_adapter.py'
      - '.gitmodules'
      - 'third_party/**'
      - 'package.json'
      - 'motion_renderer/check.mjs'
      - 'motion_renderer/bridge.py'
      - 'motion_renderer/__init__.py'
      - 'tests/test_motion_bridge.py'
      - 'requirements.txt'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [astra-production-promoted]
  schedule:
    # Primary 30-minute cadence plus a seven-minute delayed backup. If the
    # primary GitHub scheduler slot is dropped, the backup can recover it;
    # Astra's pacing/state gate prevents a second upload when the primary ran.
    - cron: '*/30 * * * *'
    - cron: '7,37 * * * *'


# Runtime executions share one serialized group because they mutate publishing
# state. Development CI uses a separate branch-scoped group and newer commits
# cancel stale validation work.
concurrency:
  group: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && 'media-check-runtime' || format('media-check-ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  process:
    # Verify publishing after an actual production promotion as well as on the clock.
    # Promotion emits this dedicated event only after the newest validated main SHA lands.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_FULL_REFRESH_TOKEN: ${{ secrets.YOUTUBE_FULL_REFRESH_TOKEN }}
      YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
      YOUTUBE_COMMUNITY_REFRESH_TOKEN: ${{ secrets.YOUTUBE_COMMUNITY_REFRESH_TOKEN }}
      YOUTUBE_COMMUNITY_CLIENT_ID: ${{ secrets.YOUTUBE_COMMUNITY_CLIENT_ID }}
      YOUTUBE_COMMUNITY_CLIENT_SECRET: ${{ secrets.YOUTUBE_COMMUNITY_CLIENT_SECRET }}
      YOUTUBE_PRIVACY: private # temporary creative-review hold; restore after Moon pilot inspection
      ORT_DISABLE_TELEMETRY: '1'
      ASTRA_LONG_ENABLED: '1'
      ASTRA_CHANNEL: 'rayvan'
      ASTRA_INITIAL_DAILY_TARGET: '48'
      ASTRA_MAX_DAILY_TARGET: '48'
      ASTRA_MIN_UPLOAD_INTERVAL_MINUTES: '25'
      ASTRA_FORCE_RUN: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[upload-probe]'))) && '1' || '0' }}
      ASTRA_PROBE_ID: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[upload-probe]') && github.sha || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Development pushes test their own SHA. Runtime executes only the
          # separately promoted production branch.
          ref: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.sha || 'astra-production' }}
          fetch-depth: 0
          submodules: recursive
      - name: Restore adaptive runtime state
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin astra-state
          for f in performance.json quota_state.json SHORTS.md; do
            git checkout origin/astra-state -- "$f" 2>/dev/null || true
          done
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          node-version: '24'
      - name: Install Motion Canvas engine
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        working-directory: motion_engine
        run: npm install --no-audit --no-fund
      - name: Build Motion Canvas engine
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        working-directory: motion_engine
        run: npm run build
      - name: dependencies
        run: pip install -r requirements.txt
      - name: Verify Python modules
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: python -m py_compile cloud_once.py creative_engine.py premium_stories.py channel_state.py revenue_geo.py viral_prior.py evolution.py backup_state.py distribution.py ops_guardian.py ypp_safety.py autonomy.py reach_reports.py longform.py longform_trends.py longform_challenges.py studio_renderer.py youtube_autonomy_setup.py oss_stack.py edit_spec.py quality_lab.py creative_director.py creative_formats.py creative_identity.py astra_pipeline.py semantic_broll.py retention_surgery.py caption_audio_qa.py channel_memory.py premium_batch_review.py motion_renderer/bridge.py astra_errors.py hyperframes_adapter.py
      - name: Verify Studio layouts and audio
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Cache neural voice
        uses: actions/cache@v4
        with:
          path: ~/.cache/astra-voice
          key: astra-kokoro-v1-beb0d184
      - name: Cache faster-whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: astra-faster-whisper-tiny-en-v1
      - name: Render Studio startup preview
        if: (github.event_name == 'push' || github.event_name == 'pull_request') && env.ASTRA_FORCE_RUN != '1'
        run: python studio_renderer.py --preview /tmp/astra-studio-preview.mp4
      - name: Render and inspect curated premium batch
        if: (github.event_name == 'push' || github.event_name == 'pull_request') && env.ASTRA_FORCE_RUN != '1'
        run: python premium_batch_review.py /tmp/astra-premium-review
      - name: Upload premium creative review
        if: (github.event_name == 'push' || github.event_name == 'pull_request') && env.ASTRA_FORCE_RUN != '1'
        uses: actions/upload-artifact@v4
        with:
          name: astra-premium-review-${{ github.run_id }}
          path: /tmp/astra-premium-review/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload Studio 6 preview
        if: (github.event_name == 'push' || github.event_name == 'pull_request') && env.ASTRA_FORCE_RUN != '1'
        uses: actions/upload-artifact@v4
        with:
          name: studio6-preview-${{ github.run_id }}
          path: /tmp/astra-studio-preview.mp4
          retention-days: 7
          if-no-files-found: error
      - name: Refresh daily research on code pushes
        if: (github.event_name == 'push' || github.event_name == 'pull_request') && env.ASTRA_FORCE_RUN != '1'
        run: python cloud_once.py --study
      # Runtime memory is persisted explicitly after the controller. Git history
      # already provides code rollback; per-run backup artifacts are not part of
      # the publishing critical path.
      - name: run
        id: controller
        run: |
          if { [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "pull_request" ]; } && [ "$ASTRA_FORCE_RUN" != "1" ]; then
            python cloud_once.py --diagnose
          else
            python cloud_once.py
          fi
      - name: Record runtime health
        if: github.event_name != 'push' && github.event_name != 'pull_request' && always()
        shell: bash
        run: |
          mkdir -p runtime-health
          printf '%s\\n' "run_id=${{ github.run_id }}" > runtime-health/status.txt
          printf '%s\\n' "production_sha=$(git rev-parse HEAD)" >> runtime-health/status.txt
          printf '%s\\n' "controller_outcome=${{ steps.controller.outcome || 'unknown' }}" >> runtime-health/status.txt
          if [ "${{ steps.controller.outcome }}" != "success" ]; then
            printf '%s\\n' "recovery=production_ref_unchanged; use pre-run state snapshot" >> runtime-health/status.txt
          else
            printf '%s\\n' "recovery=none" >> runtime-health/status.txt
          fi
      - name: Upload runtime health record
        if: github.event_name != 'push' && github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-health-${{ github.run_id }}
          path: runtime-health/
          retention-days: 30
          if-no-files-found: error
      - name: save adaptive state
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin astra-state
          if git diff --quiet origin/astra-state -- performance.json quota_state.json SHORTS.md; then
            exit 0
          fi

          STATE_DIR="$(mktemp -d)"
          git worktree add --detach "$STATE_DIR" origin/astra-state
          for f in performance.json quota_state.json SHORTS.md; do
            if [ -e "$f" ]; then
              cp "$f" "$STATE_DIR/$f"
            else
              rm -f "$STATE_DIR/$f"
            fi
          done
          cd "$STATE_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- performance.json quota_state.json SHORTS.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Astra state and performance [skip ci]"
          git push origin "HEAD:refs/heads/astra-state"


  code2mp4-install:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify pinned Code2MP4 repository
        shell: bash
        run: |
          set -euo pipefail
          test -f third_party/code2mp4/package.json
          test "$(git -C third_party/code2mp4 rev-parse HEAD)" = "91d7ba4501d8c6e48b4889a647b21af847f8185c"
          grep -q '"license": "Apache-2.0"' third_party/code2mp4/package.json
      - name: Install Code2MP4 dependencies
        working-directory: third_party/code2mp4
        run: |
          corepack enable
          corepack prepare pnpm@10.33.2 --activate
          pnpm install --frozen-lockfile
      - name: Validate Code2MP4
        working-directory: third_party/code2mp4
        run: |
          pnpm build
          pnpm typecheck
          pnpm test

  hyperframes-pilot:
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && !contains(github.event.head_commit.message || '', '[upload-probe]')
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Python dependencies
        run: pip install -r requirements.txt
      - name: Cache neural voice
        uses: actions/cache@v4
        with:
          path: ~/.cache/astra-voice
          key: astra-kokoro-v1-beb0d184
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install permissive next-gen renderer
        run: npm install --prefix /tmp/astra-hf-deps hyperframes@0.8.138 gsap@3.14.2
      - name: Cache HyperFrames browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: hyperframes-browser-v0.8.138-${{ runner.os }}-${{ runner.arch }}
      - name: Install FFmpeg for HyperFrames
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Build and validate HyperFrames pilots
        shell: bash
        run: |
          set -euo pipefail
          HF=/tmp/astra-hf-deps/node_modules/.bin/hyperframes
          "$HF" browser ensure
          python hyperframes_adapter.py --batch-root /tmp/astra-hyperframes --gsap /tmp/astra-hf-deps/node_modules/gsap/dist/gsap.min.js
          for project in /tmp/astra-hyperframes/*; do
            [ -d "$project" ] || continue
            (
              cd "$project"
              "$HF" lint
              "$HF" check
              "$HF" render --quality draft --workers 1 --no-browser-gpu --output preview.mp4
              ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of json preview.mp4 > delivery.json
            )
          done
      - name: Upload HyperFrames review batch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-hyperframes-review-${{ github.run_id }}
          path: /tmp/astra-hyperframes/
          retention-days: 7
          if-no-files-found: ignore
