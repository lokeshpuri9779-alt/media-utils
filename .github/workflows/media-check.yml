name: media check

on:
  push:
    paths:
      - 'cloud_once.py'
      - 'studio_renderer.py'
      - 'tests/test_studio.py'
      - 'requirements.txt'
  workflow_dispatch:
  schedule:
    # Hourly controller. The Python worker decides whether an upload attempt is due,
    # spreading the adaptive daily target across the India-local day.
    - cron: '20 * * * *'

permissions:
  contents: write

concurrency:
  group: media-check-adaptive
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: public
      ORT_DISABLE_TELEMETRY: '1'
      ASTRA_INITIAL_DAILY_TARGET: '9'
      ASTRA_MAX_DAILY_TARGET: '24'
      ASTRA_FORCE_RUN: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[upload-probe]'))) && '1' || '0' }}
      ASTRA_PROBE_ID: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[upload-probe]') && github.sha || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: dependencies
        run: pip install -r requirements.txt
      - name: Verify Studio layouts and audio
        if: github.event_name == 'push'
        run: python -m unittest discover -s tests -p 'test_studio.py' -v
      - name: Cache neural voice
        uses: actions/cache@v4
        with:
          path: ~/.cache/astra-voice
          key: astra-kokoro-v1-beb0d184
      - name: Render Studio startup preview
        if: github.event_name == 'push' && env.ASTRA_FORCE_RUN != '1'
        run: python studio_renderer.py --preview /tmp/astra-studio-preview.mp4
      - name: run
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "$ASTRA_FORCE_RUN" != "1" ]; then
            python cloud_once.py --diagnose
          else
            python cloud_once.py
          fi
      - name: save adaptive state
        if: always() && (github.event_name != 'push' || env.ASTRA_FORCE_RUN == '1')
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- quota_state.json performance.json SHORTS.md)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in quota_state.json performance.json SHORTS.md; do
            if [ -e "$f" ] || git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              git add -A -- "$f"
            fi
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update Astra state and performance [skip ci]"
          git push
