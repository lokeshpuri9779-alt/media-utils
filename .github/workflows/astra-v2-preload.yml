name: ASTRA V2 - Preload Approved Videos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/astra-v2-preload.yml'
      - 'editorial/reviewed_stories.json'
      - 'editorial/reviewed_decisions.json'
      - 'astra_v2/editorial_approved_intake.py'
      - 'astra_v2/editorial_creative_source.py'
      - 'quality_lab.py'
      - 'creative_director.py'
      - 'studio_renderer.py'
      - 'astra_v2/story_visuals.py'
      - 'astra_v2/distinct_animal_art.py'
      - 'tests/test_distinct_animal_art.py'
      - 'astra_v2/pillow_duo_scene.py'
      - 'astra_v2/procedural_visual_library.py'
      - 'astra_v2/story_action_motion.py'
      - 'astra_v2/story_expansion_2000.py'
      - 'astra_v2/pillow_scene_direction.py'
      - 'astra_v2/pillow_duo_stories.py'
      - 'astra_v2/free_icon_cache.py'
      - 'astra_v2/icon_visuals.py'
      - 'tests/test_astra_icon_visuals.py'
      - 'tests/test_astra_character_art.py'
      - 'astra_v2/creative.py'
      - 'astra_v2/preload_worker.py'
      - 'astra_v2/free_story_engine.py'
      - 'astra_v2/story_forge.py'
      - 'astra_v2/omniroute_local.py'
      - 'astra_v2/original_stories.py'
      - 'astra_v2/original_replenishment.py'
      - 'astra_v2/anthology_stories.py'
      - 'astra_v2/procedural_stories.py'
      - 'astra_v2/publication_quality.py'
      - 'astra_v2/preflight.py'
  schedule:
    - cron: '*/5 * * * *'

# Keep one coherent four-lane render batch active at a time.
# Scheduled triggers that arrive during a batch must not cancel its jobs.
concurrency:
  group: astra-v2-preload-batch
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  preload:
    strategy:
      fail-fast: false
      matrix:
        lane: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ASTRA_CHANNEL: rayvan
      ASTRA_UNIFIED_STORY_ENGINE: '1' # One Studio renderer for directed, solo, duo and ensemble scenes; fail closed
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_COMMUNITY_CLIENT_ID: ${{ secrets.YOUTUBE_COMMUNITY_CLIENT_ID }}
      YOUTUBE_COMMUNITY_CLIENT_SECRET: ${{ secrets.YOUTUBE_COMMUNITY_CLIENT_SECRET }}
      YOUTUBE_COMMUNITY_REFRESH_TOKEN: ${{ secrets.YOUTUBE_COMMUNITY_REFRESH_TOKEN }}
      ASTRA_PRELOAD_BUFFER: '24'
      ASTRA_PRELOAD_LANES: '4'
      ASTRA_SERIALIZED_PRELOAD: '0' # Continue producing new original stories after Season 1
      ASTRA_PRELOAD_LANE: '${{ matrix.lane }}'
      ASTRA_LONG_ENABLED: '0'
      ASTRA_OPENAI_ENABLED: '0'
      ASTRA_OPENAI_ALLOW_PAID_API: '0'
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Restore published and reserved IDs
        run: |
          git fetch origin astra-state
          for f in performance.json astra_v2_state.json astra_story_history.json; do
            if git cat-file -e "origin/astra-state:$f" 2>/dev/null; then
              git show "origin/astra-state:$f" > "$f"
              echo "ASTRA_STATE_RESTORE=$f:restored"
            else
              # Missing history must remain missing, never replaced with an empty file.
              rm -f "$f"
              echo "ASTRA_STATE_RESTORE=$f:missing"
            fi
          done
          if test -s astra_v2_state.json && test -s astra_story_history.json; then
            echo "ASTRA_EDITORIAL_HISTORY_READY=1"
          else
            echo "ASTRA_EDITORIAL_HISTORY_READY=0"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/astra-voice
            ~/.cache/huggingface
            asset_cache
          key: astra-v2-media-cache-v1
          restore-keys: astra-v2-media-cache-
      - name: Configure fast pinned-package installer
        uses: astral-sh/setup-uv@v6
        continue-on-error: true
        with:
          enable-cache: true
      - name: Install rendering stack
        timeout-minutes: 18
        run: |
          echo "ASTRA_INSTALL_STARTED=$(date -u +%FT%TZ)"
          python --version
          df -h .
          # Exact pinned requirements; the verified legacy installer is a
          # fallback when uv or its package source becomes unavailable.
          if command -v uv >/dev/null 2>&1 && timeout 240s uv pip install --system -r requirements.txt; then
            echo 'ASTRA_INSTALL_MODE=uv'
          else
            echo 'ASTRA_UV_FALLBACK=legacy-pip'
            echo 'ASTRA_INSTALL_FALLBACK_START=1'
            timeout 360s python -m pip install --disable-pip-version-check -r requirements.txt
            echo 'ASTRA_INSTALL_MODE=pip-fallback'
          fi
          # Ubuntu hosted runners normally include ffmpeg; avoid apt mirror stalls.
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # Ubuntu mirror downloads can exceed two minutes; avoid killing
            # apt midway through a large codec dependency download.
            timeout 120s sudo apt-get update -qq -o Acquire::Retries=2
            timeout 600s sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::Retries=3 ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
      - name: Refresh free licensed visual icon cache
        if: matrix.lane == 0
        continue-on-error: true
        run: timeout 90s python -m astra_v2.free_icon_cache
      - name: Test automated long-form cover generation
        run: python -m unittest discover -s tests -p 'test_astra_cover_frames.py' -v
      - name: Enforce real frame-to-frame motion
        run: python -m unittest discover -s tests -p 'test_astra_motion_gate.py' -v
      - name: Verify animated animal scenes
        run: python -m unittest discover -s tests -p 'test_astra_animal_scenes.py' -v
      - name: Test trusted video and cover packages
        run: python -m unittest discover -s tests -p 'test_astra_preload_covers.py' -v
      - name: Verify publication safety gate
        run: python -m unittest discover -s tests -p 'test_astra_publication_quality.py' -v
      - name: Test actual cached icon animation
        run: python -m unittest discover -s tests -p 'test_astra_icon_visuals.py' -v
      - name: Verify distinct animated story characters
        run: |
          python -m unittest discover -s tests -p 'test_astra_character_art.py' -v
          python -m unittest discover -s tests -p 'test_distinct_animal_art.py' -v
      - name: Enforce animation and caption collision guard
        run: |
          python -m unittest discover -s tests -p 'test_scene_layer_contract.py' -v
          python -m unittest discover -s tests -p 'test_story_visuals.py' -v
      - name: Test zero-cost policy and free story generation
        run: |
          python -m unittest discover -s tests -p 'test_openai_creative.py' -v
          python -m unittest discover -s tests -p 'test_free_story_engine.py' -v
          python -m unittest discover -s tests -p 'test_procedural_stories.py' -v
          python -m unittest discover -s tests -p 'test_omniroute_local.py' -v
      - name: Render independent character-motion preview
        if: matrix.lane == 0 && github.event_name != 'schedule'
        continue-on-error: true
        run: python -m astra_v2.character_preview
      - name: Verify preview playback metadata
        if: matrix.lane == 0 && github.event_name != 'schedule'
        continue-on-error: true
        run: |
          test -s runtime-health/astra-character-preview.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,nb_frames -of default=noprint_wrappers=1 runtime-health/astra-character-preview.mp4
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          path = Path("runtime-health/astra-character-preview.mp4")
          result = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries",
               "format=duration:stream=codec_type,width,height",
               "-of", "json", str(path)],
              check=True, capture_output=True, text=True)
          info = json.loads(result.stdout)
          video = next(stream for stream in info["streams"]
                       if stream["codec_type"] == "video")
          assert (video["width"], video["height"]) == (360, 640), video
          assert 15 <= float(info["format"]["duration"]) <= 17, info
          print("ASTRA_PREVIEW_VERIFIED=360x640, 16 seconds")
          PY
      - name: Save inspectable animation MP4
        if: matrix.lane == 0 && github.event_name != 'schedule'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: astra-character-preview-${{ github.run_id }}
          path: runtime-health/astra-character-preview.mp4
          if-no-files-found: error
          retention-days: 7
      - name: Pre-generate story-directed visual asset cache
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from astra.asset_library import generate_semantic_assets
          source = Path("editorial/reviewed_stories.json")
          data = json.loads(source.read_text(encoding="utf-8"))
          scenes = []
          for story in data.get("stories", []):
              if not story.get("production_ready"):
                  continue
              for beat in story.get("story_beats", []):
                  if isinstance(beat, dict):
                      scenes.append({**beat, "headline": story.get("title", "")})
          print("ASTRA_GENERATED_ASSETS=" + json.dumps(
              generate_semantic_assets(scenes, limit=24), sort_keys=True))
          PY
      - name: Save generated visual asset cache
        if: matrix.lane == 0
        uses: actions/upload-artifact@v4
        with:
          name: astra-semantic-assets-${{ github.run_id }}
          path: |
            art/manifest.json
            art/assets/generated/
          retention-days: 14
          if-no-files-found: warn
      - name: Validate semantic asset manifest JSON before preload
        if: matrix.lane == 0
        run: |
          python -m unittest discover -s tests -p 'test_preserve_reviewed_manifest.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('art/manifest.json')
          if path.exists():
              data = json.loads(path.read_text(encoding='utf-8'))
              assert isinstance(data, dict) and isinstance(data.get('assets'), list)
              print('ASTRA_ASSET_MANIFEST_VALID=1 assets=' + str(len(data['assets'])))
          else:
              print('ASTRA_ASSET_MANIFEST_VALID=missing')
          PY
      - name: Test fail-closed reviewed artwork preload contract
        if: matrix.lane == 0 && github.event_name != 'schedule'
        run: |
          python -m unittest discover -s tests -p 'test_reviewed_art_bridge.py' -v
          python -m unittest discover -s tests -p 'test_reviewed_art_preload.py' -v
          python -m unittest discover -s tests -p 'test_preserve_reviewed_manifest.py' -v
      - name: Discover trusted producer artwork receipt
        if: vars.ASTRA_REVIEWED_ART_SCHEDULED_RESTORE == '1'
        env:
          ASTRA_REVIEWED_ART_INDEX_JSON: ${{ vars.ASTRA_REVIEWED_ART_INDEX_JSON }}
        run: |
          if test -n "$ASTRA_REVIEWED_ART_INDEX_JSON"; then
            echo "ASTRA_ART_RECEIPT_SOURCE=pinned_repository_variable"
          else
            python - <<'PY'
          import os
          from astra_v2.reviewed_art_receipt_discovery import discover_index
          receipt = discover_index(os.environ["GITHUB_REPOSITORY"], "trusted-art-receipt")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("ASTRA_REVIEWED_ART_DISCOVERED_RECEIPT=" + str(receipt) + "\n")
          print("ASTRA_ART_RECEIPT_SOURCE=trusted_producer_workflow")
          PY
          fi
      - name: Restore pinned artwork for scheduled render
        if: vars.ASTRA_REVIEWED_ART_SCHEDULED_RESTORE == '1'
        env:
          ASTRA_ARTIFACT_S3_BUCKET: ${{ vars.ASTRA_ARTIFACT_S3_BUCKET }}
          ASTRA_ARTIFACT_S3_ENDPOINT: ${{ vars.ASTRA_ARTIFACT_S3_ENDPOINT }}
          ASTRA_ARTIFACT_S3_PREFIX: ${{ vars.ASTRA_ARTIFACT_S3_PREFIX }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ASTRA_ARTIFACT_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ASTRA_ARTIFACT_AWS_SECRET_ACCESS_KEY }}
          ASTRA_REVIEWED_ART_CONTENT_ID: ${{ vars.ASTRA_REVIEWED_ART_CONTENT_ID }}
          ASTRA_REVIEWED_ART_AUTO_SELECT: ${{ vars.ASTRA_REVIEWED_ART_AUTO_SELECT }}
          ASTRA_PRELOAD_LANE: ${{ matrix.lane }}
          ASTRA_PRELOAD_LANES: '4'
          ASTRA_EDITORIAL_STORIES_FILE: editorial/reviewed_stories.json
          ASTRA_EDITORIAL_REVIEWS_FILE: editorial/reviewed_decisions.json
          ASTRA_PUBLISHER_STATE_PATH: astra_v2_state.json
          ASTRA_STORY_HISTORY_PATH: astra_story_history.json
          ASTRA_REVIEWED_ART_INDEX_JSON: ${{ vars.ASTRA_REVIEWED_ART_INDEX_JSON }}
        run: |
          python -m pip install boto3
          python - <<'PY'
          import os
          from pathlib import Path
          from astra_v2.preload_art_receipt import restore_for_preload
          receipt = os.environ.get('ASTRA_REVIEWED_ART_INDEX_JSON', '')
          discovered = os.environ.get('ASTRA_REVIEWED_ART_DISCOVERED_RECEIPT', '')
          if receipt:
              if len(receipt.encode()) > 4096:
                  raise ValueError('pinned_art_index_too_large')
              Path('astra-art-index-receipt.json').write_text(receipt, encoding='utf-8')
              os.environ['ASTRA_REVIEWED_ART_INDEX_RECEIPT_FILE'] = 'astra-art-index-receipt.json'
          elif discovered:
              os.environ['ASTRA_REVIEWED_ART_INDEX_RECEIPT_FILE'] = discovered
          else:
              raise ValueError('trusted_art_index_required')
          manifest = restore_for_preload()
          if manifest is None:
              raise RuntimeError('scheduled_art_restore_missing')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write('ASTRA_PRELOAD_REVIEWED_ART_MANIFEST=' + str(manifest.resolve()) + '\n')
              output.write('ASTRA_REVIEWED_ART_CONTENT_ID=' + os.environ['ASTRA_REVIEWED_ART_CONTENT_ID'] + '\n')
          PY

      - name: Render and approve next original video
        id: render
        env:
          ASTRA_EDITORIAL_STORIES_FILE: editorial/reviewed_stories.json
          ASTRA_EDITORIAL_REVIEWS_FILE: editorial/reviewed_decisions.json
          ASTRA_PUBLISHER_STATE_PATH: astra_v2_state.json
          ASTRA_STORY_HISTORY_PATH: astra_story_history.json
        run: |
          /usr/bin/time -v -o /tmp/astra-render-memory.txt python -m astra_v2.preload_worker
      - name: Report render peak RAM
        if: always()
        run: |
          if test -f /tmp/astra-render-memory.txt; then
            cat /tmp/astra-render-memory.txt
            python - <<'PY'
          import re
          from pathlib import Path
          data = Path("/tmp/astra-render-memory.txt").read_text()
          match = re.search(r"Maximum resident set size \(kbytes\):\s*(\d+)", data)
          if match:
              print("ASTRA_RENDER_PEAK_RAM_MIB=" + str(round(int(match.group(1)) / 1024, 1)))
          else:
              print("ASTRA_RENDER_PEAK_RAM_UNAVAILABLE")
          PY
          else
            echo "ASTRA_RENDER_PEAK_RAM_UNAVAILABLE"
          fi
      - name: Persist approved video in Actions artifact storage
        if: steps.render.outputs.content_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: astra-preloaded-${{ steps.render.outputs.content_id }}
          path: preload-package/
          if-no-files-found: error
          retention-days: 14
      - name: Report pre-render inventory snapshot
        if: always() && matrix.lane == 0
        shell: bash
        run: |
          python - <<'PY'
          import json
          try:
              from astra_v2.preload_queue import inventory_snapshot, inventory_eligibility_snapshot
              result = inventory_snapshot()
              try:
                  from astra_v2.control import STATE_FILE, read_json, state_for_day
                  from astra_v2.creative import publisher_history_ids
                  journal = state_for_day(read_json(STATE_FILE))
                  consumed_ids = publisher_history_ids(journal)
                  result["trusted_run_preflight"] = inventory_eligibility_snapshot(excluded_ids=consumed_ids)
                  result["trusted_run_preflight"]["excluded_history_ids"] = len(consumed_ids)
                  try:
                      from astra_v2.preload_queue import package_integrity_snapshot
                      result["package_integrity_sample"] = package_integrity_snapshot(
                          excluded_ids=consumed_ids, max_packages=2)
                  except Exception as integrity_exc:
                      result["package_integrity_sample"] = {
                          "status": "unavailable", "error_type": type(integrity_exc).__name__}
              except Exception as audit_exc:
                  result["trusted_run_preflight"] = {"status": "unavailable", "error_type": type(audit_exc).__name__}
          except Exception as exc:
              result = {"status": "unavailable", "error_type": type(exc).__name__}
          print("ASTRA_PRELOAD_INVENTORY=" + json.dumps(result, sort_keys=True))
          with open("astra-preload-inventory.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
          PY
      - name: Save inventory diagnostic artifact
        if: always() && matrix.lane == 0
        uses: actions/upload-artifact@v4
        with:
          name: astra-preload-inventory-${{ github.run_id }}
          path: astra-preload-inventory.json
          if-no-files-found: warn
          retention-days: 14
