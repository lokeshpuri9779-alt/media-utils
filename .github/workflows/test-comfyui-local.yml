name: ASTRA Local ComfyUI Contract Tests

on:
  pull_request:
    paths:
      - "astra_v2/comfyui_local.py"
      - "tests/test_comfyui_local.py"
      - ".github/workflows/test-comfyui-local.yml"
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Run offline ComfyUI adapter contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_comfyui_local.py
