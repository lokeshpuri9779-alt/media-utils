name: Pillow Engine 1 audiovisual QA
on:
  workflow_dispatch:
  push:
    branches:
      - integration/pillow-av-qa
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12' 'imageio-ffmpeg>=0.5,<1'
      - run: python -m unittest discover -s tests -p 'test_pillow_av_qa.py' -v
      - name: Render and audit preview
        env:
          ASTRA_ENGINE1_PILLOW: '1'
        run: |
          mkdir -p pillow-qa
          python - <<'PY'
          from astra_v2.pillow_engine1_adapter import render_shadow_preview
          from astra_v2.pillow_av_qa import save_report
          print(render_shadow_preview('pillow-qa/preview.mp4',duration=3,fps=24))
          report=save_report('pillow-qa/preview.mp4','pillow-qa/report.json')
          assert report['video_decodes'] and not report['eligible_for_publication']
          print(report)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pillow-av-qa
          path: pillow-qa/
          retention-days: 7
