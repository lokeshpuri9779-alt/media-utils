name: ASTRA Distinct Story Planning (Isolated)
on:
  push:
    branches:
      - experiment/astra-robot-walk-and-pickup
    paths:
      - tools/experimental_frog_story_render.py
      - tools/experimental_story_diversity.py
      - .github/workflows/astra-story-diversity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-story:
    if: github.ref == 'refs/heads/experiment/astra-robot-walk-and-pickup'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check independent narrative and continuity contract
        run: |
          python3 -m tools.experimental_story_diversity
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('artifacts/experimental-story-diversity/frog_seed_plan.json').read_text())
          assert x['plot_fingerprint'] != x['comparison_story_fingerprint']
          assert x['shot_count']==3 and x['frame_budget']==32
          assert all(x[k] is False for k in ('approved','published','production_ready','paid_apis_used','rendered'))
          assert x['visual_quality']=='not_tested'
          assert x['manual_editorial_review_required'] is True
          print('New story passes planning-only contract; rendering and editorial review not yet done')
          PY
      - name: Install free CPU Blender and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender ffmpeg libegl1 libgl1 libopengl0
      - name: Render distinct frog story on CPU (review only)
        run: |
          blender --background --threads 2 --python-exit-code 1 --python tools/experimental_frog_story_render.py
          ffmpeg -hide_banner -loglevel error -y -framerate 8 -start_number 0 \
            -i artifacts/experimental-frog-render/frame_%03d.png \
            -frames:v 32 -c:v libx264 -preset veryfast -crf 19 -pix_fmt yuv420p \
            artifacts/experimental-frog-render/frog_story_previs.mp4
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/experimental-frog-render')
          r=json.loads((root/'review.json').read_text())
          assert r['success'] is True and all(r['checks'].values())
          assert len(r['frames'])==32 and len(list(root.glob('frame_*.png')))==32
          assert all(r[x] is False for x in ('approved','published','production_ready','paid_apis_used'))
          assert r['editorial_review_required'] is True and r['semantic_quality']=='not_verified'
          assert r['fps']==8 and r['duration_seconds']==4.0
          assert r['checks']['magnet_contacts_before_lift'] is True
          assert r['checks']['seed_continuous_across_camera_cut'] is True
          assert r['checks']['rain_streaks_precede_sprout'] is True
          assert (root/'frog_story_previs.mp4').stat().st_size>4096
          print('Distinct second story rendered for manual visual review only')
          PY
      - name: Apply shared scene-independent action timing contract
        run: |
          python3 -m tools.experimental_action_contracts \
            --profile frog \
            --report artifacts/experimental-frog-render/review.json \
            --output artifacts/experimental-frog-render/action_contract.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/experimental-frog-render/action_contract.json')
          x=json.loads(p.read_text())
          assert x['passed'] is True and all(x['checks'].values())
          assert x['events']['magnet_attaches'] < x['events']['airplane_lifted']
          assert x['events']['seed_in_pot'] <= x['events']['rain_waters_seed']
          assert x['events']['rain_waters_seed'] < x['events']['stem_sprouts']
          assert x['approved'] is False and x['published'] is False
          assert x['production_ready'] is False
          assert x['semantic_quality']=='not_verified'
          print('Shared frog contract passed on actual CPU render trace')
          PY
      - name: Preserve frog video and frames for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-frog-story-review
          path: artifacts/experimental-frog-render/
          retention-days: 7
          if-no-files-found: warn
      - name: Preserve story plan for manual review
        uses: actions/upload-artifact@v4
        with:
          name: astra-distinct-story-plan
          path: artifacts/experimental-story-diversity/
          retention-days: 7
          if-no-files-found: error
