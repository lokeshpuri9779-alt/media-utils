name: ASTRA Live Publisher Runway Evidence (Read Only)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/astra-live-publisher-runway.yml'
      - 'tools/astra_live_publisher_runway.py'
      - 'tests/test_astra_live_publisher_runway.py'
      - 'tools/astra_publisher_actions_probe.py'
      - 'tests/test_astra_publisher_actions_probe.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/astra-live-publisher-runway.yml'
      - 'tools/astra_live_publisher_runway.py'
      - 'tests/test_astra_live_publisher_runway.py'
      - 'tools/astra_publisher_actions_probe.py'
      - 'tests/test_astra_publisher_actions_probe.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit-signed-story-runway:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASTRA_UNIFIED_STORY_ENGINE: '1'
      ASTRA_GEMINI_ENABLED: '0'
      ASTRA_OPENAI_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run read-only negative controls
        run: python -m unittest tests.test_astra_live_publisher_runway tests.test_astra_publisher_actions_probe -v
      - name: Install bounded free CPU renderer preflight dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'httpx==0.28.1' 'Pillow==11.3.0' \
            'imageio-ffmpeg==0.6.0' 'numpy==2.2.6'
      - name: Restore protected publisher journals and signed editorial pair
        run: |
          set -euo pipefail
          git fetch origin astra-state
          mkdir -p runtime-artifacts/live-runway-state
          for file in astra_v2_state.json astra_story_history.json \
                      astra_duplicate_protection.json ai-reviewed-stories.json \
                      ai-reviewed-decisions.json gemini-batch-diagnostic.json; do
            git show "origin/astra-state:$file" \
              > "runtime-artifacts/live-runway-state/$file"
            test -s "runtime-artifacts/live-runway-state/$file"
          done
      - name: Check exact production intake without publishing
        run: |
          python -m tools.astra_live_publisher_runway \
            --state-dir runtime-artifacts/live-runway-state \
            --output runtime-health/astra-live-runway.json
      - name: Read recent publisher and preload Actions metadata only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m tools.astra_publisher_actions_probe             --output runtime-health/astra-publisher-actions.json
      - name: Archive safe summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-live-runway-readonly-${{ github.run_id }}
          path: |
            runtime-health/astra-live-runway.json
            runtime-health/astra-publisher-actions.json
          if-no-files-found: ignore
          retention-days: 5
