name: Build PULSEFALL BLACKSITE Production RC

on:
  push:
    branches:
      - pulsefall-production-rc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4
        with:
          path: control
          ref: pulsefall-production-rc

      - name: Checkout Godot TPS foundation
        uses: actions/checkout@v4
        with:
          repository: godotengine/tps-demo
          ref: master
          path: game
          fetch-depth: 1
          lfs: false

      - name: Brand PULSEFALL BLACKSITE
        shell: bash
        run: |
          set -euxo pipefail

          cat > game/menu/pulsefall_logo.svg <<'SVG'
          <svg width="1024" height="233" viewBox="0 0 1024 233" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="g" x1="0" x2="1">
                <stop offset="0" stop-color="#5ce1ff"/>
                <stop offset="0.52" stop-color="#ffffff"/>
                <stop offset="1" stop-color="#9d7bff"/>
              </linearGradient>
              <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>
            <rect width="1024" height="233" fill="none"/>
            <path d="M35 164 L75 65 L115 164 L92 164 L75 122 L58 164 Z" fill="#5ce1ff" opacity=".9" filter="url(#glow)"/>
            <text x="140" y="128" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="92" letter-spacing="11" fill="url(#g)" filter="url(#glow)">PULSEFALL</text>
            <rect x="143" y="151" width="775" height="2" fill="#5ce1ff" opacity=".65"/>
            <text x="143" y="190" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="23" letter-spacing="9" fill="#c9f8ff">BLACKSITE PROTOCOL</text>
          </svg>
          SVG

          cat > game/pulsefall_icon.svg <<'SVG'
          <svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5ce1ff"/><stop offset="1" stop-color="#8d6cff"/></linearGradient></defs>
            <rect width="256" height="256" rx="50" fill="#050811"/>
            <path d="M128 28 L213 128 L128 228 L43 128 Z" fill="none" stroke="url(#g)" stroke-width="12"/>
            <path d="M128 63 L169 160 L145 160 L128 119 L111 160 L87 160 Z" fill="url(#g)"/>
          </svg>
          SVG

          python3 - <<'PY'
          from pathlib import Path
          p=Path("game/project.godot")
          s=p.read_text()
          s=s.replace('config/name="Godot Third-Person Shooter Demo"', 'config/name="PULSEFALL BLACKSITE"')
          s=s.replace('config/description="Godot Third Person Shooter with high quality assets and lighting"', 'config/description="PULSEFALL BLACKSITE - cinematic third-person survival vertical slice"')
          s=s.replace('config/icon="res://icon.png"', 'config/icon="res://pulsefall_icon.svg"')
          p.write_text(s)

          p=Path("game/menu/menu.tscn")
          s=p.read_text()
          s=s.replace('path="res://menu/tps_demo.png"', 'path="res://menu/pulsefall_logo.svg"')
          s=s.replace('text = "PLAY"', 'text = "ENTER BLACKSITE"')
          marker='[node name="PlayOnline" type="Button" parent="UI/Main"'
          idx=s.find(marker)
          if idx!=-1:
              line_end=s.find('\n', idx)
              insert_at=line_end+1
              s=s[:insert_at]+'visible = false\n'+s[insert_at:]
          p.write_text(s)

          p=Path("game/menu/settings.gd")
          s=p.read_text()
          s=s.replace('display_mode = Window.MODE_EXCLUSIVE_FULLSCREEN', 'display_mode = Window.MODE_FULLSCREEN')
          s=s.replace('resolution_scale = 1.0', 'resolution_scale = 0.90')
          s=s.replace('taa = false', 'taa = true')
          s=s.replace('gi_type = GIType.VOXEL_GI', 'gi_type = GIType.LIGHTMAP_GI')
          s=s.replace('gi_quality = GIQuality.LOW', 'gi_quality = GIQuality.HIGH')
          p.write_text(s)

          p=Path("game/player/player.tscn")
          s=p.read_text().replace('wait_time = 0.4\none_shot = true', 'wait_time = 0.24\none_shot = true')
          p.write_text(s)
          PY

      - name: Add production diagnostics, playtest telemetry and automated tests
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p game/production game/tests

          cat > game/production/production_guard.gd <<'GDSCRIPT'
          extends Node

          const VERSION := "0.9.0-rc1"
          const MARKER_PATH := "user://session_unclean.flag"
          const EVENT_LOG_PATH := "user://logs/events.jsonl"
          const REPORT_PATH := "user://playtest_report.json"

          var fps_samples: Array[float] = []
          var sample_accumulator := 0.0
          var recovered_from_unclean_session := false
          var session_started_unix := 0.0


          func _ready() -> void:
          	DirAccess.make_dir_recursive_absolute(ProjectSettings.globalize_path("user://logs"))
          	recovered_from_unclean_session = FileAccess.file_exists(MARKER_PATH)
          	if recovered_from_unclean_session:
          		_apply_safe_mode()
          	session_started_unix = Time.get_unix_time_from_system()
          	var marker := FileAccess.open(MARKER_PATH, FileAccess.WRITE)
          	if marker != null:
          		marker.store_string(str(session_started_unix))
          	if not get_tree().root.close_requested.is_connected(_on_close_requested):
          		get_tree().root.close_requested.connect(_on_close_requested)
          	record_event("session_start", {
          		"version": VERSION,
          		"recovered_from_unclean_session": recovered_from_unclean_session,
          		"os": OS.get_name(),
          		"cpu": OS.get_processor_name(),
          		"gpu": RenderingServer.get_video_adapter_name(),
          		"renderer": RenderingServer.get_current_rendering_driver_name()
          	})


          func _process(delta: float) -> void:
          	sample_accumulator += delta
          	if sample_accumulator >= 1.0:
          		sample_accumulator = 0.0
          		fps_samples.append(float(Engine.get_frames_per_second()))
          		if fps_samples.size() > 3600:
          			fps_samples.pop_front()


          func _exit_tree() -> void:
          	mark_clean_exit()


          func _on_close_requested() -> void:
          	record_event("window_close_requested")
          	mark_clean_exit()


          func mark_clean_exit() -> void:
          	var absolute := ProjectSettings.globalize_path(MARKER_PATH)
          	if FileAccess.file_exists(MARKER_PATH):
          		DirAccess.remove_absolute(absolute)


          func _apply_safe_mode() -> void:
          	Settings.config_file.set_value("video", "resolution_scale", 0.75)
          	Settings.config_file.set_value("rendering", "volumetric_fog", false)
          	Settings.config_file.set_value("rendering", "taa", false)
          	Settings.config_file.set_value("rendering", "gi_type", Settings.GIType.LIGHTMAP_GI)
          	Settings.config_file.set_value("rendering", "gi_quality", Settings.GIQuality.LOW)
          	Settings.save_settings()


          func record_event(event_name: String, payload: Dictionary = {}) -> void:
          	var record := {
          		"timestamp_utc": Time.get_datetime_string_from_system(true, false),
          		"event": event_name,
          		"payload": payload
          	}
          	var mode := FileAccess.READ_WRITE if FileAccess.file_exists(EVENT_LOG_PATH) else FileAccess.WRITE
          	var file := FileAccess.open(EVENT_LOG_PATH, mode)
          	if file == null:
          		return
          	if mode == FileAccess.READ_WRITE:
          		file.seek_end()
          	file.store_line(JSON.stringify(record))


          func write_playtest_report(extra: Dictionary = {}) -> String:
          	var average_fps := 0.0
          	var p10_fps := 0.0
          	var minimum_fps := 0.0
          	if not fps_samples.is_empty():
          		var total := 0.0
          		for sample in fps_samples:
          			total += sample
          		average_fps = total / float(fps_samples.size())
          		var ordered := fps_samples.duplicate()
          		ordered.sort()
          		minimum_fps = ordered[0]
          		var p10_index := int(floor(float(ordered.size() - 1) * 0.10))
          		p10_fps = ordered[p10_index]

          	var report := {
          		"build": {
          			"name": "PULSEFALL BLACKSITE",
          			"version": VERSION
          		},
          		"session": {
          			"started_unix": session_started_unix,
          			"duration_seconds": Time.get_unix_time_from_system() - session_started_unix,
          			"recovered_from_unclean_session": recovered_from_unclean_session
          		},
          		"system": {
          			"os": OS.get_name(),
          			"os_version": OS.get_version(),
          			"cpu": OS.get_processor_name(),
          			"logical_processors": OS.get_processor_count(),
          			"gpu": RenderingServer.get_video_adapter_name(),
          			"gpu_vendor": RenderingServer.get_video_adapter_vendor(),
          			"renderer": RenderingServer.get_current_rendering_driver_name(),
          			"screen_size": str(DisplayServer.screen_get_size())
          		},
          		"performance": {
          			"sample_count": fps_samples.size(),
          			"average_fps": snappedf(average_fps, 0.1),
          			"p10_fps": snappedf(p10_fps, 0.1),
          			"minimum_fps": snappedf(minimum_fps, 0.1)
          		},
          		"run": extra
          	}

          	var file := FileAccess.open(REPORT_PATH, FileAccess.WRITE)
          	if file != null:
          		file.store_string(JSON.stringify(report, "\t"))
          	record_event("playtest_report_written", {"path": ProjectSettings.globalize_path(REPORT_PATH)})
          	return ProjectSettings.globalize_path(REPORT_PATH)


          func get_logs_directory() -> String:
          	return ProjectSettings.globalize_path("user://logs")
          GDSCRIPT

          cat > game/tests/test_commercial_readiness.gd <<'GDSCRIPT'
          extends GdUnitTestSuite


          func test_project_identity() -> void:
          	assert_str(str(ProjectSettings.get_setting("application/config/name"))).is_equal("PULSEFALL BLACKSITE")


          func test_core_scenes_exist() -> void:
          	assert_bool(ResourceLoader.exists("res://main/main.tscn")).is_true()
          	assert_bool(ResourceLoader.exists("res://menu/menu.tscn")).is_true()
          	assert_bool(ResourceLoader.exists("res://level/level.tscn")).is_true()
          	assert_bool(ResourceLoader.exists("res://player/player.tscn")).is_true()
          	assert_bool(ResourceLoader.exists("res://enemies/red_robot/red_robot.tscn")).is_true()


          func test_player_combat_contract() -> void:
          	var scene: PackedScene = load("res://player/player.tscn")
          	var player := scene.instantiate()
          	assert_bool(player.has_method("take_damage")).is_true()
          	assert_bool(player.has_method("heal")).is_true()
          	assert_bool(player.has_method("revive")).is_true()
          	assert_bool(player.has_signal("health_changed")).is_true()
          	assert_bool(player.has_signal("died")).is_true()
          	assert_bool(int(player.max_health) > 0).is_true()
          	player.free()


          func test_enemy_combat_contract() -> void:
          	var scene: PackedScene = load("res://enemies/red_robot/red_robot.tscn")
          	var enemy := scene.instantiate()
          	assert_bool(enemy.has_signal("exploded")).is_true()
          	assert_bool(int(enemy.health) > 0).is_true()
          	enemy.free()


          func test_release_documents_present() -> void:
          	assert_bool(FileAccess.file_exists("res://LICENSE.md")).is_true()
          	assert_bool(FileAccess.file_exists("res://THIRD_PARTY_NOTICES.txt")).is_true()
          	assert_bool(FileAccess.file_exists("res://PRIVACY_NOTICE.txt")).is_true()
          	assert_bool(FileAccess.file_exists("res://PLAYTEST_GUIDE.txt")).is_true()


          func test_file_logging_enabled() -> void:
          	assert_bool(bool(ProjectSettings.get_setting("debug/file_logging/enable_file_logging", false))).is_true()
          GDSCRIPT

          cat > game/PLAYTEST_GUIDE.txt <<'EOF'
          PULSEFALL BLACKSITE — RC PLAYTEST GUIDE

          Goal
          Complete all 5 waves, fight the OMEGA WARDEN, and judge whether the build
          feels clear, responsive, stable, and worth playing again.

          Required test passes
          1. Fresh launch: menu -> settings -> enter Blacksite.
          2. Keyboard/mouse combat: move, aim, fire, jump, take damage, die and revive.
          3. Complete all five waves and rate the build on the end-of-run survey.
          4. Change graphics settings, toggle fullscreen, alt-tab and resume.
          5. Relaunch the game after a normal exit.
          6. Force-close once, relaunch, and confirm safe-mode recovery works.
          7. Run at least one 20-minute soak session.
          8. If available, test an Xbox-compatible controller.
          9. Test at 1920x1080 and one lower resolution.
          10. Press F8 at any time to write a local playtest/performance report.

          Record
          - Any crash, freeze, broken control or visual defect.
          - Where you became confused.
          - Whether shooting feels satisfying.
          - Whether enemy difficulty feels fair.
          - Lowest-feeling performance section.
          - Would you voluntarily play another mission? Yes/No.

          Logs
          Godot log: user data folder / logs / godot.log
          Event log: user data folder / logs / events.jsonl
          F8 report: user data folder / playtest_report.json

          No diagnostic information is uploaded automatically.
          EOF

          cat > game/PRIVACY_NOTICE.txt <<'EOF'
          PULSEFALL BLACKSITE RC — PRIVACY NOTICE

          This playtest build does not transmit gameplay analytics, hardware details,
          personal information, crash logs, or feedback to a remote server.

          For quality assurance it stores local diagnostic files on the tester's PC:
          engine logs, anonymous gameplay events, frame-rate samples, build version,
          operating-system name, CPU/GPU model, renderer and optional playtest rating.

          These files remain on the tester's machine unless the tester chooses to share
          them with the developer for debugging. No advertising SDK, tracking SDK,
          account system, payment system or cloud telemetry is enabled in this RC.
          EOF

          cat > game/SUPPORT.txt <<'EOF'
          PULSEFALL BLACKSITE — SUPPORT / BUG REPORT

          When reporting a bug, include:
          - What you were doing immediately before the issue.
          - Whether it happens every time.
          - Screenshot/video if visual.
          - playtest_report.json (press F8 before exiting when possible).
          - logs/godot.log and logs/events.jsonl.

          Never include passwords, account credentials, or unrelated personal files.
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p=Path("game/project.godot")
          s=p.read_text()
          needle='Settings="*res://menu/settings.gd"'
          if 'ProductionGuard=' not in s:
              s=s.replace(needle, needle+'\nProductionGuard="*res://production/production_guard.gd"')
          if '[debug]' not in s:
              s += '\n[debug]\n\nfile_logging/enable_file_logging=true\nfile_logging/enable_file_logging.pc=true\nfile_logging/log_path="user://logs/godot.log"\n'
          p.write_text(s)
          PY

      - name: Add player health and combat stakes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path("game/player/player.gd")
          s=p.read_text()
          s=s.replace(
              'class_name Player\nextends CharacterBody3D\n',
              'class_name Player\nextends CharacterBody3D\n\n\nsignal health_changed(current: int, maximum: int)\nsignal died\n'
          )
          s=s.replace(
              'var motion := Vector2()\n',
              'var motion := Vector2()\n\n@export var max_health: int = 100\nvar health: int = 100\nvar incapacitated: bool = false\n'
          )
          s=s.replace(
              'func _ready() -> void:\n\t# Pre-initialize orientation transform.\n',
              'func _ready() -> void:\n\thealth = max_health\n\tcall_deferred("_emit_health")\n\t# Pre-initialize orientation transform.\n'
          )
          s=s.replace(
              'func apply_input(delta: float) -> void:\n\tmotion = motion.lerp',
              'func apply_input(delta: float) -> void:\n\tif incapacitated:\n\t\tvelocity = Vector3.ZERO\n\t\treturn\n\tmotion = motion.lerp'
          )
          p.write_text(s)

          p=Path("game/enemies/red_robot/red_robot.gd")
          s=p.read_text()
          s=s.replace(
              'if col.collider == player:\n\t\t\tpass # Kill.',
              'if col.collider == player:\n\t\t\tif player.has_method("take_damage"):\n\t\t\t\tplayer.take_damage(18)'
          )
          p.write_text(s)
          PY

          cat >> game/player/player.gd <<'GDSCRIPT'

          func _emit_health() -> void:
          	health_changed.emit(health, max_health)


          func take_damage(amount: int) -> void:
          	if incapacitated:
          		return
          	health = maxi(health - amount, 0)
          	hit.rpc()
          	health_changed.emit(health, max_health)
          	if health <= 0:
          		incapacitated = true
          		died.emit()


          func heal(amount: int) -> void:
          	if incapacitated:
          		return
          	health = mini(max_health, health + amount)
          	health_changed.emit(health, max_health)


          func revive() -> void:
          	incapacitated = false
          	health = max_health
          	velocity = Vector3.ZERO
          	transform.origin = initial_position
          	health_changed.emit(health, max_health)
          GDSCRIPT

      - name: Install PULSEFALL wave director and HUD
        shell: bash
        run: |
          cat > game/level/level.gd <<'GDSCRIPT'
          extends Node3D

          signal quit

          const RedRobot: PackedScene = preload("res://enemies/red_robot/red_robot.tscn")
          const PlayerScene: PackedScene = preload("res://player/player.tscn")
          const TOTAL_WAVES := 5

          var lightmap_gi: LightmapGI = null
          var wave := 0
          var hostiles := 0
          var score := 0
          var mission_time := 0.0
          var mission_active := false
          var active_player: Player = null
          var hud_font: Font = null

          var wave_label: Label
          var hostiles_label: Label
          var score_label: Label
          var timer_label: Label
          var health_label: Label
          var health_bar: ProgressBar
          var banner_title: Label
          var banner_subtitle: Label
          var banner_panel: ColorRect
          var boss_label: Label
          var survey_panel: Control = null

          @onready var world_environment: WorldEnvironment = $WorldEnvironment
          @onready var robot_spawn_points: Node3D = $RobotSpawnpoints
          @onready var player_spawn_points: Node3D = $PlayerSpawnpoints
          @onready var spawned_nodes: Node3D = $SpawnedNodes


          func _ready() -> void:
          	Settings.apply_graphics_settings(get_window(), world_environment.environment, self)

          	if Settings.config_file.get_value("rendering", "gi_type") == Settings.GIType.SDFGI:
          		setup_sdfgi()
          	elif Settings.config_file.get_value("rendering", "gi_type") == Settings.GIType.VOXEL_GI:
          		setup_voxelgi()
          	else:
          		setup_lightmapgi()

          	_build_hud()
          	ProductionGuard.record_event("mission_scene_ready", {"build": ProductionGuard.VERSION})

          	if multiplayer.is_server():
          		randomize()
          		var spawn_points = player_spawn_points.get_children()
          		spawn_points.shuffle()
          		add_player(1, spawn_points.pop_front())
          		multiplayer.peer_disconnected.connect(del_player)

          	await get_tree().create_timer(0.5).timeout
          	_show_banner("PULSEFALL", "BLACKSITE OMEGA-9 // CONTAINMENT FAILURE", 3.2)
          	await get_tree().create_timer(3.0).timeout
          	mission_active = true
          	_start_wave()


          func _process(delta: float) -> void:
          	if mission_active:
          		mission_time += delta
          		var mins := int(mission_time) / 60
          		var secs := int(mission_time) % 60
          		timer_label.text = "%02d:%02d" % [mins, secs]


          func setup_sdfgi() -> void:
          	world_environment.environment.sdfgi_enabled = true
          	$VoxelGI.hide()
          	$ReflectionProbes.hide()
          	if lightmap_gi != null:
          		lightmap_gi.queue_free()

          	if Settings.config_file.get_value("rendering", "gi_quality") == Settings.GIQuality.HIGH:
          		RenderingServer.environment_set_sdfgi_ray_count(RenderingServer.ENV_SDFGI_RAY_COUNT_96)
          	elif Settings.config_file.get_value("rendering", "gi_quality") == Settings.GIQuality.LOW:
          		RenderingServer.environment_set_sdfgi_ray_count(RenderingServer.ENV_SDFGI_RAY_COUNT_32)
          	else:
          		world_environment.environment.sdfgi_enabled = false


          func setup_voxelgi() -> void:
          	world_environment.environment.sdfgi_enabled = false
          	$VoxelGI.show()
          	$ReflectionProbes.hide()
          	if lightmap_gi != null:
          		lightmap_gi.queue_free()

          	if Settings.config_file.get_value("rendering", "gi_quality") == Settings.GIQuality.HIGH:
          		RenderingServer.voxel_gi_set_quality(RenderingServer.VOXEL_GI_QUALITY_HIGH)
          	elif Settings.config_file.get_value("rendering", "gi_quality") == Settings.GIQuality.LOW:
          		RenderingServer.voxel_gi_set_quality(RenderingServer.VOXEL_GI_QUALITY_LOW)
          	else:
          		$VoxelGI.hide()


          func setup_lightmapgi() -> void:
          	world_environment.environment.sdfgi_enabled = false
          	$VoxelGI.hide()
          	$ReflectionProbes.show()
          	if lightmap_gi == null:
          		var new_gi := LightmapGI.new()
          		new_gi.light_data = load("res://level/level.lmbake")
          		new_gi.name = "LightmapGI"
          		lightmap_gi = new_gi
          		add_child(new_gi)

          	if Settings.config_file.get_value("rendering", "gi_quality") == Settings.GIQuality.DISABLED:
          		lightmap_gi.hide()
          		$ReflectionProbes.hide()


          func _start_wave() -> void:
          	if not mission_active:
          		return
          	wave += 1
          	ProductionGuard.record_event("wave_started", {"wave": wave})
          	if wave > TOTAL_WAVES:
          		_finish_mission()
          		return

          	hostiles = 0
          	boss_label.visible = false
          	_update_hud()

          	if wave == TOTAL_WAVES:
          		_show_banner("OMEGA WARDEN", "BOSS SIGNAL ACQUIRED", 2.4)
          		await get_tree().create_timer(1.8).timeout
          		for i in range(3):
          			_spawn_robot_at(i, false, i)
          		_spawn_robot_at(3, true, 0)
          	else:
          		_show_banner("WAVE %02d" % wave, _wave_subtitle(), 1.8)
          		await get_tree().create_timer(1.1).timeout
          		var count := mini(3 + wave, 6)
          		for i in range(count):
          			_spawn_robot_at(i % robot_spawn_points.get_child_count(), false, i)

          	_update_hud()


          func _wave_subtitle() -> String:
          	match wave:
          		1: return "INITIAL BREACH // CLEAR THE DECK"
          		2: return "HOSTILE REINFORCEMENTS"
          		3: return "REACTOR ACCESS COMPROMISED"
          		4: return "CORE DEFENSES OVERRIDDEN"
          		_: return "SURVIVE"


          func _spawn_robot_at(marker_index: int, elite: bool, spawn_index: int) -> void:
          	var spawn_point: Marker3D = robot_spawn_points.get_child(marker_index)
          	var robot: CharacterBody3D = RedRobot.instantiate()
          	robot.transform = spawn_point.transform
          	var ring := float(spawn_index / max(1, robot_spawn_points.get_child_count()))
          	var angle := float(spawn_index) * 1.618
          	robot.transform.origin += Vector3(cos(angle), 0.0, sin(angle)) * ring * 2.0
          	robot.health = (26 + wave * 3) if elite else (4 + wave * 2)
          	if elite:
          		robot.scale = Vector3.ONE * 1.55
          		robot.set_meta("elite", true)
          		boss_label.visible = true
          	else:
          		robot.set_meta("elite", false)
          	robot.exploded.connect(_on_robot_exploded.bind(robot))
          	spawned_nodes.add_child(robot, true)
          	if active_player != null:
          		robot.player = active_player
          		robot.resume_approach()
          	hostiles += 1


          func _on_robot_exploded(robot: Node) -> void:
          	if not mission_active:
          		return
          	var elite := bool(robot.get_meta("elite", false))
          	ProductionGuard.record_event("enemy_destroyed", {"wave": wave, "elite": elite})
          	score += (1500 if elite else 150) * maxi(wave, 1)
          	hostiles = maxi(hostiles - 1, 0)
          	if elite:
          		boss_label.visible = false
          	_update_hud()
          	if hostiles == 0:
          		mission_active = false
          		if wave >= TOTAL_WAVES:
          			await get_tree().create_timer(1.5).timeout
          			_finish_mission()
          		else:
          			if active_player != null:
          				active_player.heal(25)
          			_show_banner("WAVE CLEARED", "+25 CORE INTEGRITY", 1.8)
          			await get_tree().create_timer(2.4).timeout
          			mission_active = true
          			_start_wave()


          func _finish_mission() -> void:
          	mission_active = false
          	boss_label.visible = false
          	ProductionGuard.record_event("mission_complete", {"score": score, "time_seconds": mission_time, "wave": wave})
          	ProductionGuard.write_playtest_report({"result": "complete", "score": score, "time_seconds": mission_time, "wave": wave})
          	_show_banner("BLACKSITE SECURED", "FINAL SCORE %06d  //  PLAYTEST RATING REQUESTED" % score, 4.5)
          	await get_tree().create_timer(4.7).timeout
          	_show_playtest_survey()


          func _on_player_died() -> void:
          	if not mission_active:
          		return
          	mission_active = false
          	ProductionGuard.record_event("player_death", {"wave": wave, "score": score, "time_seconds": mission_time})
          	_show_banner("AEGIS SIGNAL LOST", "EMERGENCY RECONSTRUCTION", 2.6)
          	_clear_hostiles()
          	await get_tree().create_timer(2.8).timeout
          	score = maxi(score - 750, 0)
          	wave = maxi(wave - 1, 0)
          	if active_player != null:
          		active_player.revive()
          	mission_active = true
          	_start_wave()


          func _clear_hostiles() -> void:
          	for child in spawned_nodes.get_children():
          		if child != active_player and child is CharacterBody3D:
          			child.queue_free()
          	hostiles = 0
          	_update_hud()


          func del_player(id: int) -> void:
          	if spawned_nodes.has_node(str(id)):
          		spawned_nodes.get_node(str(id)).queue_free()


          func add_player(id: int, spawn_point: Marker3D = null) -> void:
          	if spawn_point == null:
          		spawn_point = player_spawn_points.get_child(randi() % player_spawn_points.get_child_count())
          	var player: CharacterBody3D = PlayerScene.instantiate()
          	player.name = str(id)
          	player.player_id = id
          	player.transform = spawn_point.transform
          	spawned_nodes.add_child(player)
          	if id == 1 and player is Player:
          		active_player = player
          		active_player.health_changed.connect(_on_health_changed)
          		active_player.died.connect(_on_player_died)
          		_on_health_changed(active_player.health, active_player.max_health)


          func _on_health_changed(current: int, maximum: int) -> void:
          	if health_bar == null:
          		return
          	health_bar.max_value = maximum
          	health_bar.value = current
          	health_label.text = "CORE INTEGRITY  %03d" % current
          	if current <= 30:
          		health_label.modulate = Color(1.0, 0.3, 0.35)
          	else:
          		health_label.modulate = Color(0.72, 0.96, 1.0)


          func _build_hud() -> void:
          	hud_font = load("res://menu/font/PT_Sans-Web-Bold.ttf")
          	var layer := CanvasLayer.new()
          	layer.layer = 20
          	layer.name = "PulsefallHUD"
          	add_child(layer)

          	var top := ColorRect.new()
          	top.color = Color(0.015, 0.025, 0.05, 0.83)
          	top.anchor_right = 1.0
          	top.offset_bottom = 68.0
          	top.mouse_filter = Control.MOUSE_FILTER_IGNORE
          	layer.add_child(top)

          	var title := _make_label("PULSEFALL  //  BLACKSITE", 25, Color(0.36, 0.9, 1.0))
          	title.position = Vector2(28, 12)
          	top.add_child(title)

          	wave_label = _make_label("WAVE 00/05", 18, Color.WHITE)
          	wave_label.position = Vector2(31, 39)
          	top.add_child(wave_label)

          	hostiles_label = _make_label("HOSTILES 00", 18, Color(1.0, 0.4, 0.45))
          	hostiles_label.position = Vector2(170, 39)
          	top.add_child(hostiles_label)

          	score_label = _make_label("SCORE 000000", 18, Color(0.72, 0.96, 1.0))
          	score_label.anchor_left = 1.0
          	score_label.anchor_right = 1.0
          	score_label.offset_left = -205
          	score_label.offset_right = -25
          	score_label.offset_top = 14
          	top.add_child(score_label)

          	timer_label = _make_label("00:00", 17, Color(0.7, 0.75, 0.84))
          	timer_label.anchor_left = 1.0
          	timer_label.anchor_right = 1.0
          	timer_label.offset_left = -95
          	timer_label.offset_right = -25
          	timer_label.offset_top = 41
          	top.add_child(timer_label)

          	boss_label = _make_label("⚠  OMEGA WARDEN ACTIVE", 22, Color(1.0, 0.25, 0.3))
          	boss_label.anchor_left = 0.5
          	boss_label.anchor_right = 0.5
          	boss_label.offset_left = -170
          	boss_label.offset_right = 170
          	boss_label.offset_top = 82
          	boss_label.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
          	boss_label.visible = false
          	layer.add_child(boss_label)

          	var health_panel := ColorRect.new()
          	health_panel.color = Color(0.015, 0.025, 0.05, 0.88)
          	health_panel.anchor_top = 1.0
          	health_panel.anchor_bottom = 1.0
          	health_panel.offset_left = 28
          	health_panel.offset_right = 330
          	health_panel.offset_top = -94
          	health_panel.offset_bottom = -26
          	layer.add_child(health_panel)

          	health_label = _make_label("CORE INTEGRITY  100", 17, Color(0.72, 0.96, 1.0))
          	health_label.position = Vector2(14, 10)
          	health_panel.add_child(health_label)

          	health_bar = ProgressBar.new()
          	health_bar.position = Vector2(14, 40)
          	health_bar.size = Vector2(274, 13)
          	health_bar.show_percentage = false
          	var bg := StyleBoxFlat.new()
          	bg.bg_color = Color(0.08, 0.11, 0.16, 0.95)
          	var fill := StyleBoxFlat.new()
          	fill.bg_color = Color(0.24, 0.88, 1.0, 0.95)
          	health_bar.add_theme_stylebox_override("background", bg)
          	health_bar.add_theme_stylebox_override("fill", fill)
          	health_panel.add_child(health_bar)

          	var hint := _make_label("RMB AIM   •   LMB FIRE   •   WASD MOVE   •   SPACE JUMP", 15, Color(0.75, 0.8, 0.88, 0.8))
          	hint.anchor_left = 0.5
          	hint.anchor_right = 0.5
          	hint.anchor_top = 1.0
          	hint.anchor_bottom = 1.0
          	hint.offset_left = -300
          	hint.offset_right = 300
          	hint.offset_top = -40
          	hint.offset_bottom = -12
          	hint.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
          	layer.add_child(hint)

          	banner_panel = ColorRect.new()
          	banner_panel.color = Color(0.0, 0.02, 0.05, 0.90)
          	banner_panel.anchor_left = 0.5
          	banner_panel.anchor_right = 0.5
          	banner_panel.anchor_top = 0.5
          	banner_panel.anchor_bottom = 0.5
          	banner_panel.offset_left = -380
          	banner_panel.offset_right = 380
          	banner_panel.offset_top = -76
          	banner_panel.offset_bottom = 76
          	banner_panel.visible = false
          	layer.add_child(banner_panel)

          	banner_title = _make_label("", 42, Color(0.36, 0.9, 1.0))
          	banner_title.anchor_right = 1.0
          	banner_title.offset_top = 25
          	banner_title.offset_bottom = 80
          	banner_title.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
          	banner_panel.add_child(banner_title)

          	banner_subtitle = _make_label("", 17, Color(0.82, 0.86, 0.94))
          	banner_subtitle.anchor_right = 1.0
          	banner_subtitle.offset_top = 88
          	banner_subtitle.offset_bottom = 120
          	banner_subtitle.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
          	banner_panel.add_child(banner_subtitle)


          func _make_label(text_value: String, font_size: int, color: Color) -> Label:
          	var label := Label.new()
          	label.text = text_value
          	label.add_theme_font_override("font", hud_font)
          	label.add_theme_font_size_override("font_size", font_size)
          	label.modulate = color
          	label.mouse_filter = Control.MOUSE_FILTER_IGNORE
          	return label


          func _show_banner(title: String, subtitle: String, duration: float) -> void:
          	if banner_panel == null:
          		return
          	banner_title.text = title
          	banner_subtitle.text = subtitle
          	banner_panel.modulate.a = 0.0
          	banner_panel.visible = true
          	var tween := create_tween()
          	tween.tween_property(banner_panel, "modulate:a", 1.0, 0.25)
          	tween.tween_interval(maxf(duration - 0.55, 0.1))
          	tween.tween_property(banner_panel, "modulate:a", 0.0, 0.3)
          	tween.tween_callback(func(): banner_panel.visible = false)


          func _update_hud() -> void:
          	if wave_label == null:
          		return
          	wave_label.text = "WAVE %02d/%02d" % [mini(wave, TOTAL_WAVES), TOTAL_WAVES]
          	hostiles_label.text = "HOSTILES %02d" % hostiles
          	score_label.text = "SCORE %06d" % score


          func _show_playtest_survey() -> void:
          	if survey_panel != null:
          		return
          	Input.set_mouse_mode(Input.MOUSE_MODE_VISIBLE)
          	survey_panel = Control.new()
          	survey_panel.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
          	var shade := ColorRect.new()
          	shade.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
          	shade.color = Color(0.0, 0.01, 0.03, 0.82)
          	survey_panel.add_child(shade)
          	var card := ColorRect.new()
          	card.color = Color(0.025, 0.045, 0.08, 0.97)
          	card.anchor_left = 0.5
          	card.anchor_right = 0.5
          	card.anchor_top = 0.5
          	card.anchor_bottom = 0.5
          	card.offset_left = -330
          	card.offset_right = 330
          	card.offset_top = -145
          	card.offset_bottom = 145
          	survey_panel.add_child(card)
          	var title := _make_label("PLAYTEST COMPLETE", 32, Color(0.36, 0.9, 1.0))
          	title.anchor_right = 1.0
          	title.offset_top = 25
          	title.offset_bottom = 70
          	title.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
          	card.add_child(title)
          	var prompt := _make_label("How would you rate the overall experience?", 18, Color.WHITE)
          	prompt.anchor_right = 1.0
          	prompt.offset_top = 82
          	prompt.offset_bottom = 115
          	prompt.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
          	card.add_child(prompt)
          	for rating in range(1, 6):
          		var button := Button.new()
          		button.text = str(rating)
          		button.position = Vector2(76 + (rating - 1) * 105, 140)
          		button.size = Vector2(72, 54)
          		button.add_theme_font_size_override("font_size", 22)
          		button.pressed.connect(_submit_playtest_rating.bind(rating))
          		card.add_child(button)
          	var note := _make_label("1 = poor     5 = excellent     •     F8 saves a diagnostic report anytime", 14, Color(0.72, 0.78, 0.88))
          	note.anchor_right = 1.0
          	note.offset_top = 215
          	note.offset_bottom = 250
          	note.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
          	card.add_child(note)
          	get_node("PulsefallHUD").add_child(survey_panel)


          func _submit_playtest_rating(rating: int) -> void:
          	ProductionGuard.record_event("playtest_rating", {"rating": rating, "score": score, "time_seconds": mission_time})
          	ProductionGuard.write_playtest_report({"result": "complete", "rating": rating, "score": score, "time_seconds": mission_time, "wave": wave})
          	if survey_panel != null:
          		survey_panel.queue_free()
          		survey_panel = null
          	_show_banner("THANK YOU", "PLAYTEST REPORT SAVED LOCALLY", 3.0)


          func _input(input_event: InputEvent) -> void:
          	if input_event is InputEventKey and input_event.pressed and not input_event.echo and input_event.keycode == KEY_F8:
          		var report_path := ProductionGuard.write_playtest_report({"result": "snapshot", "score": score, "time_seconds": mission_time, "wave": wave, "hostiles": hostiles})
          		ProductionGuard.record_event("manual_report", {"path": report_path})
          		_show_banner("QA REPORT SAVED", "PRESS F8 ANYTIME DURING A TEST RUN", 2.0)
          		return
          	if input_event.is_action_pressed(&"quit"):
          		ProductionGuard.record_event("extract_to_menu", {"score": score, "time_seconds": mission_time, "wave": wave})
          		Input.set_mouse_mode(Input.MOUSE_MODE_VISIBLE)
          		quit.emit()
          GDSCRIPT

