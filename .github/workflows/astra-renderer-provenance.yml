name: ASTRA Renderer Provenance Checks
on:
  pull_request:
    paths:
      - 'astra_v2/creative.py'
      - 'astra_v2/original_stories.py'
      - 'tests/test_astra_original_story_supply.py'
      - 'tests/test_astra_shorts_fingerprint_lifecycle.py'
      - 'astra_v2/shorts_novelty.py'
      - 'tests/test_astra_shorts_novelty.py'
      - 'tests/test_astra_shorts_novelty_integration.py'
      - 'tests/test_astra_preload_novelty.py'
      - 'tests/test_astra_original_replenishment.py'
      - 'astra_v2/original_replenishment.py'
      - 'astra_v2/story_planning.py'
      - 'astra_v2/story_editorial.py'
      - 'tests/test_astra_story_editorial.py'
      - 'astra_v2/openai_creative.py'
      - 'tests/test_astra_model_story_novelty.py'
      - 'astra_v2/autonomous_story_proposals.py'
      - 'tests/test_astra_autonomous_story_proposals.py'
      - 'tests/test_astra_story_planning.py'
      - 'astra_v2/preload_queue.py'
      - 'astra_v2/run.py'
      - 'astra_v2/preflight.py'
      - 'tests/test_astra_renderer_provenance.py'
      - 'tests/test_astra_preload_artifact_pagination.py'
      - 'tests/test_preload_run_resilience.py'
      - '.github/workflows/astra-renderer-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight YouTube client for runtime tests
        run: python -m pip install --disable-pip-version-check 'httpx==0.28.1'
      - name: Check Python syntax
        run: python -m compileall -q astra_v2/creative.py astra_v2/preload_queue.py astra_v2/run.py astra_v2/preflight.py tests/test_astra_renderer_provenance.py tests/test_preload_run_resilience.py astra_v2/original_stories.py tests/test_astra_original_story_supply.py
      - name: Check original story inventory and publication policy
        run: python -m unittest discover -s tests -p test_astra_original_story_supply.py -v
      - name: Check Shorts fingerprint publication lifecycle
        run: python -m unittest discover -s tests -p test_astra_shorts_fingerprint_lifecycle.py -v
      - name: Check Shorts near-duplicate detector
        run: python -m unittest discover -s tests -p test_astra_shorts_novelty.py -v
      - name: Check Shorts novelty history integration
        run: python -m unittest discover -s tests -p test_astra_shorts_novelty_integration.py -v
      - name: Check preloaded Shorts novelty
        run: python -m unittest discover -s tests -p test_astra_preload_novelty.py -v
      - name: Verify replenished original story supply
        run: python -m unittest discover -s tests -p test_astra_original_replenishment.py -v
      - name: Verify original story planning
        run: python -m unittest discover -s tests -p test_astra_story_planning.py -v
      - name: Verify autonomous proposal persistence
        run: python -m unittest discover -s tests -p test_astra_autonomous_story_proposals.py -v
      - name: Verify model story novelty integration
        run: python -m unittest discover -s tests -p test_astra_model_story_novelty.py -v
      - name: Verify story editorial isolation
        run: python -m unittest discover -s tests -p test_astra_story_editorial.py -v
      - name: Check renderer handoff
        run: python -m unittest discover -s tests -p test_astra_renderer_provenance.py -v
      - name: Reproduce live publisher queue tests with Studio 7.2 floor
        env:
          ASTRA_MIN_STUDIO_VERSION: '7.2.0'
          ASTRA_REQUIRE_STUDIO_PRELOAD: '1'
        run: python -m unittest discover -s tests -p test_astra_preload_artifact_pagination.py -v
      - name: Check queue lookup caching and failure isolation
        run: python -m unittest discover -s tests -p test_preload_run_resilience.py -v
