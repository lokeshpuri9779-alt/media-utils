name: ASTRA Studio Narrated Review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'astra/artwork_story_bridge.py'
      - 'tests/test_artwork_story_bridge.py'
      - 'astra/artwork_provenance.py'
      - 'tests/test_artwork_provenance.py'
      - 'tests/test_scene_artwork_manifest.py'
      - 'tests/test_story_artwork_binding.py'
      - 'astra/approved_artwork_render_proof.py'
      - 'tests/test_approved_artwork_render_proof.py'
      - 'astra/artwork_pixel_proof.py'
      - 'tests/test_artwork_pixel_proof.py'
      - 'studio_renderer.py'
      - 'astra_v2/prepare_reviewed_video.py'
      - 'astra_v2/restore_reviewed_artwork.py'
      - 'tests/test_prepare_reviewed_video.py'
      - 'tests/studio_approved_mp4_e2e.py'
      - 'astra/fixtures/artwork_storyboard_review.json'
      - '.github/workflows/astra-artwork-studio-review.yml'

permissions:
  contents: read

jobs:
  narrated-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASTRA_UNIFIED_STORY_ENGINE: '1'
      ASTRA_OPENAI_ENABLED: '0'
      ASTRA_OPENAI_ALLOW_PAID_API: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing production renderer dependencies
        run: |
          # This review exercises Studio rendering, Kokoro narration and artwork proofs.
          # Avoid installing unrelated VCS-only transcription/scene-detection packages.
          grep -vE '^[[:space:]]*(scenedetect-core|faster-whisper)[[:space:]]*@' requirements.txt > /tmp/astra-studio-review-requirements.txt
          python -m pip install --disable-pip-version-check --prefer-binary -r /tmp/astra-studio-review-requirements.txt
          # Studio uses imageio-ffmpeg's pinned, self-contained FFmpeg binary.
          # Avoid a second, fragile system-package download from Ubuntu mirrors.
          python - <<'PY'
          import av
          import imageio_ffmpeg
          from pathlib import Path
          ffmpeg = Path(imageio_ffmpeg.get_ffmpeg_exe())
          if not ffmpeg.is_file():
              raise SystemExit('Bundled imageio-ffmpeg executable is missing')
          print('ASTRA_FFMPEG_BINARY=', ffmpeg)
          print('ASTRA_PYAV_VERSION=', av.__version__)
          PY
      - name: Validate storyboard contract
        run: |
          python -m unittest discover -s tests -p 'test_artwork_story_bridge.py' -v
          python -m unittest discover -s tests -p 'test_artwork_provenance.py' -v
          python -m unittest discover -s tests -p 'test_scene_artwork_manifest.py' -v
          python -m unittest discover -s tests -p 'test_story_artwork_binding.py' -v
          python -m unittest discover -s tests -p 'test_approved_artwork_render_proof.py' -v
          python -m unittest discover -s tests -p 'test_artwork_pixel_proof.py' -v
      - name: Test remote-reviewed artwork MP4 preparation safety
        run: python -m unittest discover -s tests -p 'test_prepare_reviewed_video.py' -v
      - name: Verify complete approved-scene Studio MP4 offline
        run: python -m tests.studio_approved_mp4_e2e
      - name: Render with existing Studio and Kokoro
        run: |
          python - <<'PY'
          from astra.artwork_story_bridge import render_review
          from astra.artwork_provenance import save_audit
          result = render_review('astra/fixtures/artwork_storyboard_review.json', 'astra-narrated-review.mp4')
          print('ASTRA_STUDIO_REVIEW_RESULT=', result)
          provenance = save_audit('astra/fixtures/artwork_storyboard_review.json', result, 'astra-artwork-provenance.json')
          print('ASTRA_REQUESTED_ARTWORK_VERIFIED=', provenance['requested_backgrounds_verified'])
          PY
      - name: Render isolated approved artwork fixture with real narration
        run: |
          python - <<'PY'
          from astra.approved_artwork_render_proof import render_fixture
          print(render_fixture('/tmp/astra-approved-fixture', 'astra/fixtures/artwork_storyboard_review.json', 'astra-approved-artwork-review.mp4'))
          PY
      - name: Inspect decoded artwork pixels in rendered video
        run: |
          python - <<'PY'
          from astra.artwork_pixel_proof import save_pixel_proof
          report = save_pixel_proof('astra-approved-artwork-review.mp4', 'astra/fixtures/artwork_storyboard_review.json', '/tmp/astra-approved-fixture/art/manifest.json', 'astra-artwork-pixel-proof.json')
          print('ASTRA_ARTWORK_PIXEL_PROOF=', report)
          if not report['all_pass']:
              raise SystemExit('Decoded video frames did not match expected artwork closely enough')
          PY
      - name: Verify actual audio/video streams
        run: |
          python - <<'PY'
          import av
          checks = (
              ('astra-narrated-review.mp4', {'aac', 'mp3', 'opus'}),
              ('astra-approved-artwork-review.mp4', {'aac'}),
          )
          for path, allowed_audio in checks:
              with av.open(path) as media:
                  video = [s for s in media.streams if s.type == 'video']
                  audio = [s for s in media.streams if s.type == 'audio']
                  if len(video) != 1 or (video[0].width, video[0].height) != (1080, 1920):
                      raise SystemExit(f'{path}: expected one 1080x1920 video stream')
                  if not audio or not any(s.codec_context.name in allowed_audio for s in audio):
                      raise SystemExit(f'{path}: missing supported audio stream')
                  print('ASTRA_MEDIA_STREAMS_OK=', path,
                        video[0].codec_context.name, video[0].width, video[0].height,
                        [s.codec_context.name for s in audio])
          PY
      - name: Reject silent or empty narration
        run: |
          python - <<'PY'
          import av
          import numpy as np
          import math
          total_square = 0.0
          total_samples = 0
          with av.open('astra-narrated-review.mp4') as media:
              audio = next((s for s in media.streams if s.type == 'audio'), None)
              if audio is None:
                  raise SystemExit('Narration audio stream is missing')
              for frame in media.decode(audio):
                  samples = frame.to_ndarray()
                  values = samples.astype(np.float64)
                  if np.issubdtype(samples.dtype, np.integer):
                      values /= max(abs(np.iinfo(samples.dtype).min), np.iinfo(samples.dtype).max)
                  total_square += float(np.square(values).sum())
                  total_samples += int(values.size)
          if not total_samples:
              raise SystemExit('Narration audio contains no decoded samples')
          rms = math.sqrt(total_square / total_samples)
          rms_db = 20 * math.log10(max(rms, 1e-12))
          if rms_db < -55:
              raise SystemExit(f'Narration audio too quiet or silent: {rms_db:.2f} dBFS')
          print('ASTRA_NARRATION_RMS_DBFS=', round(rms_db, 2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astra-studio-narrated-review
          path: |
            astra-narrated-review.mp4
            astra-artwork-provenance.json
            astra-approved-artwork-review.mp4
            astra-approved-artwork-review.artwork.json
            astra-artwork-pixel-proof.json
          retention-days: 14
          if-no-files-found: error
