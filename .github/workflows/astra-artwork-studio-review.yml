name: ASTRA Studio Narrated Review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'astra/artwork_story_bridge.py'
      - 'tests/test_artwork_story_bridge.py'
      - 'astra/fixtures/artwork_storyboard_review.json'
      - '.github/workflows/astra-artwork-studio-review.yml'

permissions:
  contents: read

jobs:
  narrated-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASTRA_UNIFIED_STORY_ENGINE: '1'
      ASTRA_OPENAI_ENABLED: '0'
      ASTRA_OPENAI_ALLOW_PAID_API: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing production renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Validate storyboard contract
        run: python -m unittest discover -s tests -p 'test_artwork_story_bridge.py' -v
      - name: Render with existing Studio and Kokoro
        run: |
          python - <<'PY'
          from astra.artwork_story_bridge import render_review
          result = render_review('astra/fixtures/artwork_storyboard_review.json', 'astra-narrated-review.mp4')
          print('ASTRA_STUDIO_REVIEW_RESULT=', result)
          PY
      - name: Verify actual audio/video streams
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 astra-narrated-review.mp4 | grep -Fx '1080,1920'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 astra-narrated-review.mp4 | grep -E '^(aac|mp3|opus)$'
      - name: Reject silent or empty narration
        run: |
          python - <<'PY'
          import json, subprocess
          p = subprocess.run(['ffmpeg','-hide_banner','-i','astra-narrated-review.mp4','-vn','-af','astats=metadata=1:reset=0','-f','null','-'],capture_output=True,text=True,check=True)
          import re
          matches = re.findall(r'RMS level dB:\s*(-?[0-9.]+)',p.stderr)
          if not matches or max(float(x) for x in matches) < -55:
              raise SystemExit('Narration audio too quiet or silent')
          print('ASTRA_NARRATION_RMS_DB=',max(float(x) for x in matches))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: astra-studio-narrated-review
          path: astra-narrated-review.mp4
          retention-days: 14
          if-no-files-found: error
