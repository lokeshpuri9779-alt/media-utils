name: ASTRA V2 - Long-form Preload

on:
  workflow_dispatch:
  schedule:
    - cron: '15 1,13 * * *'

concurrency:
  group: astra-v2-longform-render
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  longform:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      ASTRA_PRELOAD_BUFFER: '24'
      ASTRA_PRELOAD_LANE: '0'
      ASTRA_LONG_ENABLED: '1'
      ASTRA_OPENAI_ENABLED: '0'
      ASTRA_OPENAI_ALLOW_PAID_API: '0'
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Restore state and performance
        run: |
          git fetch origin astra-state
          for f in performance.json astra_v2_state.json; do
            git checkout origin/astra-state -- "$f" 2>/dev/null || true
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/astra-voice
            ~/.cache/huggingface
            asset_cache
          key: astra-v2-media-cache-v1
          restore-keys: astra-v2-media-cache-
      - name: Install free rendering dependencies
        run: |
          timeout 360s python -m pip install --disable-pip-version-check -r requirements.txt
          command -v ffmpeg
          command -v ffprobe
      - name: Render quality-approved long video
        id: render
        run: python -m astra_v2.preload_worker
      - name: Store long-form video
        if: steps.render.outputs.content_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: astra-preloaded-${{ steps.render.outputs.content_id }}
          path: preload-package/
          if-no-files-found: error
          retention-days: 14
