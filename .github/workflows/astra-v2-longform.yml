name: ASTRA V2 - Long-form Preload

on:
  workflow_dispatch:
  schedule:
    # 07:30 and 19:30 IST, after the 07:00/19:00 episode eligibility gates.
    - cron: '0 2,14 * * *'

concurrency:
  group: astra-v2-longform-render
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  longform:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
      ASTRA_PRELOAD_BUFFER: '24'
      ASTRA_PRELOAD_LANE: '0'
      ASTRA_LONG_ENABLED: '1'
      ASTRA_LONG_ONLY: '1'
      ASTRA_ASSET_PACK_ENABLED: '0' # Opt in only after visual review
      ASTRA_ASSET_PACK_ROOT: runtime-artifacts/verified-pack
      ASTRA_OPENAI_ENABLED: '0'
      ASTRA_OPENAI_ALLOW_PAID_API: '0'
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Restore state and performance
        run: |
          git fetch origin astra-state
          for f in performance.json astra_v2_state.json; do
            git checkout origin/astra-state -- "$f" 2>/dev/null || true
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/astra-voice
            ~/.cache/huggingface
            asset_cache
          key: astra-v2-media-cache-v1
          restore-keys: astra-v2-media-cache-
      - name: Install pinned asset validation dependency
        # The optional visual-pack restore runs before the complete media stack,
        # but its PNG validation already needs the Pillow import.
        if: env.ASTRA_ASSET_PACK_ENABLED == '1'
        run: |
          python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          python -c "from PIL import Image; print('ASTRA_ASSET_VALIDATION_IMPORT=ready')"
      - name: Download reviewed reusable visual pack
        if: env.ASTRA_ASSET_PACK_ENABLED == '1'
        uses: actions/download-artifact@v4
        with:
          name: astra-original-visual-pack
          run-id: 39960540392
          github-token: ${{ github.token }}
          path: runtime-artifacts/download
      - name: Verify restored reusable visual pack
        if: env.ASTRA_ASSET_PACK_ENABLED == '1'
        run: |
          python -m tools.astra_restore_visual_pack runtime-artifacts/download/astra-visual-pack.zip runtime-artifacts/verified-pack --expected 3200
      - name: Install free rendering dependencies
        run: |
          timeout 360s python -m pip install --disable-pip-version-check -r requirements.txt
          # Ubuntu-24.04 hosted runners do not consistently ship ffmpeg/ffprobe.
          # Python's imageio-ffmpeg wheel is NOT a substitute for ffprobe.
          bash tools/astra_ffmpeg_bootstrap.sh
      - name: Validate long-form cadence and approved package rules
        run: |
          python -m unittest discover -s tests -p 'test_astra_cover_frames.py' -v
          python -m unittest discover -s tests -p 'test_astra_preload_covers.py' -v
          python -m unittest discover -s tests -p 'test_astra_publication_quality.py' -v
      - name: Validate series episode planning and novelty policy
        run: python -m unittest discover -s tests -p 'test_astra_episode_planner.py' -v
      - name: Check long-form selection and queue policy
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          from astra_v2.long_cadence import long_upload_due
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          assert not long_upload_due({}, now, performance=None), "Missing history must fail closed"
          assert os.environ["ASTRA_LONG_ONLY"] == "1", "Dedicated lane must not render Shorts"
          assert os.environ["ASTRA_LONG_ENABLED"] == "1"
          print("ASTRA_LONGFORM_ISOLATION_PREFLIGHT=passed")
          PY
      - name: Render quality-approved long video
        id: render
        run: python -m astra_v2.preload_worker
      - name: Store long-form video
        if: steps.render.outputs.content_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: astra-preloaded-${{ steps.render.outputs.content_id }}
          path: preload-package/
          if-no-files-found: error
          retention-days: 14
