name: ASTRA Lighthouse Weather Masking (Isolated)
on:
  push:
    branches:
      - benchmark/lighthouse-weather-masking
    paths:
      - .astra/weather-mask-trigger.txt
permissions:
  contents: read
  actions: read
jobs:
  mask-weather:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Get original lighthouse anchor
        uses: actions/download-artifact@v4
        with:
          name: astra-lighthouse-three-scenes-40371027354
          run-id: 40371027354
          github-token: ${{ github.token }}
          path: artifacts/anchor-input/
      - name: Install lightweight imaging libraries
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'numpy>=1.26,<3'
      - name: Create review-only weather variations
        run: python -u -m tools.experimental_lighthouse_weather_mask
      - name: Upload comparison and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-weather-masking-${{ github.run_id }}
          path: artifacts/experimental-openvino/weather-masking/
          if-no-files-found: warn
          retention-days: 7
