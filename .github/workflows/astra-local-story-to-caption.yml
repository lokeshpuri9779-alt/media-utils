name: ASTRA Local Story to Caption Short

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Content direction
        required: true
        default: surprise
        type: choice
        options:
          - surprise
          - mystery
          - sci-fi
          - emotional
          - thriller
          - moral_dilemma
          - weird_facts
          - science_explained
          - history_gk
          - geography_gk
          - world_gk
          - myth_vs_fact
          - brain_puzzle
          - logic_puzzle
          - riddle
          - quick_quiz
          - psychology
          - money_business
          - tech_explained
          - india_gk
          - space_facts
          - nature_facts
          - human_body
          - inventions
          - spot_the_lie
          - two_truths_one_lie
          - guess_the_number
          - what_if
          - mini_case_study
          - ranked_countdown
          - current_news
          - trending_topics

permissions:
  contents: write

concurrency:
  group: astra-caption-production
  cancel-in-progress: false

jobs:
  story-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out ASTRA
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-caption-only.txt
            requirements-story-engine.txt

      - name: Restore local story model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: astra-qwen3-4b-q4km-bc640142c66e1fdd

      - name: Restore Kokoro voice model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/astra-voice
          key: astra-kokoro-onnx-v1-model-files-v1.1

      - name: Run model-free story quality tests
        run: python -m unittest tests.test_github_local_story_generator -v

      - name: Install CPU build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Install local model runtime
        env:
          CMAKE_ARGS: -DGGML_NATIVE=ON -DGGML_OPENMP=ON
          FORCE_CMAKE: "1"
        run: |
          python -m pip install --disable-pip-version-check -r requirements-story-engine.txt

      - name: Collect current news or trending sources
        if: inputs.lane == 'current_news' || inputs.lane == 'trending_topics'
        run: |
          python -m astra_v2.trend_source_collector \
            --direction "${{ inputs.lane }}" \
            --output output/sources.json

      - name: Generate original story locally on GitHub runner
        env:
          HF_HOME: /home/runner/.cache/huggingface
        run: |
          timeout --foreground --signal=TERM --kill-after=30s 12m python -m astra_v2.github_local_story_generator \
            --output output/candidate.json \
            --history data/story_history.jsonl \
            --lane "${{ inputs.lane }}" \
            --seed "${{ github.run_id }}" \
            ${{ (inputs.lane == 'current_news' || inputs.lane == 'trending_topics') && '--sources-file output/sources.json' || '' }}

      - name: Persist story fingerprint history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/story_history.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Record ASTRA generated story fingerprint"
            git push
          fi

      - name: Install caption renderer dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-caption-only.txt

      - name: Render narration and synchronized captions
        env:
          ASTRA_VOICE_CACHE: /home/runner/.cache/astra-voice
        run: |
          timeout --foreground --signal=TERM --kill-after=30s 8m python -m astra_v2.caption_short_pipeline \
            --candidate output/candidate.json \
            --output output/rayvan-short.mp4

      - name: Upload story, MP4 and review manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rayvan-local-story-short-${{ github.run_id }}
          path: |
            output/candidate.json
            output/sources.json
            output/rayvan-short.mp4
            output/rayvan-short.captions.json
            output/rayvan-short.review.json
          if-no-files-found: ignore
          retention-days: 7
