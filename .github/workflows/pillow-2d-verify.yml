name: Pillow 2D isolated verification
on:
  push:
    branches:
      - experiment/pillow-2d-optimized
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=10,<12'
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p 'test_pillow_2d_engine.py' -v
          python -m unittest discover -s tests -p 'test_motion_profiles.py' -v
          python -m unittest discover -s tests -p 'test_asset_library.py' -v
          python -m unittest discover -s tests -p 'test_world_library.py' -v
          python -m unittest discover -s tests -p 'test_world_renderer.py' -v
          python -m unittest discover -s tests -p 'test_item_renderer.py' -v
      - name: Install bundled FFmpeg (no apt)
        run: |
          python -m pip install 'imageio-ffmpeg>=0.5,<1'
          mkdir -p /tmp/astra-bin
          python -c "import imageio_ffmpeg, os; os.symlink(imageio_ffmpeg.get_ffmpeg_exe(), '/tmp/astra-bin/ffmpeg')"
          echo '/tmp/astra-bin' >> "$GITHUB_PATH"
          /tmp/astra-bin/ffmpeg -version | head -n 1
      - name: Render isolated MP4
        run: |
          mkdir -p /tmp/astra-pillow
          python -c "from experimental.pillow_2d_engine import render_mp4; render_mp4('/tmp/astra-pillow/preview.mp4',duration=3,fps=24)"
          test -s /tmp/astra-pillow/preview.mp4
          ffmpeg -hide_banner -i /tmp/astra-pillow/preview.mp4 -f null - 2>&1 | tail -n 8
      - name: Benchmark frame rendering
        run: |
          python -c "from experimental.benchmark_pillow_2d import benchmark; benchmark('/tmp/astra-pillow/benchmark.json')"
      - name: Render world contact sheet
        run: python -c "from experimental.world_renderer import contact_sheet; contact_sheet().save('world-contact-sheet.png')"
      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: pillow-2d-preview
          path: |
            /tmp/astra-pillow/preview.mp4
            /tmp/astra-pillow/benchmark.json
          retention-days: 3
