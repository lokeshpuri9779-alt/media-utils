name: ASTRA V2 read-only OAuth recovery check

on:
  push:
    branches: [astra-v2-oauth-recovery-20261008]

permissions:
  contents: read

jobs:
  test-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      REFRESH_MAIN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      REFRESH_FULL: ${{ secrets.YOUTUBE_FULL_REFRESH_TOKEN }}
      REFRESH_SECOND: ${{ secrets.YOUTUBE_REFRESH_TOKEN_2 }}
      REFRESH_THIRD: ${{ secrets.YOUTUBE_REFRESH_TOKEN_3 }}
      COMMUNITY_CLIENT_ID: ${{ secrets.YOUTUBE_COMMUNITY_CLIENT_ID }}
      COMMUNITY_CLIENT_SECRET: ${{ secrets.YOUTUBE_COMMUNITY_CLIENT_SECRET }}
      COMMUNITY_REFRESH: ${{ secrets.YOUTUBE_COMMUNITY_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Test OAuth aliases and authorized channel without uploading
        shell: bash
        run: |
          python - <<'PY'
          import json,os,urllib.request,urllib.parse,urllib.error
          expected=json.load(open('channels.json'))['channels']['rayvan']['expected_channel_id']
          options=[
            ('primary','REFRESH_MAIN','CLIENT_ID','CLIENT_SECRET'),
            ('full','REFRESH_FULL','CLIENT_ID','CLIENT_SECRET'),
            ('backup2','REFRESH_SECOND','CLIENT_ID','CLIENT_SECRET'),
            ('backup3','REFRESH_THIRD','CLIENT_ID','CLIENT_SECRET'),
            ('community','COMMUNITY_REFRESH','COMMUNITY_CLIENT_ID','COMMUNITY_CLIENT_SECRET'),
          ]
          for label,refresh,client,secret in options:
            if not all(os.environ.get(k) for k in (refresh,client,secret)):
              print('ASTRA_OAUTH_DIAGNOSTIC='+json.dumps({'alias':label,'status':'not_configured'}));continue
            data=urllib.parse.urlencode({
              'client_id':os.environ[client],'client_secret':os.environ[secret],
              'refresh_token':os.environ[refresh],'grant_type':'refresh_token'}).encode()
            try:
              req=urllib.request.Request('https://oauth2.googleapis.com/token',data=data,method='POST')
              with urllib.request.urlopen(req,timeout=25) as response: payload=json.load(response)
              access=payload['access_token']
              req=urllib.request.Request(
                'https://www.googleapis.com/youtube/v3/channels?part=id&mine=true',
                headers={'Authorization':'Bearer '+access})
              with urllib.request.urlopen(req,timeout=25) as response: channels=json.load(response)
              ids=[r.get('id') for r in channels.get('items') or []]
              state='authorized_rayvan' if ids==[expected] else 'other_channel_or_none'
              print('ASTRA_OAUTH_DIAGNOSTIC='+json.dumps({'alias':label,'status':state}))
            except urllib.error.HTTPError as exc:
              try:
                detail=json.loads(exc.read().decode('utf-8',errors='ignore'))
                raw=detail.get('error')
                reason=raw if isinstance(raw,str) else (raw or {}).get('status') or 'unknown'
              except Exception: reason='unparsed_http_failure'
              print('ASTRA_OAUTH_DIAGNOSTIC='+json.dumps({'alias':label,'status':'http_error','http':exc.code,'reason':str(reason)[:60]}))
            except Exception as exc:
              print('ASTRA_OAUTH_DIAGNOSTIC='+json.dumps({'alias':label,'status':type(exc).__name__}))
          PY
