          s=s.replace(
              '\tpulse_label.position = Vector2(14, 61)\n\thealth_panel.add_child(pulse_label)',
              '\tpulse_label.position = Vector2(14, 61)\n\thealth_panel.add_child(pulse_label)\n\n\tweapon_label = _make_label("1  ARC RIFLE", 15, Color(0.95, 0.88, 0.55))\n\tweapon_label.position = Vector2(14, 85)\n\thealth_panel.add_child(weapon_label)'
          )
          s=s.replace(
              'WASD MOVE  •  SHIFT SPRINT  •  RMB AIM  •  LMB FIRE  •  SPACE JUMP  •  Q PULSE  •  R RECOVER',
              'WASD MOVE  •  SHIFT SPRINT  •  RMB AIM  •  LMB FIRE  •  1/2/3 WEAPONS  •  Q PULSE  •  R RECOVER'
          )

          # More varied mid-campaign bosses.
          s=s.replace(
              'var is_final_boss := chapter == CHAPTERS.size() - 1 and encounter == encounter_total - 1',
              'var is_final_boss := chapter == CHAPTERS.size() - 1 and encounter == encounter_total - 1\n\tvar is_sector_boss := (chapter == 3 or chapter == 5) and encounter == encounter_total - 1'
          )
          s=s.replace(
              '\tif is_final_boss:\n',
              '\tif is_final_boss:\n'
          )
          s=s.replace(
              '\telse:\n\t\t_show_banner("ENCOUNTER %02d" % (encounter + 1), _encounter_subtitle(), 1.6)',
              '\telif is_sector_boss:\n\t\t_show_banner("SECTOR GUARDIAN", "PULSE-ENHANCED DEFENSE FRAME", 2.0)\n\t\tawait get_tree().create_timer(1.3).timeout\n\t\tfor i in range(3):\n\t\t\t_spawn_enemy("assault", i, i)\n\t\t_spawn_enemy("heavy", 3, 0)\n\telse:\n\t\t_show_banner("ENCOUNTER %02d" % (encounter + 1), _encounter_subtitle(), 1.6)'
          )

          # Update subtitles from 5 to 8 chapters.
          start=s.index('\tvar subtitles := [')
          end=s.index('\n\t]\n\treturn subtitles[chapter]', start)
          s=s[:start]+'''\tvar subtitles := [
          \t\t"CONTAINMENT HOSTILES DETECTED",
          \t\t"INDUSTRIAL DEFENSE GRID ACTIVE",
          \t\t"HABITATION SECURITY CORRUPTED",
          \t\t"PULSE-CORRUPTED UNITS INBOUND",
          \t\t"TRANSIT SPINE LOCKDOWN",
          \t\t"COMMAND SECURITY HAS LOCKED ON",
          \t\t"NULL CHAMBER REPLICATION ACTIVE",
          \t\t"CORE RESISTANCE ESCALATING",
          \t]'''+s[end+len('\n\t]'):]

          p.write_text(s)
          PY

          cat >> game/level/level.gd <<'GDSCRIPT'


          func _on_weapon_changed(weapon_name: String) -> void:
          	if weapon_label != null:
          		var number := 1
          		if weapon_name == "SCATTER CANNON":
          			number = 2
          		elif weapon_name == "RAIL LANCE":
          			number = 3
          		weapon_label.text = "%d  %s" % [number, weapon_name]


          func _on_boss_phase_changed(phase: int) -> void:
          	if phase == 2:
          		_show_banner("WARDEN PHASE II", "ARMOR FAILURE  //  FIRE RATE INCREASED", 1.5)
          	elif phase == 3:
          		_show_banner("WARDEN PHASE III", "CORE EXPOSED  //  MAXIMUM AGGRESSION", 1.5)


          func _apply_sector_theme() -> void:
          	var env := world_environment.environment
          	var ambient_colors := [
          		Color(0.16, 0.22, 0.34),
          		Color(0.30, 0.19, 0.10),
          		Color(0.12, 0.22, 0.18),
          		Color(0.22, 0.10, 0.28),
          		Color(0.08, 0.18, 0.28),
          		Color(0.24, 0.12, 0.10),
          		Color(0.10, 0.05, 0.18),
          		Color(0.06, 0.12, 0.25),
          	]
          	var fog_colors := [
          		Color(0.06, 0.12, 0.20),
          		Color(0.18, 0.09, 0.035),
          		Color(0.05, 0.12, 0.09),
          		Color(0.13, 0.04, 0.16),
          		Color(0.035, 0.10, 0.17),
          		Color(0.15, 0.055, 0.035),
          		Color(0.055, 0.02, 0.09),
          		Color(0.025, 0.07, 0.15),
          	]
          	env.ambient_light_color = ambient_colors[chapter]
          	env.ambient_light_energy = 0.72 + float(chapter % 3) * 0.10
          	env.fog_enabled = true
          	env.fog_light_color = fog_colors[chapter]
          	env.fog_density = 0.008 + float(chapter % 4) * 0.0025


          func _dress_sector() -> void:
          	if chapter_setdress != null:
          		chapter_setdress.queue_free()
          	chapter_setdress = Node3D.new()
          	chapter_setdress.name = "ChapterSetDress"
          	add_child(chapter_setdress)

          	var sets = [
          		[
          			"res://assets/kenney/modular-space/cables.glb",
          			"res://assets/kenney/modular-space/gate-door.glb",
          			"res://assets/kenney/modular-space/corridor-transition.glb",
          		],
          		[
          			"res://assets/kenney/factory/conveyor.glb",
          			"res://assets/kenney/factory/machine.glb",
          			"res://assets/kenney/factory/box-large.glb",
          		],
          		[
          			"res://assets/kenney/space-station/bed-single.glb",
          			"res://assets/kenney/space-station/chair.glb",
          			"res://assets/kenney/space-station/table.glb",
          		],
          		[
          			"res://assets/kenney/space-station/computer-wide.glb",
          			"res://assets/kenney/space-station/table-display.glb",
          			"res://assets/kenney/space-station/display-wall.glb",
          		],
          		[
          			"res://assets/kenney/modular-space/corridor-wide.glb",
          			"res://assets/kenney/modular-space/gate-lasers.glb",
          			"res://assets/kenney/modular-space/cables.glb",
          		],
          		[
          			"res://assets/kenney/space-station/computer-system.glb",
          			"res://assets/kenney/space-station/chair-armrest-headrest.glb",
          			"res://assets/kenney/space-station/wall-switch.glb",
          		],
          		[
          			"res://assets/kenney/modular-space/gate-lasers.glb",
          			"res://assets/kenney/factory/pipe-glass-large.glb",
          			"res://assets/kenney/factory/machine-fortified.glb",
          		],
          		[
          			"res://assets/kenney/modular-space/corridor-wide-intersection.glb",
          			"res://assets/kenney/modular-space/gate-door-window.glb",
          			"res://assets/kenney/space-station/table-display-planet.glb",
          		],
          	]
          	var checkpoint := _get_chapter_checkpoint(chapter).origin
          	var models: Array = sets[chapter]
          	for i in range(12):
          		var path: String = str(models[i % models.size()])
          		var packed: PackedScene = load(path) as PackedScene
          		if packed == null:
          			continue
          		var prop: Node3D = packed.instantiate() as Node3D
          		var angle := float(i) / 12.0 * TAU
          		var radius := 5.0 + float((i * 3) % 5) * 1.8
          		prop.position = checkpoint + Vector3(cos(angle) * radius, 0.15, sin(angle) * radius)
          		prop.rotation.y = -angle + PI * 0.5
          		prop.scale = Vector3.ONE * (0.75 + float(i % 3) * 0.12)
          		chapter_setdress.add_child(prop)
          GDSCRIPT

          cat >> game/COMMERCIAL_CONTENT_NOTES.txt <<'EOF'
          PULSEFALL BLACKSITE commercial campaign alpha adds:
          - 8 story chapters.
          - 35+ authored combat encounters.
          - Three player weapon profiles with staged campaign unlocks.
          - Sector-specific lighting/fog art direction.
          - CC0 Kenney modular-space, factory and space-station set dressing.
          - Mid-campaign guardian fights and a three-phase Omega Warden.
          - Persistent save/continue, anti-stuck checkpoints, three endings.
          - Automated GdUnit4, runtime soak, Windows export and installer validation.

          This remains an alpha content build. External human playtesting, final VO,
          bespoke character/boss art and store certification are still release gates.
          EOF

