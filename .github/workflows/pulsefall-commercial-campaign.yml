      - name: GdUnit4 commercial-readiness tests
        uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          godot-version: '4.7.2'
          project_dir: './game'
          paths: 'res://tests'
          timeout: 10
          retries: 1
          warnings-as-errors: false
          publish-report: false
          upload-report: true
          report-name: pulsefall-gdunit-report.xml

      - name: Strip test framework from release payload
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf game/addons/gdUnit4 game/tests game/reports game/.gdunit4
          python3 - <<'PY'
          from pathlib import Path
          p=Path("game/project.godot")
          s=p.read_text()
          if "[editor_plugins]" in s:
              start=s.index("[editor_plugins]")
              next_section=s.find("\n[", start+1)
              if next_section == -1:
                  s=s[:start].rstrip()+"\n"
              else:
                  s=s[:start]+s[next_section+1:]
          p.write_text(s)
          PY

      - name: Runtime and script validation
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          wget -q "$GODOT_URL" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -type f -name 'Godot*_linux.x86_64' | head -n1)"
          chmod +x "$GODOT"
          set +e
          "$GODOT" --headless --audio-driver Dummy --path game --editor --quit-after 120 > /tmp/import.log 2>&1
          IMPORT_RC=$?
          "$GODOT" --headless --audio-driver Dummy --path game res://main/main.tscn --quit-after 180 > /tmp/menu-runtime.log 2>&1
          MENU_RC=$?
          "$GODOT" --headless --audio-driver Dummy --path game res://level/level.tscn --quit-after 900 > /tmp/runtime.log 2>&1
          RUN_RC=$?
          set -e
          cat /tmp/import.log
          cat /tmp/menu-runtime.log
          cat /tmp/runtime.log
          if grep -Eiq 'SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|nonexistent function|Failed to load script' /tmp/import.log /tmp/menu-runtime.log /tmp/runtime.log; then
            echo "PULSEFALL validation detected a script/runtime failure."
            exit 1
          fi
          if [ "$IMPORT_RC" -ne 0 ] || [ "$MENU_RC" -ne 0 ] || [ "$RUN_RC" -ne 0 ]; then
            echo "Godot validation exit codes: import=$IMPORT_RC menu=$MENU_RC runtime=$RUN_RC"
            exit 1
          fi

      - name: Export Windows 64-bit
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./game
          export_debug: false
          use_preset_export_path: true
          presets_to_export: Windows Desktop
          verbose: false
          cache: false

      - name: Package premium build
        shell: bash
        run: |
          set -euxo pipefail
          EXE="$(find game -type f -name 'PULSEFALL_BLACKSITE.exe' | head -n1)"
          if [ -z "$EXE" ]; then
            EXE="$(find "$HOME/.local/share/godot/builds" -type f -name 'PULSEFALL_BLACKSITE.exe' | head -n1)"
          fi
          test -n "$EXE"
          mkdir -p artifact/PULSEFALL_BLACKSITE
          cp "$EXE" artifact/PULSEFALL_BLACKSITE/PULSEFALL_BLACKSITE.exe
          cp game/PULSEFALL_README.txt artifact/PULSEFALL_BLACKSITE/
          cp game/THIRD_PARTY_NOTICES.txt artifact/PULSEFALL_BLACKSITE/
          cp game/LICENSE.md artifact/PULSEFALL_BLACKSITE/GODOT_TPS_LICENSE.md
          cp game/PLAYTEST_GUIDE.txt artifact/PULSEFALL_BLACKSITE/
          cp game/PRIVACY_NOTICE.txt artifact/PULSEFALL_BLACKSITE/
          cp game/SUPPORT.txt artifact/PULSEFALL_BLACKSITE/
          cp game/COMMERCIAL_CONTENT_NOTES.txt artifact/PULSEFALL_BLACKSITE/
          sha256sum artifact/PULSEFALL_BLACKSITE/PULSEFALL_BLACKSITE.exe > artifact/PULSEFALL_BLACKSITE/SHA256.txt
          (cd artifact && zip -9 -r PULSEFALL_BLACKSITE_COMMERCIAL_ALPHA_WINDOWS_64BIT.zip PULSEFALL_BLACKSITE)
          ls -lh artifact/PULSEFALL_BLACKSITE_COMMERCIAL_ALPHA_WINDOWS_64BIT.zip artifact/PULSEFALL_BLACKSITE/PULSEFALL_BLACKSITE.exe

      - name: Build Windows installer
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis
          pushd artifact
          cat > pulsefall.nsi <<'NSIS'
          Unicode True
          Name "PULSEFALL BLACKSITE"
          OutFile "PULSEFALL_BLACKSITE_COMMERCIAL_ALPHA_SETUP.exe"
          InstallDir "$LOCALAPPDATA\Programs\PULSEFALL BLACKSITE"
          RequestExecutionLevel user
          SetCompressor /SOLID lzma

          VIProductVersion "0.10.0.0"
          VIAddVersionKey "ProductName" "PULSEFALL BLACKSITE"
          VIAddVersionKey "FileDescription" "PULSEFALL BLACKSITE Production RC Installer"
          VIAddVersionKey "FileVersion" "0.10.0"
          VIAddVersionKey "ProductVersion" "0.10.0 Campaign RC1"

          Page directory
          Page instfiles
          UninstPage uninstConfirm
          UninstPage instfiles

          Section "PULSEFALL BLACKSITE"
            SetOutPath "$INSTDIR"
            File "PULSEFALL_BLACKSITE/PULSEFALL_BLACKSITE.exe"
            File "PULSEFALL_BLACKSITE/PULSEFALL_README.txt"
            File "PULSEFALL_BLACKSITE/PLAYTEST_GUIDE.txt"
            File "PULSEFALL_BLACKSITE/PRIVACY_NOTICE.txt"
            File "PULSEFALL_BLACKSITE/SUPPORT.txt"
            File "PULSEFALL_BLACKSITE/THIRD_PARTY_NOTICES.txt"
            File "PULSEFALL_BLACKSITE/GODOT_TPS_LICENSE.md"
            WriteUninstaller "$INSTDIR\Uninstall.exe"

            CreateDirectory "$SMPROGRAMS\PULSEFALL BLACKSITE"
            CreateShortcut "$SMPROGRAMS\PULSEFALL BLACKSITE\PULSEFALL BLACKSITE.lnk" "$INSTDIR\PULSEFALL_BLACKSITE.exe"
            CreateShortcut "$SMPROGRAMS\PULSEFALL BLACKSITE\Uninstall.lnk" "$INSTDIR\Uninstall.exe"
            CreateShortcut "$DESKTOP\PULSEFALL BLACKSITE.lnk" "$INSTDIR\PULSEFALL_BLACKSITE.exe"

            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PULSEFALL_BLACKSITE" "DisplayName" "PULSEFALL BLACKSITE"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PULSEFALL_BLACKSITE" "DisplayVersion" "0.10.0 Campaign RC1"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PULSEFALL_BLACKSITE" "Publisher" "PULSEFALL"
            WriteRegStr HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PULSEFALL_BLACKSITE" "UninstallString" "$\"$INSTDIR\Uninstall.exe$\""
            WriteRegDWORD HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PULSEFALL_BLACKSITE" "NoModify" 1
            WriteRegDWORD HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PULSEFALL_BLACKSITE" "NoRepair" 1
          SectionEnd

          Section "Uninstall"
            Delete "$DESKTOP\PULSEFALL BLACKSITE.lnk"
            Delete "$SMPROGRAMS\PULSEFALL BLACKSITE\PULSEFALL BLACKSITE.lnk"
            Delete "$SMPROGRAMS\PULSEFALL BLACKSITE\Uninstall.lnk"
            RMDir "$SMPROGRAMS\PULSEFALL BLACKSITE"
            Delete "$INSTDIR\PULSEFALL_BLACKSITE.exe"
            Delete "$INSTDIR\PULSEFALL_README.txt"
            Delete "$INSTDIR\PLAYTEST_GUIDE.txt"
            Delete "$INSTDIR\PRIVACY_NOTICE.txt"
            Delete "$INSTDIR\SUPPORT.txt"
            Delete "$INSTDIR\THIRD_PARTY_NOTICES.txt"
            Delete "$INSTDIR\GODOT_TPS_LICENSE.md"
            Delete "$INSTDIR\Uninstall.exe"
            RMDir "$INSTDIR"
            DeleteRegKey HKCU "Software\Microsoft\Windows\CurrentVersion\Uninstall\PULSEFALL_BLACKSITE"
          SectionEnd
          NSIS
          makensis pulsefall.nsi
          sha256sum PULSEFALL_BLACKSITE_COMMERCIAL_ALPHA_SETUP.exe > PULSEFALL_BLACKSITE_COMMERCIAL_ALPHA_SETUP_SHA256.txt
          ls -lh PULSEFALL_BLACKSITE_COMMERCIAL_ALPHA_SETUP.exe
          rm -f pulsefall.nsi
          popd

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PULSEFALL_BLACKSITE_COMMERCIAL_ALPHA
          path: |
            artifact/PULSEFALL_BLACKSITE_COMMERCIAL_ALPHA_WINDOWS_64BIT.zip
            artifact/PULSEFALL_BLACKSITE_COMMERCIAL_ALPHA_SETUP.exe
            artifact/PULSEFALL_BLACKSITE_COMMERCIAL_ALPHA_SETUP_SHA256.txt
          if-no-files-found: error
          retention-days: 7
