          		hit()
          	_update_boss_phase()


          func _update_boss_phase() -> void:
          	if not bool(get_meta("elite", false)) or dead:
          		return
          	var new_phase := boss_phase
          	if health <= 12:
          		new_phase = 3
          	elif health <= 26:
