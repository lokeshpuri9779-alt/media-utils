          PY

          cat >> game/player/player.gd <<'GDSCRIPT'


          func set_weapon_unlock(max_index: int) -> void:
          	unlocked_weapon_max = clampi(max_index, 0, WEAPONS.size() - 1)
          	if weapon_index > unlocked_weapon_max:
          		weapon_index = unlocked_weapon_max
          	weapon_changed.emit(get_weapon_display_name())


          func select_weapon(index: int) -> void:
          	if index < 0 or index > unlocked_weapon_max or index >= WEAPONS.size():
          		return
          	weapon_index = index
          	weapon_changed.emit(get_weapon_display_name())


          func get_weapon_display_name() -> String:
          	return str(WEAPONS[weapon_index]["name"])


          func _fire_current_weapon(shoot_origin: Vector3, shoot_dir: Vector3) -> void:
          	var profile: Dictionary = WEAPONS[weapon_index]
          	fire_cooldown.wait_time = float(profile["cooldown"])
          	var pellets := int(profile["pellets"])
          	var spread := float(profile["spread"])
          	for _pellet in range(pellets):
          		var dir := shoot_dir
          		if spread > 0.0:
          			dir = Vector3(
          				dir.x + randf_range(-spread, spread),
          				dir.y + randf_range(-spread, spread),
          				dir.z + randf_range(-spread, spread)
          			).normalized()
          		var bullet: CharacterBody3D = preload("res://player/bullet/bullet.tscn").instantiate()
          		bullet.damage = int(profile["damage"])
          		bullet.speed = float(profile["speed"])
          		get_parent().add_child(bullet, true)
          		bullet.global_transform.origin = shoot_origin
          		bullet.look_at(shoot_origin + dir)
          		bullet.add_collision_exception_with(self)
