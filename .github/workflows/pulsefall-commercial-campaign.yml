          	{"name": "RAIL LANCE", "damage": 8, "pellets": 1, "cooldown": 1.12, "speed": 58.0, "spread": 0.001},
          ]
          '''
          )
          old='''\t\tif player_input.shooting and fire_cooldown.time_left == 0:
