name: ASTRA - Story Proposal Performance Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'astra_v2/proposal_performance_benchmark.py'
      - 'astra_v2/story_editorial.py'
      - 'astra_v2/proposal_novelty_index.py'
      - 'astra_v2/semantic_candidate_index.py'
      - 'astra_v2/semantic_index_benchmark.py'
      - 'astra_v2/triage_index_benchmark.py'
      - 'astra_v2/triage_audit_benchmark.py'
      - '.github/workflows/astra-proposal-benchmark.yml'

permissions:
  contents: read

concurrency:
  group: astra-proposal-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Benchmark cached proposal pipeline without publishing
        run: |
          python -m astra_v2.proposal_performance_benchmark --count 100 | tee proposal-benchmark.json
          python -m astra_v2.proposal_performance_benchmark --count 500 | tee proposal-benchmark-500.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path("proposal-benchmark.json").read_text())
          assert data["publication_enabled"] is False
          assert data["count"] == 100
          larger = json.loads(Path("proposal-benchmark-500.json").read_text())
          assert larger["count"] == 500 and larger["publication_enabled"] is False
          lines = [
              "## ASTRA proposal benchmark (100 deterministic candidates)",
              "",
              "| Stage | Seconds |",
              "|---|---:|",
              f"| Generation | {data['generation_seconds']} |",
              f"| Editorial triage | {data['triage_seconds']} |",
              f"| Cached audit | {data['audit_seconds']} |",
              "",
              "",
              "## ASTRA proposal benchmark (500 deterministic candidates)",
              "",
              "| Stage | Seconds |",
              "|---|---:|",
              f"| Generation | {larger['generation_seconds']} |",
              f"| Editorial triage | {larger['triage_seconds']} |",
              f"| Cached audit | {larger['audit_seconds']} |",
              "",
              "Benchmark only: no story publication or production approval.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          PY
      - name: Compare indexed and exhaustive semantic matching
        run: |
          python -m astra_v2.semantic_index_benchmark --count 500 --probes 100 | tee semantic-index-benchmark.json
          python -m astra_v2.semantic_index_benchmark --count 1500 --probes 100 | tee semantic-index-benchmark-1500.json
      - name: Compare full indexed editorial triage with reference
        run: |
          python -m astra_v2.triage_index_benchmark --count 100 --history-count 100 | tee triage-index-benchmark-100.json
          python -m astra_v2.triage_index_benchmark --count 500 --history-count 100 | tee triage-index-benchmark-500.json
      - name: Benchmark production triage and audit on bounded real inventory
        run: |
          git fetch --depth=1 origin astra-state
          mkdir -p runtime-health
          if git cat-file -e origin/astra-state:runtime-health/story_proposals.json 2>/dev/null; then
            git show origin/astra-state:runtime-health/story_proposals.json > runtime-health/story_proposals.json
          fi
          if [ -f runtime-health/story_proposals.json ]; then
            python -m astra_v2.triage_audit_benchmark --sample 100 | tee triage-audit-real-100.json
          else
            echo 'No durable ledger restored in benchmark workflow; skip real-inventory benchmark.'
          fi
      - name: Upload benchmark measurements
        uses: actions/upload-artifact@v4
        with:
          name: astra-proposal-benchmark
          path: |
            proposal-benchmark.json
            proposal-benchmark-500.json
            semantic-index-benchmark.json
            semantic-index-benchmark-1500.json
            triage-index-benchmark-100.json
            triage-index-benchmark-500.json
            triage-audit-real-100.json
          if-no-files-found: error
          retention-days: 30
