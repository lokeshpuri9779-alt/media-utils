name: ASTRA Approved Caption Short Review Render

on:
  workflow_dispatch:
    inputs:
      generation_run_id:
        description: Successful ASTRA Caption Short Review Generation run ID
        required: true
        type: string
      candidate_id:
        description: Exact candidate_id from the review packet
        required: true
        type: string
      review_decision:
        description: Explicit human decision for a review render only
        required: true
        type: choice
        options:
          - reject
          - approve_for_review_render
      reviewer_attestation:
        description: Brief confirmation that the candidate and packet were inspected
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: astra-approved-caption-review-render
  cancel-in-progress: false

jobs:
  review-decision:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Record rejection without rendering
        if: inputs.review_decision == 'reject'
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          ATTESTATION: ${{ inputs.reviewer_attestation }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          candidate_id = os.environ["CANDIDATE_ID"].strip()
          attestation = os.environ["ATTESTATION"].strip()
          if not candidate_id or len(attestation) < 12:
              raise SystemExit("Candidate ID and a meaningful reviewer attestation are required")
          Path("output").mkdir(exist_ok=True)
          Path("output/review-decision.json").write_text(json.dumps({
              "decision": "rejected",
              "candidate_id": candidate_id,
              "reviewer": os.environ.get("GITHUB_ACTOR", ""),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "attestation": attestation,
              "rendered": False,
              "published": False
          }, indent=2) + chr(10))
          PY

      - name: Upload rejection receipt
        if: inputs.review_decision == 'reject'
        uses: actions/upload-artifact@v4
        with:
          name: rayvan-caption-review-decision-${{ github.run_id }}
          path: output/review-decision.json
          if-no-files-found: error
          retention-days: 30

      - name: Check out ASTRA
        if: inputs.review_decision == 'approve_for_review_render'
        uses: actions/checkout@v4

      - name: Set up Python
        if: inputs.review_decision == 'approve_for_review_render'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-caption-only.txt

      - name: Download the exact generation-run artifact
        if: inputs.review_decision == 'approve_for_review_render'
        uses: actions/download-artifact@v4
        with:
          name: rayvan-caption-short-review-${{ inputs.generation_run_id }}
          run-id: ${{ inputs.generation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: review-input

      - name: Verify reviewer decision, candidate identity and packet hash
        if: inputs.review_decision == 'approve_for_review_render'
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          ATTESTATION: ${{ inputs.reviewer_attestation }}
          GENERATION_RUN_ID: ${{ inputs.generation_run_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          run_id = os.environ["GENERATION_RUN_ID"].strip()
          candidate_id = os.environ["CANDIDATE_ID"].strip()
          attestation = os.environ["ATTESTATION"].strip()
          if not run_id.isdigit() or not candidate_id or len(attestation) < 12:
              raise SystemExit("A valid generation run ID, candidate ID and reviewer attestation are required")
          root = Path("review-input")
          candidate = json.loads((root / "candidate.json").read_text(encoding="utf-8"))
          packet = json.loads((root / "review-packet.json").read_text(encoding="utf-8"))
          queue = json.loads((root / "review-queue.json").read_text(encoding="utf-8"))
          if candidate.get("content_id") != candidate_id:
              raise SystemExit("Candidate ID does not match the downloaded generation artifact")
          for key in ("approved", "production_ready", "eligible_for_automatic_publishing", "published"):
              if candidate.get(key) is not False:
                  raise SystemExit("Candidate must remain explicitly unapproved: " + key)
          if packet.get("approved_count") != 0 or packet.get("rendering_triggered") is not False or packet.get("publication_triggered") is not False:
              raise SystemExit("Review packet is not review-only")
          if queue.get("approved_count") != 0 or queue.get("rendering_triggered") is not False or queue.get("publication_triggered") is not False:
              raise SystemExit("Review queue is not review-only")
          if queue.get("count") != 1 or len(queue.get("candidates", [])) != 1:
              raise SystemExit("Expected exactly one candidate in the review queue")
          canonical = json.dumps(candidate, sort_keys=True, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
          digest = hashlib.sha256(canonical).hexdigest()
          packet_items = [x for x in packet.get("candidates", []) if x.get("candidate_id") == candidate_id]
          queue_items = [x for x in queue.get("candidates", []) if x.get("candidate_id") == candidate_id]
          if len(packet_items) != 1 or packet_items[0].get("source_sha256") != digest:
              raise SystemExit("Candidate does not match the review packet hash")
          if len(queue_items) != 1 or queue_items[0].get("source_sha256") != digest:
              raise SystemExit("Candidate does not match the review queue hash")
          if packet_items[0].get("decision") != "not_approved" or packet_items[0].get("approved") is not False:
              raise SystemExit("Editorial packet must remain unapproved")
          Path("output").mkdir(exist_ok=True)
          Path("output/review-decision.json").write_text(json.dumps({
              "decision": "approve_for_review_render",
              "candidate_id": candidate_id,
              "candidate_sha256": digest,
              "generation_run_id": run_id,
              "reviewer": os.environ.get("GITHUB_ACTOR", ""),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "attestation": attestation,
              "production_approved": False,
              "published": False
          }, indent=2) + chr(10), encoding="utf-8")
          print("Human review-render authorization verified; production approval remains false.")
          PY

      - name: Install caption-only dependencies
        if: inputs.review_decision == 'approve_for_review_render'
        run: python -m pip install --disable-pip-version-check -r requirements-caption-only.txt

      - name: Restore Kokoro voice model cache
        if: inputs.review_decision == 'approve_for_review_render'
        uses: actions/cache@v4
        with:
          path: ~/.cache/astra-voice
          key: astra-kokoro-onnx-v1-model-files-v1.1

      - name: Render caption-only MP4 for visual review
        if: inputs.review_decision == 'approve_for_review_render'
        env:
          ASTRA_VOICE_CACHE: /home/runner/.cache/astra-voice
        run: |
          python -m astra_v2.caption_short_pipeline --candidate review-input/candidate.json --output output/rayvan-short.mp4 --voice af_heart --speed 1.04

      - name: Upload review MP4, captions and decision receipt
        if: inputs.review_decision == 'approve_for_review_render' && always()
        uses: actions/upload-artifact@v4
        with:
          name: rayvan-caption-short-approved-review-${{ github.run_id }}
          path: |
            output/rayvan-short.mp4
            output/rayvan-short.captions.json
            output/rayvan-short.review.json
            output/review-decision.json
          if-no-files-found: error
          retention-days: 14
