name: ASTRA V2 - Verified YouTube Publisher

# One publishing workflow. Development CI and legacy schedulers remain disabled.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/astra-v2-publish.yml', 'astra_v2/preload_queue.py', 'astra_v2/run.py', 'astra_v2/creative.py', 'astra_v2/omniroute_gemini.py', 'astra_v2/omniroute.py', 'astra_v2/preflight.py', 'astra_v2/story_forge.py', 'tests/test_astra_story_inventory.py']
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ['ASTRA V2 - Preload Approved Videos', 'ASTRA V2 - Long-form Preload']
    types: [completed]

concurrency:
  group: astra-v2-publishing
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    # Allow dependency fallback, verified render and YouTube upload to finish.
    # No extra runs are scheduled; concurrency remains unchanged.
    timeout-minutes: 30
    env:
      ASTRA_CHANNEL: rayvan
      ASTRA_UNIFIED_STORY_ENGINE: '1' # One Studio renderer for directed, solo, duo and ensemble scenes; fail closed
      ASTRA_MADE_FOR_KIDS: '0' # General-audience originals; explicitly child-directed candidates must override
      ASTRA_LONG_ENABLED: '0' # Shorts-first recovery: long-form remains isolated in its own workflow
      ASTRA_PRELOAD_ENABLED: '1'
      ASTRA_REQUIRE_STUDIO_PRELOAD: '1' # Prefer verified Studio artifacts; retain fresh-render fallback
      ASTRA_MIN_STUDIO_VERSION: '7.3.1' # Reject older Shorts preloads; keep fresh-render fallback
      ASTRA_PRELOAD_MAX_AGE_HOURS: '48' # Skip old rendered visuals; render fresh when queue is stale
      ASTRA_PRELOAD_ONLY: '0'
      ASTRA_SERIES_PUBLICATION: '0' # Allow new approved originals after completed Season 1
      ASTRA_OMNIROUTE_ORDER: ${{ vars.ASTRA_OMNIROUTE_ORDER || 'gemini,groq,openrouter,nvidia' }}
      ASTRA_GEMINI_ENABLED: '1'
      ASTRA_AUTONOMOUS_EDITORIAL: '1' # Independent reviewer + hash-bound production intake; fail closed
      ASTRA_GROQ_ENABLED: ${{ vars.ASTRA_GROQ_ENABLED || '0' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ASTRA_GROQ_MODEL: 'llama-3.3-70b-versatile'
      ASTRA_OPENROUTER_ENABLED: ${{ vars.ASTRA_OPENROUTER_ENABLED || '0' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      ASTRA_NVIDIA_ENABLED: ${{ vars.ASTRA_NVIDIA_ENABLED || '0' }}
      ASTRA_NVIDIA_FREE_CONFIRMED: ${{ vars.ASTRA_NVIDIA_FREE_CONFIRMED || '0' }}
      ASTRA_NVIDIA_MODEL: ${{ vars.ASTRA_NVIDIA_MODEL || '' }}
      ASTRA_OPENROUTER_MODEL: 'openrouter/free'
      ASTRA_GEMINI_MODEL: 'gemini-3.1-flash-lite'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ASTRA_OPENAI_ENABLED: '0'
      ASTRA_OPENAI_ALLOW_PAID_API: '0'
      GH_TOKEN: ${{ github.token }}
      ASTRA_MAX_DAILY_UPLOADS: '100'
      ASTRA_MIN_UPLOAD_INTERVAL_MINUTES: '5'
      ORT_DISABLE_TELEMETRY: '1'
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_COMMUNITY_CLIENT_ID: ${{ secrets.YOUTUBE_COMMUNITY_CLIENT_ID }}
      YOUTUBE_COMMUNITY_CLIENT_SECRET: ${{ secrets.YOUTUBE_COMMUNITY_CLIENT_SECRET }}
      YOUTUBE_COMMUNITY_REFRESH_TOKEN: ${{ secrets.YOUTUBE_COMMUNITY_REFRESH_TOKEN }}
      YOUTUBE_FULL_REFRESH_TOKEN: ${{ secrets.YOUTUBE_FULL_REFRESH_TOKEN }}
      YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Restore existing creative learning and V2 journal
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin astra-state
          for f in performance.json astra_v2_state.json astra_stage_feedback.json SHORTS.md; do
            git checkout origin/astra-state -- "$f" 2>/dev/null || true
          done
          # Restore the latest AI editorial evidence as an inseparable pair.
          # Approval remains subject to current hash and publication-history gates.
          for f in ai-reviewed-stories.json ai-reviewed-decisions.json ai-editorial-reviews.json; do
            git checkout origin/astra-state -- "$f" 2>/dev/null || true
          done
          if [ -f ai-reviewed-stories.json ] && [ -f ai-reviewed-decisions.json ]; then
            mkdir -p runtime-health
            cp ai-reviewed-stories.json runtime-health/ai-reviewed-stories.json
            cp ai-reviewed-decisions.json runtime-health/ai-reviewed-decisions.json
          fi
          if [ -f ai-editorial-reviews.json ]; then
            mkdir -p runtime-health
            cp ai-editorial-reviews.json runtime-health/ai-editorial-reviews.json
          fi
          # Optional character continuity snapshot; no new state is invented.
          git checkout origin/astra-state -- character-continuity.json 2>/dev/null || true
          # Preserve real story fingerprints when available; never synthesize an
          # empty history from the publisher's content-ID-only journal.
          if git cat-file -e origin/astra-state:astra_story_history.json 2>/dev/null; then
            git show origin/astra-state:astra_story_history.json > astra_story_history.json
            echo 'ASTRA_STORY_HISTORY_RESTORE=present'
          else
            rm -f astra_story_history.json
            echo 'ASTRA_STORY_HISTORY_RESTORE=missing'
          fi
          # The legacy state branch previously contained a zero-byte performance
          # file. Restore the last valid main-branch snapshot instead of erasing
          # the learning history on every scheduler invocation.
          if ! python - <<'PY'
          import json
          from pathlib import Path
          p=Path('performance.json')
          try:
              d=json.loads(p.read_text(encoding='utf-8'))
              assert isinstance(d,dict) and isinstance(d.get('videos'),dict) and d['videos']
          except Exception:
              raise SystemExit(1)
          PY
          then
            echo 'State branch had missing/invalid learning history; recovering main snapshot.'
            git show HEAD:performance.json > performance.json
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/astra-voice
            ~/.cache/huggingface
            asset_cache
          key: astra-v2-media-cache-v1
          restore-keys: astra-v2-media-cache-

      - name: Install lightweight publisher diagnostic dependencies
        # The early inventory tests import Studio's renderer eligibility path,
        # including Pillow, NumPy and imageio-ffmpeg. Install the minimal pinned
        # subset BEFORE those tests, even when no video render is due.
        # The full rendering stack is still installed only after preflight.
        run: |
          python -m pip install --disable-pip-version-check \
            'httpx==0.28.1' 'Pillow==11.3.0' \
            'numpy==2.2.6' 'imageio-ffmpeg==0.6.0'
          python -c "import httpx, PIL, numpy, imageio_ffmpeg; print('ASTRA_EARLY_IMPORTS=ready')"

      - name: Test queue and OAuth diagnostics
        id: early_tests
        env:
          ASTRA_REQUIRE_STUDIO_PRELOAD: '0'
        run: |
          python -m unittest discover -s tests -p 'test_astra_youtube_oauth_errors.py' -v
          python -m unittest discover -s tests -p 'test_astra_story_inventory.py' -v
          python -m unittest discover -s tests -p 'test_astra_preload_artifact_pagination.py' -v
          python -m unittest discover -s tests -p 'test_astra_renderer_provenance.py' -v

      - name: Reconcile pending uploads and check schedule
        id: preflight
        run: python -m astra_v2.preflight

      - name: Configure fast pinned-package installer
        if: steps.preflight.outputs.render_due == 'true'
        uses: astral-sh/setup-uv@v6
        continue-on-error: true
        with:
          enable-cache: true

      - name: Install free rendering dependencies
        id: dependencies
        if: steps.preflight.outputs.render_due == 'true'
        run: |
          # Preserve the lightweight preflight path. Only install the full
          # pinned stack when the publisher actually needs to render.
          if command -v uv >/dev/null 2>&1 && timeout 240s uv pip install --system -r requirements.txt; then
            echo 'ASTRA_INSTALL_MODE=uv'
          else
            echo 'ASTRA_UV_FALLBACK=legacy-pip'
            timeout 360s python -m pip install --disable-pip-version-check -r requirements.txt
            echo 'ASTRA_INSTALL_MODE=pip-fallback'
          fi
          # Use the wheel-bundled encoder without relying on slow Ubuntu mirrors.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            python - <<'PY'
          import imageio_ffmpeg
          from pathlib import Path
          import os
          binary = Path(imageio_ffmpeg.get_ffmpeg_exe())
          assert binary.is_file() and os.access(binary, os.X_OK)
          target = Path(os.environ["RUNNER_TEMP"]) / "ffmpeg"
          if not target.exists():
              target.symlink_to(binary)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as out:
              out.write(str(target.parent) + "\n")
          print("ASTRA_FFMPEG_SOURCE=imageio-ffmpeg")
          PY
            export PATH="$RUNNER_TEMP:$PATH"
          fi
          # Only ffprobe is missing. A partial apt download must not abort
          # the step before the already-configured static fallback can run.
          # Every candidate probe is runtime-checked before being used.
          if ! command -v ffprobe >/dev/null 2>&1; then
            echo 'ASTRA_FFPROBE_MISSING=1'
            timeout 45s sudo apt-get update -qq -o Acquire::Retries=0 || true
            timeout 60s apt-get download ffmpeg || true
            probe_package="$(find . -maxdepth 1 -name 'ffmpeg_*.deb' -print -quit)"
            if [ -n "$probe_package" ]; then
              mkdir -p "$RUNNER_TEMP/astra-ffmpeg"
              if ! dpkg-deb -x "$probe_package" "$RUNNER_TEMP/astra-ffmpeg"; then
                echo 'ASTRA_FFPROBE_DEB_EXTRACT_FAILED=1'
              fi
            fi
            if [ -x "$RUNNER_TEMP/astra-ffmpeg/usr/bin/ffprobe" ] && \
               "$RUNNER_TEMP/astra-ffmpeg/usr/bin/ffprobe" -version >/dev/null 2>&1; then
              echo "$RUNNER_TEMP/astra-ffmpeg/usr/bin" >> "$GITHUB_PATH"
              export PATH="$RUNNER_TEMP/astra-ffmpeg/usr/bin:$PATH"
              echo 'ASTRA_FFPROBE_SOURCE=deb-extract'
            else
              echo 'ASTRA_FFPROBE_STATIC_FALLBACK=attempt'
              # This pre-existing static fallback avoids Ubuntu libav dependencies.
              # Keep TLS and the final executable/runtime checks mandatory.
              if timeout 65s curl --fail --location --silent --show-error \
                --connect-timeout 10 --max-time 60 --retry 1 \
                https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
                -o "$RUNNER_TEMP/astra-ffmpeg-static.tar.xz"; then
                mkdir -p "$RUNNER_TEMP/astra-static-probe"
                tar -xJf "$RUNNER_TEMP/astra-ffmpeg-static.tar.xz" \
                  -C "$RUNNER_TEMP/astra-static-probe" \
                  --wildcards --no-anchored --strip-components=1 '*/ffprobe' || true
                if [ -x "$RUNNER_TEMP/astra-static-probe/ffprobe" ] && \
                   "$RUNNER_TEMP/astra-static-probe/ffprobe" -version >/dev/null 2>&1; then
                  export PATH="$RUNNER_TEMP/astra-static-probe:$PATH"
                  echo "$RUNNER_TEMP/astra-static-probe" >> "$GITHUB_PATH"
                  echo 'ASTRA_FFPROBE_SOURCE=static'
                fi
              fi
            fi
          fi
          command -v ffmpeg || { echo 'ASTRA_FFMPEG_UNAVAILABLE=1'; exit 1; }
          command -v ffprobe || { echo 'ASTRA_FFPROBE_UNAVAILABLE=1'; exit 1; }
          ffprobe -version >/dev/null 2>&1 || { echo 'ASTRA_FFPROBE_RUNTIME_UNUSABLE=1'; exit 1; }

      # Long-form cover tests execute in astra-v2-longform.yml, not the Shorts publisher.
      - name: Enforce real frame-to-frame motion
        id: motion_tests
        if: steps.preflight.outputs.render_due == 'true'
        run: python -m unittest discover -s tests -p 'test_astra_motion_gate.py' -v
      - name: Reject unsupported directed story scenes
        if: steps.preflight.outputs.render_due == 'true'
        run: python -m unittest discover -s tests -p 'test_directed_scene_contract.py' -v
      - name: Verify animated animal scenes
        id: animal_tests
        if: steps.preflight.outputs.render_due == 'true'
        run: python -m unittest discover -s tests -p 'test_astra_animal_scenes.py' -v
      - name: Test trusted video and cover packages
        id: cover_package_tests
        if: steps.preflight.outputs.render_due == 'true'
        run: python -m unittest discover -s tests -p 'test_astra_preload_covers.py' -v
      - name: Verify publication safety gate
        id: quality_tests
        if: steps.preflight.outputs.render_due == 'true'
        run: python -m unittest discover -s tests -p 'test_astra_publication_quality.py' -v

      - name: Run V2 policy regression tests
        id: policy_tests
        if: steps.preflight.outputs.render_due == 'true'
        run: python -m unittest discover -s tests -p 'test_astra_v2.py' -v
      - name: Run queue artifact regression tests
        id: queue_tests
        env:
          ASTRA_REQUIRE_STUDIO_PRELOAD: '0'
        if: steps.preflight.outputs.render_due == 'true'
        run: python -m unittest discover -s tests -p 'test_astra_preload_artifact_pagination.py' -v
      - name: Run YouTube OAuth regression tests
        id: oauth_tests
        if: steps.preflight.outputs.render_due == 'true'
        run: python -m unittest discover -s tests -p 'test_astra_youtube_oauth_errors.py' -v

      - name: Block foreground animation and caption overlaps
        id: layer_tests
        if: steps.preflight.outputs.render_due == 'true'
        run: python -m unittest discover -s tests -p 'test_scene_layer_contract.py' -v

      - name: Audit editorial publishing runway without granting approval
        if: steps.preflight.outputs.render_due == 'true'
        env:
          ASTRA_EDITORIAL_STORIES_FILE: editorial/reviewed_stories.json
          ASTRA_EDITORIAL_REVIEWS_FILE: editorial/reviewed_decisions.json
          ASTRA_PUBLISHER_STATE_PATH: astra_v2_state.json
          ASTRA_STORY_HISTORY_PATH: astra_story_history.json
        run: python -m astra_v2.editorial_runway_diagnostic

      - name: Verify remote warehouse readiness when enabled
        if: steps.preflight.outputs.render_due == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ASTRA_RECEIPT_INDEX: ${{ vars.ASTRA_RECEIPT_INDEX }}
          ASTRA_WAREHOUSE_DATABASE_URL: ${{ secrets.ASTRA_WAREHOUSE_DATABASE_URL }}
          ASTRA_WAREHOUSE_NAMESPACE: ${{ vars.ASTRA_WAREHOUSE_NAMESPACE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${ASTRA_RECEIPT_INDEX:-}" = "postgres" ]; then
            python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.1,<4'
            python -m astra_v2.warehouse_health
          elif [ -n "${ASTRA_RECEIPT_INDEX:-}" ]; then
            echo "Unsupported warehouse index backend" >&2
            exit 1
          else
            echo 'ASTRA_WAREHOUSE=not_enabled'
          fi

      - name: Install warehouse publisher dependencies when opted in
        if: steps.preflight.outputs.render_due == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ASTRA_WAREHOUSE_PUBLISH: ${{ vars.ASTRA_WAREHOUSE_PUBLISH || '0' }}
          ASTRA_WAREHOUSE_PROBE: ${{ vars.ASTRA_WAREHOUSE_PROBE || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${ASTRA_WAREHOUSE_PUBLISH}" = "1" ] || [ "${ASTRA_WAREHOUSE_PROBE}" = "1" ]; then
            python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.1,<4' 'boto3>=1.34,<2'
          elif [ "${ASTRA_WAREHOUSE_PUBLISH}" != "0" ]; then
            echo 'Invalid warehouse publish switch' >&2
            exit 1
          fi

      - name: Verify warehouse publishing dependencies without uploading
        if: steps.preflight.outputs.render_due == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ASTRA_WAREHOUSE_PUBLISH: ${{ vars.ASTRA_WAREHOUSE_PUBLISH || '0' }}
          ASTRA_WAREHOUSE_PROBE: ${{ vars.ASTRA_WAREHOUSE_PROBE || '0' }}
          ASTRA_WAREHOUSE_UPLOAD_ENABLED: ${{ vars.ASTRA_WAREHOUSE_UPLOAD_ENABLED || '0' }}
          ASTRA_WAREHOUSE_DATABASE_URL: ${{ secrets.ASTRA_WAREHOUSE_DATABASE_URL }}
          ASTRA_WAREHOUSE_NAMESPACE: ${{ vars.ASTRA_WAREHOUSE_NAMESPACE }}
          ASTRA_TRUSTED_QA_REGISTRY: ${{ vars.ASTRA_TRUSTED_QA_REGISTRY }}
          ASTRA_QA_REGISTRY_ACCESS_CONTROLLED: ${{ vars.ASTRA_QA_REGISTRY_ACCESS_CONTROLLED || '0' }}
          ASTRA_ARTIFACT_S3_BUCKET: ${{ vars.ASTRA_ARTIFACT_S3_BUCKET }}
          ASTRA_ARTIFACT_S3_ENDPOINT: ${{ vars.ASTRA_ARTIFACT_S3_ENDPOINT }}
          ASTRA_ARTIFACT_S3_PREFIX: ${{ vars.ASTRA_ARTIFACT_S3_PREFIX }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ASTRA_ARTIFACT_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ASTRA_ARTIFACT_AWS_SECRET_ACCESS_KEY }}
        run: python -m astra_v2.warehouse_readiness

      - name: Restore verified visual assets for production render
        if: steps.preflight.outputs.render_due == 'true'
        uses: actions/download-artifact@v4
        with:
          name: astra-original-visual-pack
          run-id: 39960540392
          github-token: ${{ github.token }}
          path: runtime-artifacts/download

      - name: Validate production asset pack
        if: steps.preflight.outputs.render_due == 'true'
        run: python -m tools.astra_restore_visual_pack runtime-artifacts/download/astra-visual-pack.zip runtime-artifacts/verified-pack --expected 3200

      - name: Generate, validate, publish, and verify
        id: publish_video
        if: steps.preflight.outputs.render_due == 'true'
        env:
          ASTRA_EDITORIAL_STORIES_FILE: editorial/reviewed_stories.json
          ASTRA_EDITORIAL_REVIEWS_FILE: editorial/reviewed_decisions.json
          ASTRA_PUBLISHER_STATE_PATH: astra_v2_state.json
          ASTRA_STORY_HISTORY_PATH: astra_story_history.json
          # Explicitly opt-in; absent variables never activate warehouse uploads.
          ASTRA_WAREHOUSE_PUBLISH: ${{ vars.ASTRA_WAREHOUSE_PUBLISH || '0' }}
          ASTRA_WAREHOUSE_UPLOAD_ENABLED: ${{ vars.ASTRA_WAREHOUSE_UPLOAD_ENABLED || '0' }}
          ASTRA_WAREHOUSE_DATABASE_URL: ${{ secrets.ASTRA_WAREHOUSE_DATABASE_URL }}
          ASTRA_WAREHOUSE_NAMESPACE: ${{ vars.ASTRA_WAREHOUSE_NAMESPACE }}
          ASTRA_TRUSTED_QA_REGISTRY: ${{ vars.ASTRA_TRUSTED_QA_REGISTRY }}
          ASTRA_QA_REGISTRY_ACCESS_CONTROLLED: ${{ vars.ASTRA_QA_REGISTRY_ACCESS_CONTROLLED || '0' }}
          ASTRA_ARTIFACT_S3_BUCKET: ${{ vars.ASTRA_ARTIFACT_S3_BUCKET }}
          ASTRA_ARTIFACT_S3_ENDPOINT: ${{ vars.ASTRA_ARTIFACT_S3_ENDPOINT }}
          ASTRA_ARTIFACT_S3_PREFIX: ${{ vars.ASTRA_ARTIFACT_S3_PREFIX }}
          AWS_ACCESS_KEY_ID: ${{ secrets.ASTRA_ARTIFACT_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ASTRA_ARTIFACT_AWS_SECRET_ACCESS_KEY }}
          ASTRA_PRELOAD_ONLY: '0' # Scan only policy-approved queued media, then allow a fresh QA-gated render
          ASTRA_ASSET_PACK_ENABLED: '1'
          ASTRA_ASSET_PACK_ROOT: runtime-artifacts/verified-pack
          ASTRA_ASSET_PACK_AUDIT: '1'
          ASTRA_ASSET_AUDIT_DIR: runtime-health/asset-usage
          ASTRA_VISUAL_REVIEW_SHEET: '1'
          ASTRA_VISUAL_REVIEW_DIR: runtime-health/visual-review
        shell: bash
        run: |
          set -euo pipefail
          # Resolve the probe in this step, not only during dependency installation.
          # Python's media validator launches ffprobe by its executable name.
          if ! command -v ffprobe >/dev/null 2>&1 && [ -x "$RUNNER_TEMP/astra-static-probe/ffprobe" ]; then
            export PATH="$RUNNER_TEMP/astra-static-probe:$PATH"
          fi
          command -v ffprobe
          python - <<'PY'
          import shutil
          import subprocess
          probe = shutil.which("ffprobe")
          if not probe:
              raise SystemExit("ASTRA_FFPROBE_PUBLISHER_PATH_MISSING=1")
          subprocess.run(["ffprobe", "-version"], check=True, stdout=subprocess.DEVNULL)
          print("ASTRA_FFPROBE_PUBLISHER_SUBPROCESS=ready", flush=True)
          PY
          python -m astra_v2.run 2>&1 | tee astra-story-selection.log

      - name: Persist verified character episode if approved manifests exist
        if: steps.publish_video.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from astra_v2.postpublish_character_memory import apply_published_episode

          snapshot = Path('character-continuity.json')
          proposal = Path('runtime-health/character-proposal.json')
          episode = Path('runtime-health/character-episode.json')
          report = Path('runtime-health/astra-v2-report.json')
          # Never infer or fabricate character identities from a video.
          # Until the approved generator supplies both manifests, do nothing.
          first = Path('runtime-health/character-first-candidate.json')
          print('ASTRA_CHARACTER_MANIFESTS=' + json.dumps({
              'first_candidate': first.is_file(),
              'proposal': proposal.is_file(),
              'episode': episode.is_file(),
              'snapshot': snapshot.is_file(),
              'report': report.is_file(),
          }, sort_keys=True))
          if first.is_file() and report.is_file():
              from astra_v2.first_published_character import apply_first_published_episode
              from astra_v2.character_snapshot import read_snapshot
              import os
              import tempfile
              candidate = json.loads(first.read_text(encoding='utf-8'))
              publication = json.loads(report.read_text(encoding='utf-8'))
              if publication.get('outcome') == 'published':
                  existing = read_snapshot(snapshot) if snapshot.is_file() else {'version': 1, 'characters': {}}
                  updated = apply_first_published_episode(existing, candidate, publication)
                  fd, temp = tempfile.mkstemp(prefix='.astra-character-', dir=snapshot.parent)
                  try:
                      with os.fdopen(fd, 'w', encoding='utf-8') as handle:
                          json.dump(updated, handle, indent=2, sort_keys=True)
                          handle.flush()
                          os.fsync(handle.fileno())
                      os.replace(temp, snapshot)
                  finally:
                      if os.path.exists(temp):
                          os.unlink(temp)
                  print('ASTRA_CHARACTER_MEMORY=first_episode_persisted')
              else:
                  print('ASTRA_CHARACTER_MEMORY=skipped_unconfirmed_first_episode')
          elif not (snapshot.is_file() and proposal.is_file() and episode.is_file() and report.is_file()):
              print('ASTRA_CHARACTER_MEMORY=skipped_missing_verified_inputs')
          else:
              publication = json.loads(report.read_text(encoding='utf-8'))
              if publication.get('outcome') != 'published':
                  print('ASTRA_CHARACTER_MEMORY=skipped_unconfirmed_publication')
              else:
                  apply_published_episode(snapshot, proposal, episode, report)
                  print('ASTRA_CHARACTER_MEMORY=updated')
          PY

      - name: Record post-preflight workflow stage outcomes
        if: always()
        env:
          EARLY_TESTS_RESULT: ${{ steps.early_tests.outcome }}
          PREFLIGHT_RESULT: ${{ steps.preflight.outcome }}
          PREFLIGHT_DUE: ${{ steps.preflight.outputs.render_due }}
          JOB_RESULT: ${{ job.status }}
          DEPENDENCIES_RESULT: ${{ steps.dependencies.outcome }}
          PUBLISH_RESULT: ${{ steps.publish_video.outcome }}
          COVER_TESTS: ${{ steps.cover_tests.outcome }}
          MOTION_TESTS: ${{ steps.motion_tests.outcome }}
          ANIMAL_TESTS: ${{ steps.animal_tests.outcome }}
          COVER_PACKAGE_TESTS: ${{ steps.cover_package_tests.outcome }}
          QUALITY_TESTS: ${{ steps.quality_tests.outcome }}
          POLICY_TESTS: ${{ steps.policy_tests.outcome }}
          QUEUE_TESTS: ${{ steps.queue_tests.outcome }}
          OAUTH_TESTS: ${{ steps.oauth_tests.outcome }}
          LAYER_TESTS: ${{ steps.layer_tests.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path("astra_v2_state.json")
          try:
              state = json.loads(p.read_text(encoding="utf-8"))
              if not isinstance(state, dict):
                  raise ValueError("state not an object")
          except (OSError, ValueError):
              state = {}
          report_path = Path("runtime-health/astra-v2-report.json")
          try:
              report = json.loads(report_path.read_text(encoding="utf-8"))
              if not isinstance(report, dict):
                  report = {}
          except (OSError, ValueError):
              report = {}
          publish_step = os.getenv("PUBLISH_RESULT", "unknown")
          fresh_upload_attempted = publish_step == "success" and bool(report.get("content_id"))
          fresh_publication_confirmed = fresh_upload_attempted and report.get("outcome") == "published"
          # Workflow-level diagnostic is persisted even when preflight skips
          # the render controller; never imply that an upload occurred.
          state["last_workflow_result"] = {
              "at": datetime.now(timezone.utc).isoformat(),
              "preflight_due": os.getenv("PREFLIGHT_DUE", ""),
              "preflight_step": os.getenv("PREFLIGHT_RESULT", "unknown"),
              "publish_step": os.getenv("PUBLISH_RESULT", "unknown"),
              "job_status_before_persist": os.getenv("JOB_RESULT", "unknown"),
              "outcome": str(report.get("outcome") or "no_report")[:80],
              "reason": str(report.get("reason") or "")[:250],
              "fresh_upload_attempted": fresh_upload_attempted,
              "fresh_publication_confirmed": fresh_publication_confirmed,
              "reconciled_previous_publication": publish_step == "skipped" and report.get("outcome") == "published",
          }
          # Persist bounded candidate counts so supply failures can be diagnosed
          # from astra-state without access to private Actions logs.
          diagnostics = {}
          log_path = Path("astra-story-selection.log")
          if log_path.is_file():
              for line in log_path.read_text(encoding="utf-8", errors="replace").splitlines():
                  for marker in ("ASTRA_STORY_SUPPLY=", "ASTRA_STORY_HISTORY_FILTER=",
                                 "ASTRA_STORY_SUPPLY_AFTER_HISTORY=", "ASTRA_STORY_SELECTION="):
                      if marker in line:
                          try:
                              value = json.loads(line.split(marker, 1)[1])
                              if isinstance(value, dict):
                                  diagnostics[marker[:-1]] = value
                          except (ValueError, TypeError):
                              pass
          state["last_story_selection_diagnostics"] = {
              "at": datetime.now(timezone.utc).isoformat(),
              "collection_status": ("collected" if diagnostics else
                                    "not_applicable_publisher_skipped" if publish_step == "skipped" else
                                    "missing_diagnostics"),
              "publish_step": publish_step,
              "counters": diagnostics,
              "note": "Diagnostic counts only; no approval or publishing effect",
          }
          state["last_character_memory_diagnostic"] = {
              "at": datetime.now(timezone.utc).isoformat(),
              "publication_outcome": report.get("outcome", "no_report"),
              "publication_reason": str(report.get("reason") or "")[:250],
              "character_memory": report.get("character_memory", "not_reported"),
              "character_memory_error": report.get("character_memory_error"),
              "first_candidate_manifest": Path("runtime-health/character-first-candidate.json").is_file(),
              "existing_character_proposal": Path("runtime-health/character-proposal.json").is_file(),
              "existing_character_episode": Path("runtime-health/character-episode.json").is_file(),
              "continuity_snapshot_present": Path("character-continuity.json").is_file(),
          }
          history_path = Path("astra_story_history.json")
          state["last_story_history_diagnostic"] = {
              "at": datetime.now(timezone.utc).isoformat(),
              "history_file_present": history_path.is_file(),
              "publication_outcome": report.get("outcome", "no_report"),
              "note": "Missing history is not evidence of an upload or a complete fingerprint archive",
          }
          state["last_publisher_job_diagnostic"] = {
              "at": datetime.now(timezone.utc).isoformat(),
              "early_tests": os.getenv("EARLY_TESTS_RESULT", "unknown"),
              "preflight_step": os.getenv("PREFLIGHT_RESULT", "unknown"),
              "render_due": os.getenv("PREFLIGHT_DUE", ""),
              "job_status_before_persist": os.getenv("JOB_RESULT", "unknown"),
              "dependencies_step": os.getenv("DEPENDENCIES_RESULT", "unknown"),
              "publish_step": os.getenv("PUBLISH_RESULT", "unknown"),
              "cover_tests": os.getenv("COVER_TESTS", "unknown"),
              "motion_tests": os.getenv("MOTION_TESTS", "unknown"),
              "animal_tests": os.getenv("ANIMAL_TESTS", "unknown"),
              "cover_package_tests": os.getenv("COVER_PACKAGE_TESTS", "unknown"),
              "quality_tests": os.getenv("QUALITY_TESTS", "unknown"),
              "policy_tests": os.getenv("POLICY_TESTS", "unknown"),
              "queue_tests": os.getenv("QUEUE_TESTS", "unknown"),
              "oauth_tests": os.getenv("OAUTH_TESTS", "unknown"),
              "layer_tests": os.getenv("LAYER_TESTS", "unknown"),
          }
          p.write_text(json.dumps(state, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Reconcile confirmed publisher history
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Only confirmed public publications already in the durable journal.
          # No guessed fingerprints and no publishing or approval side effects.
          if [ -s astra_v2_state.json ]; then
            python -m astra_v2.reconcile_verified_history
          else
            echo 'ASTRA_HISTORY_RECONCILIATION=skipped_missing_publisher_state'
          fi

      - name: Audit approved authored story supply
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Diagnostic only; never promote candidates or alter publishing.
          # Require the real journal to avoid misleading empty-history counts.
          if [ -s astra_v2_state.json ] && [ -s astra_story_history.json ]; then
            python -m astra_v2.story_inventory_audit
            # Report approved-story runway from the same restored production ledgers.
            # Read-only: this never approves or publishes a story.
            python -m astra_v2.story_runway
            # Explain exhaustion using the existing editorial and novelty gates.
            python -m astra_v2.story_supply_diagnostic
            # Separate read-only scene-review queue; never auto-approve stories.
            python -m astra_v2.visual_review_queue
          else
            echo 'ASTRA_STORY_INVENTORY_AUDIT=skipped_missing_persistent_history'
          fi

      - name: Persist state even after failures
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin astra-state
          WORKTREE="$(mktemp -d)"
          git worktree add --detach "$WORKTREE" origin/astra-state
          for f in performance.json astra_v2_state.json astra_stage_feedback.json SHORTS.md; do
            if [ -f "$f" ]; then cp "$f" "$WORKTREE/$f"; fi
          done
          # Gemini alone persists the approval pair; publisher must not restore an older snapshot over it.
          if [ -s runtime-health/ai-editorial-reviews.json ]; then
            cp runtime-health/ai-editorial-reviews.json "$WORKTREE/ai-editorial-reviews.json"
          fi
          # Keep story diagnostics separate from publisher and novelty ledgers.
          if [ -s runtime-health/story_supply_diagnostic.json ]; then
            cp runtime-health/story_supply_diagnostic.json "$WORKTREE/story_supply_diagnostic.json"
          fi
          if [ -s runtime-health/visual_review_queue.json ]; then
            cp runtime-health/visual_review_queue.json "$WORKTREE/visual_review_queue.json"
          fi
          if [ -f astra_story_history.json ]; then
            echo 'ASTRA_STORY_HISTORY_CHECKPOINT=present'
          else
            echo 'ASTRA_STORY_HISTORY_CHECKPOINT=missing_no_verified_record'
          fi
          # Persist only existing, schema-valid story histories.
          if [ -f astra_story_history.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('astra_story_history.json').read_text(encoding='utf-8'))
          stories = data.get('stories') if isinstance(data, dict) else data
          if not isinstance(stories, list) or any(not isinstance(x, dict) for x in stories):
              raise ValueError('Invalid story history; refusing state update')
          print('ASTRA_STORY_HISTORY_VALIDATED=' + str(len(stories)))
          PY
            cp astra_story_history.json "$WORKTREE/astra_story_history.json"
          fi
          if [ -f character-continuity.json ]; then
            python - <<'PY'
          from astra_v2.character_snapshot import read_snapshot
          read_snapshot('character-continuity.json')
          PY
            cp character-continuity.json "$WORKTREE/character-continuity.json"
          fi
          (
            cd "$WORKTREE"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            for f in performance.json astra_v2_state.json astra_stage_feedback.json SHORTS.md; do
              if [ -e "$f" ]; then git add -- "$f"; fi
            done
            if [ -f character-continuity.json ]; then git add -- character-continuity.json; fi
            if [ -f astra_story_history.json ]; then git add -- astra_story_history.json; fi
            if [ -s ai-reviewed-stories.json ] && [ -s ai-reviewed-decisions.json ]; then
              git add -- ai-reviewed-stories.json ai-reviewed-decisions.json
            fi
            if [ -s ai-editorial-reviews.json ]; then git add -- ai-editorial-reviews.json; fi
            # Stage the new diagnostic report; copying alone does not commit it.
            if [ -s story_supply_diagnostic.json ]; then git add -- story_supply_diagnostic.json; fi
            if [ -s visual_review_queue.json ]; then git add -- visual_review_queue.json; fi
            if ! git diff --cached --quiet; then
              git commit -m 'Update verified ASTRA V2 runtime journal [skip ci]'
              git push origin HEAD:refs/heads/astra-state
            fi
          )
          git worktree remove --force "$WORKTREE"

      - name: Archive sampled MP4 frames for manual visual review
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: astra-visual-review-${{ github.run_id }}
          path: runtime-health/visual-review/
          retention-days: 3
          if-no-files-found: ignore

      - name: Publish actual asset usage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-asset-usage-${{ github.run_id }}
          path: runtime-health/asset-usage/*.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish machine-readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-v2-report
          path: runtime-health/astra-v2-report.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Summarize verified outcome
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('runtime-health/astra-v2-report.json')
          data=json.loads(path.read_text()) if path.exists() else {'outcome':'failed_before_controller'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## ASTRA V2 publishing status\n\n')
              outcome=data.get('outcome')
              url=data.get('video_url')
              verified=bool(outcome=='published' and isinstance(url,str) and url.startswith('https://www.youtube.com/watch?v='))
              summary.write('**Verified public video: ' + ('YES' if verified else 'NO') + '**\n\n')
              if not verified:
                  summary.write('A green GitHub Actions check is NOT proof of a new upload.\n\n')
              receipts = sorted(Path('runtime-health/asset-usage').glob('*.json'))
              summary.write('**Audited render receipts: ' + str(len(receipts)) + '**\n\n')
              for receipt in receipts:
                  evidence = json.loads(receipt.read_text(encoding='utf-8'))
                  summary.write('- asset evidence for ' + str(evidence.get('content_id'))
                                + ': ' + str(evidence.get('composited_shots', 0))
                                + '/' + str(evidence.get('shot_count', 0))
                                + ' shots composited; original MP4 SHA-256: '
                                + str(evidence.get('video_sha256')) + '\n')
              if not receipts:
                  summary.write('No candidate render usage evidence produced; '
                                'asset restoration does not prove asset usage.\n')
              summary.write('\n')
              for key in ('outcome','video_url','reason','character_memory','character_memory_error','queue_error_type','attempts_today','confirmed_today','pending','blocked_until'):
                  summary.write(f'- {key}: {data.get(key)}\n')
              snapshot=Path('character-continuity.json')
              first=Path('runtime-health/character-first-candidate.json')
              proposal=Path('runtime-health/character-proposal.json')
              episode=Path('runtime-health/character-episode.json')
              summary.write('\n**Character continuity evidence**\n\n')
              for label, present in (
                  ('first_candidate_manifest', first.is_file()),
                  ('existing_character_proposal', proposal.is_file()),
                  ('existing_character_episode', episode.is_file()),
                  ('continuity_snapshot_present', snapshot.is_file()),
              ):
                  summary.write(f'- {label}: {present}\n')

          PY

      - name: Notify independent publisher heartbeat
        if: always()
        continue-on-error: true
        shell: bash
        env:
          ASTRA_HEALTHCHECKS_URL: ${{ secrets.ASTRA_HEALTHCHECKS_URL }}
          ASTRA_PUBLISH_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -z "${ASTRA_HEALTHCHECKS_URL:-}" ]; then
            echo 'ASTRA_HEARTBEAT=skipped_unconfigured'
            exit 0
          fi
          # A failed or cancelled publisher must never be reported as healthy.
          endpoint="${ASTRA_HEALTHCHECKS_URL}"
          case "${ASTRA_PUBLISH_JOB_STATUS}" in
            success) ;;
            *) endpoint="${endpoint%/}/fail" ;;
          esac
          if curl --fail --silent --show-error --max-time 12 --retry 1 --retry-delay 1 --output /dev/null -- "$endpoint"; then
            echo "ASTRA_HEARTBEAT=sent status=${ASTRA_PUBLISH_JOB_STATUS}"
          else
            echo "::warning::ASTRA external heartbeat could not be delivered"
          fi
