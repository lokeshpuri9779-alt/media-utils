name: ASTRA Full Studio Preview QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/studio-full-preview-qa.yml'
      - 'studio_renderer.py'
      - 'longform_trends.py'
      - 'tests/test_astra_longform_rss_enrichment.py'
      - 'astra_v2/visual_artifact_backdrop.py'
      - 'astra_v2/quality_asset_selector.py'
      - 'astra_v2/performance_short_contract.py'
      - 'astra_v2/pillow_duo_scene.py'
      - 'tests/fixtures/performance_short_preview.json'
      - 'tests/render_performance_short_preview.py'
      - 'tests/verify_studio_preview.py'
      - 'tests/review_studio_visual_reuse.py'
      - 'tests/test_studio_visual_reuse.py'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/verify_studio_preview.py'
      - 'longform_trends.py'
      - 'tests/test_astra_longform_rss_enrichment.py'
      - 'astra_v2/studio_preview_asset_gate.py'
      - 'tests/test_astra_studio_preview_asset_gate.py'
      - 'tests/test_studio_audio_gate.py'
      - 'tests/test_visual_artifact_backdrop.py'
      - 'tests/fixtures/performance_short_preview.json'
      - 'tests/render_performance_short_preview.py'
      - 'tests/verify_studio_preview.py'
      - '.github/workflows/studio-full-preview-qa.yml'
concurrency:
  group: astra-full-studio-preview-qa
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile tests/verify_studio_preview.py tests/render_performance_short_preview.py studio_renderer.py longform_trends.py
      - run: python -m pip install pillow imageio-ffmpeg
      - run: python -m unittest tests.test_studio_audio_gate tests.test_visual_artifact_backdrop -v
      - run: python -m unittest tests.test_astra_studio_preview_asset_gate -v
      - run: python -m unittest tests.test_studio_visual_reuse -v
  full-studio-preview:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ORT_DISABLE_TELEMETRY: '1'
      ASTRA_UNIFIED_STORY_ENGINE: '1'
      ASTRA_ASSET_PACK_ENABLED: '1'
      ASTRA_ASSET_PACK_AUDIT: '1'
      ASTRA_ASSET_PACK_ROOT: runtime-artifacts/verified-pack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Studio production dependencies
        run: python -m pip install -r requirements.txt
      - name: Test sentence-aware narration cadence
        run: python -m unittest tests.test_studio_narration -v
      - name: Test source-led long-form story quality and retention
        run: python -m unittest tests.test_astra_longform_rss_enrichment -v
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/astra-voice
          key: astra-kokoro-v1-beb0d184
      - name: Restore verified existing visual asset pack
        uses: actions/download-artifact@v4
        with:
          name: astra-original-visual-pack
          run-id: 45008240518
          github-token: ${{ github.token }}
          path: runtime-artifacts/download
      - name: Validate local visual assets before Studio preview
        run: python -m tools.astra_restore_visual_pack runtime-artifacts/download/astra-visual-pack.zip runtime-artifacts/verified-pack --expected 3200
      - name: Verify all scenes in Shorts and landscape compositor
        run: |
          python - <<'PY'
          from PIL import Image
          from astra_v2.visual_artifact_backdrop import apply_pack_background, choose_scene
          import os
          root = os.environ['ASTRA_ASSET_PACK_ROOT']
          from astra_v2.visual_artifact_library import SCENES
          passed = 0
          for scene in SCENES:
              shot = {'visual': scene}
              assert choose_scene(shot) == scene, scene
              for video_format, size in (('shorts', (540, 960)), ('long', (960, 540))):
                  base = Image.new('RGB', size, (11, 22, 33))
                  result = apply_pack_background(base, shot, 'qa-' + scene,
                                                 root=root, video_format=video_format)
                  assert result.tobytes() != base.tobytes(), (
                      scene + '/' + video_format + ': unchanged pixels'
                  )
                  passed += 1
                  print('ASTRA_BACKGROUND_FORMAT_OK=' + scene + '/' + video_format, flush=True)
          print('ASTRA_BACKGROUND_FORMAT_TOTAL=' + str(passed), flush=True)
          assert passed == len(SCENES) * 2
          PY
      - name: Render real Studio narration preview (no YouTube upload)
        run: |
          set -o pipefail
          mkdir -p /tmp/astra-studio-review
          python -m tests.render_performance_short_preview --story tests/fixtures/performance_short_preview.json --output /tmp/astra-studio-review/studio-preview.mp4 --stills-dir /tmp/astra-studio-review/stills 2>&1 | tee /tmp/astra-studio-review/render.log
      - name: Require confirmed asset-pack use in narrated render
        run: |
          python -m astra_v2.studio_preview_asset_gate \
            /tmp/astra-studio-review/render.log \
            /tmp/astra-studio-review/studio-preview.mp4
      - name: Verify completed MP4 and audio
        run: python -m tests.verify_studio_preview /tmp/astra-studio-review/studio-preview.mp4
      - name: Upload preview and review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-studio-full-preview
          path: /tmp/astra-studio-review/
          retention-days: 7
          if-no-files-found: warn
