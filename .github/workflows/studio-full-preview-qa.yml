name: ASTRA Full Studio Preview QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/studio-full-preview-qa.yml'
      - 'studio_renderer.py'
      - 'astra_v2/visual_artifact_backdrop.py'
      - 'astra_v2/quality_asset_selector.py'
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/verify_studio_preview.py'
      - 'tests/test_studio_audio_gate.py'
      - 'tests/test_visual_artifact_backdrop.py'
      - '.github/workflows/studio-full-preview-qa.yml'
permissions:
  contents: read
  actions: read
jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile tests/verify_studio_preview.py studio_renderer.py
      - run: python -m pip install pillow imageio-ffmpeg
      - run: python -m unittest tests.test_studio_audio_gate tests.test_visual_artifact_backdrop -v
  full-studio-preview:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ORT_DISABLE_TELEMETRY: '1'
      ASTRA_ASSET_PACK_ENABLED: '1'
      ASTRA_ASSET_PACK_AUDIT: '1'
      ASTRA_ASSET_PACK_ROOT: runtime-artifacts/verified-pack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Studio production dependencies
        run: python -m pip install -r requirements.txt
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/astra-voice
          key: astra-kokoro-v1-beb0d184
      - name: Restore verified existing visual asset pack
        uses: actions/download-artifact@v4
        with:
          name: astra-original-visual-pack
          run-id: 39960540392
          github-token: ${{ github.token }}
          path: runtime-artifacts/download
      - name: Validate local visual assets before Studio preview
        run: python -m tools.astra_restore_visual_pack runtime-artifacts/download/astra-visual-pack.zip runtime-artifacts/verified-pack --expected 3200
      - name: Verify non-space backgrounds in actual compositor
        run: |
          python - <<'PY'
          from PIL import Image
          from astra_v2.visual_artifact_backdrop import apply_pack_background, choose_scene
          import os
          root = os.environ['ASTRA_ASSET_PACK_ROOT']
          from astra_v2.visual_artifact_library import SCENES
          for scene in SCENES:
              shot = {'visual': scene}
              assert choose_scene(shot) == scene, scene
              base = Image.new('RGB', (540, 960), (11, 22, 33))
              result = apply_pack_background(base, shot, 'qa-' + scene,
                                             root=root, video_format='shorts')
              assert result.tobytes() != base.tobytes(), scene + ': unchanged pixels'
              print('ASTRA_NONSPACE_BACKGROUND_OK=' + scene, flush=True)
          PY
      - name: Render real Studio narration preview (no YouTube upload)
        run: |
          mkdir -p /tmp/astra-studio-review
          python studio_renderer.py --preview /tmp/astra-studio-review/studio-preview.mp4 --stills-dir /tmp/astra-studio-review/stills 2>&1 | tee /tmp/astra-studio-review/render.log
      - name: Require confirmed asset-pack use in narrated render
        run: |
          python - <<'PY'
          from pathlib import Path
          log = Path('/tmp/astra-studio-review/render.log').read_text()
          selected = [line for line in log.splitlines() if 'ASTRA_PACK_BACKGROUND_SELECTED=' in line]
          print(f'ASTRA_PACK_SELECTED_UNIQUE={len(selected)}')
          if not selected:
              raise SystemExit('FAIL: Studio preview restored the asset pack but used zero verified backgrounds')
          PY
      - name: Verify completed MP4 and audio
        run: python -m tests.verify_studio_preview /tmp/astra-studio-review/studio-preview.mp4
      - name: Upload preview and review frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-studio-full-preview
          path: /tmp/astra-studio-review/
          retention-days: 7
          if-no-files-found: warn
