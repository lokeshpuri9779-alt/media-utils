name: Experimental OpenVINO SD15 (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  openvino-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --disable-pip-version-check 'optimum-intel[openvino]>=1.23,<2' 'diffusers>=0.30,<0.36' 'transformers>=4.44,<5' 'Pillow>=10,<13' 'accelerate>=0.30,<2'
      - name: Generate experimental keyframe
        run: python tools/experimental_openvino_benchmark.py --steps 12
      - name: Save generated image and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-openvino-${{ github.run_id }}
          path: artifacts/experimental-openvino/
          retention-days: 7
          if-no-files-found: warn
