name: ASTRA V2 - auth fallback regression checks

on:
  push:
    branches:
      - astra-v2-oauth-recovery-20261008
    paths:
      - 'astra_v2/youtube.py'
      - 'tests/test_astra_v2.py'
      - '.github/workflows/astra-v2-oauth-unit.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - run: python -m compileall -q astra_v2
      - run: python -m unittest discover -s tests -p 'test_astra_v2.py' -v
      - run: python -m unittest discover -s tests -p 'test_scene_layer_contract.py' -v
