name: Pillow encoded audiovisual comparison
on:
  workflow_dispatch:
  push:
    branches:
      - benchmark/pillow-full-av-comparison
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12' 'imageio-ffmpeg>=0.5,<1'
      - run: python -m benchmarks.pillow_av_comparison
      - uses: actions/upload-artifact@v4
        with:
          name: encoded-av-comparison
          path: av-benchmark/
          retention-days: 7
