name: ASTRA Gemini Proposal Batch
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: Story proposals to request (1-50)
        required: true
        default: '10'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: astra-gemini-proposal-batch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore complete publication history
        run: |
          git fetch origin astra-state
          git checkout origin/astra-state -- astra_v2_state.json astra_story_history.json
      - name: Generate proposals
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ASTRA_GEMINI_ENABLED: '1'
          BATCH_COUNT: ${{ inputs.count || '10' }}
        run: python -m astra_v2.gemini_batch --count "$BATCH_COUNT"
      - name: Independently review generated proposals
        if: success()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m astra_v2.gemini_batch_review
      - name: Persist approved batch to shared ASTRA state
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from astra_v2.editorial_approved_intake import approved_intake
          from astra_v2.proposal_history import load_history
          folder = Path("runtime-health")
          stories = json.loads((folder / "ai-reviewed-stories.json").read_text())["stories"]
          decisions = json.loads((folder / "ai-reviewed-decisions.json").read_text())["reviews"]
          history = load_history("astra_v2_state.json", "astra_story_history.json")
          result = approved_intake(stories, decisions, history)
          if len(result["stories"]) != len(stories):
              raise SystemExit("Approved batch changed under full-history validation")
          print("ASTRA_APPROVED_BATCH_COUNT=" + str(len(stories)))
          PY
          if [ "$(python -c 'import json; print(len(json.load(open("runtime-health/ai-reviewed-stories.json"))["stories"]))')" -eq 0 ]; then
            echo "No approved stories to persist"
            exit 0
          fi
          git config user.name "astra-bot"
          git config user.email "astra-bot@users.noreply.github.com"
          git fetch origin astra-state
          STATE_DIR="$(mktemp -d)"
          git worktree add --detach "$STATE_DIR" origin/astra-state
          cp runtime-health/ai-reviewed-stories.json "$STATE_DIR/ai-reviewed-stories.json"
          cp runtime-health/ai-reviewed-decisions.json "$STATE_DIR/ai-reviewed-decisions.json"
          (
            cd "$STATE_DIR"
            git add ai-reviewed-stories.json ai-reviewed-decisions.json
            git commit -m "Persist independently approved Gemini batch"
            git push origin HEAD:refs/heads/astra-state
          )
          git worktree remove --force "$STATE_DIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini-unreviewed-proposals
          path: |
            runtime-health/gemini-proposals.json
            runtime-health/ai-reviewed-stories.json
            runtime-health/ai-reviewed-decisions.json
            runtime-health/ai-batch-review-audit.json
          if-no-files-found: ignore
          retention-days: 7
