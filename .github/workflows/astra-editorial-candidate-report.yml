name: ASTRA - Editorial Candidate Report
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: astra-editorial-ledger
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - name: Checkout durable editorial ledger
        uses: actions/checkout@v4
        with:
          ref: astra-editorial-ledger-state
          path: ledger-store
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build rotating review-only candidate report
        shell: bash
        run: |
          set -euo pipefail
          test -s ledger-store/editorial-ledger.json
          cp ledger-store/editorial-ledger.json source/astra-editorial-ledger.json
          rotation=$(( $(date -u +%s) / 86400 ))
          cd source
          PYTHONPATH=. python tools/astra_editorial_candidate_report.py --limit 100 --rotation "$rotation" --ledger astra-editorial-ledger.json --output astra-editorial-review.json
      - name: Summarize candidate supply and flag depletion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("source/astra-editorial-review.json").read_text())
          status = report["supply_status"]
          selected = report["selected_for_review"]
          remaining = report["remaining_unreviewed_after_selection"]
          summary = (
              "## ASTRA editorial candidate supply\n\n"
              f"- New review-only candidates: **{selected}**\n"
              f"- Unreviewed candidates remaining: **{remaining}**\n"
              f"- Supply status: **{status}**\n"
              f"- Recorded ledger fingerprints: **{report['ledger_seen_total']}**\n"
              f"- Unseen authored causal premises available: **{report['available_new_causal_premises']}**\n"
              f"- New causal premises in batch: **{report['new_premises_in_batch']}**\n"
              f"- Reused causal premises in batch: **{report['reused_premises_in_batch']}**\n"
              f"- Candidates requiring plot rewrite: **{report['rewrite_required']}**\n"
              f"- Candidates requiring individual editorial review: **{report['individual_review_required']}**\n"
              "- Character and setting variants are not independent original plots\n"
              "- Publication approvals: **0** (review required)\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(summary)
          if status != "healthy" or report["ledger_exhausted"]:
              print(f"::warning::ASTRA editorial supply {status}: {remaining} candidates remain. Author new causal premises before depletion; never auto-approve review drafts.")
          PY
      - name: Persist ledger on dedicated branch
        shell: bash
        run: |
          set -euo pipefail
          cp source/astra-editorial-ledger.json ledger-store/editorial-ledger.json
          cd ledger-store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial-ledger.json
          if ! git diff --cached --quiet; then
            git commit -m "Record reviewed ASTRA editorial candidates"
            git push origin HEAD:astra-editorial-ledger-state
          fi
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-editorial-candidates
          path: |
            source/astra-editorial-review.json
            source/astra-editorial-ledger.json
          retention-days: 14
