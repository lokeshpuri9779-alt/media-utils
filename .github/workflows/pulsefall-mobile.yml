          extends Node

          const Upgrades = preload("res://mobile/run_upgrades.gd")
          var failures := 0
          var checks := 0

          func check(value: bool, message: String) -> void:
          	checks += 1
          	if value:
          		print("PASS: ", message)
          	else:
          		failures += 1
          		push_error("FAIL: " + message)


          func has_choice(choices: Array[Dictionary], upgrade_id: String) -> bool:
