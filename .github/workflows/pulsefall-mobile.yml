          source = replace_once(source, '\tif not Settings.config_file.get_value("rendering", "shadow_mapping"):\n', '\tif (mobile_renderer and not bool(mobile_profile.shadows)) or (not mobile_renderer and not Settings.config_file.get_value("rendering", "shadow_mapping")):\n', "settings mobile shadows")
          source = replace_once(source, '\tenvironment.glow_enabled = Settings.config_file.get_value("rendering", "bloom")', '\tenvironment.glow_enabled = bool(mobile_profile.bloom) if mobile_renderer else Settings.config_file.get_value("rendering", "bloom")', "settings mobile bloom")
