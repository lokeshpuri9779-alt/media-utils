      - name: Runtime and script validation
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          wget -q "$GODOT_URL" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -type f -name 'Godot*_linux.x86_64' | head -n1)"
          chmod +x "$GODOT"
          set +e
          "$GODOT" --headless --audio-driver Dummy --path game --editor --quit-after 180 > /tmp/import.log 2>&1
          IMPORT_RC=$?
          timeout 90 "$GODOT" --headless --verbose --audio-driver Dummy --path game res://mobile/runtime_soak_test.tscn > /tmp/runtime.log 2>&1
          RUN_RC=$?
          timeout 120 "$GODOT" --headless --audio-driver Dummy --path game res://mobile/extraction_test.tscn > /tmp/extraction-test.log 2>&1
          TEST_RC=$?
          timeout 30 "$GODOT" --headless --audio-driver Dummy --path game res://mobile/controls_test.tscn > /tmp/controls-test.log 2>&1
          CONTROLS_RC=$?
          timeout 30 "$GODOT" --headless --audio-driver Dummy --path game res://mobile/aim_assist_test.tscn > /tmp/aim-assist-test.log 2>&1
          AIM_RC=$?
          set -e
          cat /tmp/import.log
          cat /tmp/runtime.log
          cat /tmp/extraction-test.log
          cat /tmp/controls-test.log
          cat /tmp/aim-assist-test.log
          if grep -Eiq 'SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|nonexistent function|Failed to load script' /tmp/import.log /tmp/runtime.log /tmp/extraction-test.log /tmp/controls-test.log /tmp/aim-assist-test.log; then
            echo "PULSEFALL mobile validation detected a script/runtime failure."
            exit 1
          fi
          if grep -Eiq 'ERROR: Animation name .* already exists|ERROR: Failed loading resource|ERROR: Condition "surfaces\.is_empty\(\)"' /tmp/import.log; then
            echo "PULSEFALL mobile validation detected an asset import failure."
            exit 1
          fi
          if grep -Eiq '[0-9]+ ObjectDB instances were leaked at exit|[0-9]+ resources still in use at exit|RID allocations of type .* were leaked at exit' /tmp/runtime.log /tmp/extraction-test.log; then
            echo "PULSEFALL runtime lifecycle validation detected a shutdown leak."
            exit 1
          fi
          if grep -Eiq 'FSR2 3D scaling is only available|Screen-space ambient occlusion .* only available|Volumetric fog is only available' /tmp/runtime.log; then
            echo "PULSEFALL mobile validation detected unsupported renderer features."
            exit 1
          fi
          if [ "$IMPORT_RC" -ne 0 ] || [ "$RUN_RC" -ne 0 ] || [ "$TEST_RC" -ne 0 ] || [ "$CONTROLS_RC" -ne 0 ] || [ "$AIM_RC" -ne 0 ]; then
            echo "Godot validation exit codes: import=$IMPORT_RC runtime=$RUN_RC extraction=$TEST_RC controls=$CONTROLS_RC aim=$AIM_RC"
            exit 1
          fi

