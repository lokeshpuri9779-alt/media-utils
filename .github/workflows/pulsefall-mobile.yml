      - name: Add permanent arsenal progression
        shell: bash
        run: |
          set -euxo pipefail

          cat > game/mobile/meta_progression.gd <<'PULSEFALL_META'
          extends Node

          const SAVE_PATH := "user://pulsefall_meta.json"
          const SAVE_VERSION := 2
          const SCATTER_CREDITS := 250
          const LANCE_CREDITS := 900
          const MAX_INTEGRITY_BONUS := 30
          const MAX_CADENCE_BONUS := 0.12

          var credits: int = 0
          var runs: int = 0
          var best_score: int = 0
          var meta_level: int = 1


          func _ready() -> void:
          	load_state()


          static func level_for_credits(value: int) -> int:
          	return maxi(1, 1 + int(sqrt(float(maxi(value, 0)) / 450.0)))


          static func integrity_bonus_for_level(level: int) -> int:
          	return mini(maxi(level - 1, 0) * 3, MAX_INTEGRITY_BONUS)


          static func cadence_multiplier_for_level(level: int) -> float:
          	var bonus := minf(float(maxi(level - 1, 0)) * 0.012, MAX_CADENCE_BONUS)
          	return 1.0 - bonus


          static func unlocked_modes_for_credits(value: int) -> Array[int]:
          	var modes: Array[int] = [0]
          	if value >= SCATTER_CREDITS:
          		modes.append(1)
          	if value >= LANCE_CREDITS:
          		modes.append(2)
          	return modes


          func is_weapon_unlocked(mode: int) -> bool:
          	return mode in unlocked_modes_for_credits(credits)


          func next_weapon_mode(current: int) -> int:
          	var modes := unlocked_modes_for_credits(credits)
          	var index := modes.find(current)
          	if index < 0:
          		return modes[0]
          	return modes[(index + 1) % modes.size()]


          func arsenal_status() -> String:
          	var modes := unlocked_modes_for_credits(credits)
          	if modes.size() >= 3:
          		return "ARSENAL COMPLETE"
          	if modes.size() == 2:
          		return "LANCE AT %d CR" % LANCE_CREDITS
          	return "SCATTER AT %d CR" % SCATTER_CREDITS


          func complete_run(score: int, time_seconds: float) -> int:
          	var reward := 100 + maxi(int(score / 120), 0)
          	if time_seconds > 0.0 and time_seconds < 600.0:
          		reward += 50
          	credits += reward
          	runs += 1
          	best_score = maxi(best_score, score)
          	meta_level = level_for_credits(credits)
          	save_state()
          	return reward


          func apply_to_player(player) -> void:
          	if player == null or player.has_meta("pulsefall_meta_applied"):
          		return
          	player.set_meta("pulsefall_meta_applied", true)
          	player.max_health += integrity_bonus_for_level(meta_level)
          	player.health = player.max_health
          	player.weapon_fire_rate_multiplier *= cadence_multiplier_for_level(meta_level)
          	player._refresh_weapon_cooldown()
          	player.health_changed.emit(player.health, player.max_health)
          	MobileMetrics.record("meta_progression_applied", {
          		"credits": credits,
          		"level": meta_level,
          		"integrity_bonus": integrity_bonus_for_level(meta_level),
          		"cadence_multiplier": cadence_multiplier_for_level(meta_level),
          		"weapons": unlocked_modes_for_credits(credits).size(),
          	})


          func save_state() -> void:
          	var file := FileAccess.open(SAVE_PATH, FileAccess.WRITE)
          	if file == null:
          		return
          	file.store_string(JSON.stringify({
          		"save_version": SAVE_VERSION,
          		"credits": credits,
          		"runs": runs,
          		"best_score": best_score,
          		"meta_level": meta_level,
          	}))


          func load_state() -> void:
          	if not FileAccess.file_exists(SAVE_PATH):
          		return
          	var file := FileAccess.open(SAVE_PATH, FileAccess.READ)
          	if file == null:
          		return
          	var parsed = JSON.parse_string(file.get_as_text())
          	if not parsed is Dictionary:
          		return
          	credits = maxi(int(parsed.get("credits", 0)), 0)
          	runs = maxi(int(parsed.get("runs", 0)), 0)
          	best_score = maxi(int(parsed.get("best_score", 0)), 0)
          	meta_level = level_for_credits(credits)
          PULSEFALL_META

          python3 - <<'PY'
          from pathlib import Path

          player = Path("game/player/player.gd")
          source = player.read_text()
          start = source.find("func cycle_weapon() -> String:")
          end = source.find("\n\nfunc trigger_dash()", start)
          if start < 0 or end < 0:
              raise SystemExit("weapon progression boundaries missing")
          replacement = '''func cycle_weapon() -> String:
          	weapon_mode = MetaProgression.next_weapon_mode(weapon_mode)
          	_refresh_weapon_cooldown()
          	return get_weapon_name()
          '''
          player.write_text(source[:start] + replacement + source[end:])

          level = Path("game/level/level.gd")
          source = level.read_text()
          old = '_show_banner("EXTRACTION COMPLETE", "SCORE %06d  //  +%d CREDITS  //  META LV %d" % [score, reward, MetaProgression.meta_level], 8.0)'
          new = '_show_banner("EXTRACTION COMPLETE", "SCORE %06d  //  +%d CR  //  LV %d  //  %s" % [score, reward, MetaProgression.meta_level, MetaProgression.arsenal_status()], 8.0)'
          if source.count(old) != 1:
              raise SystemExit("extraction progression banner anchor missing")
          level.write_text(source.replace(old, new, 1))
          PY

          cat > game/mobile/meta_progression_test.gd <<'PULSEFALL_META_TEST'
          extends Node

          const Rules = preload("res://mobile/meta_progression.gd")
          var checks := 0
