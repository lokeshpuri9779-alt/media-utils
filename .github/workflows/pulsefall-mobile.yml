          	var rapid_one := Upgrades.add_stack(empty, "rapid")
          	check(rapid_one.rapid == 1, "selection adds one stack")
          	var rapid_three := Upgrades.add_stack(Upgrades.add_stack(rapid_one, "rapid"), "rapid")
          	var rapid_capped := Upgrades.add_stack(rapid_three, "rapid")
          	check(rapid_capped.rapid == 3, "upgrade stacks clamp at configured maximum")
          	check(not has_choice(Upgrades.available_choices(rapid_capped), "rapid"), "maxed upgrade leaves the choice pool")
          	check(Upgrades.add_stack(empty, "unknown").is_empty(), "unknown upgrade cannot mutate the build")
          	check(str(Upgrades.available_choices(rapid_one).filter(func(choice): return choice.id == "rapid")[0].title).ends_with("II"), "next choice exposes its stack tier")
          	var overcharge_before := {"rapid": 2}
          	check(not Upgrades.active_synergies(overcharge_before).has("overcharge"), "OVERCHARGE cannot unlock early")
          	var overcharge_after := {"rapid": 2, "capacitor": 1}
          	check(Upgrades.newly_unlocked(overcharge_before, overcharge_after) == ["overcharge"], "rapid plus capacitor unlocks OVERCHARGE")
          	var bulwark_before := {"core": 2, "armor": 1}
          	check(not Upgrades.active_synergies(bulwark_before).has("bulwark"), "BULWARK requires both defense branches")
          	var bulwark_after := {"core": 2, "armor": 2}
          	check(Upgrades.newly_unlocked(bulwark_before, bulwark_after) == ["bulwark"], "core plus armor unlocks BULWARK")
          	var hunter_after := {"mobility": 2, "phase_drive": 1}
          	check(Upgrades.active_synergies(hunter_after).has("phase_hunter"), "mobility plus phase drive unlocks PHASE HUNTER")
          	var all_active := {"rapid": 2, "capacitor": 1, "core": 2, "armor": 2, "mobility": 2, "phase_drive": 1}
          	check(Upgrades.active_synergies(all_active).size() == 3, "all three synergies can coexist")
          	check(Upgrades.synergy_summary(all_active).contains("OVERCHARGE") and Upgrades.synergy_summary(all_active).contains("BULWARK") and Upgrades.synergy_summary(all_active).contains("PHASE HUNTER"), "synergy summary exposes the complete build")
