      - name: Add behavior-driven enemy archetypes
        shell: bash
        run: |
          set -euxo pipefail

          cat > game/mobile/enemy_archetypes.gd <<'PULSEFALL_ARCHETYPES'
          class_name EnemyArchetypes
          extends RefCounted

          const SCOUT := "scout"
          const ASSAULT := "assault"
          const HEAVY := "heavy"
          const DISRUPTOR := "disruptor"
          const ROLES := [SCOUT, ASSAULT, HEAVY, DISRUPTOR]

          static func normalize(role: String) -> String:
          	return role if ROLES.has(role) else ASSAULT

          static func profile(role: String) -> Dictionary:
          	match normalize(role):
          		SCOUT:
          			return {"aim_time": 0.55, "preferred_range": 5.0, "color": Color(0.20, 0.95, 1.0), "behavior": "flank", "counter": "TRACK THE CYAN FLANKER"}
          		HEAVY:
          			return {"aim_time": 1.55, "preferred_range": 7.0, "color": Color(1.0, 0.34, 0.18), "behavior": "pressure", "counter": "PULSE THE ORANGE TELEGRAPH"}
          		DISRUPTOR:
          			return {"aim_time": 1.10, "preferred_range": 12.0, "color": Color(0.72, 0.32, 1.0), "behavior": "standoff", "counter": "CLOSE ON THE VIOLET STANDOFF"}
          		_:
          			return {"aim_time": 0.90, "preferred_range": 7.0, "color": Color(1.0, 0.82, 0.24), "behavior": "direct", "counter": "BREAK THE YELLOW ASSAULT LINE"}

          static func target_for_role(role: String, player_position: Vector3, enemy_position: Vector3, age: float) -> Vector3:
          	var normalized := normalize(role)
          	var separation := enemy_position - player_position
          	separation.y = 0.0
          	var distance := separation.length()
          	var away := Vector3.BACK if distance <= 0.01 else separation / distance
          	match normalized:
          		SCOUT:
          			var tangent := Vector3(-away.z, 0.0, away.x)
          			var side := 1.0 if sin(age * 0.9) >= 0.0 else -1.0
          			return player_position + tangent * side * 4.5
          		DISRUPTOR:
          			if distance < 9.0:
          				return player_position + away * 14.0
          			return player_position
          		_:
          			return player_position

          static func aim_time(role: String) -> float:
          	return float(profile(role).aim_time)

          static func color_for_role(role: String) -> Color:
          	return profile(role).color

          static func counter_hint(role: String) -> String:
          	return str(profile(role).counter)
          PULSEFALL_ARCHETYPES

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {label} anchor, found {count}")
              return source.replace(old, new, 1)

          robot_path = Path("game/enemies/red_robot/red_robot.gd")
          robot = robot_path.read_text()
          robot = replace_once(
              robot,
              "extends CharacterBody3D\n",
              'extends CharacterBody3D\n\nconst EnemyArchetypesScript = preload("res://mobile/enemy_archetypes.gd")\n',
              "enemy archetype preload",
