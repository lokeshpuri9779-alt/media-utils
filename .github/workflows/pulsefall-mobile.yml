          	return false


          func _ready() -> void:
          	var empty: Dictionary = {}
          	var base_choices := Upgrades.available_choices(empty)
          	check(base_choices.size() == 6, "all six base upgrades are initially available")
          	check(Upgrades.active_synergies(empty).is_empty(), "fresh run has no active synergy")
