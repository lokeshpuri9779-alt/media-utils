          	check(FileAccess.file_exists(RunCheckpoint.SAVE_PATH), "checkpoint file exists after write")
          	var loaded := RunCheckpoint.load_checkpoint()
          	check(loaded.phase == "wave" and loaded.wave == 2, "checkpoint round trip preserves location")
          	check(loaded.score == 900 and is_equal_approx(loaded.mission_time, 82.0), "checkpoint round trip preserves progress")
          	check(loaded.upgrade_stacks == {"mobility": 2, "phase_drive": 1}, "checkpoint round trip preserves build")
          	check(loaded.saved_at > 0, "write records a real timestamp")
