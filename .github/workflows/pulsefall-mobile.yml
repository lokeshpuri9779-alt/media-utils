          func _ready() -> void:
          	check(Rules.VARIANTS.size() == 3, "three elite variants are registered")
          	check(Rules.normalize("unknown") == Rules.NONE, "unknown elite variant fails closed")
          	check(not Rules.should_promote(1, 0), "opening wave remains elite-free")
          	check(Rules.should_promote(2, 0), "wave two promotes one deterministic elite")
          	check(Rules.should_promote(3, 1), "wave three promotes one deterministic elite")
          	check(Rules.should_promote(4, 2), "wave four promotes one deterministic elite")
          	check(not Rules.should_promote(5, 0), "final boss wave does not add an elite variant")
          	check(Rules.variant_for_spawn(2, 0) != Rules.NONE, "eligible spawn resolves an elite variant")
          	check(Rules.variant_for_spawn(2, 1) == Rules.NONE, "ineligible spawn remains standard")
          	var seen := {}
          	for wave in range(2, 5):
          		for spawn_index in range(3):
          			var variant := Rules.variant_for_spawn(wave, spawn_index)
          			if variant != Rules.NONE:
          				seen[variant] = true
          	check(seen.size() == 3, "one run exposes all three elite variants")
          	var bulwark := Rules.profile(Rules.BULWARK)
          	var stalker := Rules.profile(Rules.PHASE_STALKER)
          	var artillery := Rules.profile(Rules.VOLT_ARTILLERY)
          	check(float(bulwark.health) > 1.5, "Bulwark has a meaningful durability identity")
          	check(float(bulwark.animation) < 1.0, "Bulwark pressure is deliberately readable")
          	check(float(stalker.delay) < 0.8, "Phase Stalker attacks materially faster")
          	check(float(stalker.animation) > 1.2, "Phase Stalker movement is visibly faster")
          	check(float(artillery.damage) > 1.4, "Volt Artillery delivers high-threat shots")
          	check(float(artillery.delay) > 1.0, "Volt Artillery exposes a longer charge window")
          	check(Rules.title(Rules.BULWARK).contains("BULWARK"), "Bulwark title identifies the threat")
          	check(Rules.title(Rules.PHASE_STALKER).contains("STALKER"), "Stalker title identifies the threat")
          	check(Rules.title(Rules.VOLT_ARTILLERY).contains("ARTILLERY"), "Artillery title identifies the threat")
          	check(Rules.counter_hint(Rules.BULWARK).contains("GREEN"), "Bulwark counter matches its green signal")
          	check(Rules.counter_hint(Rules.PHASE_STALKER).contains("MAGENTA"), "Stalker counter matches its magenta signal")
          	check(Rules.counter_hint(Rules.VOLT_ARTILLERY).contains("BLUE"), "Artillery counter matches its blue signal")
          	var colors := {}
          	for variant in Rules.VARIANTS:
          		colors[Rules.color_for_variant(variant).to_html()] = true
          	check(colors.size() == 3, "elite variants have distinct signal colors")
          	check(Rules.score_for_variant(100, Rules.BULWARK) == 175, "Bulwark risk earns a 75 percent score bonus")
          	check(Rules.score_for_variant(100, Rules.PHASE_STALKER) == 155, "Stalker risk earns a 55 percent score bonus")
          	check(Rules.score_for_variant(100, Rules.VOLT_ARTILLERY) == 165, "Artillery risk earns a 65 percent score bonus")
          	check(Rules.score_for_variant(100, Rules.NONE) == 100, "standard enemies retain baseline score")
          	check(Rules.score_for_variant(-50, Rules.BULWARK) == 0, "elite score floors invalid negative values")
          	print("ELITE VARIANT CHECKS: ", checks, " FAILURES: ", failures)
          	get_tree().quit(0 if failures == 0 else 1)
          PULSEFALL_ELITE_TEST

          cat > game/mobile/elite_rules_test.tscn <<'PULSEFALL_ELITE_TEST'
