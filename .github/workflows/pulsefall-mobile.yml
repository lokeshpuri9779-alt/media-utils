      - name: Runtime and script validation
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          wget -q "$GODOT_URL" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT="$(find /tmp/godot -type f -name 'Godot*_linux.x86_64' | head -n1)"
          chmod +x "$GODOT"
          set +e
          "$GODOT" --headless --audio-driver Dummy --path game --editor --quit-after 180 > /tmp/import.log 2>&1
          IMPORT_RC=$?
          "$GODOT" --headless --audio-driver Dummy --path game res://level/level.tscn --quit-after 600 > /tmp/runtime.log 2>&1
          RUN_RC=$?
          set -e
          cat /tmp/import.log
          cat /tmp/runtime.log
          if grep -Eiq 'SCRIPT ERROR|Parse Error|Compile Error|Invalid call|Invalid access|nonexistent function|Failed to load script' /tmp/import.log /tmp/runtime.log; then
            echo "PULSEFALL mobile validation detected a script/runtime failure."
            exit 1
          fi
          if [ "$IMPORT_RC" -ne 0 ] || [ "$RUN_RC" -ne 0 ]; then
            echo "Godot validation exit codes: import=$IMPORT_RC runtime=$RUN_RC"
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Export Android APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./game
          export_debug: true
          use_preset_export_path: true
          presets_to_export: Android
          verbose: false
          cache: false

      - name: Package Android build
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find game -type f -name 'PULSEFALL_MOBILE_ALPHA.apk' | head -n1)"
          if [ -z "$APK" ]; then
            APK="$(find "$HOME/.local/share/godot/builds" -type f -name 'PULSEFALL_MOBILE_ALPHA.apk' | head -n1 || true)"
          fi
          test -n "$APK"
          mkdir -p artifact
          cp "$APK" artifact/PULSEFALL_MOBILE_ALPHA.apk
          cp game/PULSEFALL_README.txt artifact/
          cp game/THIRD_PARTY_NOTICES.txt artifact/
          sha256sum artifact/PULSEFALL_MOBILE_ALPHA.apk > artifact/PULSEFALL_MOBILE_ALPHA_SHA256.txt
          ls -lh artifact/PULSEFALL_MOBILE_ALPHA.apk

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: PULSEFALL_MOBILE_ALPHA
          path: |
            artifact/PULSEFALL_MOBILE_ALPHA.apk
            artifact/PULSEFALL_MOBILE_ALPHA_SHA256.txt
            artifact/PULSEFALL_README.txt
            artifact/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 7
