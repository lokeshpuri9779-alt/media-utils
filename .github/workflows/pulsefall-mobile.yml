          func check(condition: bool, message: String) -> void:
          	checks += 1
          	if not condition:
          		failures += 1
          		push_error(message)


          func _ready() -> void:
          	check(Rules.level_for_credits(-20) == 1, "negative legacy credits fail closed")
          	check(Rules.level_for_credits(0) == 1, "new profile begins at level one")
          	check(Rules.level_for_credits(449) == 1, "level one boundary is stable")
          	check(Rules.level_for_credits(450) == 2, "first permanent stat level unlocks")
          	check(Rules.level_for_credits(1800) == 3, "quadratic level curve remains bounded")
          	check(Rules.integrity_bonus_for_level(1) == 0, "new profile has no hidden integrity boost")
          	check(Rules.integrity_bonus_for_level(2) == 3, "each level grants readable integrity")
          	check(Rules.integrity_bonus_for_level(99) == 30, "integrity bonus has a hard cap")
          	check(is_equal_approx(Rules.cadence_multiplier_for_level(1), 1.0), "new profile keeps baseline cadence")
          	check(Rules.cadence_multiplier_for_level(2) < 1.0, "levels improve weapon cadence")
          	check(Rules.cadence_multiplier_for_level(99) >= 0.88, "permanent cadence bonus has a hard cap")
          	check(Rules.unlocked_modes_for_credits(0) == [0], "carbine is the safe starter weapon")
          	check(Rules.unlocked_modes_for_credits(249) == [0], "scatter cannot unlock early")
