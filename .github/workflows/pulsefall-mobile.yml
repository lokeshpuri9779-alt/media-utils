      - name: Repair upstream mobile asset imports
        shell: bash
        run: |
          set -euxo pipefail
          # The pinned TPS source references this legacy texture name from door.dae,
          # but ships the actual albedo under door/textures.
          cp game/door/textures/door_albedo.png game/door/model/doorsimple_d.png

          python3 - <<'PY'
          import json
          import re
          import struct
          from pathlib import Path

          # Godot 4.7 reports duplicate GLB animation names as import errors.
          # Preserve the first public name and uniquely label later duplicates.
          path = Path("game/player/model/player.glb")
          data = path.read_bytes()
          magic, version, total_length = struct.unpack_from("<4sII", data, 0)
          if magic != b"glTF" or version != 2 or total_length != len(data):
              raise SystemExit("Unexpected player GLB header")
          json_length, json_type = struct.unpack_from("<II", data, 12)
          if json_type != 0x4E4F534A:
              raise SystemExit("Player GLB does not start with a JSON chunk")
          json_start = 20
          json_end = json_start + json_length
          document = json.loads(data[json_start:json_end].rstrip(b" \x00"))
          seen = {}
          renamed = []
          animation_names = [animation.get("name", "") for animation in document.get("animations", [])]
          for animation in document.get("animations", []):
              name = animation.get("name")
              if not name:
                  continue
              # Godot removes import suffixes such as "-cycle", then canonicalizes
              # separators. Preserve the suffix while making the imported name unique.
              suffix_match = re.search(r"-(cycle|loop|noexp)$", name, re.IGNORECASE)
              suffix = suffix_match.group(0) if suffix_match else ""
              stem = name[:-len(suffix)] if suffix else name
              canonical = re.sub(r"[^0-9A-Za-z_]+", "_", stem).strip("_").casefold()
              seen[canonical] = seen.get(canonical, 0) + 1
              if seen[canonical] > 1:
                  unique_name = f"{stem}_Alt_{seen[canonical]}{suffix}"
                  animation["name"] = unique_name
                  renamed.append((name, unique_name))
          print("Source GLB animations:", animation_names)
          payload = json.dumps(document, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
          payload += b" " * ((4 - len(payload) % 4) % 4)
          remainder = data[json_end:]
          output = (
              struct.pack("<4sII", magic, version, 12 + 8 + len(payload) + len(remainder))
              + struct.pack("<II", len(payload), json_type)
              + payload
              + remainder
          )
          path.write_bytes(output)
          print("Renamed duplicate GLB animations:", renamed)

          # Remove the upstream Collada controller whose mesh and skin both contain
          # zero vertices. It is an empty Plane.007 placeholder, not visible geometry.
          dae_path = Path("game/door/model/door.dae")
          dae = dae_path.read_text()
          patterns = (
              r'\s*<geometry id="id-mesh-10"[\s\S]*?</geometry>',
              r'\s*<controller id="id-controller-11"[\s\S]*?</controller>',
              r'\s*<node id="Plane\.007"[\s\S]*?</node>',
          )
          for pattern in patterns:
              dae, count = re.subn(pattern, "", dae, count=1)
              if count != 1:
                  raise SystemExit(f"Expected one empty Collada element for {pattern}")
          dae_path.write_text(dae)

          door_scene_path = Path("game/door/door.tscn")
          door_scene = door_scene_path.read_text()
          door_scene, count = re.subn(
              r'\n\[node name="Plane_007"[\s\S]*?\nskeleton = NodePath\("\.\."\)\n',
              "\n",
              door_scene,
              count=1,
          )
          if count != 1:
              raise SystemExit("Expected one Plane.007 override in door scene")
          door_scene_path.write_text(door_scene)
          PY

      - name: Enforce mobile renderer compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("game/menu/settings.gd")
          s = p.read_text()

          def replace_once(old, new):
              global s
              if s.count(old) != 1:
                  raise SystemExit("Expected one mobile graphics anchor: " + repr(old))
              s = s.replace(old, new, 1)

          # Use settings the mobile renderer actually supports on a fresh install.
          replace_once(
              'scale_filter = Viewport.SCALING_3D_MODE_METALFX_TEMPORAL if metalfx_supported else Viewport.SCALING_3D_MODE_FSR2,',
              'scale_filter = Viewport.SCALING_3D_MODE_BILINEAR,'
          )
          replace_once('ssao_quality = RenderingServer.ENV_SSAO_QUALITY_MEDIUM,', 'ssao_quality = -1,  # Unsupported by the mobile renderer')

          # Clamp previously saved desktop settings too, so upgrades do not retain
          # unsupported FSR2/SSAO/SSIL/fog options from older builds.
          signature = 'func apply_graphics_settings(window: Window, environment: Environment, scene_root: Node) -> void:\n'
          replace_once(
              signature,
              signature + '\tvar mobile_renderer := str(ProjectSettings.get_setting("rendering/renderer/rendering_method", "")) == "mobile" or OS.has_feature("mobile")\n'
          )
          replace_once(
              '\twindow.scaling_3d_mode = Settings.config_file.get_value("video", "scale_filter")',
              '\twindow.scaling_3d_mode = Viewport.SCALING_3D_MODE_BILINEAR if mobile_renderer else Settings.config_file.get_value("video", "scale_filter")'
          )
          replace_once(
              '\twindow.use_taa = Settings.config_file.get_value("rendering", "taa")',
              '\twindow.use_taa = false if mobile_renderer else Settings.config_file.get_value("rendering", "taa")'
          )

          start_marker = '\tif Settings.config_file.get_value("rendering", "ssao_quality") == -1:\n'
          end_marker = '\n\tenvironment.glow_enabled = Settings.config_file.get_value("rendering", "bloom")'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit("Mobile post-processing block anchors missing")
          desktop_block = s[start:end]
          desktop_block = ''.join('\t' + line for line in desktop_block.splitlines(keepends=True))
          safe_block = (
              '\tif mobile_renderer:\n'
              '\t\tenvironment.ssao_enabled = false\n'
              '\t\tenvironment.ssil_enabled = false\n'
              '\telse:\n' + desktop_block
          )
          s = s[:start] + safe_block + s[end:]
          replace_once(
              '\tenvironment.volumetric_fog_enabled = Settings.config_file.get_value("rendering", "volumetric_fog")',
              '\tif not mobile_renderer:\n\t\tenvironment.volumetric_fog_enabled = Settings.config_file.get_value("rendering", "volumetric_fog")'
          )
          p.write_text(s)

          for environment_path in (
              Path("game/level/geometry/environment.tres"),
              Path("game/menu/menu.tscn"),
          ):
              environment_text = environment_path.read_text()
              if environment_text.count("volumetric_fog_enabled = true") != 1:
                  raise SystemExit(f"Expected one embedded volumetric fog setting in {environment_path}")
              environment_path.write_text(environment_text.replace("volumetric_fog_enabled = true", "volumetric_fog_enabled = false", 1))
          PY

