          fi
          if grep -Eiq '[0-9]+ ObjectDB instances were leaked at exit|[0-9]+ resources still in use at exit|RID allocations of type .* were leaked at exit' /tmp/runtime.log /tmp/extraction-test.log; then
            echo "PULSEFALL runtime lifecycle validation detected a shutdown leak."
            exit 1
          fi
          if grep -Eiq 'FSR2 3D scaling is only available|Screen-space ambient occlusion .* only available|Volumetric fog is only available' /tmp/runtime.log; then
            echo "PULSEFALL mobile validation detected unsupported renderer features."
            exit 1
          fi
          if [ "$IMPORT_RC" -ne 0 ] || [ "$RUN_RC" -ne 0 ] || [ "$TEST_RC" -ne 0 ] || [ "$CONTROLS_RC" -ne 0 ] || [ "$AIM_RC" -ne 0 ] || [ "$CAMERA_RC" -ne 0 ] || [ "$COMBAT_RC" -ne 0 ] || [ "$FEEL_RC" -ne 0 ] || [ "$GYRO_RC" -ne 0 ] || [ "$GRAPHICS_RC" -ne 0 ] || [ "$UPGRADES_RC" -ne 0 ] || [ "$RISK_RC" -ne 0 ] || [ "$ARCHETYPES_RC" -ne 0 ] || [ "$MINIBOSS_RC" -ne 0 ] || [ "$BOSS_RC" -ne 0 ] || [ "$WEAPON_RC" -ne 0 ] || [ "$META_RC" -ne 0 ] || [ "$CHECKPOINT_RC" -ne 0 ] || [ "$ELITE_RC" -ne 0 ] || [ "$TELEGRAPH_RC" -ne 0 ] || [ "$FLOW_RC" -ne 0 ]; then
            echo "Godot validation exit codes: import=$IMPORT_RC runtime=$RUN_RC extraction=$TEST_RC controls=$CONTROLS_RC aim=$AIM_RC camera=$CAMERA_RC combat=$COMBAT_RC feel=$FEEL_RC gyro=$GYRO_RC graphics=$GRAPHICS_RC upgrades=$UPGRADES_RC risk=$RISK_RC archetypes=$ARCHETYPES_RC miniboss=$MINIBOSS_RC boss=$BOSS_RC weapons=$WEAPON_RC meta=$META_RC checkpoint=$CHECKPOINT_RC elite=$ELITE_RC telegraph=$TELEGRAPH_RC flow=$FLOW_RC"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android Gradle dependencies
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Export Android AAB
        shell: bash
        run: |
          set -euxo pipefail
          GODOT="$(find /tmp/godot -type f -name 'Godot*_linux.x86_64' | head -n1)"
          test -x "$GODOT"
          TEMPLATE_ROOT="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_ROOT" /tmp/pulsefall-export-templates
          wget -q "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -O /tmp/pulsefall-export-templates.tpz
          unzip -q -o /tmp/pulsefall-export-templates.tpz -d /tmp/pulsefall-export-templates
          cp -a /tmp/pulsefall-export-templates/templates/. "$TEMPLATE_ROOT/"
          test -f "$TEMPLATE_ROOT/android_source.zip"
          # Mirror the pinned engine's default-template installation before its
          # editor starts, avoiding install_android_template's scan_changes().
          test ! -d game/android/build
          mkdir -p game/android/build
          touch game/android/build/.gdignore
          unzip -q "$TEMPLATE_ROOT/android_source.zip" -d game/android/build
          printf '4.7.2.stable\n' > game/android/.build_version
          test -f game/android/build/gradlew
          chmod +x game/android/build/gradlew
          test -f game/android/build/.gdignore
          # Export products must not enter the resource scanner or later exports.
          mkdir -p game/build android-artifacts
          touch game/build/.gdignore
          "$GODOT" --headless --verbose --path game --export-debug "Android AAB" "$GITHUB_WORKSPACE/android-artifacts/PULSEFALL_MOBILE_ALPHA.aab" 2>&1 | tee diagnostics/android-aab-export.log
          test -s android-artifacts/PULSEFALL_MOBILE_ALPHA.aab

      - name: Export Android APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./game
          export_debug: true
          use_preset_export_path: true
          presets_to_export: Android
          verbose: false
          cache: false

      - name: Package Android build
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find game -type f -name 'PULSEFALL_MOBILE_ALPHA.apk' | head -n1)"
          if [ -z "$APK" ]; then
            APK="$(find "$HOME/.local/share/godot/builds" -type f -name 'PULSEFALL_MOBILE_ALPHA.apk' | head -n1 || true)"
          fi
          AAB="android-artifacts/PULSEFALL_MOBILE_ALPHA.aab"
          test -n "$APK"
          test -n "$AAB"
          mkdir -p artifact
          cp "$APK" artifact/PULSEFALL_MOBILE_ALPHA.apk
          cp "$AAB" artifact/PULSEFALL_MOBILE_ALPHA.aab
          cp game/PULSEFALL_README.txt artifact/
          cp game/THIRD_PARTY_NOTICES.txt artifact/
          cp diagnostics/BUILD_SOURCE.txt artifact/
          sha256sum artifact/PULSEFALL_MOBILE_ALPHA.apk > artifact/PULSEFALL_MOBILE_ALPHA_SHA256.txt
          sha256sum artifact/PULSEFALL_MOBILE_ALPHA.aab > artifact/PULSEFALL_MOBILE_ALPHA_AAB_SHA256.txt
          ls -lh artifact/PULSEFALL_MOBILE_ALPHA.apk artifact/PULSEFALL_MOBILE_ALPHA.aab

      - name: Verify APK identity, signature and architecture
        shell: bash
        run: |
          set -euxo pipefail
          APK="artifact/PULSEFALL_MOBILE_ALPHA.apk"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n1)"
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          sha256sum -c artifact/PULSEFALL_MOBILE_ALPHA_SHA256.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING="$("$AAPT" dump badging "$APK" 2>/tmp/aapt-badging.err || true)"
          cat /tmp/aapt-badging.err
          test -n "$BADGING"
          printf '%s\n' "$BADGING"
          grep -Fq "package: name='com.pulsefall.blacksite' versionCode='50' versionName='0.2.30-mobile-alpha'" <<<"$BADGING"
          grep -Fq "application-label:'PULSEFALL'" <<<"$BADGING"
          mapfile -t ABI_DIRS < <(unzip -Z1 "$APK" | awk -F/ '/^lib\/[^/]+\/.*\.so$/ {print $2}' | sort -u)
          test "${#ABI_DIRS[@]}" -eq 1
          test "${ABI_DIRS[0]}" = "arm64-v8a"
          echo "APK PACKAGE CHECKS: 7 FAILURES: 0"
          echo "PACKAGE: com.pulsefall.blacksite"
          echo "VERSION: 50 / 0.2.30-mobile-alpha"
          echo "ABI: arm64-v8a"

          AAB="artifact/PULSEFALL_MOBILE_ALPHA.aab"
          sha256sum -c artifact/PULSEFALL_MOBILE_ALPHA_AAB_SHA256.txt
          unzip -tq "$AAB"
          jarsigner -verify "$AAB"
          unzip -Z1 "$AAB" | grep -Fxq "base/manifest/AndroidManifest.xml"
          mapfile -t AAB_ABI_DIRS < <(unzip -Z1 "$AAB" | awk -F/ '/^base\/lib\/[^/]+\/.*\.so$/ {print $3}' | sort -u)
          test "${#AAB_ABI_DIRS[@]}" -eq 1
          test "${AAB_ABI_DIRS[0]}" = "arm64-v8a"
          echo "AAB PACKAGE CHECKS: 5 FAILURES: 0"
          echo "AAB ABI: arm64-v8a"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PULSEFALL_MOBILE_ALPHA_APK
          path: |
            artifact/PULSEFALL_MOBILE_ALPHA.apk
            artifact/PULSEFALL_MOBILE_ALPHA_SHA256.txt
            artifact/PULSEFALL_README.txt
            artifact/THIRD_PARTY_NOTICES.txt
            artifact/BUILD_SOURCE.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: PULSEFALL_MOBILE_ALPHA_AAB
          path: |
            artifact/PULSEFALL_MOBILE_ALPHA.aab
            artifact/PULSEFALL_MOBILE_ALPHA_AAB_SHA256.txt
            artifact/PULSEFALL_README.txt
            artifact/THIRD_PARTY_NOTICES.txt
            artifact/BUILD_SOURCE.txt
          if-no-files-found: error
          retention-days: 7

      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PULSEFALL_BUILD_DIAGNOSTICS
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
