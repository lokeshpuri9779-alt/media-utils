              "recoil recovery process",
          )
          source += '''


          func apply_weapon_recoil(recoil: Vector2) -> void:
          	camera_base.rotate_y(recoil.x)
          	camera_base.orthonormalize()
          	camera_rot.rotation.x = clampf(camera_rot.rotation.x - recoil.y, CAMERA_X_ROT_MIN, CAMERA_X_ROT_MAX)
          	recoil_return += recoil


          func _recover_recoil(delta: float) -> void:
          	if recoil_return.length_squared() < 0.0000001:
          		recoil_return = Vector2.ZERO
