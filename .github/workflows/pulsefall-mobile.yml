          	check(float(boss_one.radius) < float(boss_two.radius) and float(boss_two.radius) < float(boss_three.radius), "boss warning footprint escalates by phase")
          	check(str(boss_three.name).contains("RED CORE"), "final boss telegraph identifies red-core volley")
          	check(float(boss_three.beacon) > float(boss_one.beacon), "final phase beacon grows with danger")
          	print("TELEGRAPH RULE CHECKS: ", checks, " FAILURES: ", failures)
          	get_tree().quit(0 if failures == 0 else 1)
          PULSEFALL_TELEGRAPH_TEST

          cat > game/mobile/telegraph_rules_test.tscn <<'PULSEFALL_TELEGRAPH_TEST'
