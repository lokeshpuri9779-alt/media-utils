      - name: Add timed extraction and safe escape retries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          p = Path('game/level/level.gd')
          s = p.read_text()
          def replace_once(old, new):
              global s
              if s.count(old) != 1:
                  raise SystemExit('Expected exactly one patch anchor: ' + repr(old))
              s = s.replace(old, new, 1)
          
          replace_once('const TOTAL_WAVES := 5\n', 'const TOTAL_WAVES := 5\nconst EXTRACTION_SECONDS := 60.0\n')
          replace_once('var mission_active := false\n', 'var mission_active := false\nvar extraction_active := false\nvar extraction_remaining := 0.0\nvar extraction_retrying := false\nvar run_completed := false\nvar extraction_confirmed := false\nvar extraction_beacon: ExtractionBeacon = null\n')
          replace_once('func _process(delta: float) -> void:\n', 'func _process(delta: float) -> void:\n\t_tick_extraction(delta)\n')
          replace_once('\tif mission_active:\n\t\tmission_time += delta', '\tif mission_active or extraction_active:\n\t\tmission_time += delta')
          replace_once('func _finish_mission() -> void:\n\tmission_active = false', 'func _finish_mission() -> void:\n\tif run_completed or not extraction_active or not extraction_confirmed:\n\t\treturn\n\trun_completed = true\n\textraction_active = false\n\tobjective_has_position = false\n\tmission_active = false')
          replace_once('func _on_player_died() -> void:\n\tif not mission_active:', 'func _on_player_died() -> void:\n\tif extraction_active:\n\t\t_retry_extraction("player_death")\n\t\treturn\n\tif not mission_active:')
          replace_once('func _begin_extraction() -> void:\n\tmission_active = false', 'func _begin_extraction() -> void:\n\tif run_completed or extraction_active or extraction_retrying:\n\t\treturn\n\tif active_player == null:\n\t\treturn\n\tif active_player.incapacitated:\n\t\tactive_player.revive()\n\textraction_active = true\n\textraction_remaining = EXTRACTION_SECONDS\n\tmission_active = false')
          replace_once('\tvar beacon: ExtractionBeacon = ExtractionBeaconScript.new()\n', '\tvar beacon: ExtractionBeacon = ExtractionBeaconScript.new()\n\textraction_beacon = beacon\n')
          replace_once('func _on_extracted(_beacon: ExtractionBeacon) -> void:\n\tobjective_has_position = false', 'func _on_extracted(_beacon: ExtractionBeacon) -> void:\n\tif not extraction_active or run_completed or _beacon != extraction_beacon:\n\t\treturn\n\tif active_player == null or active_player.incapacitated:\n\t\treturn\n\textraction_confirmed = true\n\tobjective_has_position = false')
          replace_once('"EXTRACTION BEACON ONLINE", 1.4', '"REACH THE BEACON  //  60 SECONDS", 1.4')
          s += '''
          
          func _tick_extraction(delta: float) -> void:
          \tif not extraction_active:
          \t\treturn
          \textraction_remaining = maxf(0.0, extraction_remaining - delta)
          \tif objective_label != null:
          \t\tobjective_label.text = "EXTRACT  //  %02ds REMAINING" % int(ceil(extraction_remaining))
          \tif extraction_remaining <= 0.0:
          \t\t_retry_extraction("timeout")
          
          
          func _retry_extraction(reason: String) -> void:
          \tif not extraction_active or extraction_retrying or run_completed:
          \t\treturn
          \textraction_active = false
          \textraction_retrying = true
          \tobjective_has_position = false
          \tif is_instance_valid(extraction_beacon):
          \t\textraction_beacon.queue_free()
          \textraction_beacon = null
          \tMobileMetrics.record("extraction_retry", {"reason": reason, "score": score, "time_seconds": mission_time})
          \tif objective_label != null:
          \t\tobjective_label.text = "EXTRACTION RETRY  //  RECONSTRUCTING AEGIS"
          \t_show_banner("EXTRACTION MISSED", "RETRYING FROM THE ESCAPE CHECKPOINT", 2.4)
          \tawait get_tree().create_timer(2.5).timeout
          \tif active_player != null:
          \t\tactive_player.revive()
          \textraction_retrying = false
          \t_begin_extraction()
          '''
          # Position objectives in the level's local space before they enter the tree.
          for name, marker in [('beacon', 'spawn_marker'), ('relay', 'spawn_marker'), ('cache', 'marker')]:
              s = s.replace(f'{name}.global_position = {marker}.global_position +', f'{name}.position = to_local({marker}.global_position) +')
              s = s.replace(f'objective_world_position = {name}.global_position', f'objective_world_position = to_global({name}.position)')
          p.write_text(s)
          
          # AnimationTree has no speed_scale property. Drive its manual evaluation with
          # the role/phase speed while retaining its existing blend tree and root motion.
          p = Path('game/enemies/red_robot/red_robot.gd')
          s = p.read_text()
          s = s.replace('animation_tree.speed_scale = animation_speed', 'animation_tree.callback_mode_process = AnimationMixer.ANIMATION_CALLBACK_MODE_PROCESS_MANUAL')
          s = s.replace('animation_tree.speed_scale = maxf(animation_tree.speed_scale,', 'animation_speed = maxf(animation_speed,')
          anchor = 'func _physics_process(delta: float) -> void:\n'
          if s.count(anchor) != 1:
              raise SystemExit('Enemy physics patch anchor missing')
          s = s.replace(anchor, anchor + '\tanimation_tree.advance(delta * animation_speed)\n', 1)
          p.write_text(s)
          PY

          cat > game/mobile/extraction_test.gd <<'GDSCRIPT'
          extends Node
          
          var failures := 0
          
          func _ready() -> void:
          	call_deferred("_run")
          
          func check(condition: bool, message: String) -> void:
          	if not condition:
          		failures += 1
          		push_error(message)
          	else:
          		print("PASS: ", message)
          
          func _run() -> void:
          	var scene: PackedScene = load("res://level/level.tscn")
          	var level = scene.instantiate()
          	var progression = get_tree().root.get_node("MetaProgression")
          	get_tree().root.add_child(level)
          	await get_tree().create_timer(7.0).timeout
          	level.set_process(false)
          	level.active_player.set_physics_process(false)
          	# Scripted enemy-defeat events test the complete director/objective path.
          	# This does not measure player-controlled combat or navigation difficulty.
          	for expected_wave in range(1, level.TOTAL_WAVES + 1):
          		check(level.wave == expected_wave and level.hostiles > 0, "wave %d starts with enemies" % expected_wave)
          		for robot in level.spawned_nodes.get_children():
          			if robot != level.active_player and robot is CharacterBody3D:
          				level._on_robot_exploded(robot)
          				robot.queue_free()
          		await get_tree().create_timer(1.3).timeout
          		if expected_wave == level.TOTAL_WAVES:
          			break
          		for objective in level.get_children():
          			if objective is PulseCache:
          				level.active_player.global_position = objective.global_position
          				await get_tree().create_timer(0.25).timeout
          			elif objective is ObjectiveRelay:
          				objective.hold_seconds = 0.05
          				level.active_player.global_position = objective.global_position
          				await get_tree().create_timer(0.25).timeout
          		await get_tree().create_timer(1.1).timeout
          		check(level.upgrade_panel != null, "wave %d objective unlocks adaptation" % expected_wave)
          		level._choose_run_upgrade("core", "CORE+")
          		await get_tree().create_timer(3.2).timeout
          	check(level.extraction_active, "final boss clear starts physical extraction")
          	level.active_player.revive()
          	var runs_before: int = progression.runs
          	var credits_before: int = progression.credits
          	level._begin_extraction()
          	var beacon = level.extraction_beacon
          	check(level.extraction_active and level.extraction_remaining == 60.0, "escape starts with 60 seconds")
          	level._finish_mission()
          	check(not level.run_completed, "direct completion cannot bypass extraction")
          	level._tick_extraction(60.0)
          	check(level.extraction_retrying and not level.extraction_active, "timeout begins one checkpoint retry")
          	level._on_extracted(beacon)
          	check(progression.runs == runs_before and progression.credits == credits_before, "expired beacon cannot award credits")
          	await get_tree().create_timer(2.7).timeout
          	check(level.extraction_active and not level.extraction_retrying and level.extraction_remaining == 60.0, "timeout resets escape without replaying the boss")
          	level.active_player.take_damage(9999)
          	check(level.extraction_retrying, "death during escape starts recovery")
          	await get_tree().create_timer(2.7).timeout
          	check(level.extraction_active and not level.active_player.incapacitated, "death recovery restores a playable escape")
          	beacon = level.extraction_beacon
          	level.active_player.global_position = beacon.global_position + Vector3(0, 0.8, 0)
          	await get_tree().create_timer(0.25).timeout
          	check(level.run_completed and not level.extraction_active, "physical beacon collision completes escape")
          	check(progression.runs == runs_before + 1 and progression.credits > credits_before, "successful escape awards one run reward")
          	var reward_credits: int = progression.credits
          	level._finish_mission()
          	level._begin_extraction()
          	check(progression.runs == runs_before + 1 and progression.credits == reward_credits and not level.extraction_active, "repeated completion cannot duplicate rewards or restart escape")
          	level.queue_free()
          	await get_tree().process_frame
          	await get_tree().process_frame
          	await get_tree().physics_frame
          	print("EXTRACTION TEST FAILURES: ", failures)
          	get_tree().quit(0 if failures == 0 else 1)
          GDSCRIPT

          cat > game/mobile/extraction_test.tscn <<'SCENE'
          [gd_scene load_steps=2 format=3]
          
          [ext_resource type="Script" path="res://mobile/extraction_test.gd" id="1"]
          
          [node name="ExtractionTests" type="Node"]
          script = ExtResource("1")
          SCENE

      - name: Fix mobile touch ownership and held aim
        shell: bash
        run: |
          cat > game/mobile/mobile_controls.gd <<'PULSEFALL_SOURCE'
          extends CanvasLayer
          
          var level: Node = null
          var left_touch_id := -1
          var right_touch_id := -1
          var left_origin := Vector2.ZERO
          var look_sensitivity := 0.0032
          var joystick_base: Panel
          var joystick_knob: Panel
          var fire_button: Button
          var jump_button: Button
          var recover_button: Button
          var pulse_button: Button
          var weapon_button: Button
          var dash_button: Button
          var button_touches: Dictionary = {}
          
          
          func bind_level(value: Node) -> void:
          	level = value
          
          
          func _ready() -> void:
          	layer = 100
          	if not OS.has_feature("mobile"):
          		visible = false
          		set_process_input(false)
          		return
          	_build_ui()
          
          
          func _build_ui() -> void:
          	var root := Control.new()
          	root.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
          	root.mouse_filter = Control.MOUSE_FILTER_IGNORE
          	add_child(root)
          
          	joystick_base = Panel.new()
          	joystick_base.anchor_left = 0.0
          	joystick_base.anchor_top = 1.0
          	joystick_base.anchor_right = 0.0
          	joystick_base.anchor_bottom = 1.0
          	joystick_base.offset_left = 44
          	joystick_base.offset_top = -250
          	joystick_base.offset_right = 244
          	joystick_base.offset_bottom = -50
          	joystick_base.mouse_filter = Control.MOUSE_FILTER_IGNORE
          	var base_style := StyleBoxFlat.new()
          	base_style.bg_color = Color(0.12, 0.18, 0.25, 0.32)
          	base_style.corner_radius_top_left = 100
          	base_style.corner_radius_top_right = 100
          	base_style.corner_radius_bottom_left = 100
          	base_style.corner_radius_bottom_right = 100
          	base_style.border_width_left = 2
          	base_style.border_width_top = 2
          	base_style.border_width_right = 2
          	base_style.border_width_bottom = 2
          	base_style.border_color = Color(0.35, 0.88, 1.0, 0.45)
          	joystick_base.add_theme_stylebox_override("panel", base_style)
          	root.add_child(joystick_base)
          
          	joystick_knob = Panel.new()
          	if is_instance_valid(joystick_knob):
          		joystick_knob.position = Vector2(61, 61)
          	joystick_knob.size = Vector2(78, 78)
          	joystick_knob.mouse_filter = Control.MOUSE_FILTER_IGNORE
          	var knob_style := StyleBoxFlat.new()
          	knob_style.bg_color = Color(0.36, 0.90, 1.0, 0.55)
          	knob_style.corner_radius_top_left = 50
          	knob_style.corner_radius_top_right = 50
          	knob_style.corner_radius_bottom_left = 50
          	knob_style.corner_radius_bottom_right = 50
          	joystick_knob.add_theme_stylebox_override("panel", knob_style)
          	joystick_base.add_child(joystick_knob)
          
          	fire_button = _make_button("FIRE", Vector2(-170, -235), Vector2(126, 126), Color(1.0, 0.27, 0.32, 0.55))
          	fire_button.button_down.connect(_fire_down)
          	fire_button.button_up.connect(_fire_up)
          	root.add_child(fire_button)
          
          	jump_button = _make_button("JUMP", Vector2(-310, -150), Vector2(108, 108), Color(0.34, 0.84, 1.0, 0.48))
          	jump_button.button_down.connect(func(): Input.vibrate_handheld(16); Input.action_press("jump"))
          	jump_button.button_up.connect(func(): Input.action_release("jump"))
          	root.add_child(jump_button)
          
          	recover_button = _make_button("RECOVER", Vector2(-185, -95), Vector2(132, 58), Color(0.55, 0.44, 0.92, 0.48))
          	recover_button.pressed.connect(_recover)
          	root.add_child(recover_button)
          
          	pulse_button = _make_button("PULSE", Vector2(-310, -275), Vector2(112, 82), Color(0.28, 0.76, 1.0, 0.52))
          	pulse_button.pressed.connect(_pulse)
          	root.add_child(pulse_button)
          
          	weapon_button = _make_button("CARBINE", Vector2(-455, -92), Vector2(128, 62), Color(0.35, 0.58, 0.95, 0.50))
          	weapon_button.pressed.connect(_cycle_weapon)
          	root.add_child(weapon_button)
          
          	dash_button = _make_button("DASH", Vector2(-440, -178), Vector2(110, 72), Color(0.62, 0.38, 1.0, 0.50))
          	dash_button.pressed.connect(_dash)
          	root.add_child(dash_button)
          
          
          func _make_button(label: String, offset: Vector2, button_size: Vector2, tint: Color) -> Button:
          	var b := Button.new()
          	b.mouse_filter = Control.MOUSE_FILTER_IGNORE
          	b.text = label
          	b.anchor_left = 1.0
          	b.anchor_top = 1.0
          	b.anchor_right = 1.0
          	b.anchor_bottom = 1.0
          	b.offset_left = offset.x
          	b.offset_top = offset.y
          	b.offset_right = offset.x + button_size.x
          	b.offset_bottom = offset.y + button_size.y
          	b.add_theme_font_size_override("font_size", 18)
          	var style := StyleBoxFlat.new()
          	style.bg_color = tint
          	style.corner_radius_top_left = int(button_size.y * 0.45)
          	style.corner_radius_top_right = int(button_size.y * 0.45)
          	style.corner_radius_bottom_left = int(button_size.y * 0.45)
          	style.corner_radius_bottom_right = int(button_size.y * 0.45)
          	b.add_theme_stylebox_override("normal", style)
          	var pressed := style.duplicate()
          	pressed.bg_color.a = minf(tint.a + 0.25, 0.9)
          	b.add_theme_stylebox_override("pressed", pressed)
          	return b
          
          
          func _input(event: InputEvent) -> void:
          	if not visible:
          		return
          	if level != null and level.upgrade_panel != null:
          		_release_all_inputs()
          		return
          	var viewport_size := get_viewport().get_visible_rect().size
          	if event is InputEventScreenTouch:
          		if event.pressed:
          			var button := _button_at(event.position)
          			if button != null:
          				button_touches[event.index] = button
          				_press_touch_button(button)
          				return
          			if event.position.x < viewport_size.x * 0.45 and event.position.y > viewport_size.y * 0.42 and left_touch_id == -1:
          				left_touch_id = event.index
          				left_origin = event.position
          				_update_move(event.position)
          			elif event.position.x > viewport_size.x * 0.42 and event.position.y < viewport_size.y * 0.78 and right_touch_id == -1:
          				right_touch_id = event.index
          		else:
          			if button_touches.has(event.index):
          				var button: Button = button_touches[event.index]
          				button_touches.erase(event.index)
          				if not button_touches.values().has(button):
          					_release_touch_button(button)
          				return
          			if event.index == left_touch_id:
          				left_touch_id = -1
          				_release_move()
          			elif event.index == right_touch_id:
          				right_touch_id = -1
          
          	elif event is InputEventScreenDrag:
          		if event.index == left_touch_id:
          			_update_move(event.position)
          		elif event.index == right_touch_id and level != null and level.active_player != null:
          			level.active_player.player_input.rotate_camera(event.relative * look_sensitivity)
          
          
          func _update_move(position: Vector2) -> void:
          	var delta := position - left_origin
          	var radius := 82.0
          	var stick := delta.limit_length(radius) / radius
          	_set_axis("move_left", maxf(-stick.x, 0.0))
          	_set_axis("move_right", maxf(stick.x, 0.0))
          	_set_axis("move_forward", maxf(-stick.y, 0.0))
          	_set_axis("move_back", maxf(stick.y, 0.0))
          	joystick_knob.position = Vector2(61, 61) + stick * 58.0
          
          
          func _set_axis(action: StringName, strength: float) -> void:
          	if strength > 0.02:
          		Input.action_press(action, strength)
          	else:
          		Input.action_release(action)
          
          
          func _release_move() -> void:
          	for action in ["move_left", "move_right", "move_forward", "move_back"]:
          		Input.action_release(action)
          	if is_instance_valid(joystick_knob):
          		joystick_knob.position = Vector2(61, 61)
          
          
          func _fire_down() -> void:
          	if level != null and level.active_player != null:
          		level.active_player.player_input.touch_aim_mode = true
          	Input.vibrate_handheld(18)
          	Input.action_press("aim")
          	Input.action_press("shoot")
          
          
          func _fire_up() -> void:
          	Input.action_release("shoot")
          	Input.action_release("aim")
          
          
          func _pulse() -> void:
          	if level != null and level.has_method("trigger_pulse"):
          		level.trigger_pulse()
          
          
          func _cycle_weapon() -> void:
          	if level == null or level.active_player == null:
          		return
          	weapon_button.text = level.active_player.cycle_weapon()
          	Input.vibrate_handheld(22)
          
          
          func _dash() -> void:
          	if level != null and level.active_player != null:
          		level.active_player.trigger_dash()
          
          
          func _recover() -> void:
          	if level != null and level.active_player != null and level.active_player.has_method("recover_to_checkpoint"):
          		level.active_player.recover_to_checkpoint()
          
          
          func _button_at(position: Vector2) -> Button:
          	for button in [fire_button, jump_button, recover_button, pulse_button, weapon_button, dash_button]:
          		if is_instance_valid(button) and button.is_visible_in_tree() and button.get_global_rect().has_point(position):
          			return button
          	return null
          
          
          func _press_touch_button(button: Button) -> void:
          	if button == fire_button:
          		_fire_down()
          	elif button == jump_button:
          		Input.action_press("jump")
          	elif button == recover_button:
          		_recover()
          	elif button == pulse_button:
          		_pulse()
          	elif button == weapon_button:
          		_cycle_weapon()
          	elif button == dash_button:
          		_dash()
          
          
          func _release_touch_button(button: Button) -> void:
          	if button == fire_button:
          		_fire_up()
          	elif button == jump_button:
          		Input.action_release("jump")
          
          
          func _release_all_inputs() -> void:
          	left_touch_id = -1
          	right_touch_id = -1
          	button_touches.clear()
          	_release_move()
          	_fire_up()
          	Input.action_release("jump")
          
          
          func _process(_delta: float) -> void:
          	if level != null and level.upgrade_panel != null:
          		_release_all_inputs()
          
          
          func _notification(what: int) -> void:
          	if what == NOTIFICATION_APPLICATION_FOCUS_OUT:
          		_release_all_inputs()
          
          
          func _exit_tree() -> void:
          	_release_all_inputs()
          PULSEFALL_SOURCE

          cat > game/player/player_input.gd <<'PULSEFALL_SOURCE'
          class_name PlayerInputSynchronizer
          extends MultiplayerSynchronizer
          
          const CAMERA_CONTROLLER_ROTATION_SPEED: float = 3.0
          const CAMERA_MOUSE_ROTATION_SPEED: float = 0.001
          # A minimum angle lower than or equal to -90 breaks movement if the player is looking upward.
          const CAMERA_X_ROT_MIN: float = deg_to_rad(-89.9)
          const CAMERA_X_ROT_MAX: float = deg_to_rad(70.0)
          
          # Release aiming if the mouse/gamepad button was held for longer than 0.4 seconds.
          # This works well for trackpads and is more accessible by not making long presses a requirement.
          # If the aiming button was held for less than 0.4 seconds, keep aiming until the aiming button is pressed again.
          const AIM_HOLD_THRESHOLD: float = 0.4
          
          # If `true`, the aim button was toggled checked by a short press (instead of being held down).
          var toggled_aim: bool = false
          var touch_aim_mode := false
          
          # The duration the aiming button was held for (in seconds).
          var aiming_timer: float = 0.0
          
          # Synchronized controls
          @export var aiming: bool = false
          @export var shoot_target := Vector3()
          @export var motion := Vector2()
          @export var shooting: bool = false
          # This is handled via RPC for now
          @export var jumping: bool = false
          
          # Camera and effects
          @export var camera_animation: AnimationPlayer
          @export var crosshair: TextureRect
          @export var camera_base: Node3D
          @export var camera_rot: Node3D
          @export var camera_camera: Camera3D
          @export var color_rect: ColorRect
          
          
          func _ready() -> void:
          	if get_multiplayer_authority() == multiplayer.get_unique_id():
          		camera_camera.make_current()
          		Input.set_mouse_mode(Input.MOUSE_MODE_CAPTURED)
          	else:
          		set_process(false)
          		set_process_input(false)
          		color_rect.hide()
          
          
          func _process(delta: float) -> void:
          	motion = Vector2(
          			Input.get_action_strength(&"move_right") - Input.get_action_strength(&"move_left"),
          			Input.get_action_strength(&"move_back") - Input.get_action_strength(&"move_forward"))
          	var camera_move := Vector2(
          			Input.get_action_strength(&"view_right") - Input.get_action_strength(&"view_left"),
          			Input.get_action_strength(&"view_up") - Input.get_action_strength(&"view_down"))
          	var camera_speed_this_frame: float = delta * CAMERA_CONTROLLER_ROTATION_SPEED
          	if aiming:
          		camera_speed_this_frame *= 0.5
          	rotate_camera(camera_move * camera_speed_this_frame)
          	var current_aim := _current_aim()
          
          	if current_aim:
          		aiming_timer += delta
          	else:
          		aiming_timer = 0.0
          
          	if aiming != current_aim:
          		aiming = current_aim
          		if aiming:
          			camera_animation.play("shoot")
          		else:
          			camera_animation.play("far")
          
          	if Input.is_action_just_pressed("jump"):
          		jump.rpc()
          
          	shooting = Input.is_action_pressed("shoot")
          	if shooting:
          		var ch_pos = crosshair.position + crosshair.size * 0.5
          		var ray_from = camera_camera.project_ray_origin(ch_pos)
          		var ray_dir = camera_camera.project_ray_normal(ch_pos)
          
          		var col = get_parent().get_world_3d().direct_space_state.intersect_ray(PhysicsRayQueryParameters3D.create(ray_from, ray_from + ray_dir * 1000, 0b11, Array([self], TYPE_RID, "", null)))
          		if col.is_empty():
          			shoot_target = ray_from + ray_dir * 1000.0
          		else:
          			shoot_target = col.position
          
          		if OS.has_feature("mobile"):
          			var best_target: Node3D = null
          			var best_screen_distance := 150.0
          			var screen_center := camera_camera.get_viewport().get_visible_rect().size * 0.5
          			for candidate in get_tree().get_nodes_in_group("hostile"):
          				if not candidate is Node3D or not is_instance_valid(candidate):
          					continue
          				var target_pos: Vector3 = candidate.global_position + Vector3.UP * 1.2
          				if camera_camera.is_position_behind(target_pos):
          					continue
          				var screen_pos := camera_camera.unproject_position(target_pos)
          				var screen_distance := screen_pos.distance_to(screen_center)
          				if screen_distance < best_screen_distance:
          					best_screen_distance = screen_distance
          					best_target = candidate
          			if best_target != null:
          				shoot_target = best_target.global_position + Vector3.UP * 1.2
          
          	# Fade out to black if falling out of the map. -17 is lower than
          	# the lowest valid position checked the map (which is a bit under -16).
          	# At 15 units below -17 (so -32), the screen turns fully black.
          	var player_transform: Transform3D = get_parent().global_transform
          	if player_transform.origin.y < -17.0:
          		color_rect.modulate.a = minf((-17.0 - player_transform.origin.y) / 15.0, 1.0)
          	else:
          		# Fade out the black ColorRect progressively after being teleported back.
          		color_rect.modulate.a *= 1.0 - delta * 4.0
          
          
          func _input(input_event: InputEvent) -> void:
          	if input_event is InputEventMouseMotion:
          		var camera_speed_this_frame = CAMERA_MOUSE_ROTATION_SPEED
          		if aiming:
          			camera_speed_this_frame *= 0.75
          		rotate_camera(input_event.screen_relative * camera_speed_this_frame)
          
          
          func rotate_camera(move: Vector2) -> void:
          	camera_base.rotate_y(-move.x)
          	# After relative transforms, camera needs to be renormalized.
          	camera_base.orthonormalize()
          	camera_rot.rotation.x = clampf(camera_rot.rotation.x + move.y, CAMERA_X_ROT_MIN, CAMERA_X_ROT_MAX)
          
          
          func get_aim_rotation() -> float:
          	var camera_x_rot: float = clampf(camera_rot.rotation.x, CAMERA_X_ROT_MIN, CAMERA_X_ROT_MAX)
          	# Change aim according to camera rotation.
          	if camera_x_rot >= 0.0: # Aim up.
          		return -camera_x_rot / CAMERA_X_ROT_MAX
          	else: # Aim down.
          		return camera_x_rot / CAMERA_X_ROT_MIN
          
          
          func get_camera_base_quaternion() -> Quaternion:
          	return camera_base.global_transform.basis.get_rotation_quaternion()
          
          
          func get_camera_rotation_basis() -> Basis:
          	return camera_rot.global_transform.basis
          
          
          @rpc("call_local")
          func jump() -> void:
          	jumping = true
          
          
          func _current_aim() -> bool:
          	if touch_aim_mode or OS.has_feature("mobile"):
          		toggled_aim = false
          		return Input.is_action_pressed("aim")
          	if Input.is_action_just_released("aim") and aiming_timer <= AIM_HOLD_THRESHOLD:
          		toggled_aim = true
          		return true
          	if Input.is_action_just_pressed("aim"):
          		toggled_aim = false
          	return toggled_aim or Input.is_action_pressed("aim")
          PULSEFALL_SOURCE

          cat > game/mobile/controls_test.gd <<'PULSEFALL_SOURCE'
          extends Node
          
          class TestLevel extends Node:
          	var active_player = null
          	var upgrade_panel = null
          
          var failures := 0
          var checks := 0
          
          func check(value: bool, message: String) -> void:
          	checks += 1
          	if not value:
          		failures += 1
          		push_error(message)
          	else:
          		print("PASS: ", message)
          
          func touch(controls: Node, index: int, position: Vector2, pressed: bool) -> void:
          	var event := InputEventScreenTouch.new()
          	event.index = index
          	event.position = position
          	event.pressed = pressed
          	controls._input(event)
          
          func _ready() -> void:
          	call_deferred("_run")
          
          func _run() -> void:
          	var controls = load("res://mobile/mobile_controls.gd").new()
          	var fixture := TestLevel.new()
          	add_child(fixture)
          	controls.bind_level(fixture)
          	add_child(controls)
          	controls.visible = true
          	controls._build_ui()
          	await get_tree().process_frame
          	await get_tree().process_frame
          	var fire: Vector2 = controls.fire_button.get_global_rect().get_center()
          	var jump: Vector2 = controls.jump_button.get_global_rect().get_center()
          	var size := get_viewport().get_visible_rect().size
          	var move := Vector2(size.x * 0.15, size.y * 0.6)
          	var look := Vector2(size.x * 0.7, size.y * 0.3)
          	touch(controls, 0, fire, true)
          	check(Input.is_action_pressed("shoot") and Input.is_action_pressed("aim"), "fire touch holds shoot and aim")
          	check(controls.right_touch_id == -1 and controls.left_touch_id == -1, "fire never claims camera or movement")
          	touch(controls, 1, move, true)
          	var drag := InputEventScreenDrag.new()
          	drag.index = 1
          	drag.position = move + Vector2(70, -30)
          	controls._input(drag)
          	check(Input.get_action_strength("move_right") > 0.5 and Input.is_action_pressed("shoot"), "movement and fire work simultaneously")
          	touch(controls, 2, look, true)
          	check(controls.right_touch_id == 2, "third finger independently owns camera")
          	touch(controls, 3, jump, true)
          	check(Input.is_action_pressed("jump") and controls.right_touch_id == 2, "jump touch preserves camera ownership")
          	touch(controls, 3, Vector2.ZERO, false)
          	check(not Input.is_action_pressed("jump") and Input.is_action_pressed("shoot"), "jump release outside button preserves fire")
          	touch(controls, 4, fire, true)
          	touch(controls, 0, Vector2.ZERO, false)
          	check(Input.is_action_pressed("shoot"), "fire remains held while a second fire finger is down")
          	touch(controls, 4, Vector2.ZERO, false)
          	check(not Input.is_action_pressed("shoot") and not Input.is_action_pressed("aim"), "last fire finger releases shoot and aim outside button")
          	touch(controls, 1, Vector2.ZERO, false)
          	check(not Input.is_action_pressed("move_right") and controls.left_touch_id == -1, "movement release clears axis")
          	touch(controls, 0, fire, true)
          	touch(controls, 1, move, true)
          	controls._notification(NOTIFICATION_APPLICATION_FOCUS_OUT)
          	check(not Input.is_action_pressed("shoot") and controls.button_touches.is_empty() and controls.right_touch_id == -1 and controls.left_touch_id == -1, "focus loss clears held touches")
          	touch(controls, 0, fire, true)
          	fixture.upgrade_panel = Control.new()
          	controls._process(0.0)
          	check(not Input.is_action_pressed("shoot"), "upgrade modal releases held fire")
          	touch(controls, 0, fire, true)
          	check(not Input.is_action_pressed("shoot") and controls.button_touches.is_empty(), "upgrade modal blocks gameplay touches")
          	fixture.upgrade_panel.free()
          	fixture.upgrade_panel = null
          	var input = load("res://player/player_input.gd").new()
          	input.touch_aim_mode = true
          	input.toggled_aim = true
          	Input.action_press("aim")
          	check(input._current_aim(), "touch aim follows held fire")
          	Input.action_release("aim")
          	check(not input._current_aim() and not input.toggled_aim, "short fire tap cannot latch touch aim")
          	input.free()
          	touch(controls, 0, fire, true)
          	controls.queue_free()
          	await get_tree().process_frame
          	await get_tree().process_frame
          	check(not Input.is_action_pressed("shoot") and not Input.is_action_pressed("aim"), "scene teardown releases fire and aim")
          	fixture.queue_free()
          	print("CONTROLS CHECKS: ", checks, " FAILURES: ", failures)
          	get_tree().quit(0 if failures == 0 else 1)
          PULSEFALL_SOURCE

          cat > game/mobile/controls_test.tscn <<'PULSEFALL_SOURCE'
          [gd_scene load_steps=2 format=3]
          [ext_resource type="Script" path="res://mobile/controls_test.gd" id="1"]
          [node name="ControlsTests" type="Node"]
          script = ExtResource("1")
          PULSEFALL_SOURCE

      - name: Make mobile aim assist respect cover
        shell: bash
        run: |
          cat > game/mobile/aim_assist.gd <<'PULSEFALL_AIM'
          extends RefCounted
          
          const MAX_RANGE := 60.0
          const RADIUS_FRACTION := 150.0 / 720.0
          
          # Return the nearest visible enemy to the crosshair. Physics cover wins over
          # screen proximity; a blocked candidate must not hide a visible alternative.
          static func select_target(camera: Camera3D, screen_aim: Vector2, candidates: Array[Node], ray_origin: Vector3, exclude: Array[RID]) -> Node3D:
          	var best: Node3D = null
          	var viewport_size := camera.get_viewport().get_visible_rect().size
          	var best_distance := minf(viewport_size.x, viewport_size.y) * RADIUS_FRACTION
          	var space := camera.get_world_3d().direct_space_state
          	for candidate in candidates:
          		if not is_instance_valid(candidate) or not candidate is Node3D or candidate.is_queued_for_deletion():
          			continue
          		var target: Node3D = candidate
          		var position := target.global_position + Vector3.UP * 1.2
          		if ray_origin.distance_squared_to(position) > MAX_RANGE * MAX_RANGE or camera.is_position_behind(position):
          			continue
          		var screen_position := camera.unproject_position(position)
          		if not Rect2(Vector2.ZERO, viewport_size).has_point(screen_position):
          			continue
          		var screen_distance := screen_position.distance_to(screen_aim)
          		if screen_distance >= best_distance:
          			continue
          		var query := PhysicsRayQueryParameters3D.create(ray_origin, position, 0b11, exclude)
          		var hit := space.intersect_ray(query)
          		if not hit.is_empty():
          			var collider: Node = hit.collider as Node
          			if collider != target and (collider == null or not target.is_ancestor_of(collider)):
          				continue
          		best_distance = screen_distance
          		best = target
          	return best
          
          PULSEFALL_AIM

          cat > game/mobile/aim_assist_test.gd <<'PULSEFALL_AIM'
          extends Node3D
          
          const AimAssist = preload("res://mobile/aim_assist.gd")
          var camera: Camera3D
          var failures := 0
          var checks := 0
          
          func check(value: bool, message: String) -> void:
          	checks += 1
          	if value:
          		print("PASS: ", message)
          	else:
          		failures += 1
          		push_error(message)
          
          func target_at(position: Vector3) -> Node3D:
          	var target := Node3D.new()
          	target.position = position
          	add_child(target)
          	var body := StaticBody3D.new()
          	body.position.y = 1.2
          	target.add_child(body)
          	var shape := CollisionShape3D.new()
          	var box := BoxShape3D.new()
          	box.size = Vector3(0.8, 2.4, 0.8)
          	shape.shape = box
          	body.add_child(shape)
          	return target
          
          func wall_at(position: Vector3) -> StaticBody3D:
          	var wall := StaticBody3D.new()
          	wall.position = position
          	add_child(wall)
          	var shape := CollisionShape3D.new()
          	var box := BoxShape3D.new()
          	box.size = Vector3(0.7, 4.0, 0.5)
          	shape.shape = box
          	wall.add_child(shape)
          	return wall
          
          func synced() -> void:
          	await get_tree().physics_frame
          	await get_tree().physics_frame
          
          func select(candidates: Array[Node], excluded: Array[RID] = []) -> Node3D:
          	return AimAssist.select_target(camera, camera.get_viewport().get_visible_rect().size * 0.5, candidates, camera.global_position, excluded)
          
          func _ready() -> void:
          	call_deferred("_run")
          
          func _run() -> void:
          	camera = Camera3D.new()
          	camera.position = Vector3(0, 1.2, 0)
          	add_child(camera)
          	camera.make_current()
          	await synced()
          	check(select([]) == null, "empty enemy group leaves manual aim unchanged")
          	var center := target_at(Vector3(0, 0, -10))
          	await synced()
          	check(select([center]) == center, "visible enemy collider child is accepted")
          	var wall := wall_at(Vector3(0, 1.2, -5))
          	await synced()
          	check(select([center]) == null, "wall blocks crosshair target")
          	var alternative := target_at(Vector3(1.8, 0, -10))
          	await synced()
          	check(select([center, alternative]) == alternative, "blocked nearest target does not hide visible alternative")
          	wall.queue_free()
          	await synced()
          	check(select([alternative, center]) == center, "closest visible enemy wins independent of group order")
          	var behind := target_at(Vector3(0, 0, 10))
          	var distant := target_at(Vector3(0, 0, -80))
          	var side := target_at(Vector3(100, 0, -10))
          	await synced()
          	check(select([behind]) == null, "enemy behind camera is rejected")
          	check(select([distant]) == null, "enemy beyond assistance range is rejected")
          	check(select([side]) == null, "off-screen enemy is rejected")
          	var shooter := wall_at(Vector3(0, 1.2, -1))
          	await synced()
          	check(select([center], [shooter.get_rid()]) == center, "shooter's collision RID is excluded from visibility ray")
          	shooter.queue_free()
          	await synced()
          	var dying := target_at(Vector3(0, 0, -8))
          	await synced()
          	dying.queue_free()
          	check(select([dying]) == null, "enemy queued for removal is not targeted")
          	print("AIM ASSIST CHECKS: ", checks, " FAILURES: ", failures)
          	get_tree().quit(0 if failures == 0 else 1)
          
          PULSEFALL_AIM

          cat > game/mobile/aim_assist_test.tscn <<'PULSEFALL_AIM'
          [gd_scene load_steps=2 format=3]
          [ext_resource type="Script" path="res://mobile/aim_assist_test.gd" id="1"]
          [node name="AimAssistTests" type="Node3D"]
          script = ExtResource("1")
          
          PULSEFALL_AIM

          python3 - <<'PY'
          from pathlib import Path
          p = Path("game/player/player_input.gd")
          s = p.read_text()
          anchor = 'class_name PlayerInputSynchronizer\nextends MultiplayerSynchronizer\n'
          if s.count(anchor) != 1:
              raise SystemExit("Player input class anchor missing")
          s = s.replace(anchor, anchor + '\nconst AimAssist = preload("res://mobile/aim_assist.gd")\n', 1)
          old = 'Array([self], TYPE_RID, "", null)'
          if s.count(old) != 1:
              raise SystemExit("Shooter collision exclusion anchor missing")
          s = s.replace(old, '[get_parent().get_rid()]', 1)
          start_marker = '\t\tif OS.has_feature("mobile"):\n\t\t\tvar best_target: Node3D = null'
          end_marker = '\n\t# Fade out to black'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit("Aim assist block anchors missing")
          s = s[:start] + (
              '\t\tif OS.has_feature("mobile"):\n'
              '\t\t\tvar assist_origin: Vector3 = get_parent().shoot_from.global_position\n'
              '\t\t\tvar best_target := AimAssist.select_target(camera_camera, ch_pos, get_tree().get_nodes_in_group("hostile"), assist_origin, [get_parent().get_rid()])\n'
              '\t\t\tif best_target != null:\n'
              '\t\t\t\tshoot_target = best_target.global_position + Vector3.UP * 1.2\n'
          ) + s[end:]
          p.write_text(s)
          PY

      - name: Add graceful runtime lifecycle soak
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("game/level/level.gd")
          source = path.read_text()
          if "func _exit_tree() -> void:" in source:
              raise SystemExit("Level already defines an exit hook")
          source += """
          
          
          func _exit_tree() -> void:
          	# Explicitly release streamed audio when a run ends or the app exits.
          	# This prevents OGG playback/resource retention across repeated runs.
          	for node in find_children("*", "", true, false):
          		if node is AudioStreamPlayer or node is AudioStreamPlayer2D or node is AudioStreamPlayer3D:
          			node.stop()
          			node.stream = null
          """
          path.write_text(source)
          PY

          cat > game/mobile/runtime_soak_test.gd <<'PULSEFALL_SOAK'
          extends Node

          const LEVEL_SCENE = preload("res://level/level.tscn")
          const CYCLES := 5
          const PHYSICS_FRAMES_PER_CYCLE := 120
          var failures := 0
          var checks := 0

          func check(value: bool, message: String) -> void:
          	checks += 1
          	if value:
          		print("PASS: ", message)
          	else:
          		failures += 1
          		push_error(message)

          func _ready() -> void:
          	call_deferred("_run")

          func _run() -> void:
          	for cycle in range(CYCLES):
          		var level := LEVEL_SCENE.instantiate()
          		level.name = "SoakLevel"
          		add_child(level)
          		for frame in range(PHYSICS_FRAMES_PER_CYCLE):
          			await get_tree().physics_frame
          		check(is_instance_valid(level) and level.is_inside_tree(), "level remains live through soak cycle %d" % (cycle + 1))
          		level.queue_free()
          		await get_tree().process_frame
          		await get_tree().process_frame
          		await get_tree().physics_frame
          		check(get_node_or_null("SoakLevel") == null, "level unloads cleanly after soak cycle %d" % (cycle + 1))
          	print("RUNTIME SOAK CHECKS: ", checks, " CYCLES: ", CYCLES, " FAILURES: ", failures)
          	get_tree().quit(0 if failures == 0 else 1)
          PULSEFALL_SOAK

          cat > game/mobile/runtime_soak_test.tscn <<'PULSEFALL_SOAK'
          [gd_scene load_steps=2 format=3]
          [ext_resource type="Script" path="res://mobile/runtime_soak_test.gd" id="1"]
          [node name="RuntimeSoakTests" type="Node"]
          script = ExtResource("1")
          PULSEFALL_SOAK

      - name: Repair upstream mobile asset imports
        shell: bash
        run: |
          set -euxo pipefail
          # The pinned TPS source references this legacy texture name from door.dae,
          # but ships the actual albedo under door/textures.
          cp game/door/textures/door_albedo.png game/door/model/doorsimple_d.png

          python3 - <<'PY'
          import json
          import re
          import struct
          from pathlib import Path

          # Godot 4.7 reports duplicate GLB animation names as import errors.
          # Preserve the first public name and uniquely label later duplicates.
          path = Path("game/player/model/player.glb")
          data = path.read_bytes()
          magic, version, total_length = struct.unpack_from("<4sII", data, 0)
          if magic != b"glTF" or version != 2 or total_length != len(data):
              raise SystemExit("Unexpected player GLB header")
          json_length, json_type = struct.unpack_from("<II", data, 12)
          if json_type != 0x4E4F534A:
              raise SystemExit("Player GLB does not start with a JSON chunk")
          json_start = 20
          json_end = json_start + json_length
          document = json.loads(data[json_start:json_end].rstrip(b" \x00"))
          seen = {}
          renamed = []
          animation_names = [animation.get("name", "") for animation in document.get("animations", [])]
          for animation in document.get("animations", []):
              name = animation.get("name")
              if not name:
                  continue
              # Godot removes import suffixes such as "-cycle", then canonicalizes
              # separators. Preserve the suffix while making the imported name unique.
              suffix_match = re.search(r"-(cycle|loop|noexp)$", name, re.IGNORECASE)
              suffix = suffix_match.group(0) if suffix_match else ""
              stem = name[:-len(suffix)] if suffix else name
              canonical = re.sub(r"[^0-9A-Za-z_]+", "_", stem).strip("_").casefold()
              seen[canonical] = seen.get(canonical, 0) + 1
              if seen[canonical] > 1:
                  unique_name = f"{stem}_Alt_{seen[canonical]}{suffix}"
                  animation["name"] = unique_name
                  renamed.append((name, unique_name))
          print("Source GLB animations:", animation_names)
          payload = json.dumps(document, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
          payload += b" " * ((4 - len(payload) % 4) % 4)
          remainder = data[json_end:]
          output = (
              struct.pack("<4sII", magic, version, 12 + 8 + len(payload) + len(remainder))
              + struct.pack("<II", len(payload), json_type)
              + payload
              + remainder
          )
          path.write_bytes(output)
          print("Renamed duplicate GLB animations:", renamed)

          # Remove the upstream Collada controller whose mesh and skin both contain
          # zero vertices. It is an empty Plane.007 placeholder, not visible geometry.
          dae_path = Path("game/door/model/door.dae")
          dae = dae_path.read_text()
          patterns = (
              r'\s*<geometry id="id-mesh-10"[\s\S]*?</geometry>',
              r'\s*<controller id="id-controller-11"[\s\S]*?</controller>',
              r'\s*<node id="Plane\.007"[\s\S]*?</node>',
          )
          for pattern in patterns:
              dae, count = re.subn(pattern, "", dae, count=1)
              if count != 1:
                  raise SystemExit(f"Expected one empty Collada element for {pattern}")
          dae_path.write_text(dae)

          door_scene_path = Path("game/door/door.tscn")
          door_scene = door_scene_path.read_text()
          door_scene, count = re.subn(
              r'\n\[node name="Plane_007"[\s\S]*?\nskeleton = NodePath\("\.\."\)\n',
              "\n",
              door_scene,
              count=1,
          )
          if count != 1:
              raise SystemExit("Expected one Plane.007 override in door scene")
          door_scene_path.write_text(door_scene)
          PY

      - name: Enforce mobile renderer compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("game/menu/settings.gd")
          s = p.read_text()

          def replace_once(old, new):
              global s
              if s.count(old) != 1:
                  raise SystemExit("Expected one mobile graphics anchor: " + repr(old))
              s = s.replace(old, new, 1)

          # Use settings the mobile renderer actually supports on a fresh install.
          replace_once(
              'scale_filter = Viewport.SCALING_3D_MODE_METALFX_TEMPORAL if metalfx_supported else Viewport.SCALING_3D_MODE_FSR2,',
              'scale_filter = Viewport.SCALING_3D_MODE_BILINEAR,'
          )
          replace_once('ssao_quality = RenderingServer.ENV_SSAO_QUALITY_MEDIUM,', 'ssao_quality = -1,  # Unsupported by the mobile renderer')

          # Clamp previously saved desktop settings too, so upgrades do not retain
          # unsupported FSR2/SSAO/SSIL/fog options from older builds.
          signature = 'func apply_graphics_settings(window: Window, environment: Environment, scene_root: Node) -> void:\n'
          replace_once(
              signature,
              signature + '\tvar mobile_renderer := str(ProjectSettings.get_setting("rendering/renderer/rendering_method", "")) == "mobile" or OS.has_feature("mobile")\n'
          )
          replace_once(
              '\twindow.scaling_3d_mode = Settings.config_file.get_value("video", "scale_filter")',
              '\twindow.scaling_3d_mode = Viewport.SCALING_3D_MODE_BILINEAR if mobile_renderer else Settings.config_file.get_value("video", "scale_filter")'
          )
          replace_once(
              '\twindow.use_taa = Settings.config_file.get_value("rendering", "taa")',
              '\twindow.use_taa = false if mobile_renderer else Settings.config_file.get_value("rendering", "taa")'
          )

          start_marker = '\tif Settings.config_file.get_value("rendering", "ssao_quality") == -1:\n'
          end_marker = '\n\tenvironment.glow_enabled = Settings.config_file.get_value("rendering", "bloom")'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit("Mobile post-processing block anchors missing")
          desktop_block = s[start:end]
          desktop_block = ''.join('\t' + line for line in desktop_block.splitlines(keepends=True))
          safe_block = (
              '\tif mobile_renderer:\n'
              '\t\tenvironment.ssao_enabled = false\n'
              '\t\tenvironment.ssil_enabled = false\n'
              '\telse:\n' + desktop_block
          )
          s = s[:start] + safe_block + s[end:]
          replace_once(
              '\tenvironment.volumetric_fog_enabled = Settings.config_file.get_value("rendering", "volumetric_fog")',
              '\tif not mobile_renderer:\n\t\tenvironment.volumetric_fog_enabled = Settings.config_file.get_value("rendering", "volumetric_fog")'
          )
          p.write_text(s)

          for environment_path in (
              Path("game/level/geometry/environment.tres"),
              Path("game/menu/menu.tscn"),
          ):
              environment_text = environment_path.read_text()
              if environment_text.count("volumetric_fog_enabled = true") != 1:
                  raise SystemExit(f"Expected one embedded volumetric fog setting in {environment_path}")
              environment_path.write_text(environment_text.replace("volumetric_fog_enabled = true", "volumetric_fog_enabled = false", 1))
          PY

