          	var ratio := float(health) / float(max_spawn_health)
          	var next_phase := 1
          	if ratio <= 0.34:
          		next_phase = 3
          	elif ratio <= 0.67:
          		next_phase = 2
          	if next_phase <= boss_phase:
          		return
          	boss_phase = next_phase
          	if boss_phase == 2:
          		attack_delay = maxf(1.9, attack_delay * 0.72)
          		animation_tree.speed_scale = maxf(animation_tree.speed_scale, 1.18)
