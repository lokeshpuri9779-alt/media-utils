          	check(hostile.extraction_remaining == 60.0, "extraction time cannot exceed authored limit")
          	check(hostile.upgrade_stacks.rapid == 3, "three-tier upgrade cap is enforced")
          	check(hostile.upgrade_stacks.capacitor == 2, "two-tier upgrade cap is enforced")
          	check(not hostile.upgrade_stacks.has("unknown"), "unknown upgrades are discarded")
