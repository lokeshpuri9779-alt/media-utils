      - name: Improve third-person camera collision
        shell: bash
        run: |
          cat > game/mobile/camera_collision.gd <<'PULSEFALL_CAMERA'
          extends RefCounted

          const ARM_LENGTH := 2.4
          const PROBE_RADIUS := 0.22
          const WALL_MARGIN := 0.08
          const CAMERA_NEAR := 0.08
          const ENVIRONMENT_MASK := 1

          static func configure(arm: SpringArm3D, camera: Camera3D, player_rid: RID) -> void:
          	var probe := SphereShape3D.new()
          	probe.radius = PROBE_RADIUS
          	arm.shape = probe
          	arm.spring_length = ARM_LENGTH
          	arm.margin = WALL_MARGIN
          	arm.collision_mask = ENVIRONMENT_MASK
          	if player_rid.is_valid():
          		arm.add_excluded_object(player_rid)
          		arm.set_meta("pulsefall_player_excluded", true)
          	camera.near = CAMERA_NEAR
          PULSEFALL_CAMERA

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source, old, new, label):
              if source.count(old) != 1:
                  raise SystemExit(f"Expected one {label} anchor, found {source.count(old)}")
              return source.replace(old, new, 1)

          path = Path("game/player/player.gd")
          source = path.read_text()
          source = replace_once(
              source,
              "const JUMP_SPEED: float = 5.0\n",
              'const JUMP_SPEED: float = 5.0\nconst MobileCameraCollision = preload("res://mobile/camera_collision.gd")\n',
              "camera collision preload",
          )
          source = replace_once(
              source,
              "@onready var fire_cooldown: Timer = $FireCooldown\n",
              "@onready var fire_cooldown: Timer = $FireCooldown\n@onready var camera_spring_arm: SpringArm3D = $CameraBase/CameraRot/SpringArm3D\n@onready var gameplay_camera: Camera3D = $CameraBase/CameraRot/SpringArm3D/Camera3D\n",
              "camera collision nodes",
          )
          source = replace_once(
              source,
              "\torientation.origin = Vector3()\n",
              "\torientation.origin = Vector3()\n\tMobileCameraCollision.configure(camera_spring_arm, gameplay_camera, get_rid())\n",
              "camera collision setup",
          )
          path.write_text(source)
          PY

          cat > game/mobile/camera_collision_test.gd <<'PULSEFALL_CAMERA'
          extends Node3D

          const CameraCollision = preload("res://mobile/camera_collision.gd")
          var failures := 0
          var checks := 0

          func check(value: bool, message: String) -> void:
          	checks += 1
          	if value:
          		print("PASS: ", message)
          	else:
          		failures += 1
          		push_error(message)

          func _ready() -> void:
          	var player := StaticBody3D.new()
          	add_child(player)
          	var arm := SpringArm3D.new()
          	player.add_child(arm)
          	var camera := Camera3D.new()
          	arm.add_child(camera)
          	CameraCollision.configure(arm, camera, player.get_rid())
          	check(is_equal_approx(arm.spring_length, CameraCollision.ARM_LENGTH), "camera keeps authored third-person distance")
          	check(is_equal_approx(arm.margin, CameraCollision.WALL_MARGIN), "camera maintains a wall-safe collision margin")
          	check(arm.shape is SphereShape3D, "camera uses a swept sphere instead of a thin probe")
          	check(is_equal_approx((arm.shape as SphereShape3D).radius, CameraCollision.PROBE_RADIUS), "camera probe protects the near-plane footprint")
          	check(arm.collision_mask == CameraCollision.ENVIRONMENT_MASK, "camera collision is limited to world geometry")
          	check(bool(arm.get_meta("pulsefall_player_excluded", false)), "camera explicitly excludes the player body")
          	check(is_equal_approx(camera.near, CameraCollision.CAMERA_NEAR), "camera near plane reduces wall clipping")
          	print("CAMERA COLLISION CHECKS: ", checks, " FAILURES: ", failures)
          	get_tree().quit(0 if failures == 0 else 1)
          PULSEFALL_CAMERA

          cat > game/mobile/camera_collision_test.tscn <<'PULSEFALL_CAMERA'
          [gd_scene load_steps=2 format=3]
          [ext_resource type="Script" path="res://mobile/camera_collision_test.gd" id="1"]
          [node name="CameraCollisionTests" type="Node3D"]
          script = ExtResource("1")
          PULSEFALL_CAMERA

      - name: Add hit confirmation and directional damage feedback
        shell: bash
        run: |
          set -euxo pipefail

          cat > game/mobile/combat_feedback.gd <<'PULSEFALL_COMBAT'
          class_name CombatFeedback
          extends RefCounted

          const HIT_MARKER_TIME := 0.14
          const DAMAGE_INDICATOR_TIME := 0.65


          static func classify_damage_direction(player_basis: Basis, attacker_position: Vector3, player_position: Vector3) -> String:
          	var offset := attacker_position - player_position
          	offset.y = 0.0
          	if offset.length_squared() < 0.0001:
          		return "FRONT"
          	var local_direction := player_basis.inverse() * offset.normalized()
          	if absf(local_direction.x) > absf(local_direction.z):
          		return "RIGHT" if local_direction.x > 0.0 else "LEFT"
          	return "BACK" if local_direction.z > 0.0 else "FRONT"


          static func direction_glyph(direction: String) -> String:
          	match direction:
          		"RIGHT": return ">"
          		"BACK": return "v"
          		"LEFT": return "<"
          		_: return "^"
          PULSEFALL_COMBAT

          python3 - <<'PY'
          from pathlib import Path

          player = Path("game/player/player.gd")
          source = player.read_text()
          source = source.replace(
              'extends CharacterBody3D\n',
              'extends CharacterBody3D\n\nconst CombatFeedbackScript: Script = preload("res://mobile/combat_feedback.gd")\n',
              1
          )
          source = source.replace(
              'signal died\n',
              'signal died\nsignal hit_confirmed\nsignal damage_received(direction: String)\n',
              1
          )
          damage_signature = 'func take_damage(amount: int) -> void:'
          if damage_signature not in source:
              raise SystemExit("player damage signature missing")
          source = source.replace(
              damage_signature,
              'func take_damage(amount: int, attacker_position: Vector3 = Vector3.INF) -> void:',
              1
          )
          health_anchor = '\thealth_changed.emit(health, max_health)\n\tif health <= 0:'
          if health_anchor not in source:
              raise SystemExit("player health notification anchor missing")
          source = source.replace(
              health_anchor,
              '\thealth_changed.emit(health, max_health)\n\tif attacker_position != Vector3.INF:\n\t\tdamage_received.emit(CombatFeedbackScript.classify_damage_direction(global_transform.basis, attacker_position, global_position))\n\tif health <= 0:',
              1
          )
          source = source.replace(
              '\tbullet.add_collision_exception_with(self)\n',
              '\tbullet.add_collision_exception_with(self)\n\tbullet.shooter = self\n',
              1
          )
          source += '''


          func register_hit_confirm() -> void:
          	hit_confirmed.emit()
          '''
          player.write_text(source)

          bullet = Path("game/player/bullet/bullet.gd")
          source = bullet.read_text()
          source = source.replace(
              'var hit: bool = false\n',
              'var hit: bool = false\nvar shooter: Node = null\n',
              1
          )
          source = source.replace(
              '\t\t\tcollider.hit.rpc()\n',
              '\t\t\tcollider.hit.rpc()\n\t\t\tif shooter != null and shooter.has_method("register_hit_confirm"):\n\t\t\t\tshooter.register_hit_confirm()\n',
              1
          )
          bullet.write_text(source)

          enemy = Path("game/enemies/red_robot/red_robot.gd")
          source = enemy.read_text()
          if 'player.take_damage(shot_damage)' not in source:
              raise SystemExit("enemy damage anchor missing")
          source = source.replace('player.take_damage(shot_damage)', 'player.take_damage(shot_damage, ray_origin)', 1)
          enemy.write_text(source)

          level = Path("game/level/level.gd")
          source = level.read_text()
          source = source.replace(
              'var boss_label: Label\n',
              'var boss_label: Label\nvar hit_marker: Label\nvar damage_indicator: Label\nvar hit_marker_time := 0.0\nvar damage_indicator_time := 0.0\n',
              1
          )
          source = source.replace(
              '\t\tactive_player.died.connect(_on_player_died)\n',
              '\t\tactive_player.died.connect(_on_player_died)\n\t\tactive_player.hit_confirmed.connect(_on_hit_confirmed)\n\t\tactive_player.damage_received.connect(_on_damage_received)\n',
              1
          )
          source = source.replace(
              '\t\ttimer_label.text = "%02d:%02d" % [mins, secs]\n',
              '\t\ttimer_label.text = "%02d:%02d" % [mins, secs]\n\t_process_combat_feedback(delta)\n',
              1
          )
          hud_anchor = '''\tvar health_panel := ColorRect.new()
          '''
          hud_nodes = '''\thit_marker = _make_label("+", 34, Color(0.42, 0.96, 1.0))
          	hit_marker.anchor_left = 0.5
          	hit_marker.anchor_right = 0.5
          	hit_marker.anchor_top = 0.5
          	hit_marker.anchor_bottom = 0.5
          	hit_marker.offset_left = -24
          	hit_marker.offset_right = 24
          	hit_marker.offset_top = -28
          	hit_marker.offset_bottom = 28
          	hit_marker.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
          	hit_marker.vertical_alignment = VERTICAL_ALIGNMENT_CENTER
          	hit_marker.visible = false
          	layer.add_child(hit_marker)

          	damage_indicator = _make_label("", 24, Color(1.0, 0.30, 0.34))
          	damage_indicator.anchor_left = 0.5
          	damage_indicator.anchor_right = 0.5
          	damage_indicator.anchor_top = 0.28
          	damage_indicator.anchor_bottom = 0.28
          	damage_indicator.offset_left = -120
          	damage_indicator.offset_right = 120
          	damage_indicator.offset_top = -20
          	damage_indicator.offset_bottom = 20
          	damage_indicator.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
          	damage_indicator.visible = false
          	layer.add_child(damage_indicator)

          	var health_panel := ColorRect.new()
          '''
          if hud_anchor not in source:
              raise SystemExit("HUD anchor missing")
          source = source.replace(hud_anchor, hud_nodes, 1)
          source += '''


          func _on_hit_confirmed() -> void:
          	hit_marker_time = CombatFeedback.HIT_MARKER_TIME
          	hit_marker.modulate = Color(0.42, 0.96, 1.0, 1.0)
          	hit_marker.visible = true


          func _on_damage_received(direction: String) -> void:
          	damage_indicator_time = CombatFeedback.DAMAGE_INDICATOR_TIME
          	damage_indicator.text = "%s  HIT FROM %s  %s" % [CombatFeedback.direction_glyph(direction), direction, CombatFeedback.direction_glyph(direction)]
          	damage_indicator.modulate = Color(1.0, 0.30, 0.34, 1.0)
          	damage_indicator.visible = true


          func _process_combat_feedback(delta: float) -> void:
          	if hit_marker_time > 0.0:
          		hit_marker_time = maxf(hit_marker_time - delta, 0.0)
          		hit_marker.modulate.a = hit_marker_time / CombatFeedback.HIT_MARKER_TIME
          		hit_marker.visible = hit_marker_time > 0.0
          	if damage_indicator_time > 0.0:
          		damage_indicator_time = maxf(damage_indicator_time - delta, 0.0)
          		damage_indicator.modulate.a = damage_indicator_time / CombatFeedback.DAMAGE_INDICATOR_TIME
          		damage_indicator.visible = damage_indicator_time > 0.0
          '''
          level.write_text(source)
          PY

          cat > game/mobile/combat_feedback_test.gd <<'PULSEFALL_COMBAT_TEST'
          extends Node

          var failures := 0
          var checks := 0


          func check(value: bool, message: String) -> void:
          	checks += 1
          	if value:
          		print("PASS: ", message)
          	else:
          		failures += 1
          		push_error("FAIL: " + message)


          func _ready() -> void:
          	var basis := Basis.IDENTITY
          	var origin := Vector3.ZERO
          	check(CombatFeedback.classify_damage_direction(basis, Vector3(0, 0, -5), origin) == "FRONT", "front damage classification")
          	check(CombatFeedback.classify_damage_direction(basis, Vector3(5, 0, 0), origin) == "RIGHT", "right damage classification")
          	check(CombatFeedback.classify_damage_direction(basis, Vector3(0, 0, 5), origin) == "BACK", "back damage classification")
          	check(CombatFeedback.classify_damage_direction(basis, Vector3(-5, 0, 0), origin) == "LEFT", "left damage classification")
          	check(CombatFeedback.classify_damage_direction(basis, origin, origin) == "FRONT", "overlap damage classification is deterministic")
          	check(CombatFeedback.direction_glyph("FRONT") == "^", "front glyph")
