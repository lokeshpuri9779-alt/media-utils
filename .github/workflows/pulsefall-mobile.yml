          	check(restored.graphics_preset == 2, "persisted graphics preset is clamped and restored")
          	if directory and directory.file_exists("graphics_preset_test.cfg"):
          		directory.remove("graphics_preset_test.cfg")
          	print("GRAPHICS PRESET CHECKS: ", checks, " FAILURES: ", failures)
          	get_tree().quit(0 if failures == 0 else 1)
