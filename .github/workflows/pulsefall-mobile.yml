          	check(Rules.unlocked_modes_for_credits(899) == [0, 1], "lance cannot unlock early")
          	check(Rules.unlocked_modes_for_credits(900) == [0, 1, 2], "lance unlock threshold is inclusive")
          	var profile := Rules.new()
          	profile.credits = 0
          	check(profile.next_weapon_mode(0) == 0, "locked arsenal cannot cycle into unavailable gear")
          	check(not profile.is_weapon_unlocked(1), "locked scatter reports unavailable")
          	check(profile.arsenal_status().contains("SCATTER"), "starter status names the next unlock")
          	profile.credits = 250
          	check(profile.next_weapon_mode(0) == 1, "scatter joins the cycle after unlocking")
          	check(profile.next_weapon_mode(1) == 0, "two-weapon cycle wraps safely")
          	check(profile.is_weapon_unlocked(1), "scatter reports permanently unlocked")
          	check(profile.arsenal_status().contains("LANCE"), "mid-tier status names the next unlock")
          	profile.credits = 900
          	check(profile.next_weapon_mode(1) == 2, "lance joins the cycle after unlocking")
          	check(profile.next_weapon_mode(2) == 0, "complete arsenal wraps to carbine")
