      - name: Add stack-aware run upgrade synergies
        shell: bash
        run: |
          set -euxo pipefail

          cat > game/mobile/run_upgrades.gd <<'PULSEFALL_UPGRADES'
          class_name RunUpgrades
          extends RefCounted

          const DEFINITIONS := {
          	"rapid": {"title": "RAPID FIRE", "description": "Faster weapon cycle", "max_stacks": 3, "tag": "WEAPON"},
          	"core": {"title": "CORE+", "description": "+18 max integrity", "max_stacks": 3, "tag": "DEFENSE"},
          	"mobility": {"title": "MOBILITY", "description": "Faster traversal", "max_stacks": 3, "tag": "MOVEMENT"},
          	"armor": {"title": "ARMOR", "description": "Reduce incoming damage", "max_stacks": 3, "tag": "DEFENSE"},
          	"capacitor": {"title": "PULSE CAPACITOR", "description": "Shorter PULSE cooldown", "max_stacks": 2, "tag": "ABILITY"},
          	"phase_drive": {"title": "PHASE DRIVE", "description": "Shorter DASH cooldown", "max_stacks": 2, "tag": "MOVEMENT"},
          }

          const SYNERGIES := {
          	"overcharge": {"title": "OVERCHARGE", "requires": {"rapid": 2, "capacitor": 1}},
          	"bulwark": {"title": "BULWARK", "requires": {"core": 2, "armor": 2}},
          	"phase_hunter": {"title": "PHASE HUNTER", "requires": {"mobility": 2, "phase_drive": 1}},
          }


          static func stack_count(stacks: Dictionary, upgrade_id: String) -> int:
          	return maxi(int(stacks.get(upgrade_id, 0)), 0)


          static func add_stack(stacks: Dictionary, upgrade_id: String) -> Dictionary:
          	var result := stacks.duplicate(true)
          	if not DEFINITIONS.has(upgrade_id):
          		return result
          	var maximum := int(DEFINITIONS[upgrade_id].max_stacks)
          	result[upgrade_id] = mini(stack_count(result, upgrade_id) + 1, maximum)
          	return result


          static func available_choices(stacks: Dictionary) -> Array[Dictionary]:
          	var choices: Array[Dictionary] = []
          	for upgrade_id in DEFINITIONS:
          		var definition: Dictionary = DEFINITIONS[upgrade_id]
          		var count := stack_count(stacks, upgrade_id)
          		var maximum := int(definition.max_stacks)
          		if count >= maximum:
          			continue
          		var next_tier := count + 1
          		choices.append({
          			"id": upgrade_id,
          			"title": "%s  %s" % [definition.title, _roman(next_tier)],
          			"description": "%s  [%s]" % [definition.description, definition.tag],
          			"tier": next_tier,
          			"max_stacks": maximum,
          		})
          	return choices


          static func active_synergies(stacks: Dictionary) -> Array[String]:
          	var active: Array[String] = []
          	for synergy_id in SYNERGIES:
          		var requirements: Dictionary = SYNERGIES[synergy_id].requires
          		var unlocked := true
          		for upgrade_id in requirements:
          			if stack_count(stacks, upgrade_id) < int(requirements[upgrade_id]):
          				unlocked = false
          				break
          		if unlocked:
          			active.append(synergy_id)
          	active.sort()
          	return active


          static func newly_unlocked(before: Dictionary, after: Dictionary) -> Array[String]:
          	var previous := active_synergies(before)
          	var unlocked: Array[String] = []
          	for synergy_id in active_synergies(after):
          		if not previous.has(synergy_id):
          			unlocked.append(synergy_id)
          	return unlocked


          static func synergy_title(synergy_id: String) -> String:
          	if not SYNERGIES.has(synergy_id):
          		return synergy_id.to_upper()
          	return str(SYNERGIES[synergy_id].title)


          static func synergy_summary(stacks: Dictionary) -> String:
          	var titles: Array[String] = []
          	for synergy_id in active_synergies(stacks):
          		titles.append(synergy_title(synergy_id))
          	return "NONE" if titles.is_empty() else ", ".join(titles)


          static func _roman(tier: int) -> String:
          	match clampi(tier, 1, 3):
          		2:
          			return "II"
          		3:
          			return "III"
          		_:
          			return "I"
          PULSEFALL_UPGRADES

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {label} anchor, found {count}")
              return source.replace(old, new, 1)

          level_path = Path("game/level/level.gd")
          source = level_path.read_text()
          source = replace_once(
              source,
              "extends Node3D\n",
              'extends Node3D\n\nconst RunUpgradesScript = preload("res://mobile/run_upgrades.gd")\n',
              "upgrade level preload",
          )
          source = replace_once(
              source,
              "var first_upgrade_recorded := false\n",
              "var first_upgrade_recorded := false\nvar upgrade_stacks: Dictionary = {}\nvar pulse_cooldown_multiplier := 1.0\n",
              "upgrade run state",
          )
          source = replace_once(
              source,
              "\tpulse_cooldown = 16.0\n",
              "\tpulse_cooldown = 16.0 * pulse_cooldown_multiplier\n",
              "pulse cooldown scaling",
          )
