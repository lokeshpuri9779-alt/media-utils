          	var yaw := 0.0025
          	match weapon_mode:
          		1:
          			pitch = 0.020
          			yaw = 0.0055
          		2:
          			pitch = 0.014
          			yaw = 0.0035
          	var side := -1.0 if shot_index % 2 == 0 else 1.0
          	return Vector2(clampf(yaw * side, -MAX_RECOIL_YAW, MAX_RECOIL_YAW), clampf(pitch, 0.0, MAX_RECOIL_PITCH))
          PULSEFALL_FEEL

