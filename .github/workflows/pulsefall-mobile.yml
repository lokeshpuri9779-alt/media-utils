      - name: Add safe mobile run resume checkpoints
        shell: bash
        run: |
          set -euxo pipefail

          cat > game/mobile/run_checkpoint.gd <<'PULSEFALL_CHECKPOINT'
          extends Node

          const SAVE_PATH := "user://pulsefall_run_checkpoint.json"
          const SAVE_VERSION := 1
          const MAX_AGE_SECONDS := 604800
          const VALID_PHASES := ["wave", "extraction"]
          const UPGRADE_CAPS := {
          	"rapid": 3,
          	"core": 3,
          	"mobility": 3,
          	"armor": 3,
          	"capacitor": 2,
          	"phase_drive": 2,
          }


          static func sanitize_state(raw) -> Dictionary:
          	if not raw is Dictionary:
          		return {}
          	var phase := str(raw.get("phase", ""))
          	if not VALID_PHASES.has(phase):
          		return {}
          	var saved_wave := clampi(int(raw.get("wave", 1)), 1, 5)
          	var stacks: Dictionary = {}
          	var raw_stacks = raw.get("upgrade_stacks", {})
          	if raw_stacks is Dictionary:
          		for upgrade_id in UPGRADE_CAPS:
          			var count := clampi(int(raw_stacks.get(upgrade_id, 0)), 0, int(UPGRADE_CAPS[upgrade_id]))
          			if count > 0:
          				stacks[upgrade_id] = count
          	return {
          		"save_version": SAVE_VERSION,
          		"phase": phase,
          		"wave": saved_wave,
          		"score": maxi(int(raw.get("score", 0)), 0),
          		"mission_time": clampf(float(raw.get("mission_time", 0.0)), 0.0, 7200.0),
          		"extraction_remaining": clampf(float(raw.get("extraction_remaining", 60.0)), 1.0, 60.0),
          		"upgrade_stacks": stacks,
          		"saved_at": maxi(int(raw.get("saved_at", 0)), 0),
          	}


          static func is_expired(state: Dictionary, now_unix: int) -> bool:
          	var saved_at := int(state.get("saved_at", 0))
          	return saved_at <= 0 or now_unix - saved_at > MAX_AGE_SECONDS


          func save_checkpoint(raw: Dictionary) -> bool:
          	var state := sanitize_state(raw)
          	if state.is_empty():
          		return false
          	state.saved_at = int(Time.get_unix_time_from_system())
          	var file := FileAccess.open(SAVE_PATH, FileAccess.WRITE)
          	if file == null:
          		return false
          	file.store_string(JSON.stringify(state))
          	return true


          func load_checkpoint() -> Dictionary:
          	if not FileAccess.file_exists(SAVE_PATH):
          		return {}
          	var file := FileAccess.open(SAVE_PATH, FileAccess.READ)
          	if file == null:
          		return {}
          	var encoded := file.get_as_text()
          	file.close()
          	# Instance parsing returns an error code for corrupt saves without
          	# emitting an engine error. Unexpected engine errors stay fatal in CI.
          	var parser := JSON.new()
          	if parser.parse(encoded) != OK:
          		clear_checkpoint()
          		return {}
          	var state := sanitize_state(parser.data)
          	if state.is_empty() or is_expired(state, int(Time.get_unix_time_from_system())):
          		clear_checkpoint()
          		return {}
          	return state


          func clear_checkpoint() -> void:
          	if FileAccess.file_exists(SAVE_PATH):
          		DirAccess.remove_absolute(ProjectSettings.globalize_path(SAVE_PATH))
          PULSEFALL_CHECKPOINT

          python3 - <<'PY'
          from pathlib import Path

          project = Path("game/project.godot")
          source = project.read_text()
          anchor = 'MetaProgression="*res://mobile/meta_progression.gd"'
          if source.count(anchor) != 1:
              raise SystemExit("meta autoload anchor missing")
          source = source.replace(anchor, anchor + '\nRunCheckpoint="*res://mobile/run_checkpoint.gd"', 1)
          project.write_text(source)

          level = Path("game/level/level.gd")
          source = level.read_text()

          ready_anchor = '\tawait get_tree().create_timer(0.5).timeout\n\tif MetaProgression.runs == 0:'
          ready_replacement = '''	var resume_state := RunCheckpoint.load_checkpoint()
          	if not resume_state.is_empty():
          		await get_tree().create_timer(0.25).timeout
          		await _restore_run_checkpoint(resume_state)
          		return

          	await get_tree().create_timer(0.5).timeout
          	if MetaProgression.runs == 0:'''
          if source.count(ready_anchor) != 1:
              raise SystemExit("resume ready anchor missing")
          source = source.replace(ready_anchor, ready_replacement, 1)

          wave_anchor = '''	if wave > TOTAL_WAVES:
          		_finish_mission()
          		return

          	hostiles = 0'''
          wave_replacement = '''	if wave > TOTAL_WAVES:
          		_finish_mission()
          		return

          	RunCheckpoint.save_checkpoint(_capture_run_checkpoint("wave"))
          	hostiles = 0'''
          if source.count(wave_anchor) != 1:
              raise SystemExit("wave checkpoint anchor missing")
          source = source.replace(wave_anchor, wave_replacement, 1)

          extraction_anchor = '\textraction_remaining = EXTRACTION_SECONDS\n\tmission_active = false'
          extraction_replacement = '\textraction_remaining = EXTRACTION_SECONDS\n\tRunCheckpoint.save_checkpoint(_capture_run_checkpoint("extraction"))\n\tmission_active = false'
          if source.count(extraction_anchor) != 1:
              raise SystemExit("extraction checkpoint anchor missing")
          source = source.replace(extraction_anchor, extraction_replacement, 1)

          reward_anchor = '\tvar reward := MetaProgression.complete_run(score, mission_time)\n'
          if source.count(reward_anchor) != 1:
              raise SystemExit("completion checkpoint anchor missing")
          source = source.replace(reward_anchor, reward_anchor + '\tRunCheckpoint.clear_checkpoint()\n', 1)

          source += '''


          func _capture_run_checkpoint(phase: String) -> Dictionary:
          	return {
          		"phase": phase,
          		"wave": clampi(wave, 1, TOTAL_WAVES),
          		"score": score,
          		"mission_time": mission_time,
          		"extraction_remaining": extraction_remaining if extraction_active else EXTRACTION_SECONDS,
          		"upgrade_stacks": upgrade_stacks.duplicate(true),
          	}


          func _restore_run_upgrades(saved_stacks: Dictionary) -> void:
          	upgrade_stacks = {}
          	pulse_cooldown_multiplier = 1.0
          	for upgrade_id in RunUpgradesScript.DEFINITIONS:
          		var count := clampi(int(saved_stacks.get(upgrade_id, 0)), 0, int(RunUpgradesScript.DEFINITIONS[upgrade_id].max_stacks))
          		for stack_index in range(count):
          			upgrade_stacks = RunUpgradesScript.add_stack(upgrade_stacks, upgrade_id)
          			active_player.apply_run_upgrade(upgrade_id)
          			if upgrade_id == "capacitor":
          				pulse_cooldown_multiplier = maxf(0.62, pulse_cooldown_multiplier * 0.84)
          	for synergy_id in RunUpgradesScript.active_synergies(upgrade_stacks):
          		match synergy_id:
          			"overcharge":
          				active_player.apply_run_upgrade("overcharge")
          				pulse_cooldown_multiplier = maxf(0.52, pulse_cooldown_multiplier * 0.85)
          			"bulwark":
          				active_player.apply_run_upgrade("bulwark")
          			"phase_hunter":
          				active_player.apply_run_upgrade("phase_hunter")


          func _restore_run_checkpoint(state: Dictionary) -> void:
          	score = maxi(int(state.get("score", 0)), 0)
          	mission_time = maxf(float(state.get("mission_time", 0.0)), 0.0)
          	_restore_run_upgrades(state.get("upgrade_stacks", {}))
          	MobileMetrics.record("run_resumed", {
          		"phase": state.phase,
          		"wave": state.wave,
          		"score": score,
          		"time_seconds": mission_time,
          	})
          	_show_banner("RUN RESUMED", "SAFE CHECKPOINT  //  WAVE %02d" % int(state.wave), 1.6)
          	await get_tree().create_timer(1.0).timeout
          	if str(state.phase) == "extraction":
          		wave = int(state.wave)
          		_begin_extraction()
          		return
          	wave = int(state.wave) - 1
          	mission_active = true
          	_start_wave()


          func _notification(what: int) -> void:
          	if what != NOTIFICATION_APPLICATION_FOCUS_OUT:
          		return
          	if extraction_active and not run_completed:
          		RunCheckpoint.save_checkpoint(_capture_run_checkpoint("extraction"))
          	MobileMetrics.record("application_backgrounded", {
          		"wave": wave,
          		"score": score,
          		"extraction": extraction_active,
          	})
          '''
          level.write_text(source)
          PY

          cat > game/mobile/run_checkpoint_test.gd <<'PULSEFALL_CHECKPOINT_TEST'
          extends Node

          const Rules = preload("res://mobile/run_checkpoint.gd")
          var checks := 0
          var failures := 0


          func check(condition: bool, message: String) -> void:
