          func _ready() -> void:
          	check(Rules.charge_ratio(1.0, 1.0) == 0.0, "charge begins empty")
          	check(is_equal_approx(Rules.charge_ratio(0.5, 1.0), 0.5), "charge reaches half at midpoint")
          	check(Rules.charge_ratio(0.0, 1.0) == 1.0, "charge completes at firing window")
          	check(Rules.charge_ratio(-1.0, 1.0) == 1.0, "negative remaining time clamps safely")
          	check(Rules.charge_ratio(1.0, 0.0) == 0.0, "zero duration fails safely")
          	check(Rules.opacity(0.0) >= 0.28, "telegraph remains visible at charge start")
          	check(Rules.opacity(1.0) >= 0.89, "telegraph becomes highly visible before firing")
