          	payload["unix"] = Time.get_unix_time_from_system()
          	var file := FileAccess.open(PATH, FileAccess.READ_WRITE)
          	if file == null:
          		file = FileAccess.open(PATH, FileAccess.WRITE)
          	if file == null:
          		return
          	file.seek_end()
          	file.store_line(JSON.stringify(payload))
