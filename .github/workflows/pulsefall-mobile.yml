      - name: Add readable tactical elite variants
        shell: bash
        run: |
          set -euxo pipefail

          cat > game/mobile/elite_rules.gd <<'PULSEFALL_ELITES'
          class_name EliteRules
          extends RefCounted

          const NONE := "none"
          const BULWARK := "bulwark"
          const PHASE_STALKER := "phase_stalker"
          const VOLT_ARTILLERY := "volt_artillery"
          const VARIANTS := [BULWARK, PHASE_STALKER, VOLT_ARTILLERY]

          static func normalize(variant: String) -> String:
          	return variant if VARIANTS.has(variant) else NONE

          static func should_promote(wave: int, spawn_index: int) -> bool:
          	return wave >= 2 and wave <= 4 and spawn_index == (wave + 1) % 3

          static func variant_for_spawn(wave: int, spawn_index: int) -> String:
          	if not should_promote(wave, spawn_index):
          		return NONE
          	return VARIANTS[(wave + spawn_index) % VARIANTS.size()]

          static func profile(variant: String) -> Dictionary:
          	match normalize(variant):
          		BULWARK:
          			return {"title": "AEGIS BULWARK", "counter": "FLANK GREEN ARMOR // SUSTAINED FIRE", "health": 1.80, "damage": 0.88, "delay": 1.18, "animation": 0.82, "scale": 1.24, "score": 1.75, "color": Color(0.25, 1.0, 0.42)}
          		PHASE_STALKER:
          			return {"title": "PHASE STALKER", "counter": "TRACK MAGENTA // BREAK ITS RUSH", "health": 0.90, "damage": 1.18, "delay": 0.72, "animation": 1.32, "scale": 0.96, "score": 1.55, "color": Color(1.0, 0.20, 0.82)}
          		VOLT_ARTILLERY:
          			return {"title": "VOLT ARTILLERY", "counter": "DODGE BLUE CHARGE // CLOSE DISTANCE", "health": 1.20, "damage": 1.48, "delay": 1.28, "animation": 0.92, "scale": 1.12, "score": 1.65, "color": Color(0.18, 0.58, 1.0)}
          		_:
          			return {"title": "", "counter": "", "health": 1.0, "damage": 1.0, "delay": 1.0, "animation": 1.0, "scale": 1.0, "score": 1.0, "color": Color.WHITE}

          static func score_for_variant(base_score: int, variant: String) -> int:
          	return maxi(base_score, 0) if normalize(variant) == NONE else roundi(float(maxi(base_score, 0)) * float(profile(variant).score))

          static func title(variant: String) -> String:
          	return str(profile(variant).title)

          static func counter_hint(variant: String) -> String:
          	return str(profile(variant).counter)

          static func color_for_variant(variant: String) -> Color:
          	return profile(variant).color
          PULSEFALL_ELITES

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {label} anchor, found {count}")
              return source.replace(old, new, 1)

          level_path = Path("game/level/level.gd")
          level = level_path.read_text()
          level = replace_once(
              level,
              'const BossRulesScript = preload("res://mobile/boss_rules.gd")\n',
              'const BossRulesScript = preload("res://mobile/boss_rules.gd")\nconst EliteRulesScript = preload("res://mobile/elite_rules.gd")\n',
              "elite level preload",
          )
          spawn_start = level.find("func _spawn_robot_at")
          risk_anchor = level.find("\tif active_risk_contract == RiskContractScript.OVERLOAD:", spawn_start)
          if spawn_start < 0 or risk_anchor < 0:
              raise SystemExit("Elite spawn insertion anchors missing")
          elite_spawn = '''	var elite_variant := EliteRulesScript.variant_for_spawn(wave, spawn_index)
          	if not elite and not miniboss and elite_variant != EliteRulesScript.NONE:
          		var elite_profile := EliteRulesScript.profile(elite_variant)
          		robot.set_meta("elite_variant", elite_variant)
          		robot.health = maxi(1, ceili(float(robot.health) * float(elite_profile.health)))
          		robot.shot_damage = maxi(1, ceili(float(robot.shot_damage) * float(elite_profile.damage)))
          		robot.attack_delay *= float(elite_profile.delay)
          		robot.animation_speed *= float(elite_profile.animation)
          		robot.scale *= float(elite_profile.scale)
          		MobileMetrics.record("elite_spawned", {"variant": elite_variant, "wave": wave, "time_seconds": mission_time})
          		_show_banner(EliteRulesScript.title(elite_variant), EliteRulesScript.counter_hint(elite_variant), 1.1)
          '''
          level = level[:risk_anchor] + elite_spawn + level[risk_anchor:]
          exploded_start = level.find("func _on_robot_exploded")
          score_anchor = level.find("\tscore += RiskContractScript.scaled_score", exploded_start)
          if exploded_start < 0 or score_anchor < 0:
              raise SystemExit("Elite reward insertion anchors missing")
          elite_reward = '''	var elite_variant := str(robot.get_meta("elite_variant", EliteRulesScript.NONE))
          	if elite_variant != EliteRulesScript.NONE:
          		base_points = EliteRulesScript.score_for_variant(base_points, elite_variant)
          		MobileMetrics.record("elite_defeated", {"variant": elite_variant, "wave": wave, "time_seconds": mission_time, "base_points": base_points})
          '''
          level = level[:score_anchor] + elite_reward + level[score_anchor:]
          level_path.write_text(level)

          robot_path = Path("game/enemies/red_robot/red_robot.gd")
          robot = robot_path.read_text()
          robot = replace_once(
              robot,
              'const BossRulesScript = preload("res://mobile/boss_rules.gd")\n',
              'const BossRulesScript = preload("res://mobile/boss_rules.gd")\nconst EliteRulesScript = preload("res://mobile/elite_rules.gd")\n',
              "elite enemy preload",
          )
          robot = replace_once(
              robot,
              "\t_add_role_beacon()\n",
              "\t_add_role_beacon()\n\t_add_elite_beacon()\n",
              "elite visual initialization",
          )
          robot += '''


          func _add_elite_beacon() -> void:
          	var elite_variant := str(get_meta("elite_variant", EliteRulesScript.NONE))
          	if elite_variant == EliteRulesScript.NONE:
          		return
          	var beacon := MeshInstance3D.new()
          	beacon.name = "EliteBeacon"
          	beacon.position = Vector3(0.0, 2.78, 0.0)
          	var mesh := SphereMesh.new()
          	mesh.radius = 0.30
          	mesh.height = 0.60
          	beacon.mesh = mesh
          	var material := StandardMaterial3D.new()
          	var elite_color := EliteRulesScript.color_for_variant(elite_variant)
          	material.albedo_color = elite_color
          	material.emission_enabled = true
          	material.emission = elite_color
          	material.emission_energy_multiplier = 4.5
          	beacon.material_override = material
          	add_child(beacon)
          '''
          robot_path.write_text(robot)
          PY

          cat > game/mobile/elite_rules_test.gd <<'PULSEFALL_ELITE_TEST'
          extends Node

          const Rules = preload("res://mobile/elite_rules.gd")
          var checks := 0
          var failures := 0

          func check(value: bool, message: String) -> void:
          	checks += 1
          	if value:
          		print("PASS: ", message)
          	else:
          		failures += 1
