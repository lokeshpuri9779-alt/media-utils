          	return maxi(1, int(ceil(float(base_health) * health_multiplier(contract))))

          static func scaled_damage(base_damage: int, contract: String) -> int:
          	return maxi(1, int(ceil(float(base_damage) * damage_multiplier(contract))))

          static func scaled_score(base_score: int, contract: String) -> int:
