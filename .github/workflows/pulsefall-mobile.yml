          cat > game/mobile/graphics_preset_test.gd <<'PULSEFALL_GRAPHICS_TEST'
          extends Node

          const Tuning = preload("res://mobile/mobile_tuning.gd")
          var failures := 0
          var checks := 0

          func check(value: bool, message: String) -> void:
          	checks += 1
          	if value:
          		print("PASS: ", message)
          	else:
          		failures += 1
          		push_error("FAIL: " + message)


          func _ready() -> void:
          	check(Tuning.safe_graphics_preset(-4) == 0, "graphics preset clamps below LOW")
          	check(Tuning.safe_graphics_preset(8) == 2, "graphics preset clamps above HIGH")
          	var low: Dictionary = Tuning.graphics_profile_for_preset(0)
          	var medium: Dictionary = Tuning.graphics_profile_for_preset(1)
          	var high: Dictionary = Tuning.graphics_profile_for_preset(2)
          	check(low.name == "LOW" and low.max_fps == 30, "LOW supplies the 30 FPS fallback")
          	check(medium.name == "MED" and medium.max_fps == 60, "MED targets 60 FPS")
          	check(high.name == "HIGH" and high.max_fps == 60, "HIGH targets 60 FPS")
          	check(low.resolution_scale < medium.resolution_scale and medium.resolution_scale < high.resolution_scale, "resolution tiers increase monotonically")
          	check(is_equal_approx(low.resolution_scale, 0.60) and is_equal_approx(medium.resolution_scale, 0.72) and is_equal_approx(high.resolution_scale, 0.85), "resolution tiers match mobile budget targets")
          	check(not low.shadows and not low.bloom, "LOW removes shadow and bloom cost")
          	check(medium.shadows and medium.bloom, "MED preserves core lighting")
          	check(high.shadows and high.bloom, "HIGH preserves core lighting")
          	var test_path := "user://graphics_preset_test.cfg"
          	var directory := DirAccess.open("user://")
          	if directory and directory.file_exists("graphics_preset_test.cfg"):
          		directory.remove("graphics_preset_test.cfg")
          	check(Tuning.save_graphics_preset(7, test_path) == OK, "graphics preference persists without error")
