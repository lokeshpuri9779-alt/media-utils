      - name: Add optional gyroscope aiming
        shell: bash
        run: |
          cat > game/mobile/gyro_aim.gd <<'PULSEFALL_GYRO'
          extends RefCounted
          class_name GyroAim

          const DEAD_ZONE := 0.04
          const MAX_ANGULAR_RATE := 3.0
          const MAX_CAMERA_STEP := 0.05

          static func sensitivity_for_mode(mode: int) -> float:
          	match clampi(mode, 0, 3):
          		1:
          			return 0.32
          		2:
          			return 0.55
          		3:
          			return 0.85
          		_:
          			return 0.0


          static func filter_angular_velocity(angular_velocity: Vector3, mode: int, delta: float) -> Vector2:
          	var sensitivity: float = sensitivity_for_mode(mode)
          	if sensitivity <= 0.0 or delta <= 0.0:
          		return Vector2.ZERO
          	var yaw_rate: float = _filtered_axis(angular_velocity.y)
          	var pitch_rate: float = _filtered_axis(angular_velocity.x)
          	var rate := Vector2(yaw_rate, pitch_rate)
          	if rate.length_squared() <= 0.0:
          		return Vector2.ZERO
          	rate = rate.limit_length(MAX_ANGULAR_RATE)
          	return (rate * sensitivity * delta).limit_length(MAX_CAMERA_STEP)


          static func _filtered_axis(value: float) -> float:
          	var magnitude: float = absf(value)
          	if magnitude <= DEAD_ZONE:
          		return 0.0
          	return signf(value) * (magnitude - DEAD_ZONE)
          PULSEFALL_GYRO

