      - name: Add state-driven mobile attack telegraphs
        shell: bash
        run: |
          set -euxo pipefail

          cat > game/mobile/telegraph_rules.gd <<'PULSEFALL_TELEGRAPHS'
          class_name TelegraphRules
          extends RefCounted

          const HIDDEN := "hidden"
          const CHARGING := "charging"
          const FIRING := "firing"

          static func charge_ratio(remaining: float, duration: float) -> float:
          	var safe_duration := maxf(duration, 0.05)
          	return clampf(1.0 - maxf(remaining, 0.0) / safe_duration, 0.0, 1.0)

          static func pulse_scale(charge: float, age: float) -> float:
          	var safe_charge := clampf(charge, 0.0, 1.0)
          	return clampf(0.76 + safe_charge * 0.38 + sin(age * (4.0 + safe_charge * 7.0)) * (0.035 + safe_charge * 0.055), 0.68, 1.24)

          static func opacity(charge: float) -> float:
          	return clampf(0.28 + clampf(charge, 0.0, 1.0) * 0.62, 0.28, 0.90)

          static func state_name(is_aiming: bool, is_firing: bool, dead: bool) -> String:
          	if dead:
          		return HIDDEN
          	if is_firing:
          		return FIRING
          	if is_aiming:
          		return CHARGING
          	return HIDDEN

          static func profile(role: String, elite_variant: String, is_miniboss: bool, is_boss: bool, boss_phase: int) -> Dictionary:
          	if is_boss:
          		if boss_phase >= 3:
          			return {"name": "RED CORE VOLLEY", "color": Color(1.0, 0.08, 0.04), "radius": 1.55, "beacon": 0.46}
          		if boss_phase == 2:
          			return {"name": "HUNTER VOLLEY", "color": Color(1.0, 0.30, 0.06), "radius": 1.42, "beacon": 0.42}
          		return {"name": "WARDEN BURST", "color": Color(1.0, 0.68, 0.12), "radius": 1.30, "beacon": 0.38}
          	if is_miniboss:
          		return {"name": "SENTINEL CHARGE", "color": Color(1.0, 0.32, 0.08), "radius": 1.20, "beacon": 0.36}
          	match elite_variant:
          		"bulwark":
          			return {"name": "BULWARK BURST", "color": Color(0.25, 1.0, 0.42), "radius": 1.10, "beacon": 0.34}
          		"phase_stalker":
          			return {"name": "STALKER RUSH", "color": Color(1.0, 0.20, 0.82), "radius": 0.95, "beacon": 0.31}
          		"volt_artillery":
          			return {"name": "ARTILLERY CHARGE", "color": Color(0.18, 0.58, 1.0), "radius": 1.18, "beacon": 0.36}
          	match role:
          		"scout":
          			return {"name": "SCOUT SHOT", "color": Color(0.20, 0.95, 1.0), "radius": 0.82, "beacon": 0.25}
          		"heavy":
          			return {"name": "HEAVY CHARGE", "color": Color(1.0, 0.34, 0.18), "radius": 1.02, "beacon": 0.31}
          		"disruptor":
          			return {"name": "DISRUPTOR SHOT", "color": Color(0.72, 0.32, 1.0), "radius": 0.92, "beacon": 0.28}
          		_:
          			return {"name": "ASSAULT SHOT", "color": Color(1.0, 0.82, 0.24), "radius": 0.88, "beacon": 0.27}
          PULSEFALL_TELEGRAPHS

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {label} anchor, found {count}")
              return source.replace(old, new, 1)

          robot_path = Path("game/enemies/red_robot/red_robot.gd")
          robot = robot_path.read_text()
          robot = replace_once(
              robot,
              'const EliteRulesScript = preload("res://mobile/elite_rules.gd")\n',
              'const EliteRulesScript = preload("res://mobile/elite_rules.gd")\nconst TelegraphRulesScript = preload("res://mobile/telegraph_rules.gd")\n',
              "telegraph enemy preload",
          )
          robot = replace_once(
              robot,
              "var behavior_age := 0.0\n",
              "var behavior_age := 0.0\nvar telegraph_flash := 0.0\nvar telegraph_disc: MeshInstance3D = null\nvar telegraph_beacon: MeshInstance3D = null\nvar telegraph_material: StandardMaterial3D = null\nvar telegraph_beacon_material: StandardMaterial3D = null\n",
              "telegraph state",
          )
          robot = replace_once(
              robot,
              "\t_add_elite_beacon()\n",
              "\t_add_elite_beacon()\n\t_add_attack_telegraph()\n",
              "telegraph initialization",
          )
          robot = replace_once(
              robot,
              "\tbehavior_age += delta\n",
              "\tbehavior_age += delta\n\t_update_attack_telegraph(delta)\n",
              "telegraph runtime update",
          )
          robot = replace_once(
              robot,
              "func shoot() -> void:\n",
              "func shoot() -> void:\n\ttelegraph_flash = 0.16\n",
              "telegraph firing flash",
          )
          robot += '''


          func _add_attack_telegraph() -> void:
          	telegraph_disc = MeshInstance3D.new()
          	telegraph_disc.name = "AttackTelegraphDisc"
          	telegraph_disc.position = Vector3(0.0, 0.055, 0.0)
          	var disc_mesh := CylinderMesh.new()
          	disc_mesh.top_radius = 1.0
          	disc_mesh.bottom_radius = 1.0
          	disc_mesh.height = 0.035
          	disc_mesh.radial_segments = 24
          	telegraph_disc.mesh = disc_mesh
          	telegraph_material = StandardMaterial3D.new()
          	telegraph_material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
          	telegraph_material.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED
          	telegraph_material.emission_enabled = true
          	telegraph_disc.material_override = telegraph_material
          	telegraph_disc.visible = false
          	add_child(telegraph_disc)

          	telegraph_beacon = MeshInstance3D.new()
          	telegraph_beacon.name = "AttackTelegraphBeacon"
          	telegraph_beacon.position = Vector3(0.0, 2.42, 0.0)
          	var beacon_mesh := SphereMesh.new()
          	beacon_mesh.radius = 0.30
          	beacon_mesh.height = 0.60
          	telegraph_beacon.mesh = beacon_mesh
          	telegraph_beacon_material = StandardMaterial3D.new()
          	telegraph_beacon_material.transparency = BaseMaterial3D.TRANSPARENCY_ALPHA
          	telegraph_beacon_material.shading_mode = BaseMaterial3D.SHADING_MODE_UNSHADED
          	telegraph_beacon_material.emission_enabled = true
          	telegraph_beacon.material_override = telegraph_beacon_material
          	telegraph_beacon.visible = false
          	add_child(telegraph_beacon)


          func _update_attack_telegraph(delta: float) -> void:
          	if telegraph_disc == null or telegraph_beacon == null:
          		return
          	telegraph_flash = maxf(telegraph_flash - delta, 0.0)
          	var visual_state := TelegraphRulesScript.state_name(state == State.AIM, state == State.SHOOTING or telegraph_flash > 0.0, dead)
          	var visible_now := visual_state != TelegraphRulesScript.HIDDEN
          	telegraph_disc.visible = visible_now
          	telegraph_beacon.visible = visible_now
          	if not visible_now:
          		return
          	var elite_variant := str(get_meta("elite_variant", EliteRulesScript.NONE))
          	var visual_profile := TelegraphRulesScript.profile(behavior_role, elite_variant, bool(get_meta("miniboss", false)), bool(get_meta("elite", false)), boss_phase)
          	var charge := 1.0 if visual_state == TelegraphRulesScript.FIRING else TelegraphRulesScript.charge_ratio(aim_countdown, aim_duration)
          	var pulse := TelegraphRulesScript.pulse_scale(charge, behavior_age)
          	var visual_color: Color = visual_profile.color
          	var alpha := TelegraphRulesScript.opacity(charge)
          	if visual_state == TelegraphRulesScript.FIRING:
          		alpha = 1.0
          		pulse = 1.24
          	var transparent_color := Color(visual_color.r, visual_color.g, visual_color.b, alpha)
          	telegraph_material.albedo_color = transparent_color
          	telegraph_material.emission = visual_color
          	telegraph_material.emission_energy_multiplier = 1.8 + charge * 3.2
          	telegraph_beacon_material.albedo_color = transparent_color
          	telegraph_beacon_material.emission = visual_color
          	telegraph_beacon_material.emission_energy_multiplier = 2.8 + charge * 4.0
          	var radius := float(visual_profile.radius) * pulse
          	telegraph_disc.scale = Vector3(radius, 1.0, radius)
          	var beacon_scale := float(visual_profile.beacon) * (0.82 + charge * 0.58)
          	telegraph_beacon.scale = Vector3.ONE * beacon_scale
          '''
          robot_path.write_text(robot)
          PY

          cat > game/mobile/telegraph_rules_test.gd <<'PULSEFALL_TELEGRAPH_TEST'
          extends Node

