          	var relay: ObjectiveRelay = ObjectiveRelayScript.new()
          	relay.global_position = spawn_marker.global_position + Vector3(0.0, 0.12, 0.0)
          	relay.activated.connect(_on_relay_activated)
          	add_child(relay)
          	if objective_label != null:
          		objective_label.text = "OBJECTIVE  //  STABILIZE PULSE RELAY"
          	_show_banner("PULSE RELAY LOCATED", "HOLD THE RELAY ZONE", 1.0)
          	MobileMetrics.record("objective_started", {"type": "relay", "wave": wave})


          func _on_relay_activated(_relay: ObjectiveRelay) -> void:
          	score += 500 * maxi(wave, 1)
          	MobileMetrics.record("objective_complete", {"type": "relay", "wave": wave, "time_seconds": mission_time})
          	if OS.has_feature("mobile"):
          		Input.vibrate_handheld(42)
          	if objective_label != null:
          		objective_label.text = "OBJECTIVE  //  ADAPT AEGIS"
          	_show_banner("RELAY STABILIZED", "SELECT AN ADAPTATION", 1.0)
          	await get_tree().create_timer(0.9).timeout
          	_show_upgrade_choice()


          func _begin_extraction() -> void:
          	mission_active = false
          	boss_label.visible = false
          	var available: int = robot_spawn_points.get_child_count()
          	var marker_index: int = (wave * 5 + 2) % maxi(available, 1)
          	var spawn_marker: Marker3D = robot_spawn_points.get_child(marker_index)
          	var beacon: ExtractionBeacon = ExtractionBeaconScript.new()
          	beacon.global_position = spawn_marker.global_position + Vector3(0.0, 0.12, 0.0)
          	beacon.extracted.connect(_on_extracted)
          	add_child(beacon)
          	if objective_label != null:
          		objective_label.text = "OBJECTIVE  //  REACH EXTRACTION"
          	_show_banner("OMEGA WARDEN DOWN", "EXTRACTION BEACON ONLINE", 1.4)
          	MobileMetrics.record("extraction_available", {"score": score, "time_seconds": mission_time})


          func _on_extracted(_beacon: ExtractionBeacon) -> void:
          	MobileMetrics.record("extraction_reached", {"score": score, "time_seconds": mission_time})
          	if OS.has_feature("mobile"):
          		Input.vibrate_handheld(90)
          	_finish_mission()
          GDSCRIPT

