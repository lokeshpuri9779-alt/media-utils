      - name: Add persistent mobile control tuning
        shell: bash
        run: |
          cat > game/mobile/mobile_tuning.gd <<'PULSEFALL_TUNING'
          extends RefCounted

          const CONFIG_PATH := "user://pulsefall_mobile.cfg"
          const SECTION := "controls"
          const LOOK_MIN := 0.5
          const LOOK_MAX := 2.0
          const AIM_MIN := 0.0
          const AIM_MAX := 1.5
          static var current_look_scale := 1.0
          static var current_aim_strength := 1.0
          static var loaded := false

          static func clamp_look(value: float) -> float:
          	return snappedf(clampf(value, LOOK_MIN, LOOK_MAX), 0.1)

          static func clamp_aim(value: float) -> float:
          	return snappedf(clampf(value, AIM_MIN, AIM_MAX), 0.1)

          static func load_values(path: String = CONFIG_PATH) -> Dictionary:
          	var config := ConfigFile.new()
          	var look := 1.0
          	var aim := 1.0
          	if config.load(path) == OK:
          		look = float(config.get_value(SECTION, "look_sensitivity", look))
          		aim = float(config.get_value(SECTION, "aim_assist_strength", aim))
          	var result := {
          		"look_sensitivity": clamp_look(look),
          		"aim_assist_strength": clamp_aim(aim),
          	}
          	if path == CONFIG_PATH:
          		current_look_scale = result.look_sensitivity
          		current_aim_strength = result.aim_assist_strength
          		loaded = true
          	return result

          static func save_values(look: float, aim: float, path: String = CONFIG_PATH) -> int:
          	var config := ConfigFile.new()
          	if FileAccess.file_exists(path):
          		config.load(path)
          	var safe_look := clamp_look(look)
          	var safe_aim := clamp_aim(aim)
          	config.set_value(SECTION, "look_sensitivity", safe_look)
          	config.set_value(SECTION, "aim_assist_strength", safe_aim)
          	var result := config.save(path)
          	if path == CONFIG_PATH and result == OK:
          		current_look_scale = safe_look
          		current_aim_strength = safe_aim
          		loaded = true
          	return result

          static func get_aim_strength() -> float:
          	if not loaded:
          		load_values()
          	return current_aim_strength
          PULSEFALL_TUNING

