          cat >> game/player/player.gd <<'GDSCRIPT'


          func _spawn_projectile(shoot_origin: Vector3, shoot_dir: Vector3) -> void:
          	var bullet: CharacterBody3D = preload("res://player/bullet/bullet.tscn").instantiate()
          	get_parent().add_child(bullet, true)
          	bullet.global_transform.origin = shoot_origin
          	bullet.look_at(shoot_origin + shoot_dir.normalized())
          	bullet.add_collision_exception_with(self)


          func _fire_weapon(shoot_origin: Vector3, shoot_dir: Vector3) -> void:
          	match weapon_mode:
          		0:
          			_spawn_projectile(shoot_origin, shoot_dir)
          		1:
          			for i in range(6):
          				var spread := Vector3(
          					randf_range(-0.075, 0.075),
          					randf_range(-0.055, 0.055),
          					randf_range(-0.035, 0.035)
          				)
          				_spawn_projectile(shoot_origin, (shoot_dir + spread).normalized())
          		2:
          			_spawn_projectile(shoot_origin, shoot_dir)
          			_spawn_projectile(shoot_origin, (shoot_dir + Vector3(0.012, 0.0, 0.0)).normalized())
          			_spawn_projectile(shoot_origin, (shoot_dir + Vector3(-0.012, 0.0, 0.0)).normalized())


          func get_weapon_name() -> String:
          	match weapon_mode:
          		1: return "SCATTER"
          		2: return "LANCE"
          		_: return "CARBINE"


          func _refresh_weapon_cooldown() -> void:
          	var base := 0.24
          	match weapon_mode:
          		1: base = 0.72
          		2: base = 0.48
          	fire_cooldown.wait_time = maxf(0.11, base * weapon_fire_rate_multiplier)


          func cycle_weapon() -> String:
          	weapon_mode = (weapon_mode + 1) % 3
          	_refresh_weapon_cooldown()
          	return get_weapon_name()


          func trigger_dash() -> void:
          	if dash_cooldown > 0.0 or incapacitated:
          		return
          	var camera_basis: Basis = player_input.get_camera_rotation_basis()
          	var camera_z := camera_basis.z
          	var camera_x := camera_basis.x
          	camera_z.y = 0.0
          	camera_x.y = 0.0
          	camera_z = camera_z.normalized()
          	camera_x = camera_x.normalized()
          	var target := camera_x * player_input.motion.x + camera_z * player_input.motion.y
          	if target.length() < 0.15:
          		target = -camera_z
          	dash_direction = target.normalized()
          	dash_time = 0.20
          	dash_cooldown = 1.15
          	if OS.has_feature("mobile"):
          		Input.vibrate_handheld(26)
          GDSCRIPT

