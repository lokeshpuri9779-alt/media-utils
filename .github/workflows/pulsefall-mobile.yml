          	check(profile.credits == 250 and profile.runs == 1, "successful extraction persists career totals")
          	check(profile.best_score == 12000, "best score advances on successful extraction")
          	check(profile.is_weapon_unlocked(1), "a strong first extraction can unlock scatter")
          	var slow_reward := profile.complete_run(0, 700.0)
          	check(slow_reward == 100, "slow extraction omits the pace bonus")
          	check(profile.best_score == 12000, "weaker runs cannot reduce best score")
          	profile.free()
