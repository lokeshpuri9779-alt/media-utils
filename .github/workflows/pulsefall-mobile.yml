      - name: Add graceful runtime lifecycle soak
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("game/level/level.gd")
          source = path.read_text()
          if "func _exit_tree() -> void:" in source:
              raise SystemExit("Level already defines an exit hook")
          source += """
          
          
          func release_streamed_audio() -> void:
          	# Stop playback while audio nodes are still inside the scene tree.
          	# Waiting until parent exit is too late on some headless/audio-driver paths.
          	for node in find_children("*", "", true, false):
          		if node is AudioStreamPlayer or node is AudioStreamPlayer2D or node is AudioStreamPlayer3D:
          			node.stop()
          			node.stream = null


          func _exit_tree() -> void:
          	release_streamed_audio()
          """
          path.write_text(source)
          PY

          cat > game/mobile/runtime_soak_test.gd <<'PULSEFALL_SOAK'
          extends Node

          const LEVEL_SCENE = preload("res://level/level.tscn")
          const CYCLES := 5
          const PHYSICS_FRAMES_PER_CYCLE := 120
          var failures := 0
          var checks := 0

          func check(value: bool, message: String) -> void:
          	checks += 1
          	if value:
          		print("PASS: ", message)
          	else:
          		failures += 1
          		push_error(message)

          func _ready() -> void:
          	call_deferred("_run")

          func _run() -> void:
          	for cycle in range(CYCLES):
          		var level := LEVEL_SCENE.instantiate()
          		level.name = "SoakLevel"
          		add_child(level)
          		for frame in range(PHYSICS_FRAMES_PER_CYCLE):
          			await get_tree().physics_frame
          		check(is_instance_valid(level) and level.is_inside_tree(), "level remains live through soak cycle %d" % (cycle + 1))
          		level.release_streamed_audio()
          		for audio_flush_frame in range(4):
          			await get_tree().process_frame
          		level.free()
          		for flush_frame in range(12):
          			await get_tree().process_frame
          		await get_tree().physics_frame
          		check(get_node_or_null("SoakLevel") == null, "level unloads cleanly after soak cycle %d" % (cycle + 1))
          	print("RUNTIME SOAK CHECKS: ", checks, " CYCLES: ", CYCLES, " FAILURES: ", failures)
          	get_tree().quit(0 if failures == 0 else 1)
          PULSEFALL_SOAK

          cat > game/mobile/runtime_soak_test.tscn <<'PULSEFALL_SOAK'
          [gd_scene load_steps=2 format=3]
          [ext_resource type="Script" path="res://mobile/runtime_soak_test.gd" id="1"]
