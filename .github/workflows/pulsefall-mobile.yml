      - name: Package Android build
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find game -type f -name 'PULSEFALL_MOBILE_ALPHA.apk' | head -n1)"
          if [ -z "$APK" ]; then
            APK="$(find "$HOME/.local/share/godot/builds" -type f -name 'PULSEFALL_MOBILE_ALPHA.apk' | head -n1 || true)"
          fi
          test -n "$APK"
          mkdir -p artifact
          cp "$APK" artifact/PULSEFALL_MOBILE_ALPHA.apk
          cp game/PULSEFALL_README.txt artifact/
          cp game/THIRD_PARTY_NOTICES.txt artifact/
          sha256sum artifact/PULSEFALL_MOBILE_ALPHA.apk > artifact/PULSEFALL_MOBILE_ALPHA_SHA256.txt
          ls -lh artifact/PULSEFALL_MOBILE_ALPHA.apk

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: PULSEFALL_MOBILE_ALPHA
          path: |
            artifact/PULSEFALL_MOBILE_ALPHA.apk
            artifact/PULSEFALL_MOBILE_ALPHA_SHA256.txt
