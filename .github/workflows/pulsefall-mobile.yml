          	check(minimum.extraction_remaining == 1.0, "resume always preserves an actionable extraction window")
          	check(not Rules.is_expired({"saved_at": 1000}, 1000 + Rules.MAX_AGE_SECONDS), "seven-day boundary remains valid")
          	check(Rules.is_expired({"saved_at": 1000}, 1001 + Rules.MAX_AGE_SECONDS), "old checkpoint expires")
          	check(Rules.is_expired({"saved_at": 0}, 1000), "missing timestamp expires")
          	var wrote := RunCheckpoint.save_checkpoint({
          		"phase": "wave",
