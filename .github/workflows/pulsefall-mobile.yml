          cat > game/mobile/mobile_performance.gd <<'GDSCRIPT'
          extends Node

          const SAMPLE_SECONDS := 3.0
          const MIN_SCALE := 0.62
          const MAX_SCALE := 0.90
          const SCALE_STEP := 0.05

          var sample_time := 0.0
          var frame_count := 0
          var current_scale := 0.78
          var low_samples := 0
          var high_samples := 0


          func _ready() -> void:
          	if not OS.has_feature("mobile"):
          		set_process(false)
          		return
          	Engine.max_fps = 60
          	get_viewport().scaling_3d_scale = current_scale


          func _process(delta: float) -> void:
          	sample_time += delta
          	frame_count += 1
          	if sample_time < SAMPLE_SECONDS:
          		return

          	var fps := float(frame_count) / maxf(sample_time, 0.001)
          	if fps < 43.0:
          		low_samples += 1
          		high_samples = 0
          	elif fps > 57.0:
          		high_samples += 1
          		low_samples = 0
          	else:
          		low_samples = 0
          		high_samples = 0

          	if low_samples >= 2 and current_scale > MIN_SCALE:
          		current_scale = maxf(MIN_SCALE, current_scale - SCALE_STEP)
          		get_viewport().scaling_3d_scale = current_scale
          		low_samples = 0
          	elif high_samples >= 3 and current_scale < MAX_SCALE:
          		current_scale = minf(MAX_SCALE, current_scale + SCALE_STEP)
          		get_viewport().scaling_3d_scale = current_scale
          		high_samples = 0

          	sample_time = 0.0
          	frame_count = 0
          GDSCRIPT

