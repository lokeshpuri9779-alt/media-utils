name: ASTRA Walk Reach Pickup CPU (Review Only)
on:
  push:
    branches:
      - experiment/astra-robot-walk-and-pickup
    paths:
      - tools/experimental_robot_walk_pickup.py
      - .github/workflows/astra-robot-walk-pickup.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    if: github.ref == 'refs/heads/experiment/astra-robot-walk-and-pickup'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and FFmpeg (CPU-only)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender ffmpeg
          blender --version | head -n 2
      - name: Render approach, reach, pickup and lift
        run: |
          blender --background --threads 2 --python-exit-code 1 \
            --python tools/experimental_robot_walk_pickup.py -- \
            --output-dir artifacts/experimental-robot-pickup/
      - name: Encode review-only MP4
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate 8 -start_number 0 \
            -i artifacts/experimental-robot-pickup/frame_%03d.png \
            -frames:v 20 -c:v libx264 -preset veryfast -crf 19 \
            -pix_fmt yuv420p -movflags +faststart \
            artifacts/experimental-robot-pickup/walk_and_pickup.mp4
      - name: Verify all image, action, and video invariants
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import struct
          import subprocess
          from pathlib import Path
          root=Path('artifacts/experimental-robot-pickup')
          report=json.loads((root/'review.json').read_text())
          assert report['success'] is True and all(report['checks'].values())
          assert report['approved'] is False and report['published'] is False
          assert report['production_ready'] is False and report['paid_apis_used'] is False
          assert report['semantic_quality']=='manual_review_required'
          assert report['character_continuity']=='not_verified'
          assert report['photorealism']=='not_verified'
          assert report['motion_quality']=='manual_review_required'
          assert report['dimensions']==[384,576]
          assert report['cycles_samples']==28
          assert report['fps']==8 and len(report['frames'])==20
          assert [f['index'] for f in report['frames']]==list(range(20))
          assert [f['phase'] for f in report['frames'][:9]]==['approach']*9
          assert [f['phase'] for f in report['frames'][9:12]]==['reach']*3
          assert [f['phase'] for f in report['frames'][12:]]==['pickup_and_lift']*8
          for frame in report['frames']:
              data=(root/frame['file']).read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n')
              assert struct.unpack('>II',data[16:24])==(384,576)
              assert hashlib.sha256(data).hexdigest()==frame['sha256']
          movie=root/'walk_and_pickup.mp4'
          assert movie.is_file() and movie.stat().st_size>4096
          streams=json.loads(subprocess.check_output([
              'ffprobe','-v','error','-select_streams','v:0',
              '-show_entries','stream=codec_name,width,height,nb_frames,r_frame_rate',
              '-of','json',str(movie)
          ],text=True))['streams']
          assert len(streams)==1
          v=streams[0]
          assert v['codec_name']=='h264'
          assert (v['width'],v['height'])==(384,576)
          assert int(v['nb_frames'])==20 and v['r_frame_rate']=='8/1'
          report['video']={'file':movie.name,'codec':'h264','fps':8,'frames':20,
                            'duration_seconds':2.5,'bytes':movie.stat().st_size}
          (root/'review.json').write_text(json.dumps(report,indent=2)+'\n')
          print('20-frame walk, reach, pickup: bounded structural validation passed; manual review still required.')
          PY
      - name: Upload review-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-walk-pickup-review
          path: artifacts/experimental-robot-pickup/
          if-no-files-found: warn
          retention-days: 7
