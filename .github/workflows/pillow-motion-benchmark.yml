name: Pillow motion full-resolution benchmark
on:
  workflow_dispatch:
  push:
    branches:
      - benchmark/pillow-motion-1080p
      - optimization/pillow-motion-fastpath
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Run existing scene motion tests
        run: python -m unittest discover -s tests -p 'test_pillow_scene_motion.py' -v
      - name: Benchmark 1080x1920 frames
        env:
          ASTRA_BENCHMARK_REPORT: benchmark-artifact/report.json
        run: python -m benchmarks.pillow_motion_1080p
      - uses: actions/upload-artifact@v4
        with:
          name: pillow-motion-1080p-benchmark
          path: benchmark-artifact/report.json
          retention-days: 14
