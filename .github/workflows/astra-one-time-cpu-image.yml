name: ASTRA One-Time CPU Image Benchmark
on:
  push:
    branches:
      - benchmark/cpu-image-once
    paths:
      - .astra/cpu-image-benchmark-trigger.txt
permissions:
  contents: read
jobs:
  cpu-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HOME: /tmp/astra-hf
      HF_HUB_DISABLE_TELEMETRY: '1'
      ASTRA_OMNI_IMAGE_ALLOW_PAID: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Runner resources
        run: |
          free -h
          df -h .
          nproc
      - name: Install CPU inference libraries
        run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'optimum[openvino]' diffusers 'transformers>=4.46,<5'
      - name: Generate one review-only portrait
        run: python -m tools.experimental_openvino_benchmark --profile export --steps 12
      - name: Upload report and optional portrait
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-cpu-image-proof-${{ github.run_id }}
          path: artifacts/experimental-openvino/
          if-no-files-found: warn
          retention-days: 7
