name: Engine 1 Pillow integration verification
on:
  workflow_dispatch:
  push:
    branches:
      - integration/pillow-engine1-adapter
permissions:
  contents: read
jobs:
  shadow-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free renderer dependencies
        run: python -m pip install 'Pillow>=10,<12' 'imageio-ffmpeg>=0.5,<1'
      - name: Run renderer and adapter tests
        run: |
          python -m unittest discover -s tests -p 'test_motion_profiles.py' -v
          python -m unittest discover -s tests -p 'test_pillow_2d_engine.py' -v
          python -m unittest discover -s tests -p 'test_pillow_engine1_adapter.py' -v
      - name: Render isolated preview
        env:
          ASTRA_ENGINE1_PILLOW: '1'
        run: |
          mkdir -p shadow-preview
          python -c "from astra_v2.pillow_engine1_adapter import render_shadow_preview; print(render_shadow_preview('shadow-preview/pillow.mp4',duration=3,fps=24))"
      - name: Decode verification
        run: |
          python - <<'PY'
          import subprocess
          from imageio_ffmpeg import get_ffmpeg_exe
          subprocess.run([get_ffmpeg_exe(),'-v','error','-i','shadow-preview/pillow.mp4','-f','null','-'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pillow-engine1-shadow-preview
          path: shadow-preview/pillow.mp4
          retention-days: 7
