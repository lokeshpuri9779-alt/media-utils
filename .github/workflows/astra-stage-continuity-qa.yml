name: ASTRA Stage Continuity QA
on:
  pull_request:
    paths:
      - 'astra_v2/pillow_scene_direction.py'
      - 'tests/test_astra_stage_continuity.py'
      - '.github/workflows/astra-stage-continuity-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12' 'numpy>=1.24' 'imageio-ffmpeg>=0.5,<1'
      - name: Test no arc, scenery continuity and safe bounds
        run: python -m unittest discover -s tests -p 'test_astra_stage_continuity.py' -v
      - name: Existing scene direction regression
        run: python -m unittest discover -s tests -p 'test_pillow_scene_direction.py' -v
