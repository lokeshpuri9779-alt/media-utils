name: ASTRA Studio Real MP4 Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/astra-studio-real-mp4-smoke.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/astra-studio-real-mp4-smoke.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASTRA_ASSET_PACK_ENABLED: '0'
      ASTRA_ASSET_PACK_AUDIT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Studio dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Render real Studio pipeline without publication
        run: |
          mkdir -p runtime-artifacts/studio-smoke
          python studio_renderer.py --preview runtime-artifacts/studio-smoke/studio.mp4
      - name: Verify encoded video and report
        run: |
          ffprobe -v error -show_entries format=duration:stream=index,codec_type,codec_name,width,height,sample_rate -of json runtime-artifacts/studio-smoke/studio.mp4 > runtime-artifacts/studio-smoke/ffprobe.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('runtime-artifacts/studio-smoke')
          video=root/'studio.mp4'
          assert video.is_file() and video.stat().st_size > 10000, 'Studio MP4 missing or empty'
          probe=json.loads((root/'ffprobe.json').read_text())
          video_streams=[x for x in probe['streams'] if x['codec_type']=='video']
          audio_streams=[x for x in probe['streams'] if x['codec_type']=='audio']
          assert len(video_streams)==1 and video_streams[0]['codec_name']=='h264'
          assert (video_streams[0]['width'],video_streams[0]['height'])==(1080,1920)
          assert audio_streams and any(x['codec_name']=='aac' for x in audio_streams), 'AAC narration track missing'
          assert float(probe['format']['duration']) > 0, 'Invalid encoded duration'
          PY
      - name: Upload rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-studio-real-mp4-smoke
          path: runtime-artifacts/studio-smoke/
          if-no-files-found: warn
          retention-days: 7
