name: ASTRA Pillow duo integration QA
on:
  pull_request:
    paths:
      - 'astra_v2/pillow_duo_scene.py'
      - 'astra_v2/pillow_scene_direction.py'
      - 'tests/test_pillow_scene_direction.py'
      - 'tests/test_astra_stage_continuity.py'
      - 'astra_v2/icon_visuals.py'
      - 'studio_renderer.py'
      - 'tests/test_pillow_duo_scene.py'
      - 'tests/test_pillow_duo_continuity.py'
      - 'tests/test_pillow_contact_timing.py'
      - 'tests/test_studio_directed_motion.py'
      - 'tools/astra_four_actions_preview.py'
      - 'astra_v2/story_action_motion.py'
      - 'tests/test_pillow_duo_studio.py'
      - 'tests/test_astra_icon_visuals.py'
      - 'tools/pillow_studio_preview.py'
      - '.github/workflows/astra-pillow-duo-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12' 'imageio-ffmpeg>=0.5,<1' 'numpy>=1.24' 'httpx>=0.25'
      - name: Validate duo matching and animation
        run: |
          python -m unittest discover -s tests -p 'test_astra_icon_visuals.py' -v
          python -m unittest discover -s tests -p 'test_pillow_duo_scene.py' -v
          python -m unittest discover -s tests -p 'test_pillow_scene_direction.py' -v
          python -m unittest discover -s tests -p 'test_astra_stage_continuity.py' -v
          python -m unittest discover -s tests -p 'test_pillow_duo_continuity.py' -v
          python -m unittest discover -s tests -p 'test_pillow_contact_timing.py' -v
          python -m unittest discover -s tests -p 'test_studio_directed_motion.py' -v
          python -m unittest discover -s tests -p 'test_pillow_duo_studio.py' -v
      - name: Exclusive Pillow Duo fail-closed regression
        env:
          ASTRA_PILLOW_DUO_ONLY: '1'
          ASTRA_UNIFIED_STORY_ENGINE: '1'
        run: |
          python - <<'PY'
          import os
          from unittest.mock import patch
          from PIL import Image
          from astra_v2 import preload_queue
          from studio_renderer import render_frame, CreativeReject

          with patch.object(preload_queue, 'take', wraps=preload_queue.take) as guarded:
              result = preload_queue.take(set(), set(), 'preview/unused.mp4')
              assert result is None
          # A solo/nonfiction scene cannot escape into the unified engine.
          shot = {'start': 0, 'duration': 2, 'speech': 'A simple icon',
                  'visual': 'a decorative icon', 'story_action': 'look'}
          try:
              render_frame([shot], 0.5, 'current', 2)
          except CreativeReject:
              pass
          else:
              raise AssertionError('Exclusive mode accepted non-fiction visuals')
          print('Exclusive preload and renderer guards passed')
          PY
      - name: Render two-character motion artifact
        run: |
          mkdir -p preview
          python - <<'PY'
          from PIL import Image
          from astra_v2.pillow_duo_scene import draw_duo
          from imageio_ffmpeg import get_ffmpeg_exe
          import subprocess
          path='preview/pillow-duo-motion.mp4'
          cmd=[get_ffmpeg_exe(),'-hide_banner','-loglevel','error','-y',
               '-f','rawvideo','-pix_fmt','rgb24','-s','1080x1920','-r','8',
               '-i','-','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p',path]
          proc=subprocess.Popen(cmd,stdin=subprocess.PIPE)
          shots=[
            {'speech':'The fox and rabbit were curious about the gift box.', 'story_action':'look'},
            {'speech':'The fox and rabbit watch as the fox picks up the gift box carefully.', 'story_action':'pick_up'},
            {'speech':'The fox and rabbit carry the gift box together.', 'story_action':'carry'},
            {'speech':'The fox and rabbit put down and release the gift box together.', 'story_action':'release'},
          ]
          for j,shot in enumerate(shots):
              for i in range(24):
                  im=Image.new('RGB',(1080,1920),(24,35,60))
                  assert draw_duo(im,shot,i/8)
                  proc.stdin.write(im.tobytes())
          proc.stdin.close()
          assert proc.wait()==0
          subprocess.run([get_ffmpeg_exe(),'-v','error','-i',path,'-f','null','-'],check=True)
          print('Verified decoded duo MP4:',path)
          PY
      - name: Render full Studio scene compositor preview (silent)
        run: python -m tools.pillow_studio_preview
      - name: Render four new actions in actual Studio
        run: python -m tools.astra_four_actions_preview
      - uses: actions/upload-artifact@v4
        with:
          name: astra-pillow-duo-motion
          path: |
            preview/pillow-duo-motion.mp4
            preview/pillow-studio-composite.mp4
            preview/astra-four-directed-actions.mp4
            preview/astra-four-directed-actions.json
          retention-days: 7
