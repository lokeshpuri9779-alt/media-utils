name: Astra Runtime Health
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Durable runtime regression suite
        run: |
          python -m pytest -q tests/test_renderer_lifecycle.py tests/test_render_preflight.py tests/test_hardware_render_planner.py tests/test_compute_router.py tests/test_self_migration.py
