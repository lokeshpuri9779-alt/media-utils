name: Renderer repair regression tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "astra_v2/renderer_repair_queue.py"
      - "astra_v2/artwork_gap_queue.py"
      - "studio_renderer.py"
      - "tests/test_renderer_repair_queue.py"
      - "tests/test_astra_artwork_gap_queue.py"
      - ".github/workflows/renderer-repair-regression.yml"
  pull_request:
    paths:
      - "astra_v2/renderer_repair_queue.py"
      - "astra_v2/artwork_gap_queue.py"
      - "studio_renderer.py"
      - "tests/test_renderer_repair_queue.py"
      - "tests/test_astra_artwork_gap_queue.py"
      - ".github/workflows/renderer-repair-regression.yml"

permissions:
  contents: read

jobs:
  renderer-repair-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install renderer test dependencies
        run: python -m pip install Pillow==11.3.0 numpy httpx imageio-ffmpeg
      - name: Test exact-shot renderer repair packets
        run: python -m unittest discover -s tests -p 'test_renderer_repair_queue.py' -v
      - name: Test renderer issue archive preservation
        run: python -m unittest discover -s tests -p 'test_astra_artwork_gap_queue.py' -v
