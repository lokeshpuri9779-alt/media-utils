name: publish polished character story

on:
  push:
    paths:
      - ".astra/publish-polished-character-story"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY: private
      ASTRA_CHANNEL: rayvan
      ASTRA_ALLOW_PAID_CHARACTER_VIDEO: "0"
      ASTRA_CHARACTER_STORY_ID: bear-cub-bakery-v1
      ASTRA_UPLOAD_REVISION: Audio Sync V2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Astra dependencies
        run: pip install -r requirements.txt

      - name: Render, validate, and upload polished story privately
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/render_publish_character_story.py

      - name: Upload rendered review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polished-character-story-${{ github.run_id }}
          path: /tmp/astra-next-character-short.mp4
          retention-days: 7
          if-no-files-found: ignore
