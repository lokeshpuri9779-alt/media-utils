name: ASTRA V2 - one-time read-only YouTube status

on:
  push:
    branches:
      - astra-v2-live-status-probe-20261008

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect latest V2 upload without mutating state
        shell: bash
        run: |
          git fetch origin astra-state
          git checkout origin/astra-state -- astra_v2_state.json
          python - <<'PY'
          import json,os,urllib.parse,urllib.request
          from pathlib import Path
          cfg=json.loads(Path('channels.json').read_text())
          channel=cfg['channels']['rayvan']['expected_channel_id']
          state=json.loads(Path('astra_v2_state.json').read_text())
          candidates=list((state.get('pending') or {}).keys())
          if not candidates:
              candidates=[x['video_id'] for x in state.get('published',{}).values() if x.get('video_id')]
          if not candidates: raise SystemExit('No recent V2 uploads recorded.')
          vid=candidates[-1]
          required=('YOUTUBE_CLIENT_ID','YOUTUBE_CLIENT_SECRET','YOUTUBE_REFRESH_TOKEN')
          if any(not os.environ.get(key) for key in required):
              raise SystemExit('Configured OAuth secrets missing')
          data=urllib.parse.urlencode({
              'client_id':os.environ['YOUTUBE_CLIENT_ID'],
              'client_secret':os.environ['YOUTUBE_CLIENT_SECRET'],
              'refresh_token':os.environ['YOUTUBE_REFRESH_TOKEN'],
              'grant_type':'refresh_token'}).encode()
          req=urllib.request.Request('https://oauth2.googleapis.com/token',
              data=data,method='POST')
          with urllib.request.urlopen(req,timeout=30) as response:
              token=json.load(response)['access_token']
          def get(resource,parts):
              url='https://www.googleapis.com/youtube/v3/'+resource+'?'+urllib.parse.urlencode(parts)
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response)
          owner=get('channels',{'part':'id','mine':'true'}).get('items',[])
          if len(owner)!=1 or owner[0].get('id')!=channel:
              raise SystemExit('Authorized channel mismatch: status withheld.')
          item=get('videos',{'part':'status,processingDetails,snippet','id':vid}).get('items',[])
          if not item:
              raise SystemExit('Video ID not found by owner API: '+vid)
          status=item[0].get('status',{})
          processing=item[0].get('processingDetails',{})
          result={'video_id':vid,'title':item[0].get('snippet',{}).get('title'),
                  'visibility':status.get('privacyStatus'),'upload_status':status.get('uploadStatus'),
                  'processing_status':processing.get('processingStatus'),
                  'public_processed': status.get('privacyStatus')=='public' and status.get('uploadStatus')=='processed'}
          print('ASTRA_V2_LIVE_STATUS='+json.dumps(result))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as summary:
              summary.write('## ASTRA V2 live YouTube status\n\n')
              for k,v in result.items():summary.write(f'- {k}: {v}\n')
          PY
