name: ASTRA - Restore Approved Artwork (Manual Verification)

on:
  workflow_dispatch:
    inputs:
      receipt_json:
        description: 'Immutable reviewed-art receipt JSON from the trusted artwork producer'
        required: true
        type: string

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASTRA_ARTIFACT_S3_BUCKET: ${{ vars.ASTRA_ARTIFACT_S3_BUCKET }}
      ASTRA_ARTIFACT_S3_ENDPOINT: ${{ vars.ASTRA_ARTIFACT_S3_ENDPOINT }}
      ASTRA_ARTIFACT_S3_PREFIX: ${{ vars.ASTRA_ARTIFACT_S3_PREFIX }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.ASTRA_ARTIFACT_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.ASTRA_ARTIFACT_AWS_SECRET_ACCESS_KEY }}
      RECEIPT_JSON: ${{ inputs.receipt_json }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install storage and artwork validation dependencies
        run: python -m pip install --disable-pip-version-check boto3 Pillow
      - name: Validate and stage trusted receipt
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from astra_v2.adaptive_artifact_store import validate_record
          from astra_v2.remote_reviewed_art import SCHEMA
          from astra_v2.reviewed_art_bundle import MAX_BUNDLE_BYTES
          raw = os.environ["RECEIPT_JSON"]
          if len(raw.encode("utf-8")) > 4096:
              raise ValueError("receipt_too_large")
          receipt = json.loads(raw)
          if (not isinstance(receipt, dict) or receipt.get("schema") != SCHEMA
                  or receipt.get("publication_triggered") is not False):
              raise ValueError("invalid_reviewed_art_receipt")
          validate_record(receipt.get("bundle"), MAX_BUNDLE_BYTES)
          Path("reviewed-art-receipt.json").write_text(
              json.dumps(receipt, sort_keys=True), encoding="utf-8")
          print("ASTRA_ART_RECEIPT_VALIDATED=1")
          PY
      - name: Restore and verify remote artwork without rendering or publishing
        env:
          ASTRA_REVIEWED_ART_RECEIPT_FILE: reviewed-art-receipt.json
          ASTRA_REVIEWED_ART_RESTORE_DIR: runtime-reviewed-art
        run: |
          python - <<'PY'
          from astra_v2.preload_art_receipt import restore_for_preload
          manifest = restore_for_preload()
          assert manifest.is_file()
          print("ASTRA_ARTWORK_REMOTE_RESTORE_VERIFIED=1")
          PY
      - name: Save verified artwork for inspection
        uses: actions/upload-artifact@v4
        with:
          name: astra-verified-reviewed-art-${{ github.run_id }}
          path: runtime-reviewed-art/
          if-no-files-found: error
          retention-days: 7
