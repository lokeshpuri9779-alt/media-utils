name: ASTRA V2 - Publisher Health Watch

# Independent operational check, not development CI and never uploads a video.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check publisher heartbeat and state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, sys
          from astra_v2.github_contents import decode_json_contents_file
          from datetime import datetime, timezone

          repo = os.environ["REPO"]
          def api(endpoint):
              result = subprocess.run(
                  ["gh", "api", f"repos/{repo}/{endpoint}"],
                  capture_output=True, text=True, timeout=35, check=True)
              return json.loads(result.stdout)

          # Check real workflow executions, not only the saved upload journal.
          runs = api("actions/workflows/astra-v2-publish.yml/runs?per_page=10")
          publisher_runs = runs.get("workflow_runs", [])
          active_publishers = [r for r in publisher_runs
                               if r.get("status") in {"queued", "in_progress"}]
          completed = [r for r in publisher_runs
                       if r.get("status") == "completed"]
          now = datetime.now(timezone.utc)
          if not completed:
              print("ASTRA_HEALTH=FAIL:no_completed_publisher_runs")
              sys.exit(1)
          latest = max(completed, key=lambda r: r.get("updated_at") or "")
          timestamp = datetime.fromisoformat(latest["updated_at"].replace("Z", "+00:00"))
          age_minutes = (now - timestamp).total_seconds() / 60
          print(f"ASTRA_PUBLISHER_LAST_RUN={latest.get('html_url')}")
          print(f"ASTRA_PUBLISHER_LAST_CONCLUSION={latest.get('conclusion')}")
          print(f"ASTRA_PUBLISHER_LAST_AGE_MINUTES={age_minutes:.1f}")
          if latest.get("conclusion") != "success":
              print("ASTRA_HEALTH=FAIL:last_publisher_run_failed")
              sys.exit(1)
          # The production publisher is event-driven by successful Shorts or long-form
          # preload completion; it intentionally has no cron/manual trigger.
          preload_runs = api("actions/workflows/astra-v2-preload.yml/runs?per_page=10")
          preload_all = preload_runs.get("workflow_runs", [])
          active_preloads = [r for r in preload_all
                             if r.get("status") in {"queued", "in_progress"}]
          preload_completed = [r for r in preload_all
                               if r.get("status") == "completed"]
          if not preload_completed:
              print("ASTRA_HEALTH=FAIL:no_completed_preload_runs")
              sys.exit(1)
          preload_latest = max(preload_completed, key=lambda r: r.get("updated_at") or "")
          preload_at = datetime.fromisoformat(preload_latest["updated_at"].replace("Z", "+00:00"))
          preload_age_minutes = (now - preload_at).total_seconds() / 60
          print(f"ASTRA_PRELOAD_LAST_RUN={preload_latest.get('html_url')}")
          print(f"ASTRA_PRELOAD_LAST_CONCLUSION={preload_latest.get('conclusion')}")
          print(f"ASTRA_PRELOAD_LAST_AGE_MINUTES={preload_age_minutes:.1f}")
          if preload_latest.get("conclusion") != "success":
              print("ASTRA_HEALTH=FAIL:last_preload_run_failed")
              sys.exit(1)
          # Allow idle periods; this checks stale infrastructure, not upload quotas.
          if age_minutes > 90 and not active_publishers and not active_preloads:
              print("ASTRA_HEALTH=FAIL:publisher_event_chain_stale")
              sys.exit(1)
          if active_publishers or active_preloads:
              print("ASTRA_HEALTH=OK:event_chain_active")
              for run in active_publishers + active_preloads:
                  print(f"ASTRA_ACTIVE_RUN={run.get('html_url')}")
          # A green publisher can still skip every upload. Check publication
          # independently so recurring no-video failures are visible.
          import base64
          try:
              state_file = api("contents/astra_v2_state.json?ref=astra-state")
              state = decode_json_contents_file(state_file, api)
          except (KeyError, ValueError, UnicodeDecodeError, subprocess.CalledProcessError) as exc:
              print(f"ASTRA_HEALTH=FAIL:journal_unavailable:{type(exc).__name__}")
              sys.exit(1)
          published = state.get("published") or {}
          timestamps = []
          for item in published.values():
              if not isinstance(item, dict):
                  continue
              raw = item.get("confirmed_at")
              if not raw:
                  continue
              try:
                  timestamps.append(datetime.fromisoformat(raw.replace("Z", "+00:00")))
              except (ValueError, TypeError):
                  continue
          if not timestamps:
              print("ASTRA_HEALTH=FAIL:no_confirmed_publications")
              sys.exit(1)
          last_publication = max(timestamps)
          publication_age_hours = (now - last_publication).total_seconds() / 3600
          print(f"ASTRA_LAST_PUBLICATION_AGE_HOURS={publication_age_hours:.1f}")
          # This is a visibility alarm, not an automatic quota-bypassing retry.
          if publication_age_hours > 6:
              print("ASTRA_HEALTH=FAIL:publication_stale")
              sys.exit(1)
          print("ASTRA_HEALTH=OK:publisher_running_and_publishing")
          PY
