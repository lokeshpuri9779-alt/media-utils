name: ASTRA V2 - Publisher Health Watch

# Independent operational check, not development CI and never uploads a video.
on:
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check publisher heartbeat and state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess, sys
          from datetime import datetime, timezone

          repo = os.environ["REPO"]
          def api(endpoint):
              result = subprocess.run(
                  ["gh", "api", f"repos/{repo}/{endpoint}"],
                  capture_output=True, text=True, timeout=35, check=True)
              return json.loads(result.stdout)

          # Check real workflow executions, not only the saved upload journal.
          runs = api("actions/workflows/astra-v2-publish.yml/runs?per_page=10")
          completed = [r for r in runs.get("workflow_runs", [])
                       if r.get("status") == "completed"]
          now = datetime.now(timezone.utc)
          if not completed:
              print("ASTRA_HEALTH=FAIL:no_completed_publisher_runs")
              sys.exit(1)
          latest = max(completed, key=lambda r: r.get("updated_at") or "")
          timestamp = datetime.fromisoformat(latest["updated_at"].replace("Z", "+00:00"))
          age_minutes = (now - timestamp).total_seconds() / 60
          print(f"ASTRA_PUBLISHER_LAST_RUN={latest.get('html_url')}")
          print(f"ASTRA_PUBLISHER_LAST_CONCLUSION={latest.get('conclusion')}")
          print(f"ASTRA_PUBLISHER_LAST_AGE_MINUTES={age_minutes:.1f}")
          if latest.get("conclusion") != "success":
              print("ASTRA_HEALTH=FAIL:last_publisher_run_failed")
              sys.exit(1)
          # Distinguish successful push/manual runs from actual scheduled delivery.
          scheduled = [r for r in completed if r.get("event") == "schedule"]
          if scheduled:
              scheduled_latest = max(scheduled, key=lambda r: r.get("created_at") or "")
              scheduled_at = datetime.fromisoformat(scheduled_latest["created_at"].replace("Z", "+00:00"))
              scheduled_age_minutes = (now - scheduled_at).total_seconds() / 60
              print(f"ASTRA_PUBLISHER_LAST_SCHEDULED_RUN={scheduled_latest.get('html_url')}")
              print(f"ASTRA_PUBLISHER_LAST_SCHEDULED_AGE_MINUTES={scheduled_age_minutes:.1f}")
              if scheduled_age_minutes > 90:
                  print("ASTRA_HEALTH=FAIL:publisher_schedule_not_firing")
                  sys.exit(1)
          else:
              print("ASTRA_HEALTH=FAIL:no_recent_scheduled_publisher_runs")
              sys.exit(1)
          # A 90-minute threshold allows normal GitHub cron delays and queued jobs.
          if age_minutes > 90:
              print("ASTRA_HEALTH=FAIL:publisher_schedule_stale")
              sys.exit(1)
          # A green publisher can still skip every upload. Check publication
          # independently so recurring no-video failures are visible.
          import base64
          try:
              state_file = api("contents/astra_v2_state.json?ref=astra-state")
              state = json.loads(base64.b64decode(state_file["content"]).decode("utf-8"))
          except (KeyError, ValueError, UnicodeDecodeError, subprocess.CalledProcessError) as exc:
              print(f"ASTRA_HEALTH=FAIL:journal_unavailable:{type(exc).__name__}")
              sys.exit(1)
          published = state.get("published") or {}
          timestamps = []
          for item in published.values():
              if not isinstance(item, dict):
                  continue
              raw = item.get("confirmed_at")
              if not raw:
                  continue
              try:
                  timestamps.append(datetime.fromisoformat(raw.replace("Z", "+00:00")))
              except (ValueError, TypeError):
                  continue
          if not timestamps:
              print("ASTRA_HEALTH=FAIL:no_confirmed_publications")
              sys.exit(1)
          last_publication = max(timestamps)
          publication_age_hours = (now - last_publication).total_seconds() / 3600
          print(f"ASTRA_LAST_PUBLICATION_AGE_HOURS={publication_age_hours:.1f}")
          # This is a visibility alarm, not an automatic quota-bypassing retry.
          if publication_age_hours > 6:
              print("ASTRA_HEALTH=FAIL:publication_stale")
              sys.exit(1)
          print("ASTRA_HEALTH=OK:publisher_running_and_publishing")
          PY
