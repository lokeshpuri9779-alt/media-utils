name: ASTRA Publisher Schedule Watchdog
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/astra-schedule-watchdog.yml'
      - 'scripts/astra_schedule_watchdog.py'
      - 'tests/test_astra_schedule_watchdog.py'
  schedule:
    - cron: '17,47 * * * *'
permissions:
  actions: read
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify watchdog unit tests
        run: python -m unittest discover -s tests -p 'test_astra_schedule_watchdog.py' -v
        if: github.event_name == 'pull_request'
      - name: Check scheduled publisher activity
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          ASTRA_PUBLISHER_WORKFLOW: astra-v2-publish.yml
          ASTRA_WATCHDOG_MAX_GAP_MINUTES: '45'
        run: python scripts/astra_schedule_watchdog.py
