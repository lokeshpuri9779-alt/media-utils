name: ASTRA V2 preflight isolated validation

on:
  push:
    branches:
      - astra-v2-fast-preflight-20261008

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - run: python -m compileall -q astra_v2
      - run: python -m unittest discover -s tests -p 'test_astra_v2.py' -v
