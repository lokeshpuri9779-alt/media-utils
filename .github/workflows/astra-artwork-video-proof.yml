name: ASTRA Artwork Video Proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'astra/artwork_video_proof.py'
      - 'tests/test_artwork_video_proof.py'
      - '.github/workflows/astra-artwork-video-proof.yml'

permissions:
  contents: read

jobs:
  video-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12'
      - run: python -m unittest discover -s tests -p 'test_artwork_video_proof.py' -v
      - name: Produce 9:16 video proof
        run: python -m astra.artwork_video_proof --output "$RUNNER_TEMP/astra-artwork-proof.mp4"
      - name: Validate encoded MP4 dimensions and duration
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$RUNNER_TEMP/astra-artwork-proof.mp4" | grep -Fx '540,960'
          test "$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$RUNNER_TEMP/astra-artwork-proof.mp4" | cut -d. -f1)" -ge 24
      - uses: actions/upload-artifact@v4
        with:
          name: astra-artwork-video-proof
          path: ${{ runner.temp }}/astra-artwork-proof.mp4
          if-no-files-found: error
          retention-days: 14
