name: ASTRA Studio Runtime Optimization QA
on:
  pull_request:
    paths:
      - 'studio_renderer.py'
      - 'astra_v2/pillow_duo_scene.py'
      - 'astra_v2/pillow_scene_direction.py'
      - 'astra_v2/procedural_visual_library.py'
      - 'tests/test_studio_runtime_optimization.py'
      - 'tools/astra_studio_perf_probe.py'
      - '.github/workflows/astra-studio-runtime-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check 'Pillow>=10,<12' 'numpy>=1.24' 'httpx>=0.25' 'imageio-ffmpeg>=0.5,<1'
      - name: Validate performance and visual fidelity
        run: |
          python -m unittest discover -s tests -p 'test_studio_runtime_optimization.py' -v
          python -m unittest discover -s tests -p 'test_astra_2000_expansion.py' -v
          python -m unittest discover -s tests -p 'test_astra_2000_actions.py' -v
          python -m unittest discover -s tests -p 'test_pillow_duo_continuity.py' -v
      - name: Profile 20 full-size Pillow duo frames
        run: python -m tools.astra_studio_perf_probe
      - name: Upload measured performance report
        uses: actions/upload-artifact@v4
        with:
          name: astra-studio-perf-report
          path: preview/studio-perf-report.json
          retention-days: 7
