name: Cycles CPU benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify experimental credential isolation
        run: python3 tools/experimental_guard.py
      - name: Validate Python syntax
        run: python3 -m py_compile tools/renderer_router.py tools/experimental_guard.py tools/cycles_benchmark.py tests/test_cycles_budget_router.py
      - name: Test renderer budget logic
        run: python3 -m unittest discover -s tests -p 'test_cycles_budget_router.py' -v
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version
      - name: Measure CPU Cycles
        run: |
          blender -b -t 2 --python tools/cycles_benchmark.py -- --output cycles_benchmark.json --samples 32 --frames 3 --width 720 --height 1280
      - name: Decide renderer from measurements
        run: |
          python3 tools/renderer_router.py --report cycles_benchmark.json --frames 120 --max-seconds 600 --complexity-factor 2 --target-width 720 --target-height 1280 --target-samples 32 --output renderer_decision.json
          cat renderer_decision.json
      - name: Upload measured report and decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycles-cpu-benchmark
          path: |
            cycles_benchmark.json
            renderer_decision.json
          if-no-files-found: warn
