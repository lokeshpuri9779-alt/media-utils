          func _base_zone(index: int, zone_name: String, origin: Vector3, size: Vector3, material: Material) -> Node3D:
          	var root := Node3D.new()
          	root.name = "Zone%02d_%s" % [index, zone_name]
          	add_child(root)
          	zone_roots.append(root)

          	var floor_body := StaticBody3D.new()
          	floor_body.position = origin + Vector3(0, -0.6, 0)
          	root.add_child(floor_body)
          	var floor_mesh := MeshInstance3D.new()
          	var box := BoxMesh.new()
          	box.size = size
          	floor_mesh.mesh = box
          	floor_mesh.material_override = material
          	floor_body.add_child(floor_mesh)
          	var collision := CollisionShape3D.new()
          	var shape := BoxShape3D.new()
          	shape.size = size
          	collision.shape = shape
          	floor_body.add_child(collision)

          	_add_wall(root, origin + Vector3(0, 4.5, -size.z*0.5), Vector3(size.x, 9, 1), material)
          	_add_wall(root, origin + Vector3(0, 4.5, size.z*0.5), Vector3(size.x, 9, 1), material)
          	_add_wall(root, origin + Vector3(-size.x*0.5, 4.5, 0), Vector3(1, 9, size.z), material)
          	_add_wall(root, origin + Vector3(size.x*0.5, 4.5, 0), Vector3(1, 9, size.z), material)

          	checkpoints.append(Transform3D(Basis.IDENTITY, origin + Vector3(0, 1.0, size.z*0.30)))
          	var spawns: Array[Transform3D] = []
          	for i in range(10):
          		var angle := TAU * float(i) / 10.0
          		var radius_x := size.x * 0.34
          		var radius_z := size.z * 0.34
          		spawns.append(Transform3D(Basis.IDENTITY, origin + Vector3(cos(angle)*radius_x, 0.3, sin(angle)*radius_z)))
          	spawn_sets.append(spawns)
          	return root


          func _add_wall(root: Node3D, position: Vector3, size: Vector3, material: Material) -> void:
          	var body := StaticBody3D.new()
          	body.position = position
          	root.add_child(body)
          	var mesh := MeshInstance3D.new()
          	var box := BoxMesh.new()
          	box.size = size
          	mesh.mesh = box
          	mesh.material_override = material
          	body.add_child(mesh)
          	var collision := CollisionShape3D.new()
          	var shape := BoxShape3D.new()
          	shape.size = size
          	collision.shape = shape
          	body.add_child(collision)


          func _add_model(root: Node3D, path: String, position: Vector3, scale_value: Vector3, rotation_y: float) -> void:
          	if not ResourceLoader.exists(path):
          		return
          	var packed = load(path)
          	if not packed is PackedScene:
          		return
          	var instance: Node3D = packed.instantiate()
          	instance.position = position
          	instance.scale = scale_value
          	instance.rotation.y = rotation_y
          	root.add_child(instance)


          func _add_lights(root: Node3D, origin: Vector3, color: Color) -> void:
          	for p in [Vector3(-24, 8, -18), Vector3(24, 8, -18), Vector3(-24, 8, 18), Vector3(24, 8, 18)]:
          		var light := OmniLight3D.new()
          		light.position = origin + p
          		light.light_color = color
          		light.light_energy = 2.4
          		light.omni_range = 32.0
          		light.shadow_enabled = true
          		root.add_child(light)


          func get_checkpoint(index: int) -> Transform3D:
          	if checkpoints.is_empty():
          		return Transform3D.IDENTITY
          	return checkpoints[clampi(index, 0, checkpoints.size() - 1)]


          func get_enemy_spawn(chapter_index: int, marker_index: int, spawn_index: int) -> Transform3D:
          	var set_index := clampi(chapter_index, 0, spawn_sets.size() - 1)
          	var options: Array = spawn_sets[set_index]
          	if options.is_empty():
          		return get_checkpoint(set_index)
          	return options[(marker_index + spawn_index) % options.size()]


          func activate_zone(index: int) -> void:
          	for i in range(zone_roots.size()):
          		zone_roots[i].visible = (i == 0 or i == index)
          GDSCRIPT

          cat > game/campaign/special_enemy.gd <<'GDSCRIPT'
          class_name PulseSpecialEnemy
          extends CharacterBody3D

          signal exploded

          @export var model_path := ""
          @export var health := 8
          @export var damage := 12
          @export var attack_interval := 3.0
          @export var move_speed := 3.0
          @export var hover_height := 1.6
          @export var attack_range := 26.0
          @export var boss := false
          var target: Node3D = null
          var dead := false
          var attack_timer := 0.0
          var base_y := 0.0
          var model_root: Node3D = null

          func _ready() -> void:
          	base_y = global_position.y
          	var collision := CollisionShape3D.new()
          	var shape := CapsuleShape3D.new()
          	shape.radius = 0.9 if not boss else 2.0
          	shape.height = 2.6 if not boss else 5.0
          	collision.shape = shape
          	add_child(collision)

          	if ResourceLoader.exists(model_path):
          		var packed = load(model_path)
          		if packed is PackedScene:
          			model_root = packed.instantiate()
          			model_root.scale = Vector3.ONE * (1.7 if not boss else 4.0)
          			model_root.position.y = -0.2 if not boss else -1.4
          			add_child(model_root)

          	var light := OmniLight3D.new()
          	light.light_color = Color(0.7, 0.1, 1.0) if boss else Color(0.1, 0.75, 1.0)
          	light.light_energy = 1.6 if boss else 0.75
          	light.omni_range = 10.0 if boss else 5.0
          	add_child(light)


          func _physics_process(delta: float) -> void:
          	if dead or target == null or not is_instance_valid(target):
          		return
          	attack_timer = maxf(attack_timer - delta, 0.0)
          	var to_target := target.global_position - global_position
          	var horizontal := Vector3(to_target.x, 0, to_target.z)
          	var dist := horizontal.length()
          	if dist > 7.0:
          		velocity = horizontal.normalized() * move_speed
          	else:
          		velocity = Vector3.ZERO
          	global_position.y = lerpf(global_position.y, base_y + hover_height + sin(Time.get_ticks_msec() * 0.002) * 0.35, delta * 2.0)
          	if horizontal.length() > 0.2:
          		look_at(global_position + horizontal.normalized(), Vector3.UP)
          	move_and_slide()
          	if dist <= attack_range and attack_timer <= 0.0:
          		attack_timer = attack_interval
          		_attack()


          func _attack() -> void:
          	if target == null or not target.has_method("take_damage"):
          		return
          	if boss:
          		var burst := 2 if health > 18 else 3
          		for i in range(burst):
          			if is_instance_valid(target):
          				target.take_damage(damage)
          	else:
          		target.take_damage(damage)


          @rpc("call_local")
          func hit() -> void:
          	hit_damage(1)


          func hit_damage(amount: int) -> void:
          	if dead:
          		return
          	health -= maxi(amount, 1)
          	if health <= 0:
          		_die()


          func _die() -> void:
          	dead = true
          	exploded.emit()
          	var tween := create_tween()
          	tween.tween_property(self, "scale", Vector3.ONE * 0.05, 0.28)
          	tween.tween_callback(queue_free)
          GDSCRIPT

