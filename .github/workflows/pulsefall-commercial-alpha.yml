          )
          s=s.replace(
              'var h_velocity: Vector3 = orientation.origin / delta\n\tvelocity.x = h_velocity.x\n\tvelocity.z = h_velocity.z',
              'var h_velocity: Vector3 = orientation.origin / delta\n\tvar movement_multiplier := 1.35 if Input.is_key_pressed(KEY_SHIFT) else 1.0\n\tvelocity.x = h_velocity.x * movement_multiplier\n\tvelocity.z = h_velocity.z * movement_multiplier'
          )
          old='''\t# If we're below -40, respawn (teleport to the initial position).\n\tif transform.origin.y < -40.0:\n\t\ttransform.origin = initial_position\n'''
          new='''\trescue_cooldown = maxf(rescue_cooldown - delta, 0.0)\n\tvar on_floor_now := is_on_floor()\n\tif was_on_floor and not on_floor_now:\n\t\tfall_origin_y = global_position.y\n\tif on_floor_now:\n\t\tvar drop_distance := fall_origin_y - global_position.y\n\t\tif drop_distance > 8.5 and rescue_cooldown <= 0.0:\n\t\t\trecover_to_checkpoint()\n\t\telse:\n\t\t\tlast_safe_transform = global_transform\n\t\t\tfall_origin_y = global_position.y\n\tif global_position.y < -19.0 and rescue_cooldown <= 0.0:\n\t\trecover_to_checkpoint()\n\twas_on_floor = on_floor_now\n'''
          if old not in s:
              raise SystemExit("old -40 rescue block not found")
          s=s.replace(old,new)
          p.write_text(s)
