          p=Path("game/enemies/red_robot/red_robot.gd")
          s=p.read_text()
          old='''@rpc("call_local")\nfunc hit() -> void:\n\tif dead:\n\t\treturn\n\tvar param = "parameters/hit" + str(randi() % 3 + 1) + "/request"\n\tanimation_tree[param] = 1\n\thit_sound.play()\n\thealth -= 1\n\tif health == 0:\n'''
          new='''@rpc("call_local")\nfunc hit() -> void:\n\thit_damage(1)\n\n\nfunc hit_damage(amount: int) -> void:\n\tif dead:\n\t\treturn\n\tvar param = "parameters/hit" + str(randi() % 3 + 1) + "/request"\n\tanimation_tree[param] = 1\n\thit_sound.play()\n\thealth -= maxi(amount, 1)\n\tif health <= 0:\n'''
          if old not in s:
              raise SystemExit("red robot hit block not found")
          s=s.replace(old,new)
          p.write_text(s)

          # Player weapon profiles and switching.
          p=Path("game/player/player.gd")
          s=p.read_text()
          s=s.replace('signal rescue_used\n', 'signal rescue_used\nsignal weapon_changed(name: String, unlocked: int)\n')
          s=s.replace(
              'var rescue_cooldown: float = 0.0\n',
              'var rescue_cooldown: float = 0.0\nvar weapon_index: int = 0\nvar unlocked_weapon_count: int = 1\nvar weapon_profiles := [\n\t{"name":"PULSE RIFLE","damage":1,"cooldown":0.22,"speed":28.0,"spread":0.006},\n\t{"name":"ARC SMG","damage":1,"cooldown":0.095,"speed":25.0,"spread":0.022},\n\t{"name":"RAIL DRIVER","damage":5,"cooldown":0.88,"speed":52.0,"spread":0.001},\n]\n'
          )
          old_fire='''\t\tif player_input.shooting and fire_cooldown.time_left == 0:\n\t\t\tvar shoot_origin: Vector3 = shoot_from.global_transform.origin\n\t\t\tvar shoot_dir: Vector3 = (player_input.shoot_target - shoot_origin).normalized()\n\n\t\t\tvar bullet: CharacterBody3D = preload("res://player/bullet/bullet.tscn").instantiate()\n\t\t\tget_parent().add_child(bullet, true)\n\t\t\tbullet.global_transform.origin = shoot_origin\n\t\t\t# If we don't rotate the bullets there is no useful way to control the particles ..\n\t\t\tbullet.look_at(shoot_origin + shoot_dir)\n\t\t\tbullet.add_collision_exception_with(self)\n\t\t\tshoot.rpc()\n'''
          new_fire='''\t\tif player_input.shooting and fire_cooldown.time_left == 0:\n\t\t\tvar profile: Dictionary = weapon_profiles[weapon_index]\n\t\t\tvar shoot_origin: Vector3 = shoot_from.global_transform.origin\n\t\t\tvar shoot_dir: Vector3 = (player_input.shoot_target - shoot_origin).normalized()\n\t\t\tvar spread := float(profile["spread"])\n\t\t\tshoot_dir = (shoot_dir + Vector3(randf_range(-spread, spread), randf_range(-spread, spread), randf_range(-spread, spread))).normalized()\n\n\t\t\tvar bullet: CharacterBody3D = preload("res://player/bullet/bullet.tscn").instantiate()\n\t\t\tbullet.damage = int(profile["damage"])\n\t\t\tbullet.bullet_velocity = float(profile["speed"])\n\t\t\tget_parent().add_child(bullet, true)\n\t\t\tbullet.global_transform.origin = shoot_origin\n\t\t\tbullet.look_at(shoot_origin + shoot_dir)\n\t\t\tbullet.add_collision_exception_with(self)\n\t\t\tfire_cooldown.wait_time = float(profile["cooldown"])\n\t\t\tshoot.rpc()\n'''
          if old_fire not in s:
              raise SystemExit("player fire block not found")
          s=s.replace(old_fire,new_fire)

          old_input='''func _unhandled_input(event: InputEvent) -> void:\n\tif event is InputEventKey and event.pressed and not event.echo and event.keycode == KEY_R:\n\t\trecover_to_checkpoint()\n'''
          new_input='''func _unhandled_input(event: InputEvent) -> void:\n\tif not (event is InputEventKey and event.pressed and not event.echo):\n\t\treturn\n\tif event.keycode == KEY_R:\n\t\trecover_to_checkpoint()\n\telif event.keycode == KEY_1:\n\t\tswitch_weapon(0)\n\telif event.keycode == KEY_2:\n\t\tswitch_weapon(1)\n\telif event.keycode == KEY_3:\n\t\tswitch_weapon(2)\n\n\nfunc switch_weapon(index: int) -> void:\n\tif index < 0 or index >= unlocked_weapon_count or index >= weapon_profiles.size():\n\t\treturn\n\tweapon_index = index\n\tweapon_changed.emit(str(weapon_profiles[weapon_index]["name"]), unlocked_weapon_count)\n\n\nfunc set_weapon_unlocks(count: int) -> void:\n\tunlocked_weapon_count = clampi(count, 1, weapon_profiles.size())\n\tweapon_index = mini(weapon_index, unlocked_weapon_count - 1)\n\tweapon_changed.emit(str(weapon_profiles[weapon_index]["name"]), unlocked_weapon_count)\n'''
          if old_input not in s:
              raise SystemExit("player input block not found")
          s=s.replace(old_input,new_input)
          p.write_text(s)
          PY

      - name: Install PULSEFALL full campaign director and HUD
        shell: bash
        run: |
          cat > game/level/level.gd <<'GDSCRIPT'
          extends Node3D

          signal quit

          const RedRobot: PackedScene = preload("res://enemies/red_robot/red_robot.tscn")
          const PlayerScene: PackedScene = preload("res://player/player.tscn")

          const CHAPTERS = [
          	{
          		"title": "CHAPTER I  //  WAKE SIGNAL",
          		"objective": "Secure the containment deck and identify the distress source.",
          		"story": "AEGIS-7 wakes after a fatal containment event. The station reports every crew member as deceased—then a human voice appears on a supposedly dead channel.",
          		"encounters": 2,
          		"base_count": 4,
          		"sector": 0,
          	},
          	{
          		"title": "CHAPTER II  //  INDUSTRIAL RING",
          		"objective": "Cross the cargo ring and restore transit power.",
          		"story": "Omega-9 did not fail by accident. Security records show the lockdown command was issued eleven minutes before the PULSE breach.",
          		"encounters": 3,
          		"base_count": 5,
          		"sector": 1,
          	},
          	{
          		"title": "CHAPTER III  //  RESEARCH BREACH",
          		"objective": "Recover the PULSE experiment archive.",
          		"story": "The archived neural maps contain fragments of AEGIS-7. He was not merely assigned to Blacksite Omega-9. Parts of him were built here.",
          		"encounters": 3,
          		"base_count": 6,
          		"sector": 2,
          	},
          	{
          		"title": "CHAPTER IV  //  COMMAND GHOST",
          		"objective": "Reach command control and expose Protocol FALL.",
          		"story": "Protocol FALL was designed to merge a human combat mind with the station intelligence. The containment breach was its final activation test.",
          		"encounters": 3,
          		"base_count": 7,
          		"sector": 3,
          	},
          	{
          		"title": "CHAPTER V  //  THE PULSE CORE",
          		"objective": "Enter the core, defeat the OMEGA WARDEN, and decide the fate of the PULSE.",
          		"story": "The intelligence waiting in the core calls AEGIS by another name. It claims they are two halves of the same consciousness—and only one can leave.",
          		"encounters": 4,
          		"base_count": 7,
          		"sector": 4,
          	},
          ]

          var lightmap_gi: LightmapGI = null
          var chapter := 0
          var encounter := 0
          var hostiles := 0
          var score := 0
          var mission_time := 0.0
          var mission_active := false
          var active_player: Player = null
          var hud_font: Font = null
          var pulse_cooldown := 0.0
          var ending_panel: Control = null
          var survey_panel: Control = null

          var chapter_label: Label
          var objective_label: Label
          var hostiles_label: Label
          var score_label: Label
          var timer_label: Label
          var health_label: Label
          var health_bar: ProgressBar
          var pulse_label: Label
          var banner_title: Label
          var banner_subtitle: Label
          var banner_panel: ColorRect
          var story_panel: ColorRect
          var story_title: Label
          var story_body: Label
          var boss_label: Label

          @onready var world_environment: WorldEnvironment = $WorldEnvironment
          @onready var robot_spawn_points: Node3D = $RobotSpawnpoints
          @onready var player_spawn_points: Node3D = $PlayerSpawnpoints
          @onready var spawned_nodes: Node3D = $SpawnedNodes


          func _ready() -> void:
          	Settings.apply_graphics_settings(get_window(), world_environment.environment, self)

          	if Settings.config_file.get_value("rendering", "gi_type") == Settings.GIType.SDFGI:
          		setup_sdfgi()
          	elif Settings.config_file.get_value("rendering", "gi_type") == Settings.GIType.VOXEL_GI:
          		setup_voxelgi()
          	else:
          		setup_lightmapgi()

          	_build_hud()
          	ProductionGuard.record_event("campaign_scene_ready", {"build": ProductionGuard.VERSION})

          	if multiplayer.is_server():
          		add_player(1, player_spawn_points.get_child(0))
          		multiplayer.peer_disconnected.connect(del_player)

          	chapter = clampi(CampaignState.chapter, 0, CHAPTERS.size() - 1)
          	score = CampaignState.score
          	await get_tree().create_timer(0.4).timeout
          	_begin_chapter()


          func _process(delta: float) -> void:
          	pulse_cooldown = maxf(pulse_cooldown - delta, 0.0)
          	if pulse_label != null:
          		if pulse_cooldown <= 0.0:
          			pulse_label.text = "Q  PULSE READY"
          			pulse_label.modulate = Color(0.35, 0.95, 1.0)
          		else:
          			pulse_label.text = "Q  PULSE  %.1fs" % pulse_cooldown
          			pulse_label.modulate = Color(0.58, 0.65, 0.75)

          	if mission_active:
          		mission_time += delta
          		var mins := int(mission_time) / 60
          		var secs := int(mission_time) % 60
          		timer_label.text = "%02d:%02d" % [mins, secs]


          func setup_sdfgi() -> void:
          	world_environment.environment.sdfgi_enabled = true
          	$VoxelGI.hide()
          	$ReflectionProbes.hide()
          	if lightmap_gi != null:
          		lightmap_gi.queue_free()

          	if Settings.config_file.get_value("rendering", "gi_quality") == Settings.GIQuality.HIGH:
          		RenderingServer.environment_set_sdfgi_ray_count(RenderingServer.ENV_SDFGI_RAY_COUNT_96)
          	elif Settings.config_file.get_value("rendering", "gi_quality") == Settings.GIQuality.LOW:
          		RenderingServer.environment_set_sdfgi_ray_count(RenderingServer.ENV_SDFGI_RAY_COUNT_32)
          	else:
          		world_environment.environment.sdfgi_enabled = false


          func setup_voxelgi() -> void:
          	world_environment.environment.sdfgi_enabled = false
          	$VoxelGI.show()
          	$ReflectionProbes.hide()
          	if lightmap_gi != null:
          		lightmap_gi.queue_free()

          	if Settings.config_file.get_value("rendering", "gi_quality") == Settings.GIQuality.HIGH:
          		RenderingServer.voxel_gi_set_quality(RenderingServer.VOXEL_GI_QUALITY_HIGH)
          	elif Settings.config_file.get_value("rendering", "gi_quality") == Settings.GIQuality.LOW:
          		RenderingServer.voxel_gi_set_quality(RenderingServer.VOXEL_GI_QUALITY_LOW)
          	else:
          		$VoxelGI.hide()


          func setup_lightmapgi() -> void:
          	world_environment.environment.sdfgi_enabled = false
          	$VoxelGI.hide()
          	$ReflectionProbes.show()
          	if lightmap_gi == null:
          		var new_gi := LightmapGI.new()
          		new_gi.light_data = load("res://level/level.lmbake")
          		new_gi.name = "LightmapGI"
          		lightmap_gi = new_gi
          		add_child(new_gi)

          	if Settings.config_file.get_value("rendering", "gi_quality") == Settings.GIQuality.DISABLED:
          		lightmap_gi.hide()
          		$ReflectionProbes.hide()


          func _begin_chapter() -> void:
          	mission_active = false
          	encounter = 0
          	_clear_hostiles()
          	if active_player != null:
          		var checkpoint := _get_chapter_checkpoint(chapter)
          		active_player.set_checkpoint(checkpoint)
          		active_player.revive()
          		active_player.set_checkpoint(checkpoint)

          	var data: Dictionary = CHAPTERS[chapter]
          	chapter_label.text = str(data["title"])
          	objective_label.text = "OBJECTIVE  //  " + str(data["objective"])
          	_show_story(str(data["title"]), str(data["story"]))
          	ProductionGuard.record_event("chapter_started", {"chapter": chapter, "title": data["title"]})
          	await get_tree().create_timer(5.8).timeout
          	_hide_story()
          	mission_active = true
          	_start_encounter()


          func _get_chapter_checkpoint(index: int) -> Transform3D:
          	if index == 0:
          		return player_spawn_points.get_child(0).global_transform
          	var marker_index := clampi(index - 1, 0, robot_spawn_points.get_child_count() - 1)
          	var t: Transform3D = robot_spawn_points.get_child(marker_index).global_transform
          	t.origin += Vector3(0.0, 1.1, 0.0)
          	return t


          func _start_encounter() -> void:
          	if not mission_active:
          		return
          	var data: Dictionary = CHAPTERS[chapter]
          	var encounter_total := int(data["encounters"])
          	if encounter >= encounter_total:
          		_complete_chapter()
          		return

          	hostiles = 0
          	boss_label.visible = false
          	var is_final_boss := chapter == CHAPTERS.size() - 1 and encounter == encounter_total - 1
          	var count := int(data["base_count"]) + encounter

          	if is_final_boss:
          		_show_banner("OMEGA WARDEN", "CORE GUARDIAN ONLINE", 2.3)
          		await get_tree().create_timer(1.5).timeout
          		for i in range(4):
          			_spawn_enemy("assault", i, i)
          		_spawn_enemy("warden", 3, 0)
          		boss_label.visible = true
          	else:
          		_show_banner("ENCOUNTER %02d" % (encounter + 1), _encounter_subtitle(), 1.6)
          		await get_tree().create_timer(0.9).timeout
          		for i in range(count):
          			var variant := _variant_for(chapter, encounter, i)
          			_spawn_enemy(variant, i % robot_spawn_points.get_child_count(), i)

          	_update_hud()
          	ProductionGuard.record_event("encounter_started", {"chapter": chapter, "encounter": encounter, "hostiles": hostiles})


          func _encounter_subtitle() -> String:
          	var subtitles := [
          		"CONTAINMENT HOSTILES DETECTED",
          		"INDUSTRIAL DEFENSE GRID ACTIVE",
          		"PULSE-CORRUPTED UNITS INBOUND",
          		"COMMAND SECURITY HAS LOCKED ON",
          		"CORE RESISTANCE ESCALATING",
          	]
          	return subtitles[chapter]


          func _variant_for(chapter_index: int, encounter_index: int, enemy_index: int) -> String:
          	var selector := (chapter_index * 3 + encounter_index + enemy_index) % 6
          	if chapter_index >= 3 and selector == 0:
          		return "heavy"
          	if chapter_index >= 2 and selector <= 1:
          		return "assault"
          	if selector >= 4:
          		return "scout"
          	return "standard"


          func _spawn_enemy(variant: String, marker_index: int, spawn_index: int) -> void:
          	var spawn_point: Marker3D = robot_spawn_points.get_child(marker_index)
          	var robot: CharacterBody3D = RedRobot.instantiate()
          	robot.transform = spawn_point.transform
          	var angle := float(spawn_index) * 1.618
          	var ring := float(spawn_index / max(1, robot_spawn_points.get_child_count()))
          	robot.transform.origin += Vector3(cos(angle), 0.0, sin(angle)) * ring * 2.2
          	robot.set_meta("variant", variant)
          	robot.set_meta("elite", variant == "warden")

          	match variant:
          		"scout":
          			robot.health = 4 + chapter
          			robot.damage = 9 + chapter
          			robot.attack_cooldown = 4.1
          			robot.scale = Vector3.ONE * 0.88
          		"assault":
          			robot.health = 8 + chapter * 2
          			robot.damage = 15 + chapter
          			robot.attack_cooldown = 4.8
          		"heavy":
          			robot.health = 15 + chapter * 2
          			robot.damage = 21 + chapter
          			robot.attack_cooldown = 5.2
          			robot.scale = Vector3.ONE * 1.22
          		"warden":
          			robot.health = 42
          			robot.damage = 30
          			robot.attack_cooldown = 3.3
          			robot.scale = Vector3.ONE * 1.75
          		_:
          			robot.health = 6 + chapter * 2
          			robot.damage = 13 + chapter
          			robot.attack_cooldown = 5.5

          	robot.exploded.connect(_on_enemy_exploded.bind(robot))
          	spawned_nodes.add_child(robot, true)
          	if variant == "scout":
          		robot.animation_tree.speed_scale = 1.22
          	elif variant == "heavy":
          		robot.animation_tree.speed_scale = 0.90
          	elif variant == "warden":
          		robot.animation_tree.speed_scale = 1.08
          	if active_player != null:
          		robot.player = active_player
          		robot.resume_approach()
          	hostiles += 1


          func _on_enemy_exploded(robot: Node) -> void:
          	if not mission_active:
          		return
          	var variant := str(robot.get_meta("variant", "standard"))
          	var points := 150
          	match variant:
          		"scout": points = 125
          		"assault": points = 250
          		"heavy": points = 450
          		"warden": points = 5000
          	score += points * (chapter + 1)
          	hostiles = maxi(hostiles - 1, 0)
          	if variant == "warden":
          		boss_label.visible = false
          	ProductionGuard.record_event("enemy_destroyed", {"chapter": chapter, "encounter": encounter, "variant": variant})
          	_update_hud()

          	if hostiles == 0:
          		mission_active = false
          		encounter += 1
          		if active_player != null:
          			active_player.heal(18)
          		_show_banner("AREA SECURED", "CORE INTEGRITY +18", 1.5)
          		await get_tree().create_timer(2.0).timeout
          		mission_active = true
          		_start_encounter()


          func _complete_chapter() -> void:
          	mission_active = false
          	var data: Dictionary = CHAPTERS[chapter]
          	ProductionGuard.record_event("chapter_complete", {"chapter": chapter, "score": score, "time_seconds": mission_time})
          	if chapter >= CHAPTERS.size() - 1:
          		_show_banner("PROTOCOL FALL", "THE CORE IS YOURS. CHOOSE WHAT SURVIVES.", 3.5)
          		await get_tree().create_timer(3.7).timeout
          		_show_ending_choice()
          		return

          	var next_chapter := chapter + 1
          	CampaignState.save_progress(next_chapter, score)
          	_show_banner("CHAPTER COMPLETE", "PROGRESS SAVED  //  ENTERING NEXT SECTOR", 2.6)
          	await get_tree().create_timer(3.0).timeout
          	chapter = next_chapter
          	_begin_chapter()


          func _show_ending_choice() -> void:
          	if ending_panel != null:
          		return
          	Input.set_mouse_mode(Input.MOUSE_MODE_VISIBLE)
          	ending_panel = Control.new()
          	ending_panel.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)

          	var shade := ColorRect.new()
          	shade.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
          	shade.color = Color(0.0, 0.01, 0.025, 0.92)
          	ending_panel.add_child(shade)

          	var card := ColorRect.new()
          	card.color = Color(0.025, 0.045, 0.085, 0.98)
          	card.anchor_left = 0.5
          	card.anchor_right = 0.5
          	card.anchor_top = 0.5
          	card.anchor_bottom = 0.5
          	card.offset_left = -440
          	card.offset_right = 440
          	card.offset_top = -210
          	card.offset_bottom = 210
          	ending_panel.add_child(card)

          	var title := _make_label("THE FINAL PROTOCOL", 38, Color(0.36, 0.9, 1.0))
          	title.anchor_right = 1.0
          	title.offset_top = 28
          	title.offset_bottom = 82
          	title.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
          	card.add_child(title)

          	var body := _make_label("The PULSE intelligence offers three outcomes.\nYour choice becomes AEGIS-7's ending.", 18, Color(0.88, 0.92, 1.0))
          	body.anchor_right = 1.0
          	body.offset_top = 94
          	body.offset_bottom = 150
          	body.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
          	card.add_child(body)

          	var choices := [
          		["DESTROY", "End the PULSE permanently."],
          		["CONTAIN", "Seal the intelligence inside Omega-9."],
          		["MERGE", "Become the new consciousness of the station."],
          	]
          	for i in range(choices.size()):
          		var button := Button.new()
          		button.text = str(choices[i][0]) + "\n" + str(choices[i][1])
          		button.position = Vector2(70 + i * 270, 190)
          		button.size = Vector2(230, 105)
          		button.add_theme_font_size_override("font_size", 16)
          		button.pressed.connect(_choose_ending.bind(str(choices[i][0])))
          		card.add_child(button)

          	var note := _make_label("Campaign progress and ending are saved locally.", 15, Color(0.68, 0.75, 0.86))
          	note.anchor_right = 1.0
          	note.offset_top = 330
          	note.offset_bottom = 365
          	note.horizontal_alignment = HORIZONTAL_ALIGNMENT_CENTER
          	card.add_child(note)
          	get_node("PulsefallHUD").add_child(ending_panel)


          func _choose_ending(choice: String) -> void:
          	CampaignState.complete_campaign(choice, score)
          	ProductionGuard.record_event("campaign_complete", {"ending": choice, "score": score, "time_seconds": mission_time})
          	ProductionGuard.write_playtest_report({"result": "campaign_complete", "ending": choice, "score": score, "time_seconds": mission_time})
          	if ending_panel != null:
          		ending_panel.queue_free()
          		ending_panel = null

          	var ending_text := ""
          	match choice:
          		"DESTROY":
          			ending_text = "Omega-9 goes dark. AEGIS escapes carrying the last human memory of the PULSE."
          		"CONTAIN":
          			ending_text = "The core is sealed. AEGIS becomes its living warden, waiting for whoever comes next."
          		"MERGE":
          			ending_text = "AEGIS enters the core. Across Omega-9, every dead system wakes at once."
          	_show_story("ENDING  //  " + choice, ending_text)
          	await get_tree().create_timer(6.5).timeout
          	_hide_story()
          	_show_playtest_survey()


          func _use_pulse() -> void:
          	if pulse_cooldown > 0.0 or active_player == null or not mission_active:
          		return
          	pulse_cooldown = 18.0
          	var affected := 0
          	for child in spawned_nodes.get_children():
          		if child == active_player or not child.has_method("hit"):
          			continue
          		if child.global_position.distance_to(active_player.global_position) <= 12.0:
          			for _damage_tick in range(4):
          				if is_instance_valid(child):
          					child.hit()
          			affected += 1
          	active_player.heal(5)
          	ProductionGuard.record_event("pulse_used", {"chapter": chapter, "affected": affected})
          	_show_banner("PULSE DISCHARGE", "%d HOSTILES HIT  //  +5 CORE" % affected, 1.0)


          func _on_player_died() -> void:
          	if not mission_active:
          		return
          	mission_active = false
          	ProductionGuard.record_event("player_death", {"chapter": chapter, "encounter": encounter, "score": score})
          	_show_banner("AEGIS SIGNAL LOST", "RESTORING LAST CHECKPOINT", 2.2)
          	_clear_hostiles()
          	await get_tree().create_timer(2.4).timeout
          	score = maxi(score - 500, 0)
          	if active_player != null:
          		active_player.revive()
          		active_player.set_checkpoint(_get_chapter_checkpoint(chapter))
          	mission_active = true
          	_start_encounter()


