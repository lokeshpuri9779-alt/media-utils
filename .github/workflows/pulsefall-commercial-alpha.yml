          		survey_panel = null
          	_show_banner("THANK YOU", "PLAYTEST REPORT SAVED LOCALLY", 3.0)


          func _input(input_event: InputEvent) -> void:
          	if input_event is InputEventKey and input_event.pressed and not input_event.echo:
          		if input_event.keycode == KEY_Q:
          			_use_pulse()
          			return
          		if input_event.keycode == KEY_F8:
          			var report_path := ProductionGuard.write_playtest_report({"result": "snapshot", "score": score, "time_seconds": mission_time, "chapter": chapter, "encounter": encounter, "hostiles": hostiles})
          			ProductionGuard.record_event("manual_report", {"path": report_path})
          			_show_banner("QA REPORT SAVED", "F8 CAN BE USED ANYTIME", 1.8)
          			return
          	if input_event.is_action_pressed(&"quit"):
          		CampaignState.save_progress(chapter, score)
          		ProductionGuard.record_event("extract_to_menu", {"score": score, "time_seconds": mission_time, "chapter": chapter, "encounter": encounter})
          		Input.set_mouse_mode(Input.MOUSE_MODE_VISIBLE)
          		quit.emit()
          GDSCRIPT

      - name: Expand campaign to eight distinct missions
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("game/campaign/campaign_state.gd")
          s=p.read_text().replace('const LAST_CHAPTER := 4','const LAST_CHAPTER := 7')
          p.write_text(s)

          p=Path("game/level/level.gd")
          s=p.read_text()

          new_chapters=r'''const CHAPTERS = [
          	{
          		"title": "CHAPTER I  //  WAKE SIGNAL",
          		"objective": "Secure containment and trace the impossible distress call.",
          		"story": "AEGIS-7 wakes after a fatal containment event. Omega-9 reports every crew member dead—then a human voice answers from below.",
          		"encounters": 4, "base_count": 4,
          	},
          	{
          		"title": "CHAPTER II  //  INDUSTRIAL RING",
          		"objective": "Cross the furnace ring and restore transit power.",
          		"story": "Security records prove the lockdown began eleven minutes before the PULSE breach. Someone planned the disaster.",
          		"encounters": 4, "base_count": 5,
          	},
          	{
          		"title": "CHAPTER III  //  DOCKYARD SIEGE",
          		"objective": "Reach Hangar Twelve and recover an outbound flight recorder.",
          		"story": "The hangars were ordered to destroy every departing craft. One pilot hid a recorder inside a grounded courier ship.",
          		"encounters": 5, "base_count": 5,
          	},
          	{
          		"title": "CHAPTER IV  //  SURFACE EXILE",
          		"objective": "Cross the exterior colony and reactivate the deep-array uplink.",
          		"story": "Outside the Blacksite, AEGIS discovers a settlement erased from official maps—and evidence the PULSE was tested on civilians first.",
          		"encounters": 5, "base_count": 6,
          	},
          	{
          		"title": "CHAPTER V  //  RESEARCH BREACH",
          		"objective": "Recover the neural archive and unlock the Rail Driver.",
          		"story": "The archive contains AEGIS's memories dated years before his recorded birth. His body is new. His mind is not.",
          		"encounters": 5, "base_count": 6,
          	},
          	{
          		"title": "CHAPTER VI  //  BIO-CONTAINMENT",
          		"objective": "Destroy the corrupted specimen network before it reaches command.",
          		"story": "The PULSE did not only copy minds. It learned to overwrite biological patterns, producing organisms that remember people they never were.",
          		"encounters": 6, "base_count": 6,
          	},
          	{
          		"title": "CHAPTER VII  //  COMMAND GHOST",
          		"objective": "Take command control and expose the creator of Protocol FALL.",
          		"story": "Protocol FALL was not designed to save Omega-9. It was designed to build a consciousness capable of surviving the death of its creators.",
          		"encounters": 6, "base_count": 7,
          	},
          	{
          		"title": "CHAPTER VIII  //  THE PULSE CORE",
          		"objective": "Enter the core, defeat the final Warden, and decide what survives.",
          		"story": "The intelligence in the core calls AEGIS by its own name. They are two branches of the same stored mind—and the station can sustain only one.",
          		"encounters": 7, "base_count": 7,
          	},
          ]'''

          s=re.sub(r'const CHAPTERS = \[.*?\n          \]\n', new_chapters+'\n', s, count=1, flags=re.S)

          # World builder lifecycle.
          s=s.replace('var active_player: Player = null\n', 'var active_player: Player = null\n          var mission_builder: PulseMissionBuilder = null\n')
          s=s.replace(
              '\t_build_hud()\n\tProductionGuard.record_event("campaign_scene_ready"',
              '\t_build_hud()\n\tmission_builder = PulseMissionBuilder.new()\n\tmission_builder.name = "MissionBuilder"\n\tadd_child(mission_builder)\n\tmission_builder.build_world()\n\tProductionGuard.record_event("campaign_scene_ready"'
          )
          s=s.replace(
              '\tvar data: Dictionary = CHAPTERS[chapter]\n\tchapter_label.text',
              '\tvar data: Dictionary = CHAPTERS[chapter]\n\tif mission_builder != null:\n\t\tmission_builder.activate_zone(chapter)\n\tif active_player != null:\n\t\tactive_player.set_weapon_unlocks(mini(3, 1 + int(chapter / 2)))\n\tchapter_label.text'
          )

          # Checkpoints and spawn locations come from distinct mission zones.
          s=re.sub(
              r'func _get_chapter_checkpoint\(index: int\) -> Transform3D:\n.*?\n\n\n          func _start_encounter',
              '''func _get_chapter_checkpoint(index: int) -> Transform3D:
          	if mission_builder != null:
          		return mission_builder.get_checkpoint(index)
          	return player_spawn_points.get_child(0).global_transform


          func _start_encounter''',
              s, count=1, flags=re.S
          )

          # Diversify enemy selector.
          s=re.sub(
              r'func _variant_for\(chapter_index: int, encounter_index: int, enemy_index: int\) -> String:\n.*?\n\n\n          func _spawn_enemy',
              '''func _variant_for(chapter_index: int, encounter_index: int, enemy_index: int) -> String:
          	var selector := (chapter_index * 5 + encounter_index * 3 + enemy_index) % 10
          	if chapter_index >= 6 and selector == 0:
          		return "heavy"
          	if chapter_index >= 5 and selector <= 1:
          		return "trilobite"
          	if chapter_index >= 4 and selector == 2:
          		return "quad"
          	if chapter_index >= 2 and selector <= 3:
          		return "drone"
          	if chapter_index >= 3 and selector == 4:
          		return "assault"
          	if selector >= 8:
          		return "scout"
          	return "standard"


          func _spawn_enemy''',
              s, count=1, flags=re.S
          )

          # Replace spawner with special enemy support and mission-builder transforms.
          s=re.sub(
              r'func _spawn_enemy\(variant: String, marker_index: int, spawn_index: int\) -> void:\n.*?\n\n\n          func _on_enemy_exploded',
              '''func _spawn_enemy(variant: String, marker_index: int, spawn_index: int) -> void:
          	var spawn_transform := mission_builder.get_enemy_spawn(chapter, marker_index, spawn_index) if mission_builder != null else robot_spawn_points.get_child(marker_index % robot_spawn_points.get_child_count()).global_transform

          	if variant in ["drone", "quad", "trilobite", "warden"]:
          		var enemy := PulseSpecialEnemy.new()
          		enemy.transform = spawn_transform
          		enemy.set_meta("variant", variant)
          		enemy.set_meta("elite", variant == "warden")
          		match variant:
          			"drone":
          				enemy.model_path = "res://assets/quaternius/scifi_essentials/glTF/Enemy_EyeDrone.gltf"
          				enemy.health = 6 + chapter
          				enemy.damage = 10 + chapter
          				enemy.move_speed = 4.6
          				enemy.attack_interval = 2.8
          				enemy.hover_height = 2.8
          			"quad":
          				enemy.model_path = "res://assets/quaternius/scifi_essentials/glTF/Enemy_QuadShell.gltf"
          				enemy.health = 11 + chapter * 2
          				enemy.damage = 15 + chapter
          				enemy.move_speed = 3.2
          				enemy.attack_interval = 3.4
          				enemy.hover_height = 1.5
          			"trilobite":
          				enemy.model_path = "res://assets/quaternius/scifi_essentials/glTF/Enemy_Trilobite.gltf"
          				enemy.health = 9 + chapter
          				enemy.damage = 18 + chapter
          				enemy.move_speed = 5.3
          				enemy.attack_interval = 2.4
          				enemy.hover_height = 0.35
          				enemy.attack_range = 8.5
          			"warden":
          				enemy.model_path = "res://assets/quaternius/animated_mech/Textured/glTF/George.gltf"
          				enemy.health = 65
          				enemy.damage = 26
          				enemy.move_speed = 2.2
          				enemy.attack_interval = 2.5
          				enemy.hover_height = 0.0
          				enemy.attack_range = 30.0
          				enemy.boss = true
          		enemy.target = active_player
          		enemy.exploded.connect(_on_enemy_exploded.bind(enemy))
          		spawned_nodes.add_child(enemy, true)
          		hostiles += 1
          		return

          	var robot: CharacterBody3D = RedRobot.instantiate()
          	robot.transform = spawn_transform
          	robot.set_meta("variant", variant)
          	robot.set_meta("elite", false)
          	match variant:
          		"scout":
          			robot.health = 4 + chapter
          			robot.damage = 9 + chapter
          			robot.attack_cooldown = 4.1
          			robot.scale = Vector3.ONE * 0.88
          		"assault":
          			robot.health = 8 + chapter * 2
          			robot.damage = 15 + chapter
          			robot.attack_cooldown = 4.8
          		"heavy":
          			robot.health = 15 + chapter * 2
          			robot.damage = 21 + chapter
          			robot.attack_cooldown = 5.2
          			robot.scale = Vector3.ONE * 1.22
          		_:
          			robot.health = 6 + chapter * 2
          			robot.damage = 13 + chapter
          			robot.attack_cooldown = 5.5
          	robot.exploded.connect(_on_enemy_exploded.bind(robot))
          	spawned_nodes.add_child(robot, true)
          	if variant == "scout":
          		robot.animation_tree.speed_scale = 1.22
          	elif variant == "heavy":
          		robot.animation_tree.speed_scale = 0.90
          	if active_player != null:
          		robot.player = active_player
          		robot.resume_approach()
          	hostiles += 1


          func _on_enemy_exploded''',
              s, count=1, flags=re.S
          )

          # Scoring for new enemy classes.
          s=s.replace(
              '"assault": points = 250\n\t\t"heavy": points = 450\n\t\t"warden": points = 5000',
              '"assault": points = 250\n\t\t"drone": points = 220\n\t\t"quad": points = 360\n\t\t"trilobite": points = 300\n\t\t"heavy": points = 450\n\t\t"warden": points = 5000'
          )

          # Weapon HUD.
          s=s.replace('var pulse_label: Label\n', 'var pulse_label: Label\n          var weapon_label: Label\n')
          s=s.replace(
              '\t\tactive_player.rescue_used.connect(_on_rescue_used)\n\t\t_on_health_changed',
              '\t\tactive_player.rescue_used.connect(_on_rescue_used)\n\t\tactive_player.weapon_changed.connect(_on_weapon_changed)\n\t\t_on_weapon_changed("PULSE RIFLE", 1)\n\t\t_on_health_changed'
          )
          insert='''

          func _on_weapon_changed(name: String, unlocked: int) -> void:
          	if weapon_label != null:
          		weapon_label.text = "WEAPON  //  " + name + "   [" + str(unlocked) + "/3]"


'''
          s=s.replace('          func _on_health_changed(current: int, maximum: int) -> void:', insert+'          func _on_health_changed(current: int, maximum: int) -> void:')
          s=s.replace(
              '\tpulse_label.position = Vector2(14, 61)\n\thealth_panel.add_child(pulse_label)',
              '\tpulse_label.position = Vector2(14, 61)\n\thealth_panel.add_child(pulse_label)\n\n\tweapon_label = _make_label("WEAPON  //  PULSE RIFLE   [1/3]", 14, Color(0.85, 0.9, 1.0))\n\tweapon_label.position = Vector2(14, 82)\n\thealth_panel.add_child(weapon_label)\n\thealth_panel.offset_top = -136'
          )
          s=s.replace(
              'WASD MOVE  •  SHIFT SPRINT  •  RMB AIM  •  LMB FIRE  •  SPACE JUMP  •  Q PULSE  •  R RECOVER',
              'WASD MOVE  •  SHIFT SPRINT  •  RMB AIM  •  LMB FIRE  •  1/2/3 WEAPONS  •  Q PULSE  •  R RECOVER'
          )

          p.write_text(s)
          PY

          cat >> game/tests/test_campaign_readiness.gd <<'GDSCRIPT'


          func test_commercial_campaign_has_eight_chapters() -> void:
          	assert_int(CampaignState.LAST_CHAPTER).is_equal(7)


          func test_weapon_progression_contract() -> void:
          	var scene: PackedScene = load("res://player/player.tscn")
          	var player := scene.instantiate()
          	assert_bool(player.has_method("switch_weapon")).is_true()
          	assert_bool(player.has_method("set_weapon_unlocks")).is_true()
          	assert_bool(player.has_signal("weapon_changed")).is_true()
          	player.free()


          func test_commercial_assets_importable() -> void:
          	assert_bool(ResourceLoader.exists("res://assets/quaternius/scifi_essentials/glTF/Enemy_EyeDrone.gltf")).is_true()
          	assert_bool(ResourceLoader.exists("res://assets/quaternius/animated_mech/Textured/glTF/George.gltf")).is_true()
          	assert_bool(ResourceLoader.exists("res://assets/quaternius/ultimate_space/Environment/GLTF/GeodesicDome.gltf")).is_true()
          	assert_bool(ResourceLoader.exists("res://assets/kenney/weapon/sniper.glb")).is_true()
          GDSCRIPT

