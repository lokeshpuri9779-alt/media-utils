          func _submit_playtest_rating(rating: int) -> void:
          	ProductionGuard.record_event("playtest_rating", {"rating": rating, "score": score, "time_seconds": mission_time, "ending": CampaignState.ending})
          	ProductionGuard.write_playtest_report({"result": "campaign_complete", "rating": rating, "score": score, "time_seconds": mission_time, "ending": CampaignState.ending})
          	if survey_panel != null:
