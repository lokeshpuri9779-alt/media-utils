name: ASTRA Story Factory Replenishment
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: astra-story-factory
  cancel-in-progress: false
jobs:
  replenish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-state
          path: state
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          path: code
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image preproduction dependency
        run: python -m pip install 'Pillow>=10,<12'
      - name: Verify generation and publishing safety
        working-directory: code
        run: python -m unittest discover -s tests -p 'test_astra_story_factory.py'
      - name: Generate review-only candidates
        working-directory: code
        run: |
          python -m astra_v2.story_factory --state ../state/story_factory_state.json --output ../state/story_factory_candidates.jsonl --batch-size 500
      - name: Validate candidate and review artifacts before state push
        working-directory: state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("story_factory_state.json").read_text())
          candidates=[json.loads(x) for x in Path("story_factory_candidates.jsonl").read_text().splitlines()]
          reviews=[json.loads(x) for x in Path("story_factory_review.jsonl").read_text().splitlines()]
          assert len(candidates)==len(reviews)==state["last_batch"]
          assert all(c["production_ready"] is False and c["kind"]=="unreviewed_causal_draft" for c in candidates)
          assert all(r["production_ready"] is False and r["status"] in ("awaiting_editorial_review","needs_new_plot") for r in reviews)
          assert len({c["candidate_id"] for c in candidates})==len(candidates)
          from collections import Counter
          counts=Counter(r["status"] for r in reviews)
          reasons=Counter(reason for r in reviews for reason in r.get("issues",[]))
          report={"generated":len(candidates),"awaiting_editorial_review":counts["awaiting_editorial_review"],
                  "needs_new_plot":counts["needs_new_plot"],"issue_counts":dict(sorted(reasons.items())),
                  "automatically_approved":0,"production_ready":0}
          Path("story_factory_review_summary.json").write_text(json.dumps(report,indent=2,sort_keys=True)+chr(10))
          print("ASTRA_STORY_FACTORY_REVIEW_SUMMARY="+json.dumps(report,sort_keys=True))
          print("Validated review-only replenishment batch:",len(candidates))
          PY
      - name: Build fail-closed editorial review packet
        working-directory: code
        run: |
          python -m astra_v2.story_factory_review_packet \
            --candidates ../state/story_factory_candidates.jsonl \
            --reviews ../state/story_factory_review.jsonl \
            --output ../state/story_factory_editorial_packet.json
      - name: Clear previous image manifest for fresh-run accounting
        working-directory: state
        run: rm -f story_factory_image_manifest.json
      - name: Clear previous rewrite queue for fresh-run accounting
        working-directory: state
        run: rm -f story_factory_rewrite_queue.json
      - name: Rewrite a bounded editorial shortlist with existing Gemini
        working-directory: code
        env:
          ASTRA_GEMINI_ENABLED: ${{ secrets.GEMINI_API_KEY != '' && '1' || '0' }}
          ASTRA_GEMINI_MODEL: ${{ vars.ASTRA_GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          ASTRA_GEMINI_FALLBACK_MODEL: ${{ vars.ASTRA_GEMINI_FALLBACK_MODEL || 'gemini-3.1-flash-lite' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "$ASTRA_GEMINI_ENABLED" != "1" ]; then echo "Gemini not configured; skipping rewrite"; exit 0; fi
          python -m astra_v2.story_factory_rewrite_queue --packet ../state/story_factory_editorial_packet.json --output ../state/story_factory_rewrite_queue.json --limit 3
      - name: Preproduce review-only images via configured free OmniRoute provider
        working-directory: code
        env:
          ASTRA_OMNI_IMAGE_ENDPOINT: ${{ vars.ASTRA_OMNI_IMAGE_ENDPOINT }}
          ASTRA_OMNI_IMAGE_MODEL: ${{ vars.ASTRA_OMNI_IMAGE_MODEL }}
          ASTRA_OMNI_IMAGE_FREE_CONFIRMED: ${{ vars.ASTRA_OMNI_IMAGE_FREE_CONFIRMED }}
          ASTRA_OMNI_IMAGE_API_KEY: ${{ secrets.ASTRA_OMNI_IMAGE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m unittest discover -s tests -p 'test_omniroute_image_assets.py'
          if [ -z "$ASTRA_OMNI_IMAGE_ENDPOINT" ] || [ -z "$ASTRA_OMNI_IMAGE_MODEL" ]; then
            echo "::warning::ASTRA image generation skipped: image endpoint or model is not configured"
          elif [ "$ASTRA_OMNI_IMAGE_FREE_CONFIRMED" != "1" ]; then
            echo "::warning::ASTRA image generation skipped: free-tier confirmation is not enabled"
          elif [ ! -f ../state/story_factory_rewrite_queue.json ]; then
            echo "::warning::ASTRA image generation skipped: story rewrite queue is missing"
          else
            case "$ASTRA_OMNI_IMAGE_ENDPOINT" in
              https://generativelanguage.googleapis.com/*:generateContent)
                if [ -z "$ASTRA_OMNI_IMAGE_API_KEY" ]; then
                  ASTRA_OMNI_IMAGE_API_KEY="$GEMINI_API_KEY"
                  export ASTRA_OMNI_IMAGE_API_KEY
                fi
                ;;
            esac
            if [ -z "$ASTRA_OMNI_IMAGE_API_KEY" ]; then
              echo "::warning::ASTRA image generation skipped: image provider API key is missing"
            else
              python -m astra_v2.omniroute_image_assets --queue ../state/story_factory_rewrite_queue.json --root ../state/omni_assets --manifest ../state/story_factory_image_manifest.json --limit 3
            fi
          fi
      - name: Report actual image preproduction outcome
        working-directory: state
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("story_factory_image_manifest.json")
          if not p.exists():
              print("::warning::ASTRA_IMAGE_RESULT=missing_manifest; no generated illustrations verified")
          else:
              result = json.loads(p.read_text())
              assets = result.get("assets", [])
              generated = sum(a.get("status") == "review_only" for a in assets)
              cached = sum(a.get("status") == "cached_review_only" for a in assets)
              failures = sum(a.get("status") == "generation_failed" for a in assets)
              print("ASTRA_IMAGE_RESULT=" + json.dumps({
                  "status": result.get("status"),
                  "provider_calls": result.get("provider_calls", 0),
                  "new_images": generated,
                  "cached_images": cached,
                  "generation_failures": failures,
                  "production_ready": False
              }, sort_keys=True))
              if generated + cached == 0:
                  print("::warning::ASTRA image preproduction produced no usable illustrations")
          PY
      - name: Archive per-run diagnostics even if state push conflicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-story-factory-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state/story_factory_review_summary.json
            state/story_factory_rewrite_queue.json
            state/story_factory_image_manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Recover generated scene assets if state push conflicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-story-factory-scene-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            state/omni_assets/sha256/
            state/omni_assets/requests/
          if-no-files-found: ignore
          retention-days: 14
      - name: Report safe Cloudflare failure codes
        if: always()
        working-directory: state
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          p = Path("story_factory_image_manifest.json")
          if p.exists():
              manifest = json.loads(p.read_text())
              failures = Counter(str(item.get("error_detail", item.get("error", "unknown")))[:120]
                                 for item in manifest.get("assets", [])
                                 if item.get("status") == "generation_failed")
              print("ASTRA_IMAGE_FAILURE_CODES=" + json.dumps(dict(failures), sort_keys=True))
          PY
      - name: Commit persistent cursor and latest review batch
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add story_factory_state.json story_factory_candidates.jsonl story_factory_review.jsonl story_factory_review_summary.json story_factory_editorial_packet.json
          if [ -f story_factory_rewrite_queue.json ]; then git add story_factory_rewrite_queue.json; fi
          if [ -f story_factory_image_manifest.json ]; then git add story_factory_image_manifest.json omni_assets/; fi
          if ! git diff --cached --quiet; then
            git commit -m "Replenish review-only story candidate batch"
            # Never force-push persistent cursors: another writer may have advanced them.
            # Retry only transient network errors; detect remote changes before each attempt.
            baseline="$(git rev-parse HEAD^)"
            for attempt in 1 2 3; do
              git fetch origin astra-state
              remote="$(git rev-parse FETCH_HEAD)"
              if [ "$remote" != "$baseline" ]; then
                echo "::error::ASTRA_STATE_CONFLICT: astra-state advanced during this run. Refusing to overwrite another worker's cursor or asset manifest; retry the workflow against fresh state."
                exit 1
              fi
              if git push origin HEAD:refs/heads/astra-state; then
                echo "ASTRA_STATE_PUSH=success"
                exit 0
              fi
              echo "::warning::State push attempt $attempt failed; checking branch again before retry"
              sleep "$((attempt * 2))"
            done
            echo "::error::ASTRA_STATE_PUSH_FAILED: persistent results were not committed to remote state"
            exit 1
          fi
